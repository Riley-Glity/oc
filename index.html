<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>七环地狱 · 傲慢之醒</title>
    <style>
        :root {
            --bg: #0a0005;
            --panel: #120108;
            --border: #2a0a14;
            --text: #d0c4c8;
            --dim: #7a5a62;
            --gold: #d4a040;
            --red: #c03040;
            --sidebar-w: 320px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Georgia', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            height: 100vh; height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        #app { display: flex; height: 100vh; height: 100dvh; position: relative; }
        #main { flex: 1; display: flex; flex-direction: column; min-width: 0; transition: margin-right 0.3s ease; }
        #main.sidebar-open { margin-right: var(--sidebar-w); }
        #topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: linear-gradient(180deg, #14010a 0%, #0d0106 100%); border-bottom: 2px solid #3a0a18; gap: 10px; flex-shrink: 0; }
        #topbar .title { font-size: 1.15em; letter-spacing: 0.08em; color: #e8c060; font-weight: bold; white-space: nowrap; text-shadow: 0 0 12px rgba(200,80,40,0.4); }
        #topbar .subtitle { font-size: 0.72em; color: #9a6a6a; white-space: nowrap; letter-spacing: 0.05em; }
        #menuBtn { background: rgba(180,30,50,0.15); border: 1px solid #5a1a28; color: #e0b0b0; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 0.82em; white-space: nowrap; transition: 0.2s; letter-spacing: 0.04em; }
        #menuBtn:hover, #menuBtn:active { border-color: #c04050; color: #ffc0c0; background: rgba(200,40,60,0.25); box-shadow: 0 0 16px rgba(200,40,60,0.3); }
        #quick-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px; background: #0a0106; border-bottom: 1px solid #200a10; font-size: 0.76em; flex-shrink: 0; }
        #quick-stats span { white-space: nowrap; }
        .qs-label { color: #8a5a62; }
        .qs-val { color: #d0c0c4; font-weight: bold; }
        .qs-gold { color: #e8c060; }
        .qs-red { color: #e85060; }
        .qs-special { color: #ff6080; text-shadow: 0 0 8px rgba(255,60,80,0.5); }
        .qs-time { color: #8ab4d4; font-weight: bold; }
        #text-area { flex: 1; overflow-y: auto; padding: 18px 16px; -webkit-overflow-scrolling: touch; background: linear-gradient(180deg, #0a0005 0%, #0d0108 100%); }
        #text-content { white-space: pre-wrap; line-height: 1.9; font-size: 0.93em; letter-spacing: 0.02em; }
        #text-content em { color: #c09080; font-style: italic; }
        #text-content strong { color: #e8c060; font-weight: bold; }
        #text-content .highlight { color: #ff4060; font-weight: bold; text-shadow: 0 0 8px rgba(255,60,90,0.4); }
        #text-content .gold-text { color: #e8c060; font-weight: bold; }
        .scene-title { text-align: center; font-size: 1.05em; letter-spacing: 0.12em; color: #e8c060; margin-bottom: 14px; text-shadow: 0 0 10px rgba(200,80,40,0.3); }
        .divider { text-align: center; color: #5a2a30; margin: 10px 0; letter-spacing: 0.2em; }
        .input-group { margin: 10px 0; }
        .input-group label { display: block; color: #c09090; font-size: 0.85em; margin-bottom: 4px; letter-spacing: 0.04em; }
        .input-group input { width: 100%; padding: 10px 14px; background: #14040a; border: 1px solid #3a1020; color: #e0c0c0; font-family: inherit; font-size: 0.95em; border-radius: 6px; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: #c04050; box-shadow: 0 0 10px rgba(200,40,60,0.3); }
        /* 美化按钮 */
        .clickable { border-radius: 4px; padding: 6px 12px; }
        #menuBtn { border-radius: 4px; }
        .primary-btn { box-shadow: inset 0 0 8px rgba(200,40,60,0.4); border-radius: 4px; font-weight: bold; }
        /* 统一响应式布局 */
        @media (max-width: 768px) {
            #sidebar { width: 85vw; right: calc(-1 * 85vw - 10px); }
            #main.sidebar-open { margin-right: 0; }
            .status-box { padding: 10px; }
        }
        .race-select { display: flex; gap: 8px; flex-wrap: wrap; }
        .race-select .clickable { padding: 6px 12px; }
        .race-select .clickable.active { color: #ff8090; text-shadow: 0 0 10px rgba(200,80,60,0.4); }
        #text-content .clickable { color: #e8c060; text-decoration: underline; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-block; padding: 2px 6px; border-radius: 4px; }
        #text-content .clickable:hover { color: #ffc060; background: rgba(200,80,40,0.15); text-shadow: 0 0 8px rgba(255,200,60,0.3); }
        #text-content .clickable:active { transform: scale(0.97); }
        #text-content .clickable.danger { color: #e85060; }
        #text-content .clickable.danger:hover { color: #ff7080; background: rgba(200,40,60,0.2); }
        #text-content .clickable.gold { color: #e8c060; }
        #text-content .clickable.gold:hover { color: #ffd070; background: rgba(200,160,60,0.15); }
        #text-content .clickable.back { color: #8aaa8a; }
        #text-content .clickable.back:hover { color: #aacca0; background: rgba(100,180,100,0.1); }
        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        #sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        #sidebar { position: fixed; top: 0; right: calc(-1 * var(--sidebar-w)); width: var(--sidebar-w); height: 100%; height: 100dvh; background: #0e0108; border-left: 2px solid #3a0a18; z-index: 100; overflow-y: auto; -webkit-overflow-scrolling: touch; transition: right 0.3s ease; padding: 20px 18px; }
        #sidebar.open { right: 0; }
        #sidebar h3 { font-size: 0.88em; color: #e8c060; letter-spacing: 0.1em; margin-bottom: 16px; text-align: center; text-shadow: 0 0 8px rgba(200,80,40,0.3); }
        #sidebar .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a0812; font-size: 0.82em; }
        #sidebar .stat-row .s-label { color: #8a5a62; }
        #sidebar .stat-row .s-val { font-weight: bold; color: #d0c0c4; }
        #sidebar .stat-row .s-highlight { color: #ff4060; text-shadow: 0 0 6px rgba(255,60,80,0.4); }
        #sidebar .stat-row .s-gold { color: #e8c060; }
        #sidebar .close-btn { display: block; width: 100%; margin-top: 18px; padding: 10px; background: #180610; border: 1px solid #2a0a16; color: #d0c0c4; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85em; text-align: center; }
        #sidebar .close-btn:active { border-color: #c04050; }
        #sidebar-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
        #sidebar-tabs button { flex: 1; padding: 6px 4px; background: #180610; border: 1px solid #2a0a16; color: #8a5a62; font-family: inherit; font-size: 0.72em; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        #sidebar-tabs button.active { border-color: #c04050; color: #ff8090; background: #1e0812; }
        #sidebar .social-card { background: #14040a; border: 1px solid #2a0a14; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
        #sidebar .social-card .npc-name { color: #e8c060; font-weight: bold; font-size: 0.82em; }
        #sidebar .social-card .npc-opinion { color: #9a6a6a; font-size: 0.72em; font-style: italic; margin: 2px 0 6px; }
        #sidebar .social-card .npc-bars { font-size: 0.7em; }
        #sidebar .social-card .npc-bar { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        #sidebar .social-card .npc-bar-fill { height: 6px; border-radius: 3px; }
        #sidebar .social-card .npc-bar-fill.love { background: #e85060; }
        #sidebar .social-card .npc-bar-fill.desire { background: #d4a040; }
        #sidebar .social-card .npc-bar-fill.anger { background: #c03040; }
        #sidebar .status-box { background: #14040a; border: 1px solid #2a0a14; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
        #sidebar .status-box .status-label { color: #8a5a62; font-size: 0.7em; }
        #sidebar .status-mood { color: #c09080; font-size: 0.78em; font-style: italic; margin-top: 6px; padding-top: 6px; border-top: 1px solid #1a0812; }
        #sidebar .buff-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.68em; margin: 2px 4px 2px 0; }
        #sidebar .buff-tag.positive { background: rgba(100,180,100,0.2); border: 1px solid rgba(100,180,100,0.4); color: #80c080; }
        #sidebar .buff-tag.negative { background: rgba(200,60,60,0.2); border: 1px solid rgba(200,60,60,0.4); color: #e06060; }
        #sidebar .save-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid #1a0812; }
        #sidebar .save-section button { width: 100%; margin: 4px 0; padding: 8px; background: #180610; border: 1px solid #2a0a16; color: #d0c0c4; font-family: inherit; font-size: 0.78em; border-radius: 4px; cursor: pointer; }
        #sidebar .save-section button:active { border-color: #c04050; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a1020; border-radius: 2px; }
        @media (max-width: 500px) {
            :root {
                --sidebar-w: 85vw;
            }

            #topbar {
                padding: 6px 10px;
            }

            #topbar .title {
                font-size: 0.9em;
            }

            #topbar .subtitle {
                font-size: 0.6em;
            }

            #menuBtn {
                padding: 6px 12px;
                font-size: 0.75em;
            }

            #quick-stats {
                padding: 4px 8px;
                font-size: 0.6em;
                gap: 3px 6px;
                overflow-x: auto;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
            }

            #quick-stats span {
                white-space: nowrap;
                flex-shrink: 0;
            }

            #text-area {
                padding: 10px 10px;
            }

            #text-content {
                font-size: 0.82em;
                line-height: 1.8;
            }

            #text-content .clickable {
                padding: 6px 10px;
                display: inline-block;
                min-height: 36px;
                line-height: 1.6;
                margin: 2px 0;
            }

            .race-select .clickable {
                padding: 8px 14px;
                font-size: 0.85em;
            }

            /* 侧边栏优化 */
            #sidebar {
                padding: 14px 12px;
                width: 85vw;
                right: calc(-1 * 85vw);
            }

            #sidebar.open {
                right: 0;
            }

            #sidebar h3 {
                font-size: 0.78em;
                margin-bottom: 10px;
            }

            #sidebar .stat-row {
                padding: 6px 0;
                font-size: 0.75em;
                min-height: 32px;
            }

            #sidebar .status-box {
                padding: 8px;
                margin-bottom: 6px;
            }

            #sidebar .buff-tag {
                font-size: 0.6em;
                padding: 3px 8px;
                margin: 2px 3px 2px 0;
            }

            #sidebar .close-btn {
                padding: 12px;
                font-size: 0.8em;
                border-radius: 10px;
            }

            #sidebar .social-card {
                padding: 8px;
            }

            #sidebar .social-card .npc-name {
                font-size: 0.78em;
            }

            #sidebar .social-card .npc-bars {
                font-size: 0.65em;
            }

            #sidebar .status-mood {
                font-size: 0.72em;
            }

            /* 侧边栏标签页 - 2列（手机端） */
            #sidebar-tabs {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 4px 0 10px 0;
                margin-bottom: 8px;
            }

            #sidebar-tabs button {
                padding: 14px 4px;
                font-size: 0.78em;
                min-height: 56px;
                border-radius: 10px;
                border: 1px solid rgba(42, 10, 22, 0.5);
                background: rgba(24, 6, 16, 0.5);
                color: #8a5a62;
                font-family: inherit;
                cursor: pointer;
                transition: all 0.2s ease;
                touch-action: manipulation;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2px;
                text-align: center;
                line-height: 1.2;
            }

            #sidebar-tabs button.active {
                border-color: #c04050;
                color: #ff8090;
                background: rgba(30, 8, 18, 0.8);
                box-shadow: 0 0 20px rgba(200, 40, 60, 0.08);
            }

            #sidebar-tabs button:active {
                transform: scale(0.94);
                background: rgba(200, 80, 40, 0.08);
            }

            @media (max-width: 380px) {
                #sidebar-tabs {
                    grid-template-columns: repeat(3, 1fr);
                    gap: 4px;
                }
                #sidebar-tabs button {
                    font-size: 0.6em;
                    padding: 8px 2px;
                    min-height: 42px;
                }
            }

            /* 背包物品操作按钮 */
            #sidebar .status-box button {
                padding: 6px 12px;
                font-size: 0.7em;
                min-height: 36px;
                min-width: 44px;
                border-radius: 6px;
            }

            /* 地图节点 */
            .map-grid {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }

            .map-node {
                padding: 8px 4px;
                font-size: 0.7em;
                min-height: 44px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            /* 任务卡片 */
            .task-card {
                padding: 8px;
                font-size: 0.75em;
            }

            .task-card button {
                padding: 6px 12px;
                min-height: 36px;
                font-size: 0.7em;
            }

            /* 合成界面 */
            .craft-item {
                padding: 10px 8px;
                font-size: 0.72em;
                min-height: 52px;
            }

            /* 成就徽章 */
            .achievement-badge {
                padding: 6px 10px;
                font-size: 0.68em;
                display: inline-block;
                margin: 3px 4px 3px 0;
            }

            /* 快速操作栏 */
            .quick-actions {
                display: flex;
                padding: 4px 8px;
                gap: 4px;
                overflow-x: auto;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                background: #0a0106;
                border-bottom: 1px solid #200a10;
            }

            .quick-actions::-webkit-scrollbar {
                display: none;
            }

            .quick-actions button {
                flex: 0 0 auto;
                padding: 6px 12px;
                font-size: 0.65em;
                min-height: 34px;
                border-radius: 16px;
                white-space: nowrap;
                touch-action: manipulation;
                background: #180610;
                border: 1px solid #2a0a16;
                color: #d0c0c4;
                font-family: inherit;
            }

            .quick-actions button:active {
                transform: scale(0.95);
            }

            /* 场景选项中的点击区域 */
            #text-content .clickable {
                padding: 8px 12px;
                min-height: 40px;
                display: inline-block;
                line-height: 1.5;
                margin: 3px 0;
                border-radius: 6px;
                text-decoration: none;
                background: rgba(200, 80, 40, 0.05);
                border: 1px solid transparent;
            }

            #text-content .clickable:active {
                background: rgba(200, 80, 40, 0.15);
                border-color: #3a1020;
                transform: scale(0.97);
            }

            /* 关闭按钮优化 */
            .close-btn {
                padding: 14px !important;
                font-size: 0.85em !important;
                border-radius: 10px !important;
                margin-top: 12px !important;
            }

        /* ==================== 新底部操作栏（暗黑哥特风格） ==================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(10, 0, 5, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(180, 60, 80, 0.3);
            padding: 6px 4px 10px 4px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(180, 40, 60, 0.05);
            transition: transform 0.3s ease;
        }

        .bottom-nav.hidden {
            transform: translateY(100%);
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 6px;
            min-width: 48px;
            min-height: 48px;
            border: none;
            background: transparent;
            color: #7a5a62;
            font-family: inherit;
            font-size: 0.6em;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.25s ease;
            position: relative;
            gap: 1px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .bottom-nav .nav-item .nav-icon {
            font-size: 1.5em;
            line-height: 1.2;
            transition: transform 0.2s ease;
        }

        .bottom-nav .nav-item .nav-label {
            font-size: 0.65em;
            letter-spacing: 0.04em;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .bottom-nav .nav-item:active .nav-icon {
            transform: scale(0.88);
        }

        .bottom-nav .nav-item.active {
            color: #e8c060;
        }

        .bottom-nav .nav-item.active .nav-label {
            opacity: 1;
            color: #e8c060;
        }

        .bottom-nav .nav-item.active::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e8c060, transparent);
            border-radius: 2px;
            box-shadow: 0 0 12px rgba(200, 180, 60, 0.3);
        }

        .bottom-nav .nav-item:active {
            background: rgba(200, 80, 40, 0.12);
            box-shadow: 0 0 20px rgba(200, 80, 40, 0.05);
        }

        /* 底部操作栏在桌面端隐藏，手机端显示 */
        @media (min-width: 501px) {
            .bottom-nav {
                display: none;
            }
            #text-area {
                padding-bottom: 18px !important;
            }
        }

        @media (max-width: 500px) {
            .bottom-nav {
                display: flex;
            }
            /* 为底部操作栏留出空间 */
            #text-area {
                padding-bottom: 72px !important;
            }
            #app {
                padding-bottom: 0;
            }
        }

        /* 新增：顶部标题栏优化 */
        #topbar {
            position: relative;
            z-index: 10;
        }

        #topbar .title {
            font-size: 1.15em;
            letter-spacing: 0.12em;
            background: linear-gradient(180deg, #e8c060 20%, #b08040 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(200, 180, 60, 0.15));
        }

        #topbar .subtitle {
            -webkit-text-fill-color: #9a6a6a;
        }

        /* 菜单按钮更精致 */
        #menuBtn {
            background: rgba(180, 30, 50, 0.12);
            border: 1px solid rgba(180, 60, 80, 0.25);
            color: #d0b0b0;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.78em;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            letter-spacing: 0.06em;
        }

        #menuBtn:hover, #menuBtn:active {
            border-color: #c04050;
            color: #ffc0c0;
            background: rgba(200, 40, 60, 0.2);
            box-shadow: 0 0 24px rgba(200, 40, 60, 0.2), inset 0 0 24px rgba(200, 40, 60, 0.05);
        }

        /* 快捷状态栏优化 */
        #quick-stats {
            background: rgba(10, 1, 6, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-bottom: 1px solid rgba(40, 10, 20, 0.5);
            padding: 6px 12px;
            gap: 4px 10px;
            font-size: 0.7em;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #quick-stats::-webkit-scrollbar {
            display: none;
        }

        #quick-stats span {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: rgba(20, 4, 10, 0.4);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(40, 10, 20, 0.3);
            white-space: nowrap;
            flex-shrink: 0;
            font-size: 0.7em;
        }

        #quick-stats .qs-label {
            color: #6a4a4a;
            font-size: 0.85em;
        }

        #quick-stats .qs-val,
        #quick-stats .qs-gold,
        #quick-stats .qs-red,
        #quick-stats .qs-special,
        #quick-stats .qs-time {
            font-size: 0.95em;
        }

        /* 侧边栏微调 */
        #sidebar {
            background: rgba(14, 1, 8, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(60, 10, 30, 0.5);
        }

        #sidebar h3 {
            font-size: 0.82em;
            letter-spacing: 0.15em;
            color: #d4a040;
            text-shadow: 0 0 30px rgba(200, 160, 60, 0.1);
        }

        #sidebar-tabs button {
            font-size: 0.65em;
            padding: 6px 4px;
            min-height: 32px;
            border-radius: 6px;
            background: rgba(24, 6, 16, 0.6);
            border-color: rgba(40, 10, 20, 0.4);
        }

        #sidebar-tabs button.active {
            border-color: #c04050;
            color: #ff8090;

        .achievement-popup .popup-icon { font-size: 24px; filter: drop-shadow(0 0 5px rgba(212,160,64,0.5)); }
        .achievement-popup .popup-content { flex: 1; }

        .achievement-popup .popup-badge { font-size: 0.55em; color: #5a2a30; text-transform: uppercase; margin-top: 4px; letter-spacing: 1px; }
        
        .achievement-flash {

            background: radial-gradient(circle, rgba(212,160,64,0.15) 0%, transparent 70%);

var RD = {
    '傲慢之环': {
        poor: {
            name: '灰烬区',
            desc: '傲慢之环的最底层，被称为“灰烬区”。这里常年不见天日，上方垂落的暗紫色光芒穿透层层阴霾到达此处时，已经变得极其稀薄黯淡。破败粗糙的街道上，随处可见游荡的低阶恶魔与堕入地狱的罪人。他们混杂在一起，在狭窄、满是污垢的巷道里警惕地穿行。街道两侧排列着高低不平、结构严重歪斜的石砌建筑。大部分房屋的沉重木门都死死紧闭着，只有少数几扇半掩的门缝里，向外透出浑浊微弱的油灯光晕。空气中弥漫着刺鼻的气味，并悬浮着大量细小的水晶粉尘。这些粉尘在周围冰冷微光的折射下，像是一层散落的星尘，缓慢而无声地在死寂的街道上空漂浮、沉降。',
            features: ['破旧酒馆', '废弃水晶矿场', '低阶市场', '流浪者聚集地', '暗巷角落'],
            featureScenes: {
                '破旧酒馆': function(ring, level) { sceneTavernTutorialIntro(ring, level); },
                '废弃水晶矿场': function(ring, level) {
                    st('<div class="scene-title">废弃水晶矿场</div><p>灰烬区的边缘地带，横亘着一座早已废弃的水晶矿场。巨大的矿坑入口大半已经被崩塌的碎石死死掩埋，只剩下一个勉强能让人通过的狭窄豁口。偶尔会有底层的拾荒者钻进这里，试图在废墟底层挖出几块残留的傲慢环水晶碎片。矿洞内部的空气极其沉闷，漂浮着呛人的矿石粉尘，并混杂着常年不见光滋生出的浓重霉味。你向矿坑深处望去，幽深的黑暗中隐约有微弱的暗紫色光芒在断续闪烁——那光晕或许来自尚未被彻底挖空的水晶矿脉，又或许是某种未知的东西。在深处微光的映照下，一块倾斜的巨大水晶板旁边坐着一个身影。那人有着一头灰色的短发，头顶的猫耳微微向后压着，透着一丝防备。他正低着头，手里握着一把小刀，刀刃抵着一块金属片，正一下下用力削刮着。金属碎屑随着刀锋的摩擦，无声地剥落掉在满是灰尘的地上。</p>');
                    addTime(5);
                    cb();
                    ab('返回', function() { sceneExploreDistrict(ring, level); });
                    addNpcButton('莱利', ring, level);
                },
                '低阶市场': function(ring, level) {
                    st('<div class="scene-title">低阶市场</div><p>灰烬区的低阶市场是一片嘈杂混乱的露天交易地。几张高低不平、木腿歪斜的破旧桌子勉强拼凑在一起，充当着临时摊位。桌面上杂乱地堆满了各种来源不明的廉价商品：锈迹斑斑的旧武器、边缘破损且沾着暗色污渍的皮质护甲、大小不一且光泽暗淡的水晶碎片，甚至还有几个浸泡在浑浊液体里、疑似从某种活物身上生剜下来的残缺器官。周围充斥着商贩们沙哑刺耳的叫卖声。他们正为了几枚金币的差价，与买家进行着激烈的讨价还价，空气里弥漫着汗臭与劣质烟草的味道。看到你走近，其中一个满脸污垢的商贩立刻停下了手里的动作。他用力向你挥了挥手，咧开嘴露出几颗发黄的牙齿。"嘿，新面孔！"他扯着沙哑的嗓子大声招呼，从杂乱的桌面上抓起一块指甲盖大小的暗紫色石头，直接递向你的方向。"看看这个——绝对上好的傲慢环水晶碎片，只要8个金币！"</p>');
                    addTime(5);
                    cb();
                    ab('购买水晶碎片（8金币）', function() {
                        if (player.gold >= 8) { player.gold -= 8; addItem('crystal_frag_' + Date.now(), '傲慢水晶碎片', 'material', '一块拇指大小的暗紫色水晶碎片，散发着微弱的冷光。', 1); st('<p>你买下了一块水晶碎片。</p>'); } else { st('<p class="highlight">金币不足。</p>'); }
                        cb(); ab('返回', function() { sceneExploreDistrict(ring, level); });
                    });
                    ab('返回', function() { sceneExploreDistrict(ring, level); });
                },
                '流浪者聚集地': function(ring, level) {
                    st('<div class="scene-title">流浪者聚集地</div><p>在灰烬区最偏僻的角落，坐落着一片混乱拥挤的流浪者聚集地。这里聚集着大量没有固定居所的低阶恶魔和罪人。地面上到处是用废弃金属板、烂木头和破布随意搭建的低矮棚屋。几个衣衫褴褛的身影正蜷缩着围坐在一起。他们的正中央放着一个用废弃铁桶改造的简易火堆，桶里燃烧着散发黑烟的燃料。空气中弥漫着浓重的劣质酒精气味和难以名状的酸臭。听到你靠近的脚步声，火堆旁的一个老者停下了动作。他缓缓抬起头，布满皱纹和污垢的脸上没有多余的表情，视线在你身上快速扫过。"新来的？"他用极其沙哑的声音开了口，随后向火堆另一侧努了努下巴。"这里没什么值钱的东西——但如果你需要消息，可以问问那边的瘸腿恶魔。他什么都知道，就是不太爱说话。"</p>');
                    addTime(5);
                    cb();
                    ab('和瘸腿恶魔交谈（耗时10分钟）', function() {
                        addTime(10);
                        var r = Math.random();
                        if (r < 0.3) {
                            st('<p>瘸腿恶魔看到你走近，微微前倾身体。他警惕地环顾了一圈四周，确认没人注意这边后，压低声音凑向你。"东边矿场深处有一条密道，通往中层区域。但那里盘踞着一些危险的东西。"</p><p style="color:#e8c060;">获得情报：废弃矿场密道。</p>');
                        } else if (r < 0.6) {
                            st('<p>瘸腿恶魔看了你一眼，随后毫无兴致地摇了摇头。他将身上破旧的衣物裹得更紧了一些，直接移开视线不再看你。"今天不想说话。改天吧。"</p>');
                        } else {
                            st('<p>瘸腿恶魔上下打量了你一番，目光在你的腰间和口袋处短暂停留。"你身上有金币吗？有的话我可以告诉你一些有趣的事。"</p>');
                            cb();
                            ab('给他3金币', function() {
                                if (player.gold >= 3) { player.gold -= 3; st('<p>你拿出3枚金币递了过去。他迅速伸手接过，熟练地将金币藏进破烂的衣兜深处。确认钱收好后，他再次凑近你，刻意压低了嗓音。"贪婪环的金丝街最近不太平——有人在大规模收购灵魂碎片。如果你有货，可以去那里碰碰运气。"</p>'); } else { st('<p class="highlight">金币不足。</p>'); }
                                cb(); ab('返回', function() { sceneExploreDistrict(ring, level); });
                            });
                            ab('拒绝', function() { sceneExploreDistrict(ring, level); });
                            return;
                        }
                        cb(); ab('返回', function() { sceneExploreDistrict(ring, level); });
                    });
                    ab('返回', function() { sceneExploreDistrict(ring, level); });
                },
                '暗巷角落': function(ring, level) {
                    st('<div class="scene-title">暗巷角落</div><p>这是一条极其狭窄的暗巷。两侧高耸的石墙将光线完全遮挡，墙面上大面积地爬满了暗色、湿滑的苔藓。巷子深处一片昏暗，寂静中不时传来单调的滴水声，以及某种微弱、低沉的痛苦呻吟。你踩过满是泥泞与污垢的地面，脚边杂乱地散落着一些破碎的陶器，以及几根已经完全发黑的残缺骨头。你注意到前方的墙角处，有一个人影正紧紧蜷缩成一团。他将自己缩在阴影里，身体正不受控制地剧烈发抖。</p>');
                    addTime(5);
                    cb();
                    ab('靠近查看', function() {
                        addTime(5);
                        var r = Math.random();
                        if (r < 0.4) {
                            st('<p>你放轻脚步靠近墙角，看清了那个发抖的人影。那是一个身受重伤的低阶恶魔。他的腹部被利器撕开了一道深可见骨的巨大伤口，暗红色的血液正不断向外涌出，浸透了周围的衣物和满是泥垢的地面。察觉到你的靠近，他费力地抬起头，满是冷汗的脸上透着濒死的虚弱。"……帮帮我……"他用极其微弱、断断续续的声音向你求救。</p>');
                            cb();
                            ab('帮他包扎（耗时10分钟）', function() {

function saveToSlot(index) {
    try {
        var slots = JSON.parse(LS.g(SAVE_KEY + '_slots') || '[]');
        var cleanData = JSON.parse(JSON.stringify(player));
        if (cleanData.npcTalkDaily) {
            var today = cleanData.daysSurvived || 0;
            for (var key in cleanData.npcTalkDaily) {
                if (cleanData.npcTalkDaily[key].day !== today) delete cleanData.npcTalkDaily[key];
            }
        }
        if (cleanData.buffs) {
            cleanData.buffs.forEach(function(b) {
                if (b.startAbsolute === undefined && b.startTime !== undefined) {
                    b.startAbsolute = cleanData.daysSurvived * 1440 + b.startTime;
                }
            });
        }
        var slotData = { timestamp: Date.now(), player: cleanData, slotIndex: index };
        while (slots.length <= index) slots.push(null);
        slots[index] = slotData;
        LS.s(SAVE_KEY + '_slots', JSON.stringify(slots));
        LS.s(SAVE_KEY, JSON.stringify(cleanData));
        playSound(880, 0.12);
        st('<p style="color:#80c080;">存档 ' + (index + 1) + ' 保存成功！</p>');
        cb();
        ab('返回', function() { switchTab('save'); });
    } catch (e) {
        st('<p class="highlight">保存失败：' + e.message + '</p>');
        cb();
        ab('返回', function() { switchTab('save'); });
    }
}

function loadFromSlot(index) {
    try {
        var slots = JSON.parse(LS.g(SAVE_KEY + '_slots') || '[]');
        if (index < 0 || index >= slots.length || !slots[index]) {
            st('<p class="highlight">该槽位无存档。</p>');
            cb();
            ab('返回', function() { switchTab('save'); });
            return;
        }
        var data = slots[index];
        if (!data || !data.player) {
            st('<p class="highlight">存档损坏。</p>');
            cb();
            ab('返回', function() { switchTab('save'); });
            return;
        }
        Object.assign(player, data.player);
        if (!player.buffs) player.buffs = [];
        if (!player.npcTalkDaily) player.npcTalkDaily = {};
        player.buffs.forEach(function(b) {
            if (b.startAbsolute === undefined && b.startTime !== undefined) {
                b.startAbsolute = player.daysSurvived * 1440 + b.startTime;
            }
        });
        player.flags.isSleeping = false;
        player.flags.isFainting = false;
        checkHp();
        ua();
        playSound(1000, 0.1);

        ab('继续', function() { sceneExploreDistrict(player.currentRing || "傲慢之环", getCurrentLevel()); });

        st('<p class="highlight">读取失败：' + e.message + '</p>');
        cb();
        ab('返回', function() { switchTab('save'); });
    }
}

function importSaveFile(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            Object.assign(player, data);
            saveToSlot(0);
            checkHp();
            ua();
            st('<p style="color:#e8c060;">导入成功！已自动保存到槽位1。</p>');

    };

}

function playSound(freq = 600, duration = 0.1, vol = 0.15) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
    } catch(e) {}
}

function applyBuffEffects(id, add) {
    var buffMod = {
        'weapon_attack': { strength: 3 },
        'armor_defense': { agility: 2 },
        'crystal_dust': { magic: 1 },
        'energy_drink': { magic: 1 },
        'gold_chocolate': { charisma: 1 },
        'lava_meat': { strength: 1 },
        'desire_wine': { charisma: 1 },
        'stew_fill': { food: 0 },
        'lazy_rest': { sanity: 1 },
        'velvet_satisfaction': { charisma: 2 },
        'dark_deed': { agility: 1 },
        'scavenger_eye': { agility: 1 },
        'fatigue_layer_1': { strength: -1, agility: -1 },
        'fatigue_layer_2': { strength: -1, agility: -1 },
        'fatigue_layer_3': { strength: -2, agility: -2 },
        'fatigue_layer_4': { strength: -2, agility: -2 },
        'fatigue_layer_5': { strength: -3, agility: -3 },
        'fatigue_layer_6': { strength: -3, agility: -3 },
        'fatigue_layer_7': { strength: -4, agility: -4 },
        'fatigue_layer_8': { strength: -4, agility: -4 },
        'exhausted': { strength: -2, agility: -2 },
        'starvation': { strength: -2, agility: -2 },
        'satiety': { strength: 0, agility: 0 }
    };
    var mod = buffMod[id];
    if (!mod) return;

    var sign = add ? 1 : -1;
    for (var stat in mod) {
        if (stat === 'strength' || stat === 'agility' || stat === 'magic' || stat === 'charisma' || stat === 'sanity') {
            player[stat] = Math.max(1, player[stat] + sign * mod[stat]);
        }
    }

}
function addBuff(id, name, desc, type, duration) { 
    // 移除同名旧 buff（避免重复）
    player.buffs = player.buffs.filter(function(b) { 
        if (b.id === id) {
            applyBuffEffects(b.id, false); 
            return false;
        }
        return true;
    }); 

    // 计算绝对时间（从第1天0点起的总分钟数）
    var absoluteTime = player.daysSurvived * 1440 + player.gameTime;
    var newBuff = {
        id: id,
        name: name,
        desc: desc,
        type: type,
        duration: duration,
        startAbsolute: absoluteTime, // 新字段
        startTime: player.gameTime // 保留旧字段兼容
    };
    // 如果传递了 extra（用于恢复属性），一起保存
    if (arguments.length > 5) {
        newBuff.extra = arguments[5];
    }
    player.buffs.push(newBuff);
    applyBuffEffects(id, true); // 应用新buff效果
}
function removeBuff(id) {
    // v0.7.5 逻辑修复：仅当Buff真实存在时才执行移除和属性恢复
    var exists = player.buffs.some(function(b) { return b.id === id; });
    if (exists) {
        applyBuffEffects(id, false);
        player.buffs = player.buffs.filter(function(b) { return b.id !== id; });
    }

}

// ==================== NPC好感审视系统 ====================
function getNpcAttitude(npcId) {
    var rel = player.relationships[npcId];
    if (!rel) return { text: '你们尚未相识。', level: 'unknown', color: '#5a5a6a' };
    var love = rel.love || 0;
    var des = rel.desire || 0;
    if (love <= -50) return { text: '【死敌】他视你为必除之物，空气中凝结着纯粹的杀意。', level: 'nemesis', color: '#ff0000' };
    if (love <= -20) return { text: '【敌视】极度的厌恶，他甚至不屑于掩饰对你的反感。', level: 'hostile', color: '#e85060' };
    if (love <= 0) return { text: '【冷淡】视若空气，那种刻骨的疏离感令你如坐针毡。', level: 'cold', color: '#9a6a6a' };
    if (love <= 20) return { text: '【陌路】维持着最基本的社交礼仪，礼貌而空洞。', level: 'neutral', color: '#c0c0c0' };
    if (love <= 40) return { text: '【熟识】偶尔会露出放松的表情，愿意分享些许琐事。', level: 'friendly', color: '#80c080' };
    if (love <= 60) return { text: '【信任】你在他心中占据了一席之地，眼神多了一丝温度。', level: 'trusted', color: '#8ab4d4' };
    if (love <= 80) return { text: '【羁绊】无需多言的默契，他是你在地狱最坚实的依靠。', level: 'bond', color: '#c090ff' };
    if (love <= 100) {
        if (des > 50) return { text: '【渴求】那份情感已近乎偏执，瞳孔中闪烁着危险的火花。', level: 'obsession', color: '#ff6080' };
        return { text: '【至爱】灵魂的共鸣，在这永恒的黑暗中，你是他唯一的锚点。', level: 'soulmate', color: '#ffb3ba' };
    }
    return { text: '未知的情感状态', level: 'unknown', color: '#5a5a6a' };
}

// ==================== NPC对话次数限制 ====================
function canTalkNPC(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    return data.count < 5;
}
function incrementNpcTalk(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    data.count++;
}
function getNpcTalkRemaining(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    return Math.max(0, 5 - data.count);
}

// ==================== 服装装备系统 ====================
function unequipCurrentCloth() {
    if (!player.equippedClothId) return;
    var oldData = player.equippedClothData;
    if (oldData) {
        player.charisma -= (oldData.charisma || 0);
        player.strength -= (oldData.strength || 0);
        player.magic -= (oldData.magic || 0);
        player.agility -= (oldData.agility || 0);
        player.sanity = Math.min(player.maxSanity, player.sanity - (oldData.sanity || 0));
        
        if (oldData.buffs) {
            for (var i = 0; i < oldData.buffs.length; i++) {
                removeBuff('armor_' + oldData.buffs[i].id);
            }
        }
        
        var oldItem = findItemById(player.equippedClothId);
        if (oldItem) {
            oldItem.equipped = false;
        }
    }
    player.equippedClothId = null;
    player.equippedClothData = null;
    player.outfit = '基础衣着';
    player.outfitDesc = '你穿着一身坠入地狱时的简陋衣物，已经有些磨损。';
}
function equipCloth(item) {
    var id = item.name.replace(/\s/g,'_');
    player.equippedClothId = id;
    player.equippedClothData = {
        charisma: item.charisma || 0,
        strength: item.strength || 0,
        magic: item.magic || 0,
        agility: item.agility || 0,
        sanity: item.sanity || 0,
        buffs: item.buffs || []
    };
    player.charisma += (item.charisma || 0);
    player.strength += (item.strength || 0);
    player.magic += (item.magic || 0);
    player.agility += (item.agility || 0);
    player.sanity = Math.min(player.maxSanity, player.sanity + (item.sanity || 0));
    player.outfit = item.name;
    player.outfitDesc = item.desc;
}
function equipArmorFromBag(itemId) {
    var item = findItemById(itemId);
    if (!item || item.type !== 'armor' || item.equipped) return;
    unequipCurrentCloth();
    item.equipped = true;
    player.equippedClothId = itemId;
    player.equippedClothData = item.effects || {};
    player.charisma += (player.equippedClothData.charisma || 0);
    player.strength += (player.equippedClothData.strength || 0);
    player.magic += (player.equippedClothData.magic || 0);
    player.agility += (player.equippedClothData.agility || 0);

    player.outfit = item.name;
    player.outfitDesc = item.desc;

    ua(); usb();

        }

    cb();

}
function unequipArmorFromBag() {

// ==================== 消耗品使用（修复：增加饱食度） ====================
function useConsumable(itemId) {
    var item = findItemById(itemId);
    if (!item || item.type !== 'consumable' || item.quantity <= 0) return;
    var e = item.effects || {};

    player.hp = Math.min(player.maxHp, player.hp + (e.hp || 0));
    if (e.sanity) player.sanity = Math.min(player.maxSanity, player.sanity + e.sanity);
    if (e.desire) player.desire = Math.min(player.maxDesire, player.desire + e.desire);
    if (e.fatigue !== undefined) {
        player.fatigue = Math.max(0, Math.min(player.maxFatigue, player.fatigue + e.fatigue));
    }
    if (e.food) {
        player.food = Math.min(player.maxFood, player.food + e.food);
        if (e.satietyBuff) {
            addBuff('satiety', e.satietyBuff.name, e.satietyBuff.desc, 'positive', e.satietyBuff.duration || 1440);
            player.satietyTimer = e.satietyBuff.duration || 1440;
        }
    }

    var attrMap = { strength: '力量', agility: '敏捷', magic: '魔力', charisma: '魅力' };
    var attrBuffs = [];
    if (e.strength) attrBuffs.push({ stat: 'strength', value: e.strength });
    if (e.agility) attrBuffs.push({ stat: 'agility', value: e.agility });
    if (e.magic) attrBuffs.push({ stat: 'magic', value: e.magic });
    if (e.charisma) attrBuffs.push({ stat: 'charisma', value: e.charisma });

    if (attrBuffs.length > 0) {
        var buffId = 'food_stat_' + item.name.replace(/\s/g, '_');
        var buffName = item.name + ' 效果';
        var buffDesc = attrBuffs.map(function(a) {
            return attrMap[a.stat] + (a.value > 0 ? '+' : '') + a.value;
        }).join('、') + '（持续60分钟）';
        attrBuffs.forEach(function(a) {
            player[a.stat] += a.value;
        });
        addBuff(buffId, buffName, buffDesc, 'positive', 60);
        var buffObj = player.buffs.find(function(b) { return b.id === buffId; });
        if (buffObj) {
            buffObj.extra = { restore: attrBuffs };
        }
    }

    if (e.buffs) {
        for (var i = 0; i < e.buffs.length; i++) {
            var b = e.buffs[i];
            // 使用固定组合ID：物品名 + Buff名，彻底封死动态ID累积通道
            var fixedBuffId = 'food_' + item.name.replace(/\s/g, '_') + '_' + b.name.replace(/\s/g, '_');
            addBuff(fixedBuffId, b.name, b.desc, b.type || 'positive', b.duration || 60);
        }
    }

    removeItem(itemId, 1);
    checkHp();
    ua();
    usb();
    st('<p>你使用了 ' + item.name + '。</p>');
    
    if (item.name === '极乐致幻剂' || item.name === '高纯度恶魔脑髓液') {
        player.flags.addicted = true;
        player.flags.drugTakenToday = true;
        player.flags.withdrawal = false;
        st('<p style="color:#ff6080;font-weight:bold;text-shadow:0 0 8px #ff6080;">你感受到前所未有的极乐与力量，但深渊的毒素已深深扎根在你的灵魂中。你上瘾了。</p>');
    }
    
    cb();
    ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
}

// ==================== 饱食度系统（每日检查） ====================
function checkSatiety() {
    // 每天检查一次饱食度状态
    if (player.food <= 0) {
        if (!player.buffs.find(function(b){ return b.id === 'starvation'; })) {
            addBuff('starvation', '饥饿', '你饥肠辘辘，身体开始虚弱。力量-2，敏捷-2，疲劳恢复速度降低。', 'negative', 1440);
        }
    } else {
        if (player.buffs.find(function(b){ return b.id === 'starvation'; })) {
            removeBuff('starvation');
        }
    }
    if (player.satietyTimer > 0) {
        player.satietyTimer = Math.max(0, player.satietyTimer - 1440);
        if (player.satietyTimer <= 0) {
            removeBuff('satiety');
        }
    }
}

// ==================== 战斗系统 ====================
function startCombat(enemyData, flagKey, returnRing, returnLevel) {
    var enemy = {
        id: enemyData.id || enemyData.name || 'unknown',
        name: enemyData.name || '敌人',
        maxHp: enemyData.hp || 30,
        hp: enemyData.hp || 30,
        attack: enemyData.physicalAttack || 8,
        defense: enemyData.defense || 2,
        goldReward: enemyData.goldReward || 5,
        sinReward: enemyData.sinReward || 0,
        desc: enemyData.description || ''
    };

    var playerAtk = Math.floor(player.strength * 1.2) + 2;
    var playerDef = Math.floor(player.agility * 0.8) + 1;

    function renderCombat(statusMsg) {
        var hpBar = '❤️ ' + player.hp + '/' + player.maxHp;
        var enemyHpBar = '💀 ' + enemy.hp + '/' + enemy.maxHp;
        var html = '<div class="scene-title">战 斗 </div>';
        html += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a0a14;">';
        html += '<div><span class="highlight">' + player.name + '</span><br>' + hpBar + '<br>攻击 ' + playerAtk + ' | 🛡️ 防御 ' + playerDef + '</div>';
        html += '<div style="text-align:right;"><span class="gold-text">' + enemy.name + '</span><br>' + enemyHpBar + '<br>攻击 ' + enemy.attack + ' | 🛡️ 防御 ' + enemy.defense + '</div>';
        html += '</div>';
        if (statusMsg) html += '<p style="margin:8px 0;color:#c09080;">' + statusMsg + '</p>';
        html += '<p style="font-size:0.78em;color:#8a5a62;">' + enemy.desc + '</p>';
        st(html);
        cb();
    }
function endCombat(victory) {
        if (victory) {
            var gold = enemy.goldReward + Math.floor(Math.random() * 3);
            var exp = 5 + Math.floor(Math.random() * 6);
            player.gold += gold;
            addExp(exp);
            player.sinValue += (enemy.sinReward || 0);

            // 任务系统：检查战斗任务
            player.activeTasks.forEach(function(t) {
                if (t.type === 'combat' && t.target === enemy.id) {
                    player.flags['task_combat_done_' + t.id] = true;
                }
            });

            if (flagKey) {
                player.flags[flagKey] = true;
                // 如果是酒馆教程，额外设置完成标志
                if (flagKey === 'tavernTutorial') {
                    player.flags.tavernTutorialDone = true;
                }
            }
            checkHp();
    ua();
            st('<div class="scene-title">战 斗 胜 利</div><p>你击败了 <span class="gold-text">' + enemy.name + '</span>！</p><p style="color:#e8c060;">获得 ' + gold + ' 金币，' + exp + ' 经验。' + (enemy.sinReward ? ' 罪业值 +' + enemy.sinReward : '') + '</p>');
            player.stats.battlesWon++;
            setTimeout(function() { checkAchievement('first_battle'); }, 150);
            cb();
            ab('继续', function() {
                player.fatigue = Math.min(player.maxFatigue, player.fatigue + 10);
                if (returnRing && returnLevel) {
                    sceneExploreDistrict(returnRing, returnLevel);
                } else {
                    sceneExploreDistrict(player.currentRing, getCurrentLevel());
                }
            });
        } else {
            player.hp = Math.max(1, Math.floor(player.maxHp * 0.2));
            player.fatigue = Math.min(player.maxFatigue, player.fatigue + 30);
            var goldLoss = Math.floor(player.gold * 0.3);
            player.gold = Math.max(0, player.gold - goldLoss);
            if (flagKey && flagKey === 'tavernTutorial') {
                player.flags.tavernTutorialDone = true;
            }
            checkHp();
    ua();
            st('<div class="scene-title">💀 战 斗 失 败</div><p>你被 <span class="highlight">' + enemy.name + '</span> 击倒了……</p><p>你勉强保住了一条命，但损失了 ' + goldLoss + ' 金币。</p>');
            cb();
            ab('艰难地爬起来', function() {
                if (returnRing && returnLevel) {
                    sceneExploreDistrict(returnRing, returnLevel);
                } else {
                    sceneExploreDistrict(player.currentRing, getCurrentLevel());
                }
            });
        }
    }
function playerTurn(action) {
        if (enemy.hp <= 0) { endCombat(true); return; }
        if (player.hp <= 0) { endCombat(false); return; }

        if (action === 'attack') {
            playSound(900, 0.1);
            var dmg = Math.max(1, playerAtk - enemy.defense + Math.floor(Math.random() * 4) - 1);
            enemy.hp = Math.max(0, enemy.hp - dmg);
            renderCombat('你攻击了 ' + enemy.name + '，造成 ' + dmg + ' 点伤害！');
            if (enemy.hp <= 0) { endCombat(true); return; }
            enemyTurn();
        } else if (action === 'defend') {
            playSound(400, 0.15);
            var recovered = Math.floor(player.maxHp * 0.05) + 2;
            player.hp = Math.min(player.maxHp, player.hp + recovered);
            renderCombat('你采取了防御姿态，恢复了 ' + recovered + ' 点生命。');
            enemyTurn();
        } else if (action === 'flee') {
            playSound(200, 0.2);
            var fleeChance = 0.4 + (player.agility * 0.02);
            if (Math.random() < fleeChance) {
                st('<div class="scene-title">🏃 逃 跑</div><p>你成功脱离了战斗！</p>');
                cb();
                ab('继续', function() {
                    if (returnRing && returnLevel) {
                        sceneExploreDistrict(returnRing, returnLevel);
                    } else {
                        sceneExploreDistrict(player.currentRing, getCurrentLevel());
                    }
                });
                return;
            } else {
                renderCombat('逃跑失败！');
                enemyTurn();
            }
        } else if (action === 'item') {
            var consumables = player.inventory.filter(function(it) { return it.type === 'consumable' && it.quantity > 0; });
            if (consumables.length === 0) {
                renderCombat('没有可用的消耗品。');
                cb();
                ab('攻击', function() { playerTurn('attack'); });
                ab('🛡️ 防御', function() { playerTurn('defend'); });
                ab('🏃 逃跑', function() { playerTurn('flee'); });
                return;
            }
            var html = '<div class="scene-title">🧪 使 用 物 品</div>';
            for (var i = 0; i < consumables.length; i++) {
                html += '<p>' + consumables[i].name + ' x' + consumables[i].quantity + ' — ' + consumables[i].desc + '</p>';
            }
            st(html);
            cb();
            for (var i = 0; i < consumables.length; i++) {
                (function(item) {
                    ab('使用 ' + item.name, function() {
                        var e = item.effects || {};
                        player.hp = Math.min(player.maxHp, player.hp + (e.hp || 0));
                        if (e.strength) player.strength += e.strength;
                        if (e.magic) player.magic += e.magic;
                        if (e.charisma) player.charisma += e.charisma;
                        if (e.sanity) player.sanity = Math.min(player.maxSanity, player.sanity + e.sanity);
                        if (e.desire) player.desire = Math.min(player.maxDesire, player.desire + e.desire);
                        if (e.fatigue !== undefined) {
                            player.fatigue = Math.max(0, Math.min(player.maxFatigue, player.fatigue + e.fatigue));
                        }
                        if (e.food) {
                            player.food = Math.min(player.maxFood, player.food + e.food);
                        }
                        removeItem(item.id, 1);
                        checkHp();
    ua();
                        renderCombat('你使用了 ' + item.name + '。');
                        enemyTurn();
                    });
                })(consumables[i]);
            }
            ab('取消', function() {
                renderCombat('');
                cb();
                ab('攻击', function() { playerTurn('attack'); });
                ab('🛡️ 防御', function() { playerTurn('defend'); });
                ab('🧪 使用物品', function() { playerTurn('item'); });
                ab('🏃 逃跑', function() { playerTurn('flee'); });
            });
            return;
        }
    }
function enemyTurn() {
        if (enemy.hp <= 0) { endCombat(true); return; }
        if (player.hp <= 0) { endCombat(false); return; }
        var dmg = Math.max(1, enemy.attack - playerDef + Math.floor(Math.random() * 3) - 1);
        player.hp = Math.max(0, player.hp - dmg);
        renderCombat(enemy.name + ' 攻击了你，造成 ' + dmg + ' 点伤害！');
        if (player.hp <= 0) { endCombat(false); return; }
        cb();
        ab('攻击', function() { playerTurn('attack'); });
        ab('🛡️ 防御', function() { playerTurn('defend'); });
        ab('🧪 使用物品', function() { playerTurn('item'); });
        ab('🏃 逃跑', function() { playerTurn('flee'); });
    }

    renderCombat('战斗开始！');
    cb();
    ab('攻击', function() { playerTurn('attack'); });
    ab('🛡️ 防御', function() { playerTurn('defend'); });
    ab('🧪 使用物品', function() { playerTurn('item'); });
    ab('🏃 逃跑', function() { playerTurn('flee'); });
}

// ==================== 时间系统 ====================
function getTimeString() { var h = Math.floor(player.gameTime / 60) % 24; var m = player.gameTime % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
function getDateString() { return '第' + player.daysSurvived + '天 · 月' + player.month + ' · 年' + player.year; }
function getTimePeriod() { var h = Math.floor(player.gameTime / 60) % 24; if (h >= 6 && h < 12) return 'morning'; if (h >= 12 && h < 18) return 'afternoon'; if (h >= 18 && h < 22) return 'evening'; return 'night'; }
function isNight() { var h = Math.floor(player.gameTime / 60) % 24; return h >= 22 || h < 6; }
function isBlackMarketOpen() { var h = Math.floor(player.gameTime / 60) % 24; return h >= 22 || h < 2; }
function addTime(minutes) {
    player.gameTime += minutes;
    while (player.gameTime >= 1440) {
        player.gameTime -= 1440;
        player.daysSurvived++;
        // 成瘾戒断检测
        if (player.flags.addicted) {
            if (player.flags.drugTakenToday) {
                player.flags.drugTakenToday = false;
            } else {
                player.hp = Math.max(1, player.hp - 15);
                player.sanity = Math.max(0, player.sanity - 10);
                player.flags.withdrawal = true;
            }
        }
        
        // 通宵检测
        if (player.flags.isSleeping) {
            player.consecutiveSleeplessDays = 0;
        } else {
            player.consecutiveSleeplessDays = (player.consecutiveSleeplessDays || 0) + 1;
            if (player.consecutiveSleeplessDays >= 7) {
                triggerGameOver('sleepless');
                return;
            }

function tickBuffs() {
    var currentAbsolute = player.daysSurvived * 1440 + player.gameTime;
    for (var i = player.buffs.length - 1; i >= 0; i--) {
        var b = player.buffs[i];
        if (b.duration && b.duration < 9999 && b.startAbsolute !== undefined) {
            var elapsed = Math.floor((currentAbsolute - b.startAbsolute) / 60);
            if (elapsed >= b.duration) {
                if (b.extra && b.extra.restore) {
                    b.extra.restore.forEach(function(a) {
                        player[a.stat] = Math.max(1, player[a.stat] - a.value);
                    });
                }
                removeBuff(b.id);
            }
        }
    }
}

function sleepRest(quality, hours, fatiguePerHour, hpPerHour, sanityPerHour) {
    var fatigueRecovery = fatiguePerHour * hours;
    var hpRecovery = hpPerHour * hours;
    var sanityRecovery = sanityPerHour * hours;
    var foodCost = Math.floor(hours * 2);

    player.hp = Math.min(player.maxHp, player.hp + hpRecovery);
    player.sanity = Math.min(player.maxSanity, player.sanity + sanityRecovery);
    player.fatigue = Math.max(0, player.fatigue - fatigueRecovery);
    player.food = Math.max(0, player.food - foodCost);

    if (player.alarmTime !== null) {
        var currentMin = player.gameTime % 1440;
        var alarmMin = player.alarmTime % 1440;
        if (alarmMin > currentMin) {
            player.gameTime += (alarmMin - currentMin);
        } else if (alarmMin < currentMin) {
            player.gameTime += (1440 - currentMin + alarmMin);
        }
        player.alarmTime = null;
    } else {
        addTime(Math.floor(hours * 60));
    }
    player.flags.isSleeping = false; saveToSlot(0);
    removeBuff('exhausted');

    var keys = Object.keys(player.flags);
    for (var i = 0; i < keys.length; i++) {
        if (keys[i].indexOf('npcLeft_') === 0) {
            delete player.flags[keys[i]];
        }
    }

    checkHp();
    ua();
}

function getMoodText() {
    var moods = [];

    else if (player.sanity <= 6) moods.push('你的理智摇摇欲坠，时常感到不安与恐惧。');
    else if (player.sanity <= 10) moods.push('你感到迷茫而警觉。初来乍到，一切都需要小心应对。');
    else moods.push('你保持着清醒的头脑，对周围的一切有着敏锐的感知。');
    if (player.desire >= 15) moods.push('欲望在你体内燃烧，几乎要将理智吞没。');
    else if (player.desire >= 10) moods.push('一股隐隐的渴望在你心中涌动。');
    
    if (player.flags.addicted) {
        if (player.flags.withdrawal) {
            moods.push('<span style="color:#e85060;font-weight:bold;text-shadow:0 0 4px #e85060;">戒断反应如同万蚁噬骨，你的灵魂在尖叫着渴求下一剂药物！</span>');
        } else {
            moods.push('<span style="color:#d4a040;">禁忌药物带来的极乐在你的血液中流淌，但你深知这份快乐是有致命代价的。</span>');
        }
    }
    if (player.flags.mutationGland) {
        moods.push('<span style="color:#8a2be2;">心脏旁的黑色肉瘤在跳动，带给你无尽的疯狂呓语与超常的再生力。</span>');
    }

    else if (player.hp < player.maxHp * 0.6) moods.push('你身上带着些许伤痕，需要休养。');

function checkTaskDeadlines() {
    for (var i = player.activeTasks.length - 1; i >= 0; i--) {
        var t = player.activeTasks[i];
        if (player.daysSurvived > t.deadline) {
            t.status = 'failed';
            player.failedTasks.push(t);
            player.activeTasks.splice(i, 1);
            // 惩罚
            player.sanity = Math.max(0, player.sanity - 2);
            player.gold = Math.max(0, player.gold - 3);
            st('<p style="color:#e85060;">⚠️ 任务 "' + t.title + '" 已过期！你失去了信誉，理智-2，金币-3。</p>');
        }
    }
}

function completeTask(taskId) {
    for (var i = 0; i < player.activeTasks.length; i++) {
        if (player.activeTasks[i].id === taskId) {
            var t = player.activeTasks[i];
            var canComplete = false;
            switch (t.type) {
                case 'collect':
                    if (getItemCount(t.target) >= t.quantity) {
                        removeItem(t.target, t.quantity);
                        canComplete = true;
                    }
                    break;
                case 'combat':
                    if (player.flags['task_combat_done_' + t.id]) canComplete = true;
                    break;
                case 'escort':
                case 'steal':
                case 'social':
                case 'explore':
                    if (player.flags['task_done_' + t.id]) canComplete = true;
                    break;
            }
            if (canComplete) {
                t.status = 'completed';
                player.completedTasks.push(t);
                player.activeTasks.splice(i, 1);
                player.gold += t.goldReward;
                addExp(t.expReward);
                if (t.sinReward) player.sinValue += t.sinReward;
                st('<p style="color:#e8c060;">恭喜！任务已完成：' + t.title + '</p><p>奖励：' + t.goldReward + '金币，' + t.expReward + '经验值。</p>');
                checkAchievement('task_1');
                cb();
                ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
                return;
            } else {
                st('<p class="highlight">任务目标尚未达成。</p>');
                cb();
                ab('返回', function() { switchTab('tasks'); });
                return;
            }
        }
    }
}

function abandonTask(taskId) {
    for (var i = 0; i < player.activeTasks.length; i++) {
        if (player.activeTasks[i].id === taskId) {
            var t = player.activeTasks[i];
            t.status = 'failed';
            player.failedTasks.push(t);
            player.activeTasks.splice(i, 1);
            st('<p style="color:#e85060;">你放弃了任务：' + t.title + '</p>');
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
            return;
        }
    }
}

function refreshBlackMarket() {
    var day = player.daysSurvived;
    if (player.blackMarketLastRefresh !== day) {
        player.blackMarketItems = [];
        var count = 3 + Math.floor(Math.random() * 4);
        for (var i = 0; i < count; i++) {
            var item = generateBlackMarketItem();
            item.sold = false; // 初始化
            player.blackMarketItems.push(item);
        }
        player.blackMarketLastRefresh = day;
    }
}

function enterBlackMarket() {
    if (!isBlackMarketOpen()) {
        st('<div class="scene-title">黑市</div><p>黑市只在夜晚开放（22:00-02:00）。现在还未到营业时间。</p>');
        cb();
        ab('返回', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
        return;
    }
    refreshBlackMarket();
    var html = '<div class="scene-title">黑 市</div><p>暗巷深处，一个被阴影笼罩的摊位前，一个戴着兜帽的商人正在等你。</p><p style="color:#ff6080;font-size:0.82em;">"欢迎光临……我这里有些……特别的货物。"</p>';
    html += '<div style="background:#180610;border:1px solid #2a0a16;border-radius:6px;padding:10px;margin:8px 0;">';
    var availableItems = player.blackMarketItems.filter(function(it) { return !it.sold; });
    if (availableItems.length === 0) {
        html += '<p style="color:#5a5a6a;text-align:center;">今天的货都卖完了……改天再来吧。</p>';
    } else {
        for (var i = 0; i < availableItems.length; i++) {
            var it = availableItems[i];
            html += '<p>· ' + it.name + ' <span style="color:#e85060;">' + it.price + 'G</span> — ' + it.desc + '</p>';
        }
    }
    html += '</div>';
    st(html);
    cb();
    // 生成购买按钮（只针对未售商品）
    for (var i = 0; i < player.blackMarketItems.length; i++) {
        (function(item) {
            if (item.sold) return;
            ab('购买 ' + item.name + '（' + item.price + 'G）', function() {
                if (player.gold >= item.price) {
                    player.gold -= item.price;
                    var type = item.type || 'misc';
                    var effects = item.effects || {};
                    if (type === 'consumable') {
                        addItem(item.id, item.name, 'consumable', item.desc, 1, effects);
                    } else if (type === 'weapon') {
                        addItem(item.id, item.name, 'weapon', item.desc, 1, effects);
                    } else if (type === 'armor') {
                        addItem(item.id, item.name, 'armor', item.desc, 1, effects);
                    } else {
                        addItem(item.id, item.name, 'misc', item.desc, 1, effects);
                    }
                    checkHp();
    ua();
                    st('<p>你购买了 <span style="color:#ff6080;">' + item.name + '</span>。</p>');
                    // 标记为已售（不删除）
                    item.sold = true;
                } else {
                    st('<p class="highlight">⚠️ 金币不足。需要 ' + item.price + ' 金币，你只有 ' + player.gold + ' 金币。</p>');
                }
                cb();
                ab('继续购物', function() { enterBlackMarket(); });
                ab('离开', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
            }, 'danger-btn');
        })(player.blackMarketItems[i]);
    }
    ab('离开黑市', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
}

function triggerRandomEvent() {
    if (player.randomEventCooldown > 0) {
        player.randomEventCooldown--;
        return false;
    }

    // 根据昼夜调整基础概率
    var baseChance = isNight() ? 0.7 : 0.45;
    if (Math.random() > baseChance) return false;

    // 首先尝试生成NPC随机事件
    if (Math.random() < 0.15) {
        var npcEvent = generateNpcRandomEvent();
        if (npcEvent) {
            renderRandomEvent(npcEvent);
            player.randomEventCooldown = 2 + Math.floor(Math.random() * 3);
            return true;
        }
    }

    // 尝试生成泽洛斯事件（概率显著降低）
    if (Math.random() < 0.12) {
                // 若尚未初遇泽洛斯，强制转入初遇剧情
                if (!player.relationships['泽洛斯']) {
                    sceneNpcFirstMeet('泽洛斯', player.currentRing, getCurrentLevel());
                    player.randomEventCooldown = 2 + Math.floor(Math.random() * 3);
                    return true;
                }
                var zelosEvent = {
                    type: 'zelos',
                    title: '🌀 混沌之影 · 泽洛斯',
                    text: '你正走在路上，周围流动的空气突然变得极其粘稠，仿佛陷入了泥沼。紧接着，一道暗紫色的幻光在你面前的半空中剧烈扭曲、迅速凝聚，最终化作一个身形修长的实体。泽洛斯顶着一头蓬松略显凌乱的紫发，发丝间漆黑的尖角极其惹眼。他透过细框眼镜，用那双暗红色的瞳孔带着玩味的光芒将你上下打量。他嘴角向两边咧开，扯出一个极其诡异且危险的弧度，声音慵懒中透着笑意：“又见面了——或者说，初次见面？混沌之中，时间和顺序都是幻觉。你最近……收集到有趣的情绪碎片了吗？”他微微歪了歪头，暗红色的瞳孔中闪过一丝难以捉摸的危险光芒。',
                    options: [
                        { label: '与他周旋，套取情报', effect: function() {
                                player.charisma = Math.min(20, player.charisma + 1);
                                addExp(5);
                                st(
                                    '<p>你迅速压下心底的警惕，面部表情切换得极其自然，顺着他那种混沌无序的话头极其巧妙地聊了下去。泽洛斯似乎对你的配合感到一丝愉悦，在看似漫不经心的交谈中，他极其随意地抛出了一个致命的情报："傲慢之环的星尘区深处有一扇被遗忘的门，通往一个被封存的空间。如果你能找到钥匙——也许会有惊喜。"你将这条关于星尘区密门的情报牢牢记在脑海中。</p><p style="color:#e8c060;">魅力+1，经验+5。获得情报：星尘区密门。</p>'
                                    );
                                player.flags.zelosInfo = true;
                                checkHp();
    ua();
                            } },
                        { label: '警惕地保持距离', effect: function() {
                                player.sanity = Math.min(player.maxSanity, player.sanity + 2);
                                st(
                                    '<p>你没有任何犹豫，浑身肌肉瞬间绷紧，直接向后倒退了一大步，拉开了一个极其明确且充满防备的安全距离。泽洛斯见状并没有动怒，反而极其愉悦地笑出了声："有趣……你比大多数恶魔都要谨慎。这很好——在混沌中，谨慎是少数能保命的品质之一。"他抬起手，指尖极其随意地弹出一枚由暗紫色幻光凝结而成的硬币。硬币在半空中划过一道弧线落入你手中，触手冰凉。</p><p style="color:#e8c060;">理智+2。获得：泽洛斯的幻光硬币。</p>'
                                    );
                                addItem('zelos_coin', '泽洛斯的幻光硬币', 'misc',
                                    '一枚由混沌幻术凝成的硬币，可在关键时刻抵消一次幻术效果。', 1);
                                checkHp();
    ua();
                            } },
                        { label: '挑衅他，试探底线', effect: function() {
                                player.sinValue += 3;
                                st(
                                    '<p>你毫不退让地直视着他那双暗红色的眼睛，嘴角扯出一抹极其冰冷的讥笑，毫不客气地回击：“少故弄玄虚了。”听到这句话，泽洛斯脸上的笑容极其明显地僵硬了一瞬。但紧接着，他爆发出了一阵极度张狂的大笑。“有意思！作为奖励——让我给你看个东西。”他抬起右手，在半空中极其清脆地打了一个响指。你的视线瞬间被强行拉入一段极其逼真的血腥幻象中——你清晰地看到自己正在一条极其昏暗的死胡同里遭到多名刺客的致命围攻。“这是你三天后的命运。不过既然我提前告诉你了，也许你能改变它。”他的声音在幻象碎裂后悠悠传来，你带着满身冷汗回到了现实，手里多了一份沾血的死亡预告。</p><p style="color:#e85060;">罪业值+3。获得情报：三天后将有伏击。</p>'
                                    );
                                player.flags.zelosWarning = true;
                                checkHp();
    ua();
                            }, cls: 'danger-btn' }
                    ]
                };
                renderRandomEvent(zelosEvent);
                player.randomEventCooldown = 2 + Math.floor(Math.random() * 3);
                return true;
    }

    // 最后生成普通负面事件
            var negEvent = generateNegativeRandomEvent();
            if (negEvent) {
                // 检查是否有自定义选项
                if (negEvent.options) {
                    renderRandomEvent(negEvent);
                } else {
                    // 标准负面事件，直接执行效果
                    renderRandomEvent({
                        type: 'negative',
                        title: '⚠️ ' + negEvent.title,
                        text: negEvent.text,
                        options: [
                            { label: '继续前进', effect: function() {
                                    negEvent.effect();
                                    checkHp();
    ua();
                                    cb();
                                    ab('继续探索', function() { sceneExploreDistrict(player.currentRing,
                                            getCurrentLevel()); });
                                } }
                        ]
                    });
                }
                player.randomEventCooldown = 2 + Math.floor(Math.random() * 4);
                return true;
            }

            return false;
        }

        ],
        '暴怒之环': [
            { name: '角斗场陪练', desc: '血焰角斗场需要一批"沙包"——在正式角斗士热身时充当陪练的活靶子。你不会被杀死，但肯定会疼。训练师递给你一副破旧的皮甲和一柄钝剑，推着你走进满是干涸血迹的铁笼。', stat: 'strength', dc: 13, reward: 12, exp: 14, time: 50, failMsg: '你连最基础的防御架势都没撑住，直接被揍得鼻青脸肿瘫倒在地。训练师失望地摇摇头，随手丢下几枚硬币当做医药费。', successMsg: '你穿着破旧的皮甲，在满是血迹的铁笼里硬生生扛过了角斗士整整三轮的狂暴重击。浑身淤青的你换来了训练师赞赏的拍肩和全额丰厚报酬。' },
            { name: '武器工坊淬火', desc: '铁砧大道的武器工坊里，熔炉日夜不熄。你被雇来负责最枯燥的环节——将锻打好的刀坯反复浸入淬火油中，再送进回火炉。这项工作需要稳定的手法和对高温的忍耐力。', stat: 'agility', dc: 10, reward: 6, exp: 8, time: 50, failMsg: '你被高温烤得手腕一抖，刀坯直接掉进槽底，捞出时刃口已经彻底崩坏。工头大声咒骂着，直接扣掉了你一半的工资。', successMsg: '你忍受着熔炉的极度高温，极其平稳地将锻打好的刀坯反复浸入淬火油槽。工头试了试完美的刃口硬度，难得地咧嘴笑着将工钱和磨刀石碎块塞给你。' },
            { name: '伤兵护理', desc: '碎骨巷的伤兵收容所里挤满了从角斗场抬下来的倒霉蛋。他们断骨错位、伤口化脓，急需有人帮忙换绷带、喂水和按住那些因剧痛而挣扎的伤兵。', stat: 'charisma', dc: 9, reward: 5, exp: 7, time: 40, failMsg: '你笨手笨脚地被伤兵一头撞翻，直接打翻了整盆干净的绷带。护士长扯下沾满血水的手套，狠狠砸在你的脸上。', successMsg: '你在一片哀嚎声中，极其熟练地按住剧烈挣扎的伤兵，动作利落地更换化脓的绷带。护士长在工作结束后，分给了你一份热汤和硬币。' }
        ],
        '色欲之环': [
            { name: '秀场后台杂役', desc: '霓虹大道的欲焰秀场正在筹备今晚的演出。后台乱成一锅粥——戏服散落一地，道具需要搬运，化妆台前堆满了用过的粉扑和假睫毛。场务总管急需人手在开演前将所有东西归位。', stat: 'agility', dc: 10, reward: 6, exp: 8, time: 45, failMsg: '你慌乱中一脚踢翻了整盒昂贵的亮片，场务总管尖叫着将你强行推搡出后台，只扔出两枚硬币。', successMsg: '你在极其混乱的后台来回穿梭，在开演前十分钟将所有戏服和道具精准归位。场务总管长舒一口气，塞钱时顺手在你脸上留下一个带着浓烈香水味的指印。' },
            { name: '陪酒招待', desc: '暗巷深处的一家地下酒馆正在找临时陪酒。你的工作是坐在卡座里，为那些孤独的恶魔倒酒、听他们抱怨地狱的无聊，偶尔附和几句。不需要出卖身体——只需要出卖倾听的耐心。', stat: 'charisma', dc: 11, reward: 9, exp: 9, time: 55, failMsg: '你全程如同木头般的反应让客人感到极其扫兴。对方挥手将你赶走，酒保只能无奈地付给你最低的底薪。', successMsg: '你坐在昏暗的卡座里，面无表情却又极其到位地附和着客人的抱怨。你的倾听让对方极其受用，临走时在酒杯下压了一笔丰厚的小费。' },
            { name: '香水试嗅员', desc: '魅骨时装店的地下室里，一位调香师正在研发新款魅惑香水。她需要"未经训练的鼻子"来测试不同配方的前调、中调和后调。你需要在闻了二十几种香精之后，准确描述每种气味给人的感受。', stat: 'magic', dc: 10, reward: 7, exp: 8, time: 40, failMsg: '闻到第十五种时，你的嗅觉彻底失灵，大脑一阵眩晕。调香师遗憾地收起记录本，只付了最基础的测试费。', successMsg: '你连续吸入二十几种刺鼻香精，依然极其精准地在纸上写下了所有的气味层次。调香师兴奋地塞给你报酬和一管试用装香水。' }
        ],
        '嫉妒之环': [
            { name: '黑水打捞', desc: '水沟区的黑水齐腰深，水面上常年漂浮着从上层环层冲下来的废弃物品。有人专门雇人在黑水中打捞——运气好的话，能捞到完整的旧家具、还能转卖的破损饰品、甚至某位贵族不慎冲进下水道的金笔。', stat: 'strength', dc: 11, reward: 7, exp: 9, time: 50, failMsg: '你在黑水里泡得浑身发抖，捞上来的全是一堆生锈的废铁和破布。雇主冷眼一扫，直接将东西重新踢回水里。', successMsg: '你强忍着恶臭，在齐腰深的冰冷黑水中不断摸索，成功捞出了一把镀银餐具和一只旧怀表。雇主仔细端详后，满意地付了全款。' },
            { name: '谣言集市散播', desc: '镜面街区的谣言集市里，一个情报贩子正在招募"扩音器"——将几条真假难辨的消息传遍嫉妒之环的各个角落。你需要在茶馆、栈桥和地下通道之间穿梭，用不经意的口吻把话递出去。', stat: 'charisma', dc: 10, reward: 8, exp: 8, time: 45, failMsg: '你的表演极其僵硬刻意，周围的恶魔立刻识破了你的意图。情报贩子失望地摇摇头，只给了你一点路费。', successMsg: '你如同幽灵般穿梭在茶馆与地下通道间，用极其自然的闲聊口吻将虚假消息散布出去。傍晚时分，谣言已彻底传开，情报贩子痛快地支付了报酬。' },
            { name: '仿冒品加工', desc: '镜面街区的深渊镜像工坊正在赶制一批仿冒的"傲慢环水晶吊坠"——实际上只是用普通玻璃染色后打磨而成。你的工作是给这些假吊坠刻上以假乱真的暗纹，让它们看起来像是从晨星高地上捡来的。', stat: 'agility', dc: 12, reward: 9, exp: 10, time: 55, failMsg: '你的刻刀一滑，直接刮废了好几片玻璃。工坊主看着残次品眉头紧锁，直接扣下了一半的工钱。', successMsg: '你手中的刻刀极其精准地在廉价玻璃表面游走，刻下的暗纹足以以假乱真。工坊主举起成品对着灯光仔细端详，满意地点头付钱。' }
        ],
        '暴食之环': [
            { name: '食材分拣', desc: '美食大道的永饥食品厂后门，堆满了从各环运来的食材原料。你的工作是将腐烂的部分切掉，把勉强能用的部分分拣进不同的筐里。这项工作对胃的承受力是一种考验——腐烂的肉类散发着令人窒息的恶臭。', stat: 'strength', dc: 10, reward: 6, exp: 8, time: 45, failMsg: '你在极其刺鼻的酸臭味中没撑过半小时，直接冲到后巷干呕起来。工头看着你惨白的脸色，只给结算了半个工时。', successMsg: '你强忍着令人窒息的腐肉恶臭，面不改色地挥刀切除腐烂部分，分拣完三大筐食材。工头看着你干净的围裙，竖起拇指支付了报酬。' },
            { name: '食教传教站帮厨', desc: '食教传教站的执事正在准备今日的免费汤品。他需要人手帮忙削皮、切菜和搅拌那一口永远填不满的大锅。执事一边干活一边低声向你讲述食教的教义——"吞噬是万物最终的归宿"。', stat: 'magic', dc: 10, reward: 7, exp: 9, time: 50, failMsg: '你一个走神，锋利的菜刀直接切破了手指，鲜血滴落。执事面无表情地帮你包扎伤口，随后只付了最低的帮厨费。', successMsg: '你手脚麻利地切菜、投料，极其默契地配合执事搅拌那口巨大的浓汤锅。工作结束后，执事在塞给你报酬的同时，悄悄往你口袋里放了一包干燥香料。' },
            { name: '残渣区拾荒', desc: '残渣区的深处，堆积如山的食物残渣中偶尔能翻出还能吃的东西。有人在招募拾荒者——从腐臭的垃圾中翻出还能转卖的边角料。这工作需要敏锐的眼力和强大的胃。', stat: 'agility', dc: 11, reward: 8, exp: 10, time: 50, failMsg: '你徒手翻找了半天，只掏出一堆彻底发黑腐烂的烂泥。雇主捏着鼻子嫌弃地看了一眼，扔下一点辛苦费便转身离开。', successMsg: '你极其敏锐地在堆积如山的腐臭垃圾中翻找，挖出了半箱未变质的罐头和干粮。雇主惊喜地拍打你的后背，连钱带两罐罐头一起塞给了你。' }
        ],
        '懒惰之环': [
            { name: '帮人躺平', desc: '停滞区的惰性休闲馆正在招募"陪伴躺平员"。你的工作很简单——躺在体验区的躺椅上当活招牌，向路过的恶魔展示躺椅的舒适度。唯一的挑战是不能真的睡着——虽然就算睡着了也没人在乎。', stat: 'charisma', dc: 8, reward: 4, exp: 6, time: 40, failMsg: '你直接陷入了深度睡眠，醒来时嘴角还挂着口水。经理面无表情地看着你，直接扣掉了一半的工资。', successMsg: '你躺在柔软的体验椅上，极其完美地保持着半睡半醒的慵懒状态，成功吸引了几个路人恶魔当场掏钱购买。经理难得地点头夸奖并支付了全额。' },
            { name: '文件代交', desc: '懒鬼外包公司的前台趴在一叠积压了数月的文件上，用极其缓慢的语速告诉你——他们需要人帮客户把一份拖延了半年的申请表交到对面那栋楼。距离：不到一百米。原因：客户懒得亲自走过去。', stat: 'agility', dc: 5, reward: 3, exp: 5, time: 20, failMsg: '你拿着文件站在原地，连腿都懒得迈出一步。前台用同样慵懒的眼神看了你一眼，表达了惺惺相惜的失望。', successMsg: '你拿着那份拖延了半年的申请表，步行不到一百米塞进了对面的信箱。前台恶魔用极其缓慢的动作竖起大拇指，将报酬推到你面前。' },
            { name: '灰雾冥想指导', desc: '停滞区的一间低价惰性休闲馆里，几个长期失眠的恶魔正在参加"灰雾冥想"课程。你的工作是坐在他们面前，用最缓慢、最催眠的语调念出指导语，帮助他们进入深层放松状态。', stat: 'magic', dc: 9, reward: 5, exp: 7, time: 35, failMsg: '你的语速没有控制好，显得极其急躁，直接导致前排的恶魔烦躁地睁开眼。老师无奈地夺过指导词，只支付了一半的钱。', successMsg: '你盘腿坐在前方，用极其缓慢、温柔的语调念出指导语。所有失眠的恶魔都在你的声音中陷入了深沉的睡眠。老师轻手轻脚地递上了丰厚报酬。' }
        ]
    };

    var jobs = ringJobs[ring];
    if (!jobs || jobs.length === 0) {
        jobs = [
            { name: '矿场搬运', desc: '在水晶矿场搬运矿石。需要体力。', stat: 'strength', dc: 12, reward: 8, exp: 10, time: 60, failMsg: '你体力不支，只拿到一半报酬。', successMsg: '工作顺利完成！' },
            { name: '酒馆招待', desc: '在酒馆端盘子。需要魅力。', stat: 'charisma', dc: 10, reward: 6, exp: 8, time: 60, failMsg: '你笨手笨脚，只拿到一半报酬。', successMsg: '工作顺利完成！' },
            { name: '街头卖艺', desc: '用你的魔力表演杂耍。', stat: 'magic', dc: 10, reward: 7, exp: 9, time: 50, failMsg: '你的表演无人喝彩，只拿到一半报酬。', successMsg: '表演大获成功！' },
            { name: '暗巷交易', desc: '参与地下交易，需要敏捷和胆量。', stat: 'agility', dc: 12, reward: 12, exp: 12, time: 40, failMsg: '交易搞砸了，只拿到一半报酬。', successMsg: '交易顺利完成！' }
        ];
    }

    var job = jobs[Math.floor(Math.random() * jobs.length)];
    // 工作事件随机文本
    var eventTexts = [
        '工作中，你听到工友在谈论一个隐藏的宝库。',
        '你发现了一个偷懒的好地方，休息了一会儿。',
        '监工今天心情不错，多给了你一些报酬。',
        '一个同事试图偷你的东西，你及时发现了。',
        '你无意中听到了一段关于某个君主的秘密谈话。'
    ];
    var eventChance = Math.random();
    var extraEvent = '';
    if (eventChance < 0.15) {
        extraEvent = '<p style="color:#c09080;font-style:italic;">' + eventTexts[Math.floor(Math.random() * eventTexts.length)] + '</p>';
    }

    st('<div class="scene-title">工作机会</div><p>' + job.desc + '</p><p>需求：' + statNames[job.stat] + ' ≥ ' + job.dc + '</p>' + extraEvent);
    cb();
    ab('接受（耗时' + job.time + '分钟）', function() {
        addTime(job.time);
        player.fatigue = Math.min(player.maxFatigue, player.fatigue + 15 + Math.floor(player.fatigue/10));
        // 工作意外事件
        var accident = Math.random();
        if (accident < 0.05) {
            st('<p style="color:#e85060;">⚠️ 工作中发生了意外！你被掉落的石块砸伤，HP-15。</p>');
            player.hp -= 15;
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
            return;
        }
        if (player[job.stat] >= job.dc) {
            var reward = Math.floor(job.reward * (1 + player.level * 0.1));
            var exp = Math.floor(job.exp * (1 + player.level * 0.05));
            player.gold += reward;
            addExp(exp);
            st('<p>' + (job.successMsg || '工作顺利完成！获得了 ' + reward + ' 金币，' + exp + ' 经验。') + '</p><p style="color:#e8c060;">获得了 ' + reward + ' 金币，' + exp + ' 经验。</p>' + extraEvent);
        } else {
            var half = Math.floor(Math.floor(job.reward * (1 + player.level * 0.1)) / 2);
            player.gold += half;
            st('<p>' + (job.failMsg || '你勉强完成，但效果不佳。') + '</p><p style="color:#e85060;">获得了 ' + half + ' 金币。</p>' + extraEvent);
        }
        cb();
        ab('返回（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
    });
    ab('拒绝', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
}

// ==================== NPC 交互（修复：次数限制+好感审视） ====================
function getNpcFirstMeetText(npcId) {
    var sin = player.sin, race = player.race;
    
    if (npcId === '墨菲') {
        if (race === 'sinner') return '色欲环的地下霓虹舞台后场，空气中弥漫着一股甜腻得发昏的香气。墨菲正对着镜子整理他那件半透明的紫青色真丝衬衫。听到脚步声，他的脖子以一种完全没有骨头支撑的诡异角度直接扭转了180度看向你，亮黄色的兽瞳里闪过一丝兴奋。\n\n<em>"哎呀，一只迷路的小罪人~"</em>他猛地转过身，身后的细长尾巴兴奋地拍打着地面，迈着极其妖娆的步伐向你走来，指尖隐隐分泌出透明的致幻毒液，<em>"看看这干瘪的灵魂……亲爱的，需要我给你注射一点‘快乐’，让你在这无聊的地狱里重新鲜活起来吗？"</em>';
        return '墨菲正慵懒地瘫在紫丝绒沙发上，他的双腿和左臂此刻已经完全化作了粗壮的紫青色章鱼触手，上面密密麻麻的吸盘正贪婪地呼吸着空气中的水分。看到你出现，他立刻将触手收缩重塑成修长的人类肢体，从沙发上弹了起来，顺手理了理腰间的金属细链。\n\n<em>"哦~原生恶魔的魔力味道，真是令人迷醉。"</em>他双手夸张地捧着脸颊，亮黄色的眼睛弯成月牙，甜腻的声音里藏着致命的危险，<em>"欢迎来到我的后台，小可怜。你是来找乐子的，还是来买秘密的？事先声明，我的出场费可是很贵的哦，可能要拿你的理智来换呢。"</em>';
    }
    if (npcId === '厄尔') {
        return '一间布满焦痕和血迹的冰冷禁闭室里，角落传出断断续续的绝望悲泣，与一种病态、沙哑的狂笑声交织在一起。厄尔蜷缩在阴影中，左半边脸极度怯懦痛苦，而右半边脸被深渊侵蚀，长着三只毫无高光的多重眼睛。\n\n察觉到你的靠近，他猛地抬起头。左眼流下泪水，声音哽咽：<em>"快走……别过来……它要出来了！"</em>但他右边长着暗红色恶魔角的额头猛地抽搐，嘴里爆发出狂躁的笑声：<em>"哈哈哈哈！食物！新的玩具！撕碎你！"</em>他痛苦地用左手死死掐住自己的右半边脖子，在理智与疯狂的深渊中挣扎。';
    }
    if (npcId === '西珀') {
        if (race === 'sinner') return '贪婪之环的最高建筑顶端，夜风凛冽。西珀正蹲在一根狭窄的避雷针上，脖颈处的白色绒毛被风吹得轻轻飘动。察觉到你的气息，他停止了动作，回过头，琥珀色的竖瞳在黑暗中泛着微光。\n\n<em>"哟~大半夜还在街上晃悠的罪人，你的口袋里有什么闪闪发光的好玩意儿吗？"</em>他露出两颗尖锐的小虎牙，像只发现毛线球的猫一样轻笑起来，紧接着毫无预兆地松开双腿，在半空中轻盈地翻滚了一圈，悄无声息地落在你身后，冰冷的利爪瞬间抵住了你的后颈，<em>"别动哦，如果不把有趣的东西交出来，我可是会咬人的~"</em>';
        return '贪婪之环的最高建筑顶端，夜风凛冽。西珀正蹲在一根狭窄的避雷针上，脖颈处的白色绒毛被风吹得轻轻飘动。他手里正抛着一颗刚偷来的高阶灵魂宝石。察觉到你的气息，他回头看向你。\n\n<em>"原生恶魔的气息……真难闻。"</em>他嫌弃地皱了皱鼻子，琥珀色的竖瞳瞬间缩紧成一条线，充满戒备与野性。他将宝石随手塞进口袋，身体重心压低，做出了随时准备弹射起步的攻击姿态，<em>"如果你是来替那些蠢货要回这块石头的，我劝你省省力气。我不想跟你打，但如果你非要拦我的路……我不介意在你的脸上留几道血印子。"</em>';
    }
    if (npcId === '塞缪尔') {
        if (race === 'sinner') return '暴怒之环的阴暗街角，空气中弥漫着刺鼻的劣质酒精味和血腥味。塞缪尔正摇摇晃晃地靠在墙边，手里拎着一个酒瓶，脚下踩着一个不知死活的倒霉蛋。巨大的生锈铁十字架被扔在一旁，上面还沾着新鲜的碎肉。\n\n听到你的脚步声，他打了个响亮的酒嗝，猛地抬起头。布满血丝的眼球凶狠地死盯着你。<em>"看什么看？没见过神父做礼拜吗？"</em>他随手把空酒瓶砸碎在墙上，玻璃碴溅了一地，摇晃着抓起地上的铁十字架，大舌头地骂骂咧咧，<em>"又来一个不知死活的罪人……过来！让老子用主的名义，把你这狗娘养的脑袋敲碎！"</em>';
        return '地下酒吧的后巷里，塞缪尔正扒着垃圾桶剧烈地干呕。他灰白色的油腻长发垂在脸颊两侧，黑色的神父袍上全是污渍。察觉到原生恶魔的气息，他胡乱用袖子擦了擦嘴，转过身来。\n\n<em>"原生恶魔……嗝……高高在上的大人物……"</em>他眯起那双神经质的眼睛，充满敌意地上下打量着你。他从怀里掏出一个扁酒壶猛灌了一大口，劣质酒精顺着下巴流进敞开的领口。他单手将那把几百斤重的铁十字架扛在肩上。<em>"你们这群地狱里的寄生虫，身上那股子优越感真是熏得我直恶心。趁我还没发火，赶紧滚出我的视线！"</em>';
    }
    if (npcId === '维奥莱特') {
        if (race === 'sinner') return '情报沙龙“盲点”的顶层包厢里，空气中弥漫着昂贵的红茶香气。维奥莱特端坐在天鹅绒高背椅上。她穿着一身剪裁利落的暗红色西装长裤，戴着黑色蕾丝手套的双手交叠放在膝盖上。紫色的短卷发完美地贴合在脸颊两侧。\n\n听到大门推开的声音，她缓缓抬起头。那双没有瞳孔的纯白眼眸准确无误地“看”向了你所在的方向。\n\n“一股混杂着人间泥土味和劣质执念的酸气。”她嘴角的弧度加深了几分，声音轻柔得像是在叹息，“一个罪人。既然你能在不惊动我护卫的情况下走到这里，说明你的灵魂里藏着点有价值的东西。坐吧，告诉我，你想用什么秘密来换取我的时间？”';
        return '维奥莱特正站在留声机旁，戴着蕾丝手套的手指轻轻将唱针搭在黑胶唱片上。悠扬的大提琴声在房间里流淌开来。\n\n她转过身，那双空洞纯白的眼睛直直地对准了你。她没有后退，也没有做出任何防备的动作，只是穿着那身干练的暗红色西装长裤，优雅地将双手交叠在身前。紫色的短卷发在昏暗的灯光下泛着幽暗的光泽。\n\n“纯粹的魔力波动……原生恶魔的灵魂总是比那些罪人要干净一些，但也无趣得多。”她微微歪了歪头，“在这个时间闯入我的沙龙，希望你带来的情报，配得上你打扰我听音乐的失礼。”';

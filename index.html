        '</span> | 罪人 | <span class="gold-text">' + player.sin +
        '</span></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:12px 0;padding:14px;background:#14040a;border-radius:6px;border:1px solid #2a0a14;"><span>力量：<span class="highlight">' +
        player.strength + '</span></span><span>敏捷：<span class="highlight">' + player.agility +
        '</span></span><span>魔力：<span class="highlight">' + player.magic +
        '</span></span><span>魅力：<span class="highlight">' + player.charisma +
        '</span></span><span>理智：<span class="highlight">' + player.sanity +
        '</span></span></div>');
    cb();
    ab('坠入傲慢之环……', function() { sceneSinnerAwaken(); }, 'primary-btn');
}
function setSinTraits() {
            if (player.sin === '暴食' || player.birthRing === '暴食之环') player.sinTrait = '暴食';
            else if (player.sin === '懒惰' || player.birthRing === '懒惰之环') player.sinTrait = '懒惰';
            else if (player.sin === '色欲' || player.birthRing === '色欲之环') player.sinTrait = '色欲';
        }
function sceneSinnerAwaken() { 
            player.hp = player.maxHp; 
            player.currentRing = '傲慢之环'; 
            player.currentDistrict = 'poor';
            ua(); 
            st('<div class="scene-title">傲 慢 之 环</div><p>意识像一根被拉出水面的绳索，缓慢而痛苦地凝聚。然后——你睁开了眼。</p><p>头顶不是天空。是<span class="highlight">水晶</span>。暗紫色的水晶穹顶覆盖着整个视野，望不到边际。从中透出的光不来自任何星辰，不来自任何太阳——那光是傲慢本身发出的冷光，将一切照得清晰而残酷。你从不知道光也可以如此冰冷。你躺在黑色的石板上，石板表面刻满了你看不懂的古老符文——那是审判的文字，在你接触它的瞬间便印入了你的意识。</p><p>周围是和你一样刚坠入地狱的灵魂。有的蜷缩着无声哭泣，有的疯狂咒骂着这片黑暗，有的已经吓得说不出话，只是呆呆地望着头顶的水晶穹顶。空气中弥漫着一种难以形容的压迫感——不是重量，是<span class="highlight">目光</span>。仿佛有什么不可名状的存在正从上方俯视着这一切。</p><p>远处，一座水晶宫殿悬浮在半空。它不依附于任何支撑，只是静静地漂浮在暗紫色的光晕中。塔尖刺入更深层的黑暗。你知道那座宫殿属于谁。地狱中的每一个存在都知道。</p><p>一阵脚步声接近。一个穿着暗色长袍的低阶恶魔走到你面前。他的面孔模糊不清，仿佛五官只是临时拼凑的。他用不带任何感情的声音说：</p><p><em>新到的罪人。君主今日亲自审判。起来。去审判厅。</em></p>'); 
            cb(); 
            ab('挣扎着站起来，跟随恶魔前往审判厅', function() { sceneSinnerHall(); }); 
        }
function sceneSinnerHall() { st('<div class="scene-title">审 判 厅</div><p>审判厅比你想象中更大。大到你无法看到尽头。暗紫色的光从穹顶的棱镜中折射下来，将整个空间切割成无数明暗交错的碎片。厅堂两侧矗立着巨大的水晶柱，每根柱子都有数十米高——但让你脊背发凉的，不是柱子的宏伟，而是柱中封存的东西。</p><p><span class="highlight">罪人的遗骸。</span>不知多少年前的灵魂，保持着坠入地狱时的姿态，被永远凝固在水晶之中。他们的表情清晰可见——有的惊恐，有的愤怒，有的在最后一刻终于流露出了悔恨。他们已成为这座厅堂的装饰，成为对每一位新到者的无声警告。</p><p>你被推搡着站到了厅堂中央。周围是数十个和你一样的新到者，挤在一起，像待宰的牲畜。哭泣声渐渐停止了——因为所有人都感觉到了——空气变了。不是变冷。是变得<span class="highlight">稀薄</span>。然后你听到了脚步声。每一下都像踩在所有人的心脏上。</p><p>银白色的长发，赤金色的眼眸，暗紫金边的长袍——<span class="highlight">路西法</span>降临在审判席上。他没有看任何人。他的目光越过所有新到的罪人，仿佛他们只是一片不值得聚焦的模糊背景。</p>'); cb(); ab('屏住呼吸，等待审判', function() { var verdictText = ''; switch (player.sin) { case '傲慢': verdictText = '他的目光在你身上多停了半秒——在那双赤金色的眼眸中，你捕捉到了一丝几乎不可察觉的玩味。<em>傲慢——</em>他微微侧头，银白长发从肩上滑落，<em>倒是与吾同源。但你配不上这份罪孽。你犯下的傲慢如此渺小，连给吾提鞋都不配。不过——至少你选择了最高贵的罪。</em>'; break; case '暴怒': verdictText = '他的目光扫过你，嘴角微微下撇——那表情介于轻蔑和厌烦之间。<em>暴怒——野蛮人的罪孽。</em>他连评价都懒得多说一个字。在他眼中，你的愤怒不过是一只野兽在笼中的咆哮——吵闹，但毫无意义。'; break; case '贪婪': verdictText = '他看了你一眼——那眼神中闪过一丝毫不掩饰的鄙夷。<em>贪婪——为铜臭折腰的灵魂。</em>他的语气里没有愤怒，只有一种居高临下的嫌恶，<em>连罪孽都犯得如此庸俗。你追逐了一辈子的东西，在吾眼中不过是脚下的尘埃。</em>'; break; case '嫉妒': verdictText = '他甚至没有正眼看你。<em>嫉妒——最卑微的罪孽。</em>他的声音里带着一种独特的蔑视——那种蔑视不是针对你的罪行，而是针对你选择了如此低劣的罪，<em>连罪都不配光明正大地犯。永远活在别人的阴影里，连自己站出来的勇气都没有。</em>'; break; case '暴食': verdictText = '他的目光冷冷掠过你，像掠过一块不值得停留的残渣。<em>暴食——把灵魂浪费在填饱肚子上。</em>他轻轻摇了摇头，<em>真是可悲。你一生的追求，不过是满足一个永远填不满的胃。连罪都犯得如此没有野心。</em>'; break; case '色欲': verdictText = '他轻哼了一声——那声音里混合着厌倦和轻微的不耐烦。<em>色欲——被欲望驱使的动物。</em>他的手指在王座扶手上轻轻敲了一下，<em>连自制都做不到，也配称罪人？你不过是欲望的奴隶，而奴隶——在任何地方都是最底层的存在。</em>'; break; case '懒惰': verdictText = '他几乎懒得开口。沉默了许久，才吐出几个字：<em>懒惰——连罪都犯得如此敷衍。</em>他挥了挥手，仿佛连审判你都是一种浪费，<em>你甚至不配被审判。你的存在本身，就是对地狱效率的侮辱。</em>'; break; } st('<div class="scene-title">审 判</div><p>路西法的目光终于扫过你——当那双赤金色的眼眸与你短暂接触时，你感到一阵前所未有的<span class="highlight">自惭形秽</span>。仿佛你的一生、你的罪孽、你自认为刻骨铭心的痛苦——在他眼中都轻如尘埃。</p><p>' + verdictText + '</p><p>他轻轻挥了挥手，语气恢复了平淡：<em>罪孽浅薄。平庸至极。按惯例，依罪孽送往对应环层。至于这些连罪孽都犯得如此平庸的——暂留傲慢环底层。若有价值，自有去处。若无价值——</em></p><p>他没有说完。他不需要说完。那个未完成的句子像一把悬在半空的刀，让每一个人都清楚地意识到：在这里，你的存在本身，不过是一种<span class="highlight">暂缓</span>。</p>'); player.flags.judged = true; cb(); ab('低头承受审判结果', function() { sceneSinnerAfter(); }); }); ab('直视路西法', function() { player.sanity -= 1; player.flags.daredToLook = true; ua(); var dareText = ''; switch (player.sin) { case '傲慢': dareText = '在所有低垂的头颅中，你抬起了头。路西法的嘴角微微上扬——那不是赞赏，而是看到一只蚂蚁试图模仿飞鸟时的嘲弄。他微微偏头，银白长发从肩上滑落。<em>有趣。</em>他说这两个字时，眼中终于映出了你的倒影——但那倒影如此渺小，<em>你至少还有抬头的勇气。但这不能改变你的平庸。傲慢——是需要实力来支撑的。而你没有。</em>'; break; case '暴怒': dareText = '你抬起头。路西法甚至没有回应你的目光——他的无视本身就是最锋利的回应。他沉默了很久，久到你的脖子开始酸痛。然后他才开口：<em>你以为愤怒能让你与众不同？每一个暴怒的灵魂在审判时都会抬头。你们都一样——除了蛮力一无所有。</em>'; break; case '贪婪': dareText = '你抬起头。路西法终于正眼看了你——但只是短短一瞬。随即移开，仿佛你的存在污染了他的视线。<em>连审判都要讨价还价？</em>他语气里的嫌恶加深了，<em>你以为直视吾能让你获得更好的待遇？贪婪——真是从头到脚都写着廉价。</em>'; break; case '嫉妒': dareText = '你抬起头。路西法的目光掠过你，像掠过一片不值得停留的阴影。<em>你在看吾？还是你在想——凭什么坐在上面的是他而不是你？</em>他替你回答了：<em>因为你永远只敢在下面看。嫉妒者最大的可悲，是永远不敢伸手去拿自己想要的东西。</em>'; break; case '暴食': dareText = '你抬起头。路西法微微偏头——那姿态不像在看你，更像在确认一件物品是否值得被踢开。<em>你的胃填不满，你的胆量倒是不小。</em>他的语气中带着一丝意外的玩味，<em>但饥饿带来的勇气，和饥饿本身一样——不过是本能。</em>'; break; case '色欲': dareText = '你抬起头。路西法面无表情，你的直视在他眼中和一只飞虫掠过面前没有区别。<em>你在试图诱惑谁？</em>他的声音冷淡至极，<em>吾见过最美的天使坠落，也见过最丑陋的欲望膨胀。你的这点小把戏，连让吾多看一眼的资格都没有。</em>'; break; case '懒惰': dareText = '你抬起头。路西法甚至懒得回应你的目光。他挥了挥手——那动作随意得像在赶走一阵无关紧要的风。<em>连抬头都抬得这么敷衍。</em>他的语气中没有愤怒，只有一种深深的疲惫，<em>退下吧。你连被审判的价值都没有。</em>'; break; } st('<p>你不知从哪来的勇气——或许是愚蠢，或许是残存的尊严——在所有头颅都低垂的时刻，你抬起了头。你直视了那双赤金色的眼眸。仅仅一瞬。但那一瞬间漫长得像一个世纪。</p><p>你没有感到愤怒。没有感到惩罚。你只感到一种<span class="highlight">彻底的无视</span>——比蔑视更令人窒息的，是他甚至懒得对你施加蔑视。一个人类抬头看天，天不会感到被冒犯。一只蚂蚁举起前肢，踩死它的人不会觉得那是挑衅。</p><p>' + dareText + '</p>'); cb(); ab('……', function() { sceneSinnerAfter(); }); }, 'danger-btn'); }

    cb();

        var fatigueRecovery = place.fatiguePerHour * hours;
        var hpRecovery = place.hpPerHour * hours;
        var sanityRecovery = place.sanityPerHour * hours;
        var foodCost = Math.floor(hours * 2);
        
        // Add nightmare/dream mechanic
        var dreamHtml = '';
        var nightmareTriggered = false;
        
        if (player.flags.addicted && player.flags.withdrawal) {
            dreamHtml = '<p style="color:#e85060;">你做了一个极其恐怖的噩梦。梦里你的五脏六腑都在被数千只毒蚁啃食，你疯狂地尖叫着，在地上打滚，乞求哪怕一滴毒药。戒断反应让你的睡眠几乎成了一种拷问。</p>';
            sanityRecovery = 0; hpRecovery = 0; fatigueRecovery = fatigueRecovery / 2;

    st('<div class="scene-title">全程侍奉</div><p>扎里克带你穿过一条更深的走廊——这次你注意到走廊两侧还有好几扇紧闭的门，每扇门后面都隐藏着你无法猜测的秘密。走廊尽头是一间稍微宽敞的房间。与之前的房间相比，这里几乎可以算得上"舒适"了——当然，这是以灰烬区的标准而言。</p><p>房间里有一张简陋的床——实际上只是几块厚木板搭在石头上，上面铺了一层薄薄的、已经看不出原本颜色的垫子。角落里放着一个破旧的衣柜，柜门半开着，里面空空如也，只有一层厚厚的灰尘。窗被封死了——不是用木板，而是用某种暗色的、半透明的水晶碎片拼成的，透进来的光是一种浑浊的暗紫色。墙上有一面裂了缝的镜子，镜面模糊得几乎照不出人形。</p><p>他关上了门。门闩落下的声音在安静的房间中格外清晰——那是一声沉闷的、带着回响的金属撞击声，宣告着外界的一切都被暂时隔绝在外。他转过身看着你，那双蛇瞳在昏暗中闪烁着暗黄色的光芒。在这一刻，他不像是一个交易对象——更像是一只评估猎物的野兽。但你也在评估他。这是双向的。</p><p><em>你知道该怎么做。</em>他说，声音低沉得像从胸腔深处发出的震动。那不是命令——只是陈述一个即将发生的事实。</p><p style="color:#c09080;font-style:italic;">[扎里克将衣物一件件剥落，随手丢弃在满是灰尘的地板上。你也褪去了身上的遮挡。他沉重结实的身躯覆压下来，将你牢牢抵在床铺上。昏暗的紫色灯光照在裂缝遍布的墙面上。他找准位置，沉腰挤入了你的身体。起初，他挺动的动作缓慢而克制，每次都深深碾过内里的软肉。很快，他的动作变得急促且粗暴。大开大合的抽插让两人的肌肤不断拍打相撞，汗水交融在一起。破旧的床架随着他猛烈的撞击节奏，发出不堪重负的"吱呀"声。墙上的两道影子不断重叠、分开，又再次狠狠撞成一团。扎里克死死咬紧牙关，下颌因为强烈的刺激而微微发颤。他原本冷硬的眼角此刻完全放松下来，流露出毫无防备的失控神情。伴随着最后几次极具爆发力的深深挺进，他的身体猛地紧绷到极限。一股滚烫的浊液尽数灌入你的体内深处。事后，他脱力地半压在你身上，胸膛剧烈起伏。狭窄的房间里弥漫着浓重混浊的气味。两人都没有开口说话，死寂的空气中只剩下交错的喘息声。]</p><p>事后，扎里克躺在那张简陋的床上，盯着天花板上剥落的灰泥沉默了很久。墙上那道裂缝里的暗紫色光线在他脸上投下一道细长的光斑，恰好划过他嘴角那道旧伤疤。他的呼吸渐渐平稳下来，但那双蛇瞳仍然睁着，望着上方，仿佛在天花板的裂缝中看到了什么你不理解的东西。</p><p>然后他伸手从散落在地上的衣物中翻出了那个陈旧的皮袋。他数出了 ' + rw + ' 枚金币——比之前谈好的价格多了几枚。他把金币放在枕边，手指在金币上停留了一秒，然后收回了手。他起身穿衣的动作很慢，与之前那种干脆利落的风格截然不同。你注意到他没有立刻系上斗篷——而是先背对着你站了几秒，看着墙上那面模糊的镜子。</p><p><em>……你不错。</em></p><p>这是他起身离开前说的最后一句话。他的背影在门口停留了一秒——他回头看了你一眼，那双蛇瞳中的光芒比任何时候都要柔和。然后他拉上了兜帽，走进了走廊的阴影中。脚步声渐渐远去，直到消失在酒馆深处的嘈杂声里。</p><p>你一个人留在房间里。枕边那摞金币在暗紫色的光线中泛着微光。</p><p style="color:#e8c060;">获得 ' + rw + ' 金币。欲望值 +6。罪业值 +6。理智 -1。</p>');

}

    player.statusMood = '你感到手指微微发酸，心中涌起一种复杂的感受——屈辱、满足、以及某种隐秘的兴奋交织在一起。你不确定自己是不是应该感到羞耻，但口袋里金币的重量是真实的。在地狱里，真实的东西比感觉重要。';

function sceneSellOral() {

    ua();
    st('<div class="scene-title">口部侍奉</div><p>扎里克带你穿过了同一条走廊，但这次他打开了走廊尽头的一扇不同的门。房间比之前那个稍大一些，但仍然简陋得令人压抑。一张老旧的木椅放在房间中央——那是一把曾经上过漆的椅子，但现在扶手上的漆皮已经大片大片地剥落，露出下面灰白色的木头。椅子旁边是一个破旧的衣柜，柜门半开着，里面空空如也，只有一股樟脑和霉菌的混合气味。</p><p>他坐在那把椅子上。椅子承受他的体重时发出一声呻吟，但撑住了。他居高临下地看着你，昏黄的灯光在他脸上投下深深的阴影——那些阴影让他脸上的伤疤看起来更加深邃，也让他的蛇瞳在暗处闪烁着不真实的光芒。他的手指在椅子扶手上敲了两下——那节奏和之前在吧台时一模一样。</p><p>你在他面前跪下。地板很硬——木头的纹理透过薄薄的衣物硌着你的膝盖。你能感受到地板上那些被无数人踩踏过的凹痕和不平整。空气中弥漫着灰尘、旧木头和他身上的气味——一种混合了皮革、硫磺和某种更原始的体味的气息。远处隐约传来酒馆里的嘈杂声，但在这个房间里，那些声音仿佛来自另一个世界。</p><p><em>放松。</em>他说，声音比之前低沉了一些。那不是威胁——更像是一种难得的、笨拙的安抚。</p><p style="color:#c09080;font-style:italic;">[你张开嘴，将扎里克那处含入口中。一开始，你的动作还带着些许僵硬与停顿，但很快便调整了吞吐的幅度，动作变得熟练而有节奏。你的口腔内部被那股沉甸甸的分量完全撑满，舌尖舔舐过表面陌生的纹理，随着一次次的摩擦，那种触感逐渐变得熟悉。扎里克的手指顺着你的头骨插进发丝之间。起初他的指腹只是试探性地抚摸着，但没过多久，他的五指便猛然收紧，用力扣住你的后脑。他并没有粗暴地拉扯你的头发，而是用掌心的力量向下按压，强硬地引导着你的头部，让你吞咽得更深。他的胸膛剧烈起伏，呼吸声愈发粗重。他紧咬着牙，试图克制自己的反应，但喉咙深处依然难以自控地溢出低沉的闷哼。昏暗的灯光在房间内闪烁。随着时间的推移，原本由你主动掌控的节奏，逐渐被扎里克接管。他按压着你的动作越来越强势，腰部也开始配合着挺动。最终，他的身体猛地紧绷到极限，手指死死扣紧你的发根。一股温热的浊液直接涌入你的喉咙深处。随后，他脱力般松开了手。房间里陷入一片死寂，只剩下你急促的喘息声，以及墙外酒馆里隐约透进来的喧哗。]</p><p>结束后，他沉默了一会儿。那双蛇瞳在昏暗中注视着你——这次的目光中没有审视，没有评估，只是一种难以解读的平静。他从斗篷内袋里掏出皮袋，一枚一枚地数出 ' + rw + ' 枚金币，在桌上堆成一小摞。金币在昏暗的灯光下泛着微弱的光芒，那光芒映在他脸上的伤疤上。</p><p><em>不错。</em>他说，语气比之前多了一丝——不是温柔，更像是某种罕见的认可。<em>你比大多数新手有天赋。不是每个人都能……这么自然。如果你以后还想做这种交易——</em>他从斗篷里掏出一小块碎水晶放在桌上——<em>拿着这个。捏碎它，我会知道你在找我。当然，只是交易。别的就算了。</em></p><p style="color:#e8c060;">获得 ' + rw + ' 金币。欲望值 +4。罪业值 +4。获得信物：扎里克的通讯水晶碎片。</p>');
    player.statusMood = '你感到喉咙微微发疼，嘴唇上还残留着陌生的味道——皮革、盐和某种更深层的、说不清的东西。一种复杂的情绪在胸中翻涌——不是羞耻，而是一种奇怪的、想要更多的空虚感。你握紧了那枚碎水晶，它的棱角硌着你的掌心。';

}

function sceneFakeCombat() {
    st('<div class="scene-title">你决定揍他一顿</div>' +
    '<p>你猛地站起身，一拳挥向黑衣人！</p>' +
    '<p>然而，你的拳头穿过了一片残影，原来他早已从原地消失。声音从你背后传来：</p>' +
    '<p style="color:#e8c060;">“哎呀呀，年轻人火气这么大？”</p>' +
    '<p>你回头，他正悠闲地站在三米外，双手插兜，一脸戏谑。</p>');
    cb();
    ab('再次攻击', function() { fakeCombatAttack(1); });
    ab('😤 骂他一句', function() { fakeCombatInsult(); });
    ab('😩 认输', function() { fakeCombatEnd(); });
}
function fakeCombatAttack(stage) {
    var taunts = [
    '“啧啧，这拳头软绵绵的，连只苍蝇都打不中吧？你是在给我挠痒痒吗？”',
    '“哈！你这出拳速度，比我翻漫画还慢。建议你去跟史莱姆学两招。”',
    '“哇哦，好大的力气——可惜全打在空气上了。你是不是近视啊？”',
    '“我闭着眼睛都能躲开你这一拳。你该不会是在模仿慢动作回放吧？”'
    ];
    var taunt = taunts[Math.floor(Math.random() * taunts.length)];
    st('<div class="scene-title">你再次挥拳</div>' +
    '<p>你大喝一声，全力挥出一记重拳！黑衣人轻轻侧身，你的拳头擦着他的衣角落空，你因为惯性差点摔倒。</p>' +
    '<p style="color:#e8c060;">' + taunt + '</p>');
    cb();
    if (stage < 3) {
    ab('😠 继续打', function() { fakeCombatAttack(stage + 1); });
    } else {
    ab('😩 认输', function() { fakeCombatEnd(); });
    }
    ab('😤 骂他一句', function() { fakeCombatInsult(); });
}
function fakeCombatInsult() {
    var insults = [
    '“你倒是挺有意思的。好吧，我承认，我就是喜欢看你气急败坏的样子。”',
    '“骂人倒是挺利索，可惜拳脚跟不上。你该不会是在把天赋都点在了嘴上吧？”',
    '“哈哈哈哈，你骂人的样子比打架可爱多了。继续，我听着呢。”'
    ];
    st('<div class="scene-title">😤 你骂了他一句</div>' +
    '<p>你忍不住爆了句粗口：“你这家伙，就会躲来躲去，有本事正面打啊！是不是男人？”</p>' +
    '<p>黑衣人愣了一下，然后哈哈大笑：</p>' +
    '<p style="color:#e8c060;">' + insults[Math.floor(Math.random() * insults.length)] + '</p>');
    cb();
    ab('😩 认输', function() { fakeCombatEnd(); });
    ab('💢 继续攻击', function() { fakeCombatAttack(1); });
}
function fakeCombatEnd() {
    st('<div class="scene-title">战斗结束</div>' +
    '<p>你无奈地叹了口气，放弃了和这个神秘黑衣人较量的念头。</p>' +
    '<p>他咧嘴一笑：“这才对嘛。以后少动拳头，多动脑子。看你这么执着，送你点小礼物好了。”</p>' +
    '<p>他随随手从口袋里掏出一张皱巴巴的纸条，扔到你面前，然后转身走向酒馆后门。</p>' +
    '<p style="color:#9a6a6a;font-size:0.78em;">（你捡起纸条，上面用歪歪扭扭的字写着：“恭喜你，成功浪费了五分钟——神高一哥留。” 下面还画了个吐舌头的鬼脸，旁边画着一只被踩扁的蟑螂。）</p>');
    addItem('sgyg_gift', '神高一哥的恶作剧纪念品', 'misc', '一张被揉皱的签名纸条，背面写着“你永远打不中我——神高一哥”。附赠一个鬼脸涂鸦和一只被踩扁的蟑螂图案。纯属恶搞，毫无用处，但承载了一段难忘的（憋屈）回忆。', 1);
    cb();
    ab('回到酒馆', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
}

// ==================== 启动游戏 ====================
checkHp();
    ua();
sceneTitle();
</script>

function doSleep(place, hours) {
    if (player.flags.isSleeping) return;
    if (player.gameOver) return;
    if (place.cost && player.gold < place.cost) {
        st('<p class="highlight">⚠️ 金币不足。需要 ' + place.cost + ' 金币，你只有 ' + player.gold + ' 金币。</p>');
        cb();
        ab('返回', function() { chooseSleepPlace(); });
        return;
    }
    // 房费在真正入睡时扣除，取消房间选择不会白花钱
    if (place.cost) player.gold -= place.cost;
    player.flags.isSleeping = true;
    player.sleepPlace = place.name;
    player.sleepQuality = place.quality || 'poor';
    st('<div class="scene-title">💤 沉 睡</div><p>你在 ' + place.name + ' 闭上了眼睛，试图在地狱的重压下寻找片刻的喘息……</p>');
    cb();
    var snapshot = { hp: player.hp, sanity: player.sanity, fatigue: player.fatigue, food: player.food };
    setTimeout(function() {
        var fatigueRecovery = place.fatiguePerHour * hours;
        var hpRecovery = place.hpPerHour * hours;
        var sanityRecovery = place.sanityPerHour * hours;
        var foodCost = Math.floor(hours * 2);

        try {
            if (player.gameOver) return;

            // 梦境与噩梦
            var dreamHtml = '';
            var nightmareTriggered = false;

            if (player.flags.addicted && player.flags.withdrawal) {
                dreamHtml = '<p style="color:#e85060;">你做了一个极其恐怖的噩梦。梦里你的五脏六腑都在被数千只毒蚁啃食，你疯狂地尖叫着，在地上打滚，乞求哪怕一滴毒药。戒断反应让你的睡眠几乎成了一种拷问。</p>';
                sanityRecovery = 0; hpRecovery = 0; fatigueRecovery = fatigueRecovery / 2;
                nightmareTriggered = true;
            } else if (player.sanity < player.maxSanity * 0.2) {
                dreamHtml = '<p style="color:#e85060;">理智的崩溃让梦境化为一片血海。你梦见路西法的赤金双眸正在你的脑海里冷酷地审判你，你的血肉一点点剥落，只剩下一具枯骨。你在极度的恐慌和冷汗中惊醒，浑身虚脱。</p>';
                sanityRecovery = Math.floor(sanityRecovery / 2);
                nightmareTriggered = true;
            } else if (player.flags.rileyEnemy && Math.random() < 0.35) {
                dreamHtml = '<p style="color:#c09080;font-style:italic;">梦里有一条金色的锁链。它从黑暗里垂下来，绕过你的手腕，一寸一寸收紧。你听见猫科动物极轻的呼吸声——然后锁链断了，断口整齐得像被刀切过。</p>';
            } else if (player.sinValue > 80 && Math.random() < 0.5) {
                dreamHtml = '<p style="color:#8a2be2;">你梦见自己正在无尽的深渊中下坠。庞大的罪业在你周围化作一双双黑色的巨手，试图将你彻底拉入不可名状的混沌。但奇怪的是，你并没有感到恐惧，反而有一丝……享受。</p>';
            } else if (player.race === 'sinner' && Math.random() < 0.3) {
                dreamHtml = '<p style="color:#9a6a6a;font-style:italic;">你梦见了生前的事。梦见了你犯下罪孽的那一天，那个被你伤害的人的脸孔在黑暗中闪过。但在这冰冷的地狱里，那段人间的记忆正变得越来越模糊，像一团快要散去的灰雾。</p>';
            } else if (player.race === 'demon' && Math.random() < 0.3) {
                dreamHtml = '<p style="color:#c09080;font-style:italic;">你梦见了你诞生时的那片混沌。纯粹的魔力在你的血管中流淌，你听到了原罪君主在远方深渊中的低语。这让你感到一种归属感。</p>';
            } else {
                dreamHtml = '<p>这是一个难得的、没有被深渊噩梦侵扰的安稳睡眠。</p>';
            }

            player.hp = clampStat('hp', player.hp + hpRecovery);
            player.sanity = clampStat('sanity', player.sanity + sanityRecovery);
            player.fatigue = clampStat('fatigue', player.fatigue - fatigueRecovery);
            player.food = clampStat('food', player.food - foodCost);

            // 睡眠全过程保持 isSleeping，避免「边睡边通宵」、随机事件插进梦里
            addTime(Math.floor(hours * 60));
            player.flags.isSleeping = false;
            player.consecutiveSleeplessDays = 0;
            updateFatigue();

            if (player.gameOver || screenLocked()) return;

            if (nightmareTriggered) {
                player.statusMood = '你刚从一场可怕的噩梦中惊醒，浑身冷汗。';
            } else {
                player.statusMood = '你好好休息了一觉，感到精力充沛。';
            }

            autoSave();
            checkHp();
            ua();

            var dHp = player.hp - snapshot.hp, dSan = player.sanity - snapshot.sanity;
            var dFat = snapshot.fatigue - player.fatigue, dFood = snapshot.food - player.food;
            st('<div class="scene-title">苏 醒</div>' + dreamHtml +
                '<p style="color:#e8c060;">HP ' + (dHp >= 0 ? '+' : '') + Math.round(dHp) +
                '，理智 ' + (dSan >= 0 ? '+' : '') + Math.round(dSan) +
                '，疲劳 -' + Math.round(dFat) +
                '，饱食 -' + Math.round(dFood) + '</p>' +
                '<p style="font-size:0.78em;color:#8a5a62;">' + getDateString() + ' · ' + getTimeString() +
                ' · 夜宿于 ' + place.name + '</p>');
            cb();
            ab('起身，继续探索', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
        } finally {
            player.flags.isSleeping = false;
        }
    }, 800);
}

            // 随机选一个NPC
            var npcId = candidateNpcs[Math.floor(Math.random() * candidateNpcs.length)];
            var rel = player.relationships[npcId];
            var love = rel ? (rel.love || 5) : 5;

            var rData = npcRandomReactions[npcId];

            if (rData) {
                if (Array.isArray(rData)) {
                    reactions = rData;
                } else if (love <= 20) {
                    reactions = rData.low || rData.neutral || rData.high;
                } else if (love <= 50) {
                    reactions = rData.neutral || rData.low || rData.high;
                } else {
                    reactions = rData.high || rData.neutral || rData.low;
                }

            if (!reactions || reactions.length === 0) return null;

            // 好感度变化（轻微）
            var loveChange = 0;
            if (love <= 20) loveChange = Math.floor(Math.random() * 3) + 1;
            else if (love <= 50) loveChange = Math.floor(Math.random() * 2) + 1;
            else loveChange = Math.floor(Math.random() * 2) + 1;

            return {
                type: 'npc_encounter',
                npcId: npcId,
                title: '偶遇 ' + npcId,

    st('<div class="scene-title">全程侍奉</div><p>扎里克带你穿过一条更深的走廊——这次你注意到走廊两侧还有好几扇紧闭的门，每扇门后面都隐藏着你无法猜测的秘密。走廊尽头是一间稍微宽敞的房间。与之前的房间相比，这里几乎可以算得上"舒适"了——当然，这是以灰烬区的标准而言。</p><p>房间里有一张简陋的床——实际上只是几块厚木板搭在石头上，上面铺了一层薄薄的、已经看不出原本颜色的垫子。角落里放着一个破旧的衣柜，柜门半开着，里面空空如也，只有一层厚厚的灰尘。窗被封死了——不是用木板，而是用某种暗色的、半透明的水晶碎片拼成的，透进来的光是一种浑浊的暗紫色。墙上有一面裂了缝的镜子，镜面模糊得几乎照不出人形。</p><p>他关上了门。门闩落下的声音在安静的房间中格外清晰——那是一声沉闷的、带着回响的金属撞击声，宣告着外界的一切都被暂时隔绝在外。他转过身看着你，那双蛇瞳在昏暗中闪烁着暗黄色的光芒。在这一刻，他不像是一个交易对象——更像是一只评估猎物的野兽。但你也在评估他。这是双向的。</p><p><em>你知道该怎么做。</em>他说，声音低沉得像从胸腔深处发出的震动。那不是命令——只是陈述一个即将发生的事实。</p><p style="color:#c09080;font-style:italic;">[扎里克将衣物一件件剥落，随手丢弃在满是灰尘的地板上。你也褪去了身上的遮挡。他沉重结实的身躯覆压下来，将你牢牢抵在床铺上。昏暗的紫色灯光照在裂缝遍布的墙面上。他找准位置，沉腰挤入了你的身体。起初，他挺动的动作缓慢而克制，每次都深深碾过内里的软肉。很快，他的动作变得急促且粗暴。大开大合的抽插让两人的肌肤不断拍打相撞，汗水交融在一起。破旧的床架随着他猛烈的撞击节奏，发出不堪重负的"吱呀"声。墙上的两道影子不断重叠、分开，又再次狠狠撞成一团。扎里克死死咬紧牙关，下颌因为强烈的刺激而微微发颤。他原本冷硬的眼角此刻完全放松下来，流露出毫无防备的失控神情。伴随着最后几次极具爆发力的深深挺进，他的身体猛地紧绷到极限。一股滚烫的浊液尽数灌入你的体内深处。事后，他脱力地半压在你身上，胸膛剧烈起伏。狭窄的房间里弥漫着浓重混浊的气味。两人都没有开口说话，死寂的空气中只剩下交错的喘息声。]</p><p>事后，扎里克躺在那张简陋的床上，盯着天花板上剥落的灰泥沉默了很久。墙上那道裂缝里的暗紫色光线在他脸上投下一道细长的光斑，恰好划过他嘴角那道旧伤疤。他的呼吸渐渐平稳下来，但那双蛇瞳仍然睁着，望着上方，仿佛在天花板的裂缝中看到了什么你不理解的东西。</p><p>然后他伸手从散落在地上的衣物中翻出了那个陈旧的皮袋。他数出了 ' + rw + ' 枚金币——比之前谈好的价格多了几枚。他把金币放在枕边，手指在金币上停留了一秒，然后收回了手。他起身穿衣的动作很慢，与之前那种干脆利落的风格截然不同。你注意到他没有立刻系上斗篷——而是先背对着你站了几秒，看着墙上那面模糊的镜子。</p><p><em>……你不错。</em></p><p>这是他起身离开前说的最后一句话。他的背影在门口停留了一秒——他回头看了你一眼，那双蛇瞳中的光芒比任何时候都要柔和。然后他拉上了兜帽，走进了走廊的阴影中。脚步声渐渐远去，直到消失在酒馆深处的嘈杂声里。</p><p>你一个人留在房间里。枕边那摞金币在暗紫色的光线中泛着微光。</p><p style="color:#e8c060;">获得 ' + rw + ' 金币。欲望值 +6。罪业值 +6。理智 -1。</p>');

}

    st('<div class="scene-title">手部侍奉</div><p>扎里克站起身，示意你跟上。他带你穿过酒馆深处一条狭窄的走廊——走廊很暗，只有尽头一盏快要熄灭的油灯投下摇曳的暗黄色光圈。墙壁上布满裂缝，从裂缝中渗出某种暗色的潮湿痕迹。空气在这里变得更加沉闷，酒馆里的嘈杂声渐渐远去，只剩下你们的脚步声在狭窄的空间中回荡。</p><p>他推开走廊尽头的一扇木门。门没有锁——显然这间房间经常被用于类似的用途。房间很小，墙壁由粗糙的石块砌成，上面没有任何装饰。唯一的家具是一张低矮的木桌和两把椅子。墙上挂着一盏摇摇欲坠的油灯，投下摇曳的阴影——光线将房间内的一切都蒙上了一层不真实的暗黄色调。空气中弥漫着灰尘和旧木头的气味，还有一丝若有若无的、来自之前使用者的香水余味。</p><p><em>随便坐。</em>扎里克靠在墙上，双臂交叉。他的斗篷微微敞开，露出了腰间那把短刀的刀柄——他没有把刀取下来。也许这是信任的表现，也许只是他不需要。<em>放轻松。不需要紧张——就当作一份工作。在地狱里，工作就是工作，没什么可羞耻的。</em></p><p>你深吸一口气，在他面前蹲下——</p><p style="color:#c09080;font-style:italic;">[你背靠着粗糙的石墙坐下，调整好姿势后，伸出手一把握住了他身下的那处。昏暗摇曳的油灯下，你的手掌紧紧贴着他硬挺的器官。你收拢五指，开始顺着原本的轮廓上下套弄。随着掌心与粗糙表面的摩擦，他原本平稳的呼吸逐渐变得急促。你加重了手上的力道，指腹用力按压着快速滑动。狭小的空间里，皮肉快速摩擦的黏腻声被无限放大。他因难耐而微微变换站姿，重心的移动让脚下的木地板发出轻微的"吱呀"声。你加快了手部的动作，掌心不断在根部与顶端之间来回重重碾过。空气紧绷到了极点。伴随着一声难以克制、微微发颤的粗重呼气，他的身体猛地一僵，滚烫的浊液尽数喷洒在你的手心和指缝间。寂静重新降临。他从斗篷内袋里掏出一块破布，冷静且熟练地将你手上的脏污擦拭干净，随后清理了自己。他将那处收回，面无表情地扣好纽扣，将衣服的褶皱一一抚平。整套动作行云流水，快得仿佛刚才的一切根本没有发生过。]</p><p>结束后，扎里克整理好衣物，动作不紧不慢。他从斗篷内袋里掏出一个陈旧的皮袋，从里面数出了 ' + rw + ' 枚金币。金币在昏暗的灯光下泛着微弱的金色光芒——那是一种与周围灰暗环境格格不入的亮色。他把金币一枚一枚地放在你面前的小桌上，排成一排。</p><p><em>不赖。</em>他说，语气比之前多了一丝——不是温柔，更像是某种难得的认可。<em>你的手很稳。这在灰烬区是种本事。下次如果还有兴趣——</em>他用手指在桌上敲了两下——<em>老地方见。如果你还愿意的话。</em></p><p style="color:#e8c060;">获得 ' + rw + ' 金币。欲望值 +2。罪业值 +2。</p>');
    player.statusMood = '你感到手指微微发酸，心中涌起一种复杂的感受——屈辱、满足、以及某种隐秘的兴奋交织在一起。你不确定自己是不是应该感到羞耻，但口袋里金币的重量是真实的。在地狱里，真实的东西比感觉重要。';
    cb();
    ab('整理衣物，离开房间（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
}
function sceneSellOral() {

    checkHp();
    ua();
    st('<div class="scene-title">口部侍奉</div><p>扎里克带你穿过了同一条走廊，但这次他打开了走廊尽头的一扇不同的门。房间比之前那个稍大一些，但仍然简陋得令人压抑。一张老旧的木椅放在房间中央——那是一把曾经上过漆的椅子，但现在扶手上的漆皮已经大片大片地剥落，露出下面灰白色的木头。椅子旁边是一个破旧的衣柜，柜门半开着，里面空空如也，只有一股樟脑和霉菌的混合气味。</p><p>他坐在那把椅子上。椅子承受他的体重时发出一声呻吟，但撑住了。他居高临下地看着你，昏黄的灯光在他脸上投下深深的阴影——那些阴影让他脸上的伤疤看起来更加深邃，也让他的蛇瞳在暗处闪烁着不真实的光芒。他的手指在椅子扶手上敲了两下——那节奏和之前在吧台时一模一样。</p><p>你在他面前跪下。地板很硬——木头的纹理透过薄薄的衣物硌着你的膝盖。你能感受到地板上那些被无数人踩踏过的凹痕和不平整。空气中弥漫着灰尘、旧木头和他身上的气味——一种混合了皮革、硫磺和某种更原始的体味的气息。远处隐约传来酒馆里的嘈杂声，但在这个房间里，那些声音仿佛来自另一个世界。</p><p><em>放松。</em>他说，声音比之前低沉了一些。那不是威胁——更像是一种难得的、笨拙的安抚。</p><p style="color:#c09080;font-style:italic;">[你张开嘴，将扎里克那处含入口中。一开始，你的动作还带着些许僵硬与停顿，但很快便调整了吞吐的幅度，动作变得熟练而有节奏。你的口腔内部被那股沉甸甸的分量完全撑满，舌尖舔舐过表面陌生的纹理，随着一次次的摩擦，那种触感逐渐变得熟悉。扎里克的手指顺着你的头骨插进发丝之间。起初他的指腹只是试探性地抚摸着，但没过多久，他的五指便猛然收紧，用力扣住你的后脑。他并没有粗暴地拉扯你的头发，而是用掌心的力量向下按压，强硬地引导着你的头部，让你吞咽得更深。他的胸膛剧烈起伏，呼吸声愈发粗重。他紧咬着牙，试图克制自己的反应，但喉咙深处依然难以自控地溢出低沉的闷哼。昏暗的灯光在房间内闪烁。随着时间的推移，原本由你主动掌控的节奏，逐渐被扎里克接管。他按压着你的动作越来越强势，腰部也开始配合着挺动。最终，他的身体猛地紧绷到极限，手指死死扣紧你的发根。一股温热的浊液直接涌入你的喉咙深处。随后，他脱力般松开了手。房间里陷入一片死寂，只剩下你急促的喘息声，以及墙外酒馆里隐约透进来的喧哗。]</p><p>结束后，他沉默了一会儿。那双蛇瞳在昏暗中注视着你——这次的目光中没有审视，没有评估，只是一种难以解读的平静。他从斗篷内袋里掏出皮袋，一枚一枚地数出 ' + rw + ' 枚金币，在桌上堆成一小摞。金币在昏暗的灯光下泛着微弱的光芒，那光芒映在他脸上的伤疤上。</p><p><em>不错。</em>他说，语气比之前多了一丝——不是温柔，更像是某种罕见的认可。<em>你比大多数新手有天赋。不是每个人都能……这么自然。如果你以后还想做这种交易——</em>他从斗篷里掏出一小块碎水晶放在桌上——<em>拿着这个。捏碎它，我会知道你在找我。当然，只是交易。别的就算了。</em></p><p style="color:#e8c060;">获得 ' + rw + ' 金币。欲望值 +4。罪业值 +4。获得信物：扎里克的通讯水晶碎片。</p>');
    player.statusMood = '你感到喉咙微微发疼，嘴唇上还残留着陌生的味道——皮革、盐和某种更深层的、说不清的东西。一种复杂的情绪在胸中翻涌——不是羞耻，而是一种奇怪的、想要更多的空虚感。你握紧了那枚碎水晶，它的棱角硌着你的掌心。';

}

function ringPermitKey(ring) { return ring + '·通行印'; }

function hasRingPermit(ring) {
    if (!player.permits) return false;
    return !!player.permits[ringPermitKey(ring)];
}

function grantRingPermit(ring, days) {
    if (!player.permits) player.permits = {};
    player.permits[ringPermitKey(ring)] = player.daysSurvived + (days || 7);
}

// ---------- 瞳色判定：莱利的触发器 ----------
function hasAbnormalPupil() {
    if (player.flags && player.flags.abnormalPupil) return true;
    var a = player.appearance;
    if (!a || !a.eyeColor) return false;
    var n = a.eyeColor.name || '';
    return /异|金|银|双色|怪|血|紫金/.test(n);
}

function hasReptileOnPerson() {
    var inv = player.inventory || [];
    for (var i = 0; i < inv.length; i++) {
        var n = inv[i].name || '';
        if (/蛇|蜥蜴|鳞|爬虫|壁虎|鳄/.test(n)) return true;
    }
    return false;
}

function getRileyLove() {
    var rel = player.relationships['莱利'];
    return rel ? (rel.love || 0) : 0;
}

function addRileyLove(delta) {
    if (!player.relationships['莱利']) player.relationships['莱利'] = { love: 2, met: false };
    var rel = player.relationships['莱利'];
    rel.love = Math.max(0, Math.min(100, (rel.love || 0) + delta));
    return rel.love;
}

// 抵达某环（统一入口，处理记录与首次抵达事件）
function arriveRing(ring) {
    player.currentRing = ring;
    gameStarted = true;
    if (!player.stats) player.stats = { battlesWon: 0, battlesLost: 0, npcsMet: 0, ringsVisited: [], tasksCompleted: 0, itemsCrafted: 0, monstersSlain: 0 };
    if (!player.stats.ringsVisited) player.stats.ringsVisited = [];
    var first = player.stats.ringsVisited.indexOf(ring) === -1;
    if (first) player.stats.ringsVisited.push(ring);
    if (first && typeof checkAchievement === 'function') {
        try { checkAchievement('first_ring'); } catch (e) {}
    }

    if (first) {
        var court = LORD_COURT[ring];
        st('<div class="scene-title">初 入 · ' + ring + '</div>' +
            '<p>壁垒在你身后合上。空气变了——不是气味，是重量。每一环的地狱都有自己的呼吸节奏，你花了几秒钟才跟上。</p>' +
            (court ? '<p style="color:#9a6a6a;font-size:0.85em;">这里是' + court.lord + '的地界。' + court.title +
                '不欢迎任何没有预约的人，但他至少会让你走完这条街。</p>' : ''));
        cb();
        ab('往前走', function() { sceneExploreDistrict(ring, 'poor'); });
        return;
    }
    sceneExploreDistrict(ring, 'poor');
}

// ==================================================================
// 七君主觐见
// ==================================================================
function sceneLordCourt(ring) {
    var court = LORD_COURT[ring];
    if (!court) { sceneExploreDistrict(ring, getCurrentLevel()); return; }

    var sinOk = (player.sinValue || 0) >= court.gateSin;
    var dayOk = (player.daysSurvived || 1) >= court.gateDay;
    var hasPermitNow = hasRingPermit(ring);
    // 世界观：人类的自制与悔改会让君主的权柄变弱。
    // 具体到机械上：悔悟值到 25 之后，君主干脆不再见你——净化罪业的代价是断掉上升的路。
    var repentBlocked = (player.repentance || 0) >= 25;

    var html = '<div class="scene-title">觐 见 · ' + court.seat + '</div>' +
        '<div class="divider">◆ ◆ ◆</div>' +
        '<p>' + court.intro + '</p>' +
        '<p style="color:#c09080;font-style:italic;">' + court.line + '</p>' +
        '<p style="font-size:0.82em;color:#8a5a62;">门槛：罪业值 ≥ ' + court.gateSin + '（当前 ' + (player.sinValue || 0) +
        '），第 ' + court.gateDay + ' 天之后（当前第 ' + player.daysSurvived + ' 天）</p>';

    if (repentBlocked) {
        html += '<p style="color:#9a6a6a;">殿门在你面前合上了，不是被谁推的——它自己关的。</p>' +
            '<p style="color:#c09080;font-style:italic;">「你身上已经没有味道了。」门里传出来的声音很平静，' +
            '「干净的人不该站在这里。你走吧——你要是真洗干净了，就不该再需要我。」</p>' +
            '<p style="font-size:0.85em;color:#8a5a62;">（悔悟值 ' + Math.round(player.repentance) +
            ' ≥ 25。君主的力量来自罪业，而你已经不是燃料了。要继续在这里往上爬，' +
            '得先重新弄脏自己；要活下去，就继续走这条路。）</p>';
        st(html);
        cb();
        ab('转身离开', function() { sceneExploreDistrict(ring, getCurrentLevel()); });
        return;
    }

    if (!sinOk) {
        html += '<p style="color:#e85060;">你身上的罪业太薄了。君主连眼皮都懒得抬——在他眼里，你还不构成一个「值得谈」的对象。</p>';
        st(html);
        cb();
        ab('退下', function() { sceneExploreDistrict(ring, getCurrentLevel()); });
        return;
    }
    if (!dayOk) {
        html += '<p style="color:#e85060;">你来早了。君主不接见刚落地的新魂——先去活过几天再说。</p>';
        st(html);
        cb();
        ab('退下', function() { sceneExploreDistrict(ring, getCurrentLevel()); });
        return;
    }

    if (hasPermitNow) {
        html += '<p style="color:#80c080;">你已经持有' + ring + '的通行印（有效至第 ' +
            player.permits[ringPermitKey(ring)] + ' 天）。</p>';
    }

    st(html);
    cb();

    // 请求通行印
    if (!hasPermitNow) {
        var t = court.tribute;
        ab('献上贡品，换取通行印（' + t.text + '）', function() {
            var ok = false;
            if (t.type === 'gold') {
                if (player.gold >= t.value) { player.gold -= t.value; ok = true; }
            } else if (t.type === 'hp') {
                if (player.hp > t.value) { player.hp -= t.value; ok = true; }
            } else if (t.type === 'desire') {
                player.desire = clampStat('desire', player.desire + t.value); ok = true;
            } else if (t.type === 'food') {
                if (player.food >= t.value) { player.food -= t.value; ok = true; }
            } else if (t.type === 'time') {
                ok = true;
            } else {
                ok = true;
            }

            if (!ok) {
                st('<p class="highlight">⚠️ 你拿不出这份贡品。' +
                    (t.type === 'gold' ? '需要 ' + t.value + ' 金币，你只有 ' + player.gold + '。' :
                     t.type === 'hp' ? '你需要至少 ' + (t.value + 1) + ' 点生命值。' :
                     t.type === 'food' ? '你需要至少 ' + t.value + ' 点饱食度。' : '条件不足。') + '</p>');
                cb();
                ab('退下', function() { sceneExploreDistrict(ring, getCurrentLevel()); });
                return;
            }
            if (t.type === 'time') addTime(t.value);
            else addTime(60);

            grantRingPermit(ring, 30);
            st('<div class="scene-title">' + court.contractName.replace('之印', '') + ' 通 行 印</div>' +
                '<p>' + t.text + '</p>' +
                '<p>一枚薄如蝉翼的纹章落在你的手背上，烫了一下，然后沉进皮肤里。三十天内，' + ring +
                '的壁垒会认得你。</p>' +
                '<p style="color:#e8c060;">获得「' + ringPermitKey(ring) + '」（有效 30 天）。</p>');
            checkHp();
            ua();
            cb();
            ab('躬身退下', function() { sceneExploreDistrict(ring, getCurrentLevel()); }, 'primary-btn');
        }, 'gold-btn');
    }

    // 缔结契约
    var hasContract = player.flags['contract_' + ring];
    if (!hasContract) {
        ab('接受「' + court.contractName + '」', function() {
            st('<div class="scene-title">缔 约 · ' + court.contractName + '</div>' +
                '<p>' + court.contractDesc + '</p>' +
                '<p style="color:#c09080;font-style:italic;">契约不是纸，是刻进去的东西。你点头的那一刻就已经生效了。</p>');
            court.apply();
            player.flags['contract_' + ring] = true;
            player.sinValue += 10;
            player.lastSinDay = player.daysSurvived;
            addTime(30);
            checkHp();
            ua();
            cb();
            ab('感受身体里的变化', function() {
                st('<p>有什么东西在你体内改动了一遍。你说不清改了什么，但你知道它不会再改回去。</p>');
                cb();
                ab('离开' + court.seat, function() { sceneExploreDistrict(ring, getCurrentLevel()); });
            }, 'primary-btn');
        }, 'danger-btn');
    } else {
        ab('（你已与' + court.lord + '缔结契约，无法再次签约）', function() {
            st('<p style="color:#9a6a6a;">「一份就够了。贪多的人，通常活不到第二次见面。」</p>');
            cb();
            ab('退下', function() { sceneExploreDistrict(ring, getCurrentLevel()); });
        });
    }

    ab('沉默地退下', function() { sceneExploreDistrict(ring, getCurrentLevel()); });
}

                st('<p>你没有拔武器。你把手举起来，慢慢往后退，退到矿坑口的光线里。</p>' +
                    '<p>链子停在半空，抖了很久，才一节一节落回地上。他贴着墙滑坐下去，把脸埋进膝盖。</p>' +
                    '<p style="color:#c09080;font-style:italic;">「……走。」他的声音闷在袖子里，「下次别一个人进这种地方。」</p>' +
                    '<p style="color:#80c080;">好感度略微上升。他没有把你当成敌人——至少这一次没有。</p>');
                cb();
                ab('离开矿坑', function() { sceneExploreDistrict('傲慢之环', 'poor'); });
            });
            return;
        }

        // 正常初见
        st('<div class="scene-title">废 弃 矿 坑</div>' +
            '<p>' + NATIVE_NPCS['莱利'].desc + '</p>' +
            '<p>他看见你，整个人立刻贴到矿壁上，手里的自制匕首横在身前。</p>' +
            '<p style="color:#c09080;font-style:italic;">「站住。别过来。」</p>' +
            '<p>但他没有动手。你注意到他的视线一直在你的手上——他在看你有没有拿东西，而不是在看你这个人。</p>');
        cb();
        ab('蹲下来，让视线比他低', function() {
            addRileyLove(3);
            addTime(10);
            st('<p>你蹲下去，把武器放在地上，然后让自己的视线比他的低一点。</p>' +
                '<p>这个动作在地狱里几乎不成立——没人会对一个蹲在矿坑里的瘦弱恶魔低头。他愣了很久，匕首慢慢放了下来。</p>' +
                '<p style="color:#c09080;font-style:italic;">「……你有点怪。」他小声说，「怪人在这儿活不长。」</p>' +
                '<p style="color:#80c080;">好感度 +10。</p>');
            cb();
            ab('和他聊两句', function() { sceneRileyTalk(); });
        }, 'primary-btn');
        ab('直接开口问他这里有什么', function() {
            addRileyLove(-2);
            addTime(10);
            st('<p>「这里有什么？」</p>' +
                '<p>他看了你两秒，把匕首往怀里一收：<em>「什么都没有。你走吧。」</em></p>' +
                '<p>矿坑深处确实什么都没有——除了一堆被翻了三遍的废料。</p>');
            cb();
            ab('离开', function() { sceneExploreDistrict('傲慢之环', 'poor'); });
        });
        return;
    }

    // 已认识：因瞳色成为敌人的分支
    if (player.flags.rileyEnemy && love < 30) {
        st('<div class="scene-title">废 弃 矿 坑</div>' +
            '<p>你走近时，矿坑里的金属链先动了。他从阴影里站起来，眼睛在黑暗里反着两种不同的光。</p>' +
            '<p style="color:#c09080;font-style:italic;">「又是你。你那双眼睛……我见过。在很冷的地方见过。」</p>');
        cb();
        ab('试着解释你的眼睛', function() {
            if (player.charisma >= 9) {
                addRileyLove(3);
                addTime(15);
                st('<p>你慢慢开口，告诉他这双眼睛是怎么来的——不是天生的，不是他以为的那种。</p>' +
                    '<p>他听着，链子的转速一点点慢下来。</p>' +
                    '<p style="color:#c09080;font-style:italic;">「……不是他们？」他重复了一遍，像是在确认这句话能不能信，「那你最好别骗我。我被人骗过一次，那次我差点没从雪地里爬起来。」</p>' +
                    '<p style="color:#80c080;">好感度 +12。他把你从「敌人」那一格里挪了出来。</p>');
                if (getRileyLove() >= 30) { player.flags.rileyEnemy = false; st(tc.innerHTML + '<p style="color:#80c080;">（他不再把你当成威胁了。）</p>'); }
                cb();
                ab('继续', function() { sceneRileyTalk(); });
            } else {
                addTime(10);
                st('<p>你解释了几句，但话说得太急，也太空洞。他摇了摇头，链子重新绷直。</p>' +
                    '<p style="color:#c09080;font-style:italic;">「你说的话和你眼睛里写的东西不一样。」</p>');
                cb();
                ab('退出去', function() { sceneExploreDistrict('傲慢之环', 'poor'); });
            }
        });
        ab('不再多说，直接退出去', function() { addTime(5); sceneExploreDistrict('傲慢之环', 'poor'); });
        return;
    }

    sceneRileyTalk();
}

function sceneRileyTalk() {
    var love = getRileyLove();
    var html = '<div class="scene-title">莱 利 · 格 雷 特</div>' +
        '<p>' + NATIVE_NPCS['莱利'].desc + '</p>' +
        '<p style="font-size:0.85em;color:#9a6a6a;">他的状态：' +
        (love >= 70 ? '已经不再把手放在匕首上了。' :
         love >= 40 ? '警惕，但愿意听你说话。' :
         love >= 20 ? '勉强容忍你待在这里。' : '随时准备跑，或者咬你一口。') + '</p>' +
        '<div style="width:100%;height:4px;background:#1a0a1a;margin:6px 0 14px;border-radius:2px;overflow:hidden;">' +
        '<div style="width:' + love + '%;height:100%;background:linear-gradient(90deg,#8a5a62,#e8c060);"></div></div>';

    if (hasReptileOnPerson()) {
        html += '<p style="color:#e85060;">（他忽然抖了一下，视线钉在你身上，鼻子抽了两下。）</p>';
    }
    st(html);
    cb();

    // 爬虫恐惧
    if (hasReptileOnPerson()) {
        ab('（你身上带着带鳞的东西）', function() {
            addRileyLove(-15);
            player.flags.rileyEnemy = true;
            addTime(10);
            st('<p>他的耳朵猛地贴平在头上。</p>' +
                '<p style="color:#e85060;font-style:italic;">「你身上有那个味道——！」</p>' +
                '<p>他一下子窜到矿坑最深处，金属链哗啦啦地整片扫过来，把你们之间隔开。他在链子后面喘得很响。</p>' +
                '<p style="color:#e85060;">好感度 -15。他把你归到了「会拿那种东西来吓人」的那一类。</p>');
            cb();
            ab('把东西扔掉', function() {
                var inv = player.inventory;
                for (var i = 0; i < inv.length; i++) {
                    if (/蛇|蜥蜴|鳞|爬虫|壁虎|鳄/.test(inv[i].name || '')) {
                        inv[i].quantity = 0;
                        st('<p>你把那东西掏出来扔进矿坑深处的黑水里。链子停了一下。</p>');
                        cb();
                        ab('继续', function() { sceneRileyTalk(); });
                        return;
                    }
                }
                sceneExploreDistrict('傲慢之环', 'poor');
            }, 'danger-btn');
            ab('算了，走开', function() { sceneExploreDistrict('傲慢之环', 'poor'); });
        }, 'danger-btn');
    }

    if (love < 60) {
        ab('问他一个人在这里做什么（+好感）', function() {
            addRileyLove(2);
            addTime(15);
            st('<p>「你一个人在这里做什么？」</p>' +
                '<p>他低头看了看地上那堆废料，又看了看自己手里磨了一半的链节。</p>' +
                '<p style="color:#c09080;font-style:italic;">「挖东西。能卖的都挖。」他顿了顿，「这矿坑以前出过好东西，现在只出石头。但我找不到别的地方。」</p>' +
                '<p>他说这话的时候没有抱怨的意思，只是陈述。这比抱怨更让人难受。</p>');
            cb();
            ab('再聊一会儿', function() { sceneRileyTalk(); });
            ab('离开', function() { sceneExploreDistrict('傲慢之环', 'poor'); });
        });
        ab('问他那些金属链（+好感）', function() {
            addRileyLove(2);
            addTime(15);
            st('<p>「那些链子——是你自己做的？」</p>' +
                '<p>他的耳朵动了一下，像是在确认这不是嘲讽。</p>' +
                '<p style="color:#c09080;font-style:italic;">「捡的。断了就接，接不上就拆。」他把一截链子举起来给你看，接口处磨得非常平，「它们听我的。我也不知道为什么。从小就这样。」</p>' +
                '<p>链子在半空中浮起来，绕着他的手腕转了一圈，像某种宠物。</p>');
            cb();
            ab('再聊一会儿', function() { sceneRileyTalk(); });
            ab('离开', function() { sceneExploreDistrict('傲慢之环', 'poor'); });
        });
    }

    if (love >= 25) {
        ab('给他一些食物（消耗10饱食）', function() {
            if (player.food < 15) {
                st('<p class="highlight">⚠️ 你自己的饱食度不够，拿不出手。</p>');
                cb();
                ab('返回', function() { sceneRileyTalk(); });
                return;
            }
            player.food = clampStat('food', player.food - 10);
            addRileyLove(3);
            addTime(10);
            st('<p>你把食物推过去。他先是没动，然后很快地伸手拿走，吃得又快又安静。</p>' +
                '<p style="color:#c09080;font-style:italic;">「……谢了。」他说得很轻，几乎听不见，「下次别给这么多。我一次吃太多会难受。」</p>' +
                '<p style="color:#80c080;">好感度 +10，饱食度 -10。</p>');
            cb();
            ab('继续', function() { sceneRileyTalk(); });
            ab('离开', function() { sceneExploreDistrict('傲慢之环', 'poor'); });
        }, 'gold-btn');
    }

    if (love >= 40 && !player.flags.rileyGiftCrystal) {
        ab('把一块水晶碎片送给他', function() {
            var has = false;
            for (var i = 0; i < player.inventory.length; i++) {
                if (/水晶/.test(player.inventory[i].name || '') && player.inventory[i].quantity > 0) {
                    player.inventory[i].quantity--;
                    has = true;
                    break;
                }
            }
            if (!has) {
                st('<p class="highlight">你身上没有水晶碎片。</p>');
                cb();
                ab('返回', function() { sceneRileyTalk(); });
                return;
            }
            addRileyLove(5);
            player.flags.rileyGiftCrystal = true;
            addTime(15);
            st('<p>他把碎片捧在手里，看了很久。那不是贪婪的眼光——是那种「不知道该往哪里放」的眼光。</p>' +
                '<p style="color:#c09080;font-style:italic;">「这个……成色太好了。」他抬起头，「我可以把它换成吃的，换很多。但我不想换。」</p>' +
                '<p>他把碎片塞进最里层的衣服里，压得很紧。</p>' +
                '<p style="color:#80c080;">好感度 +20。</p>');
            cb();
            ab('继续', function() { sceneRileyTalk(); });
        }, 'gold-btn');
    }

    if (love >= 60 && !player.flags.rileyTaught) {
        ab('请他教你怎么控制金属', function() {
            player.flags.rileyTaught = true;
            addRileyLove(3);
            addTime(60);
            addBuff('chain_mastery', '锁链的余韵', '力量+2，敏捷+2。莱利教你的东西不是招式，是手感。', 'positive', 9999, { strength: 2, agility: 2 });
            if (!player.abilities) player.abilities = [];
            player.abilities.push('锁链控制');
            st('<div class="scene-title">锁 链</div>' +
                '<p>他没有讲理论。他只是把一截断链接到你手里，然后松手——链子掉了。</p>' +
                '<p style="color:#c09080;font-style:italic;">「不是用手。用手的话，它只是块铁。」他想了想，又补了一句，「想它是什么形状，它就是什么形状。你要是想着「它应该掉下去」，那它就一定会掉下去。」</p>' +
                '<p>你练了将近一个小时。最后那两分钟，链子在你掌心悬停住了。</p>' +
                '<p style="color:#e8c060;">获得能力「锁链控制」。力量+2，敏捷+2（永久）。</p>');
            checkHp();
            ua();
            cb();
            ab('继续', function() { sceneRileyTalk(); }, 'primary-btn');
        }, 'primary-btn');
    }

    if (love >= 75 && !player.flags.rileyMemory) {
        ab('问他眼睛的事', function() {
            player.flags.rileyMemory = true;
            addTime(30);
            st('<div class="scene-title">雪 地</div>' +
                '<p>「你的眼睛——」你开口，然后停住了。</p>' +
                '<p>他没有立刻回答。链子在半空停住，慢慢落回地上。</p>' +
                '<p style="color:#c09080;font-style:italic;">「我死过一次。」他说，「在很冷的地方。地上有雪，雪上全是脚印，都不是我的。」</p>' +
                '<p style="color:#c09080;font-style:italic;">「有人按住我的脸，让我看着他的眼睛。他的眼睛和我的一样，一只金色一只银色。他说，这种眼睛的人不配活着。」</p>' +
                '<p style="color:#c09080;font-style:italic;">「然后就没有然后了。」</p>' +
                '<p>他抬起头看你。那双被厌恶过的眼睛里没有恨，只有一种被磨平的疲惫。</p>' +
                '<p style="color:#c09080;font-style:italic;">「所以别人一看我的眼睛，我就知道要出事。你第一次走进来的时候，我就在等那件事。」</p>' +
                '<p style="color:#9a6a6a;font-size:0.85em;">——他没有说地名。但你知道那个地方。二〇〇九年，科罗拉多，普韦布洛。</p>');
            cb();
            ab('什么都不说，坐到他旁边', function() {
                addRileyLove(3);
                addTime(30);
                st('<p>你在他旁边坐下。矿坑里很静，只有滴水声。</p>' +
                    '<p>过了很久，他往你这边挪了一点，近到可以听见他呼吸的节奏。</p>' +
                    '<p style="color:#c09080;font-style:italic;">「……你别死。」他说，「在这儿活着挺难的，但你别死。」</p>' +
                    '<p style="color:#80c080;">好感度 +10。</p>');
                cb();
                ab('继续', function() { sceneRileyTalk(); }, 'primary-btn');
            }, 'primary-btn');
        }, 'primary-btn');
    }

    if (love >= 80) {
        ab('把通行印的事告诉他', function() {
            addTime(15);
            st('<p>「壁垒那边——你有印吗？」</p>' +
                '<p>他摇头：<em>「没有。我出不去。这矿坑就是我的全部。」</em></p>' +
                '<p>你告诉他君主会给印，只要罪业够重、够狠。</p>' +
                '<p style="color:#c09080;font-style:italic;">「罪业……」他笑了一下，那笑很短，「我这一路走过来，做过的坏事不少。但每次一想起来，我都在后悔。后悔的人，算不算罪孽够重？」</p>' +
                '<p style="color:#e8c060;">他把自己那截最好的链节塞进你手里：「你要是能出去，帮我看看雪是什么样的。我记不清了。」</p>');
            cb();
            ab('收下链节', function() {
                addItem('riley_chain', '莱利的链节', 'material', '一截被反复打磨过的金属链节，接口处磨得发亮。', 1, {});
                addRileyLove(2);
                st('<p>链节很轻，比看上去轻得多。</p>');
                cb();
                ab('继续', function() { sceneRileyTalk(); });
            });
        });
    }

    ab('离开矿坑', function() { addTime(5); sceneExploreDistrict('傲慢之环', 'poor'); });
}

function sceneFreddy() {

        player.flags.freddyMet = true;
        st('<div class="scene-title">栈 桥 下 的 阴 影</div>' +
            '<p>' + NATIVE_NPCS['弗雷迪'].desc + '</p>' +
            '<p>他靠在栈桥的立柱上，黑羽大衣的边缘在往下滴东西——不是水。</p>' +
            '<p style="color:#c09080;font-style:italic;">「新面孔。你是来买东西的，还是来卖东西的？」他笑了一下，露出一排不太整齐的牙，「先说好，我不收命。命在这儿不值钱。」</p>');

function eliasRitual() {
    if (player.gold < 40) {
        st('<p class="highlight">⚠️ 40 金币。你不够。</p>');

        ab('返回', function() { sceneEliasShop(); });
        return;
    }
    player.gold -= 40;
    addTime(90);
    player.sanity = clampStat('sanity', player.sanity - 8);
    player.flags.eliasRitualDone = true;

    var roll10 = Math.floor(Math.random() * 10);
    var html = '<div class="scene-title">四 百 赫 兹</div>' +
        '<p>他把两根导线贴在你的太阳穴上，然后把机器调到了那个频率。</p>' +
        '<p>嗡声一开始只是嗡声。然后它开始有形状——你在里面看见了自己过去做过的每一件小事，全都在同时发生。你想抓住一件，它就从指缝里滑走了。</p>';

    if (roll10 >= 7) {
        var stats = ['strength', 'agility', 'magic', 'charisma'];
        var pick = stats[Math.floor(Math.random() * stats.length)];
        var label = { strength: '力量', agility: '敏捷', magic: '魔力', charisma: '魅力' }[pick];
        player[pick] = clampStat(pick, player[pick] + 2);
        html += '<p style="color:#80c080;">嗡声突然断了。你从椅子上滑下来，浑身都是冷汗——但你能感觉到，身体里有什么东西被拧紧了一格。</p>' +
            '<p style="color:#e8c060;">' + label + ' +2（永久）。理智 -8。</p>';
    } else if (roll10 >= 4) {
        player.maxSanity = Math.max(6, player.maxSanity - 2);
        player.sanity = Math.min(player.sanity, player.maxSanity);
        html += '<p style="color:#e85060;">嗡声断了。你还坐在椅子上，但脑子里有一样东西没回来。</p>' +
            '<p style="color:#e85060;">理智上限 -2。</p>';
    } else {
        player.hp = Math.max(1, player.hp - 20);
        player.flags.addicted = true;
        player.flags.withdrawal = true;
        html += '<p style="color:#e85060;">机器发出一声不该发出的声音。你的鼻子先开始流血，然后是耳朵。</p>' +
            '<p style="color:#e85060;">HP -20。你染上了对那个频率的依赖——从今天起，你会需要它。</p>';

    st(html);
    checkHp();
    ua();
    cb();
    ab('站起来', function() { sceneEliasShop(); });
}

// ==================================================================
// 键盘快捷键与帮助
// ==================================================================
function initKeyboard() {
    if (typeof document === 'undefined' || !document.addEventListener) return;
    document.addEventListener('keydown', function(e) {
        var tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        var k = e.key;
        // 数字键：直接点第 N 个选项
        if (/^[1-9]$/.test(k)) {
            var spans = document.querySelectorAll('#text-content .clickable');
            var idx = parseInt(k, 10) - 1;
            if (spans[idx]) {
                e.preventDefault();
                spans[idx].click();
                return;
            }
        }
        if (k === 'Escape') {
            if (typeof sidebarOpen !== 'undefined' && sidebarOpen) toggleSidebar();
            return;
        }
        var low = (k || '').toLowerCase();
        if (low === 'i') { if (!sidebarOpen) toggleSidebar(); switchTab('inventory'); e.preventDefault(); return; }
        if (low === 'c' || low === 's') { if (!sidebarOpen) toggleSidebar(); switchTab('status'); e.preventDefault(); return; }
        if (low === 'm') { if (!sidebarOpen) toggleSidebar(); switchTab('map'); e.preventDefault(); return; }
        if (low === 'q') { if (!sidebarOpen) toggleSidebar(); switchTab('tasks'); e.preventDefault(); return; }
        if (k === '?') { showHelp(); e.preventDefault(); }
    });
}

// 背包进食 / 用药：把「买了东西却不知道怎么吃」这个坑填掉
// ==================================================================
function sceneEatFromBag(returnRing, returnLevel) {
    var ring = returnRing || player.currentRing || '傲慢之环';
    var level = returnLevel || getCurrentLevel();
    var usable = [];
    for (var i = 0; i < player.inventory.length; i++) {
        var it = player.inventory[i];
        if (it.type === 'consumable' && it.quantity > 0) usable.push(it);
    }

    var html = '<div class="scene-title">吃 点 东 西</div>';
    if (!usable.length) {
        html += '<p>你翻了半天背包，什么能吃的都没有。</p>';
        st(html);
        cb();
        ab('去食品店', function() { enterShop('food'); }, 'gold-btn');
        ab('返回', function() { sceneExploreDistrict(ring, level); });
        return;
    }
    html += '<p style="color:#8a5a62;font-size:0.8em;">饱食度 ' + Math.floor(player.food) + ' / ' + player.maxFood +
        '（' + (player.hungerStageLabel || '饱足') + '）</p>';
    for (var j = 0; j < usable.length; j++) {
        var u = usable[j];
        var e = u.effects || {};
        var tags = [];
        if (e.food) tags.push('饱食+' + e.food);
        if (e.hp) tags.push('HP+' + e.hp);
        if (e.sanity) tags.push('理智' + (e.sanity > 0 ? '+' : '') + e.sanity);
        if (e.fatigue) tags.push('疲劳' + (e.fatigue > 0 ? '+' : '') + e.fatigue);
        if (e.desire) tags.push('欲望' + (e.desire > 0 ? '+' : '') + e.desire);
        if (e.strength) tags.push('力量+' + e.strength);
        if (e.agility) tags.push('敏捷+' + e.agility);
        if (e.magic) tags.push('魔力+' + e.magic);
        if (e.charisma) tags.push('魅力+' + e.charisma);
        html += '<p>· ' + u.name + ' ×' + u.quantity +
            (tags.length ? ' <span style="color:#80c080;font-size:0.8em;">(' + tags.join('，') + ')</span>' : '') + '</p>';
    }
    st(html);
    cb();

    for (var k = 0; k < usable.length; k++) {
        (function(item) {
            ab('吃掉 ' + item.name, function() {
                var beforeFood = player.food;
                useConsumable(item.id);
                addTime(5);
                checkHp();
                ua();
                var gained = Math.floor(player.food - beforeFood);
                st('<p>你把 ' + item.name + ' 吃了下去。' +
                    (gained > 0 ? '<span style="color:#80c080;">饱食度 +' + gained + '。</span>' : '') + '</p>');
                cb();
                ab('再吃点别的', function() { sceneEatFromBag(ring, level); });
                ab('返回', function() { sceneExploreDistrict(ring, level); });
            }, 'gold-btn');
        })(usable[k]);
    }
    ab('返回', function() { sceneExploreDistrict(ring, level); });
}

// 忏悔：世界观里「人类的克制会削弱君主」的机械对应
// 罪业可以洗掉，代价是你再也进不了君主的门。
// ==================================================================
function sceneConfession() {
    var sin = player.sinValue || 0;
    var rep = player.repentance || 0;
    var html = '<div class="scene-title">审 判 厅 · 台 阶</div>' +
        '<p>审判厅的台阶是黑色的石头，磨得很亮——磨亮它的不是脚步，是膝盖。台阶上跪着几个和你一样从人间掉下来的人，' +
        '他们低着头，嘴唇在动，但发不出声音。厅门两侧的水晶柱里封着不肯低头的人，他们至今保持着伸手向前的姿势。</p>' +
        '<p>一个执事站在门里，手里捧着一本厚得不像话的册子。他没有抬头。</p>' +
        '<p style="color:#c09080;font-style:italic;">「报上名字。说清楚你做过什么。」</p>' +
        '<p style="font-size:0.82em;color:#8a5a62;">当前罪业值 ' + sin + '，悔悟值 ' + Math.round(rep) + '。</p>';

    if (sin <= 0) {
        html += '<p style="color:#80c080;">执事翻了两页，合上册子：<em>「你身上没什么可记的。走吧。」</em></p>';
        st(html);
        cb();
        ab('离开', function() { sceneExploreDistrict('傲慢之环', getCurrentLevel()); });
        return;
    }

    html += '<p style="color:#9a6a6a;font-size:0.82em;">' +
        '（在这里低头，能洗掉一部分罪业、换回一点清醒。但君主们靠罪业活着——你越干净，他们越不愿意把力量借给你。）</p>';
    st(html);
    cb();

    ab('跪下，把做过的事说一遍（耗时60分钟）', function() {
        addTime(60);
        var wash = 3 + Math.floor(Math.random() * 4);
        if (getSinLevel().level >= 4) wash += 3;   // 罪越重，洗掉得越多
        wash = Math.min(sin, wash);
        player.sinValue = Math.max(0, sin - wash);
        player.repentance = (player.repentance || 0) + 4;
        player.lastGoodDeedDay = player.daysSurvived;
        player.sanity = clampStat('sanity', player.sanity + 4);
        checkHp();
        ua();

        var extra = '';
        if (player.repentance >= 25) {
            extra = '<p style="color:#e8c060;">你站起来的时候，感觉有什么东西从背后离开了。' +
                '那是一种被注视的感觉——你已经很久没有意识到它一直在那儿。</p>' +
                '<p style="color:#9a6a6a;font-size:0.85em;">（悔悟值已达 ' + Math.round(player.repentance) +
                '。君主不会再接见一个正在变干净的人——你换到了活下去的机会，也换掉了往上爬的梯子。）</p>';
        }
        st('<p>你跪下来，一开始说得很轻，后来说得越来越慢。执事的笔在册子上走，一笔一笔，没有评价。</p>' +
            '<p>说到某一段的时候你停住了。他没有催你，只是等。你说完，他合上册子，抬手让你起来。</p>' +
            '<p style="color:#80c080;">罪业值 -' + wash + '，悔悟值 +4，理智 +4。</p>' + extra);
        cb();
        ab('站起来', function() { sceneExploreDistrict('傲慢之环', getCurrentLevel()); }, 'primary-btn');
    }, 'primary-btn');

    ab('只是站着看看', function() { sceneExploreDistrict('傲慢之环', getCurrentLevel()); });
}

// ---------- 通用骨架：初见 → 菜单 → 对话 / 服务 / 动手 ----------

function getNpcLove(id) {
    var d = NPC_PACK[id];
    if (!d) return 0;
    var rel = player.relationships[d.name];
    return rel ? (rel.love || 0) : 0;
}

function addNpcLove(id, delta) {
    var d = NPC_PACK[id];
    if (!d) return 0;
    // 一次最多 +3，一天最多 +2
    if (delta > 3) delta = 3;
    if (typeof clampDailyFavor === 'function') delta = clampDailyFavor(id, delta);
    if (delta === 0) return 0;
    if (delta > 0 && typeof _favorAddToday === 'function') _favorAddToday(id, delta);
    if (!player.relationships[d.name]) player.relationships[d.name] = { love: 2, met: true };
    var rel = player.relationships[d.name];
    rel.love = Math.max(0, Math.min(100, (rel.love || 0) + delta));
    return rel.love;
}

function npcAlive(id) { return !player.flags['npcKilled_' + id]; }

// 塞西莉亚这类跨层级角色：记录真实入口层级，避免把玩家传送回上一层
function npcLvl(id) {
    var d = NPC_PACK[id];
    if (!d) return 'poor';
    var l = player.flags && player.flags['npcLvl_' + id];
    if (l && d.levels.indexOf(l) !== -1) return l;
    return d.levels[0];
}

function sceneNativeNpc(id) {
    if (typeof tryNpcInterlude === 'function' && !player._npcRollPaused) {
        try { if (tryNpcInterlude(id, player.currentRing, getCurrentLevel())) return; } catch (e) {}
    }
    var d = NPC_PACK[id];
    if (!d) { sceneExploreDistrict(player.currentRing || '傲慢之环', getCurrentLevel()); return; }
    if (!npcAlive(id)) {
        st('<div class="scene-title">' + d.place + '</div><p>' + (d.killLine || '这里已经没有人了。') + '</p>');
        cb();
        ab('离开', function() { sceneExploreDistrict(d.ring, npcLvl(id)); });
        return;
    }

    if (!player.npcMet) player.npcMet = {};
    var met = player.npcMet[id];
    var isSinner = player.race === 'sinner';
    var raceText = isSinner ? d.sinner : d.demon;

    // 初见
    if (!met) {
        player.npcMet[id] = true;
        if (!player.relationships[d.name]) player.relationships[d.name] = { love: 5, met: true };
        if (player.stats) player.stats.npcsMet = (player.stats.npcsMet || 0) + 1;
        // 优先用长文本初遇：它按「罪孽 x 种族」分支，带初始印象
        var _long = '';
        try { if (typeof getNpcFirstMeetText === 'function') _long = getNpcFirstMeetText(d.name) || ''; } catch (e) {}
        var _imp = (typeof sinImpression === 'function') ? sinImpression(id) : null;
        if (_imp) player.relationships[d.name].love = _imp.love;
        var _body = _long
            ? _long.split('\n').map(function(x){ return '<p>' + x + '</p>'; }).join('')
            : raceText;
        st('<div class="scene-title">' + d.name + '</div>' + _body +
            (_imp ? '<p style="color:' + (_imp.good ? '#80c080' : '#c09080') +
                    ';font-style:italic;">' + _imp.line + '</p>' : ''));
        cb();
        ab('开口说话', function() { sceneNativeNpcMenu(id); }, 'primary-btn');
        ab('握紧武器', function() { npcFight(id); }, 'danger-btn');
        ab('转身离开', function() { addTime(5); sceneExploreDistrict(d.ring, npcLvl(id)); });
        return;
    }

    sceneNativeNpcMenu(id);
}

function sceneNativeNpcMenu(id) {
    var d = NPC_PACK[id];
    var love = getNpcLove(id);
    var html = '<div class="scene-title">' + d.name + '</div>' +
        '<p>' + d.menu + '</p>' +
        '<p style="font-size:0.85em;color:#9a6a6a;">' +
        (love >= 60 ? '他已经把你当成「自己人」了，虽然他自己的定义很含糊。' :
         love >= 35 ? '他记得你。这是个好迹象，也可能是个坏迹象。' :
         love >= 15 ? '他对你的态度从「可以利用」变成了「可以聊聊」。' :
         '他看你的眼神，和看这条街上任何一件东西没有区别。') + '</p>' +
        '<div style="width:100%;height:4px;background:#1a0a1a;margin:6px 0 14px;border-radius:2px;overflow:hidden;">' +
        '<div style="width:' + love + '%;height:100%;background:linear-gradient(90deg,#5a2a30,#e8c060);"></div></div>';

    // 与既有角色的交叉线索
    if (id === 'xavier' && player.storyProgress && player.storyProgress['shadow_whisper']) {
        html += '<p style="color:#c09080;font-style:italic;">「你身上有深渊祭坛的味道。」他抽了抽鼻子，「你用过那条路？那是我告诉你怎么走的——你大概不记得了，我那时候没露脸。」</p>';
    }
    if (id === 'cecilia' && player.flags.freddyMet) {
        html += '<p style="color:#c09080;font-style:italic;">「你身上有黑羽毛的味道。」她的笑淡了一点，「你见过他了。」</p>';
    }
    if (id === 'samuel' && (player.wantedLevel || 0) >= 3) {
        html += '<p style="color:#c09080;font-style:italic;">「你身上有通缉的味道。老子闻得出来，因为老子身上一直有。」</p>';
    }

    st(html);
    cb();

    // 独立剧情线
    if (typeof addNpcStoryButton === 'function') addNpcStoryButton(id);
    if (typeof addNpcTogetherButton === 'function') addNpcTogetherButton(id);
    if (typeof addWardrobeButton === 'function') addWardrobeButton();
    if (typeof storyAftermathText === 'function') {
        var _am = storyAftermathText(id);
        if (_am) { tc.innerHTML += _am; }
    }
    if (typeof purchaseFollowupText === 'function') {
        var _pf = purchaseFollowupText(id);
        if (_pf) { tc.innerHTML += _pf; }
    }

    // 对话
    for (var i = 0; i < d.talk.length; i++) {
        (function(t) {
            ab(t.label, function() {
                if (t.cost) {
                    if (player.gold < t.cost) {
                        st('<p class="highlight">⚠️ 你身上没有 ' + t.cost + ' 金币。</p>');
                        cb(); ab('返回', function() { sceneNativeNpcMenu(id); });
                        return;
                    }
                    player.gold -= t.cost;
                }
                addTime(15);
                if (t.love > 0 && typeof talkExhausted === 'function' && talkExhausted(id)) {
                    st('<p>你把话头递过去，他接了，但只是"嗯"了一声。</p>' +
                        '<p style="color:#8a6a72;">今天他已经不太想说话了。明天再来。</p>');
                    checkHp(); ua();
                    cb();
                    ab('继续聊', function() { sceneNativeNpcMenu(id); });
                    ab('离开', function() { sceneExploreDistrict(d.ring, d.levels[0]); });
                    return;
                }
                var loveDelta = t.love
                    ? (t.love > 0 && typeof addNpcLoveFromTalk === 'function'
                        ? addNpcLoveFromTalk(id, t.love)
                        : (t.love < 0 ? addNpcLove(id, t.love) : 0))
                    : 0;
                if (t.flag) player.flags[t.flag] = true;
                st('<p>' + t.text + '</p>' +
                    (loveDelta ? '<p style="color:' + (loveDelta > 0 ? '#80c080' : '#e85060') + ';">好感度 ' + (loveDelta > 0 ? '+' : '') + loveDelta +
                        (loveDelta !== t.love ? '（今天说得够多了，他没那么容易被打动）' : '') + '</p>' : ''));
                checkHp(); ua();
                cb();
                ab('继续聊', function() { sceneNativeNpcMenu(id); });
                ab('离开', function() { sceneExploreDistrict(d.ring, npcLvl(id)); });
            }, t.danger ? 'danger-btn' : '');
        })(d.talk[i]);
    }

    // 交易 / 服务
    if (d.service) {
        ab('💼 谈生意', function() { d.service(); }, 'gold-btn');
    }

    // 好感解锁的额外选项
    if (love >= 40 && !player.flags['npcGift_' + id]) {
        ab('🎁 送他一件东西', function() {
            var given = false;
            for (var j = 0; j < player.inventory.length; j++) {
                var it = player.inventory[j];
                if (it.quantity > 0 && (it.type === 'consumable' || it.type === 'material') && it.id !== 'riley_chain') {
                    it.quantity--;
                    given = true;
                    break;
                }
            }
            if (!given) {
                st('<p class="highlight">你身上没有拿得出手的东西。</p>');
                cb(); ab('返回', function() { sceneNativeNpcMenu(id); });
                return;
            }
            player.flags['npcGift_' + id] = true;
            addNpcLove(id, 6);
            addTime(20);
            st('<p>你把东西递过去。他接了，看了一会儿。</p>' +
                '<p style="color:#c09080;font-style:italic;">「……行吧。」他把东西收起来，语气没变，但手停了一下，「我记着了。」</p>' +
                '<p style="color:#80c080;">好感度 +15。</p>');
            checkHp(); ua();
            cb(); ab('继续', function() { sceneNativeNpcMenu(id); });
        }, 'gold-btn');
    }

    ab('⚔️ 动手', function() { npcFight(id); }, 'danger-btn');
    ab('离开', function() { addTime(5); sceneExploreDistrict(d.ring, npcLvl(id)); });
}

function npcFight(id) {
    var d = NPC_PACK[id];
    if (!d || !d.fight) return;
    var f = d.fight;
    var w = null;
    if (f.weakness && f.weakness.need && f.weakness.need()) {
        w = {
            label: f.weakness.label,
            hint: f.weakness.hint,
            apply: f.weakness.apply
        };
    }
    startCombat({
        id: 'npc_' + id,
        name: f.name,
        hp: f.hp,
        physicalAttack: f.attack,
        defense: f.defense,
        goldReward: f.goldReward,
        expReward: f.expReward,
        sinReward: f.sinReward,
        desireReward: f.desireReward || 0,
        description: f.desc,
        weakness: w
    }, 'npcKilled_' + id, d.ring, npcLvl(id));
}

// ---------- 按环位挂载入口 ----------
function addPackNpcButtons(ring, level) {
    var order = ['kangte', 'xavier', 'rocco', 'violette', 'virid', 'murphi', 'earle', 'ciper', 'samuel', 'cecilia'];
    for (var i = 0; i < order.length; i++) {
        (function(id) {
            var d = NPC_PACK[id];
            if (!d) return;
            if (!npcAlive(id)) return;
            // 有活动规律的按当前位置判定，没有的照旧
            if (typeof npcPlace === 'function') {
                var _pl = npcPlace(id);
                if (_pl === null) {
                    if (d.ring !== ring || d.levels.indexOf(level) === -1) return;
                } else if (_pl.away) {
                    return;
                } else if (_pl.ring !== ring || _pl.level !== level) {
                    return;
                }
            } else {
                if (d.ring !== ring) return;
                if (d.levels.indexOf(level) === -1) return;
            }
            ab(d.promo, function() { addTime(10); if (!player.flags) player.flags = {}; player.flags['npcLvl_' + id] = level; sceneNativeNpc(id); });
        })(order[i]);
    }
}

// 降级用的内存存档：localStorage 不可用时至少本次会话内可读写
var MEM_SAVE = {};

function kvGet(k) {
    try { var v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {}
    return (k in MEM_SAVE) ? MEM_SAVE[k] : null;
}
function kvSet(k, v) {
    var ok = false;
    try { localStorage.setItem(k, v); ok = true; } catch (e) { ok = false; }
    MEM_SAVE[k] = v;              // 两种情况下都留一份在内存
    return ok;
}
function kvDel(k) {
    try { localStorage.removeItem(k); } catch (e) {}
    delete MEM_SAVE[k];
}

function requireStarted() {

// ---------- 存档读写 ----------

function saveStamp() {
    var d = new Date();
    var p2 = function(n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' +
           p2(d.getHours()) + ':' + p2(d.getMinutes());
}

function packSave() {
    var snap = JSON.parse(JSON.stringify(player));
    // 瞬时状态不进存档，否则读档后可能卡在「沉睡」「晕倒」里
    if (snap.flags) {
        delete snap.flags.isSleeping;
        delete snap.flags.isFainting;
    }
    snap.gameOver = false;
    if (snap.npcTalkDaily) {
        var today = snap.daysSurvived || 0;
        for (var key in snap.npcTalkDaily) {
            if (!snap.npcTalkDaily[key] || snap.npcTalkDaily[key].day !== today) delete snap.npcTalkDaily[key];
        }
    }
    if (snap.buffs) {
        snap.buffs.forEach(function(b) {
            if (b.startAbsolute === undefined && b.startTime !== undefined) {
                b.startAbsolute = (snap.daysSurvived || 0) * 1440 + b.startTime;
            }
        });
    }
    return { v: SAVE_VERSION, at: Date.now(), stamp: saveStamp(), player: snap };
}

function readSlots() {
    var raw = kvGet(SAVE_KEY + '_slots');
    var slots = [];
    if (raw) { try { slots = JSON.parse(raw); } catch (e) { slots = []; } }
    if (!Array.isArray(slots)) slots = [];
    while (slots.length <= SLOT_COUNT) slots.push(null);
    return slots;
}

// 静默存档（自动存档用）：不碰正文，不打断场景
function saveToSlotQuiet(index) {
    var pack = packSave();
    var slots = readSlots();
    slots[index] = pack;
    var ok = kvSet(SAVE_KEY + '_slots', JSON.stringify(slots));
    if (index === 0) kvSet(SAVE_KEY + '_auto_at', String(Date.now()));
    return ok;
}

function saveToSlot(index) {
    var pack = packSave();
    var slots = readSlots();
    slots[index] = pack;
    var ok = kvSet(SAVE_KEY + '_slots', JSON.stringify(slots));
    if (index === 0) kvSet(SAVE_KEY, JSON.stringify(pack.player));

    if (ok) {
        if (typeof toast === 'function') toast('已保存到槽位 ' + (index === 0 ? '自动' : index) + '。', 'good');
    } else {
        // 关键：不再静默失败。告诉玩家真正发生了什么，并给出出路。
        st('<div class="scene-title">保存未写入磁盘</div>' +
            '<p class="highlight">浏览器拒绝写入本地存储（可能是隐私模式、无痕窗口，或用 file:// 直接打开）。</p>' +
            '<p>本次保存只存在于当前页面的内存里，' +
            '<strong>刷新就会丢失</strong>。</p>' +
            '<p style="color:#8a5a62;font-size:0.85em;">解决办法：用侧栏的「导出存档文件」把进度存成 JSON，下次用「导入」读回来。</p>');
        cb();
        ab('导出文件', function() { exportSaveFile(); }, 'primary-btn');
        ab('返回', function() { switchTab('save'); });
        return;
    }
    switchTab('save');
}

function autoSave() {
    var ok = saveToSlotQuiet(0);
    kvSet(SAVE_KEY, JSON.stringify(packSave().player));
    return ok;
}

function deleteSlot(index) {
    var slots = readSlots();
    slots[index] = null;
    kvSet(SAVE_KEY + '_slots', JSON.stringify(slots));
    if (index === 0) kvDel(SAVE_KEY);
    if (typeof toast === 'function') toast('槽位已清空。', 'warn');
    switchTab('save');
}

function loadFromSlot(index) {
    var slots = readSlots();
    var data = slots[index];
    if (!data || !data.player) {
        st('<p class="highlight">该槽位没有存档。</p>');
        cb();
        ab('返回', function() { switchTab('save'); });
        return;
    }
    try {
        applyLoadedPlayer(data.player);
        gameStarted = true;
        player.flags.isSleeping = false;
        player.flags.isFainting = false;
        checkHp();
        ua();
        if (typeof toast === 'function') toast('已读取槽位 ' + (index === 0 ? '自动' : index) + '。', 'good');
        sceneExploreDistrict(player.currentRing, getCurrentLevel());
    } catch (e) {
        st('<p class="highlight">读取失败：' + e.message + '</p>');
        cb();
        ab('返回', function() { switchTab('save'); });
    }
}

// 从自动存档「继续游戏」（标题界面用）
function continueFromAutoSave() {
    var slots = readSlots();
    if (!slots[0] || !slots[0].player) {
        var legacy = kvGet(SAVE_KEY);
        if (!legacy) {
            if (typeof toast === 'function') toast('没有可继续的存档。', 'warn');
            return false;
        }
        try { slots[0] = { player: JSON.parse(legacy) }; } catch (e) { return false; }
    }
    try {
        applyLoadedPlayer(slots[0].player);
        gameStarted = true;
        player.flags.isSleeping = false;
        player.flags.isFainting = false;
        checkHp();
        ua();
        sceneExploreDistrict(player.currentRing, getCurrentLevel());
        return true;
    } catch (e) {
        if (typeof toast === 'function') toast('存档损坏，无法继续。', 'warn');
        return false;
    }
}

function hasAutoSave() {
    var slots = readSlots();
    if (slots[0] && slots[0].player) return true;
    return !!kvGet(SAVE_KEY);
}

// ---------- 文件导出 / 导入 ----------

function exportSaveFile() {
    var pack = packSave();
    var data = JSON.stringify(pack, null, 2);
    try {
        var blob = new Blob([data], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '七环地狱存档_' + (player.name || '无名') + '_第' + (player.daysSurvived || 1) + '天.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        if (typeof toast === 'function') toast('已导出存档文件。', 'good');
    } catch (e) {
        st('<p class="highlight">导出失败：' + e.message + '</p>');
        cb();
        ab('返回', function() { switchTab('save'); });
    }
}

function importSaveFile(event) {
    var f = event && event.target && event.target.files && event.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var obj = JSON.parse(e.target.result);
            var pdata = obj && obj.player ? obj.player : obj;   // 兼容裸 player 对象
            if (!pdata || typeof pdata !== 'object' || !pdata.race) throw new Error('这不是七环地狱的存档');
            applyLoadedPlayer(pdata);
            gameStarted = true;
            player.flags.isSleeping = false;
            player.flags.isFainting = false;
            checkHp();
            ua();
            if (typeof toast === 'function') toast('存档已导入。', 'good');
            sceneExploreDistrict(player.currentRing, getCurrentLevel());
        } catch (err) {
            st('<p class="highlight">导入失败：' + err.message + '</p>');
            cb();
            ab('返回', function() { switchTab('save'); });
        }
    };
    reader.readAsText(f);
}

                   (s.player.currentRing || '?');

            meta += ' · 血' + Math.round(_sp.hp) + '/' + Math.round(_sp.maxHp || 100) +
                    ' 理' + Math.round(_sp.sanity || 0) +
                    ' 金' + Math.round(_sp.gold || 0);
        }
            cls = 'slot-row';
        }
        html += '<div class="' + cls + '">';
        html += '<span class="slot-name">' + label + '</span>';
        html += '<span class="slot-meta">' + meta + '</span>';
        html += '<span class="slot-btns">';
        if (i > 0) html += '<button class="mini" onclick="saveToSlot(' + i + ')">存</button>';
        if (s && s.player) {
            html += '<button class="mini" onclick="loadFromSlot(' + i + ')">读</button>';
            if (i > 0) html += '<button class="mini danger" onclick="deleteSlot(' + i + ')">删</button>';
        }
        html += '</span></div>';
    }

    html += '<div class="save-io">';
    html += '<button class="wide" onclick="exportSaveFile()">导出存档文件</button>';
    html += '<button class="wide" onclick="document.getElementById(\'load-input\').click()">导入存档文件</button>';
    html += '<input type="file" id="load-input" accept=".json,application/json" style="display:none" onchange="importSaveFile(event)">';
    html += '</div>';
    html += '<button class="wide danger" style="margin-top:10px" onclick="resetGameFromMenu()">重新开始（清除所有存档）</button>';
    html += '</div>';
    return html;
}

// UI 精简层：把 24 个平铺按钮收成 6 个分组

// 去掉标签前缀的装饰性 emoji（⚡ 保留：它是战斗弱点的标记）
function stripEmoji(s) {
    if (!s) return s;
    var i = 0;
    while (i < s.length) {
        var c = s.charCodeAt(i);
        if (c >= 0xD800 && c <= 0xDBFF) { i += 2; continue; }        // 代理对（大多数 emoji）
        if (c === 0x26A1) break;                                      // ⚡ 保留
        if ((c >= 0x2600 && c <= 0x27BF) || c === 0xFE0F ||
            (c >= 0x2B00 && c <= 0x2BFF) || (c >= 0x2190 && c <= 0x21FF)) { i += 1; continue; }
        break;
    }
    while (i < s.length && (s.charAt(i) === ' ' || s.charAt(i) === '\u3000')) i++;
    return i > 0 ? s.slice(i) : s;
}

// 通用子菜单：items = [{label, fn, cls}]
function sceneSubmenu(title, intro, items, backFn, backLabel) {

        (function(it) {
            if (!it || !it.label) return;
            ab(it.label, it.fn, it.cls || '');
        })(items[i]);
    }
    ab(backLabel || '返回', backFn);
}

// 原来只有 rentDue / rentPaidUntilDay 两个字段，收租逻辑在，
// 但没有任何地方能签租约——等于房租永远不会被触发。

var RENT_PLAN = {
    poor:   { ring: null, label: '棚屋',   price: 35,  days: 7, line: '一块木板搭的棚，门能锁。下雨会漏。' },
    middle: { ring: null, label: '单间',   price: 90,  days: 7, line: '一张床、一张桌、一扇朝内的窗。' },
    rich:   { ring: null, label: '套间',   price: 240, days: 7, line: '有热水，有门房，走廊里没人看你。' }
};

function rentInfo() {
    var paid = player.rentPaidUntilDay || 0;
    var day = player.daysSurvived || 1;
    return { paid: paid, left: Math.max(0, paid - day), level: player.residenceLevel || 'poor' };
}

function sceneRentHome(ring, level) {
    var info = rentInfo();
    var html = '<div class="scene-title">住 处</div>';
    if (info.paid > (player.daysSurvived || 1)) {
        var r = RENT_PLAN[info.level] || RENT_PLAN.poor;
        html += '<p>你住的是<b>' + r.label + '</b>。' + r.line + '</p>' +
            '<p style="color:#7ab47a;">租金已付到第 ' + info.paid + ' 天，还剩 ' + info.left + ' 天。</p>';
    } else {
        html += '<p>你没有在付租金的地方。</p>' +
            '<p style="color:#c09080;">睡在街上不是不能活，只是醒过来的时候不会好受。</p>';
    }
    st(html);
    cb();

    for (var key in RENT_PLAN) {
        (function(k) {
            var r = RENT_PLAN[k];
            var canAdd = (level === k || (k === 'poor' && level === 'middle'));
            if (!canAdd) return;
            ab('租 ' + r.label + '（' + r.price + ' 金币 / ' + r.days + ' 天）', function() {
                if (player.gold < r.price) {
                    st('<p>你数了数，还差 ' + (r.price - player.gold) + ' 金币。</p>');
                    cb();
                    ab('回去', function() { sceneRentHome(ring, level); });
                    return;
                }
                addTime(15);
                player.gold -= r.price;
                player.residenceLevel = k;
                player.residenceRing = ring;
                var base = Math.max(info.paid, player.daysSurvived || 1);
                player.rentPaidUntilDay = base + r.days;
                player.rentDue = 0;
                st('<p>你把金币推过去，对方数了一遍，给了你一把钥匙。</p>' +
                    '<p>房租付到第 ' + player.rentPaidUntilDay + ' 天。</p>');
                cb();
                ab('进去看看', function() { sceneRentHome(ring, level); });
            }, player.gold >= r.price ? 'primary-btn' : '');
        })(key);
    }

    if (info.paid > (player.daysSurvived || 1)) {
        ab('收拾东西，睡一觉', function() {
            if (typeof sceneSleepAtHome === 'function') { sceneSleepAtHome(ring, level); return; }
            sceneExploreDistrict(ring, level);
        });
    }
    ab('离开', function() { sceneExploreDistrict(ring, level); });
}

// 睡在自己租的地方：回得多，欠租的话扣得厉害
function sceneSleepAtHome(ring, level) {
    var info = rentInfo();
    var ok = info.paid > (player.daysSurvived || 1);
    addTime(420);
    if (ok) {
        var r = RENT_PLAN[info.level] || RENT_PLAN.poor;
        player.hp = Math.min(player.maxHp || 100, (player.hp || 0) + 45);
        player.fatigue = Math.max(0, (player.fatigue || 0) - 60);
        player.sanity = Math.min(15, (player.sanity || 0) + 2);
        st('<div class="scene-title">' + r.label + '</div><p>你睡了一觉。醒来的时候天还没亮。</p>' +
            '<p style="color:#7ab47a;">HP +45　疲劳 -60　理智 +2</p>');
    } else {
        player.hp = Math.min(player.maxHp || 100, (player.hp || 0) + 10);
        player.fatigue = Math.max(0, (player.fatigue || 0) - 15);
        player.sanity = Math.max(0, (player.sanity || 0) - 3);
        st('<div class="scene-title">街上</div><p>你在墙根下睡着了，半夜被冻醒过两次。</p>' +
            '<p style="color:#c09080;">HP +10　疲劳 -15　理智 -3</p>');
    }
    cb();
    ab('起来', function() { sceneExploreDistrict(ring, level); });
}

function districtGoMenu(ring, level) {
    var items = [];
    var ti = tierIndex(level);
    var curName = RD[ring][level].name;
    var note = '';

    // 下层：免费，永远可以下去
    if (ti > 0) {
        (function(down) {
            items.push({
                label: '下到' + districtName(ring, down) + '（免费，15分钟）',
                fn: function() { moveToTier(down); }
            });
        })(TIER_ORDER[ti - 1]);
    }

    // 上层：要钱。付不起就不列出来，免得新手点进去撞墙。
    if (ti < 2) {
        var up = TIER_ORDER[ti + 1];
        var ucost = tierUpCost(up);
        if (player.gold >= ucost) {
            (function(u, c) {
                items.push({
                    label: '上到' + districtName(ring, u) + (c ? '（' + c + ' 金币，20分钟）' : '（持证免检）'),
                    fn: function() { moveToTier(u); }
                });
            })(up, ucost);
        } else {
            note = '进' + districtName(ring, up) + '要 ' + ucost + ' 金币，你现在付不起，所以这条路先不给你看了。';
        }
    }

    // 相邻环：同样，付不起就不列
    var nbrs = ringNeighbors(ring);
    var listed = 0;
    for (var i = 0; i < nbrs.length; i++) {
        (function(r) {
            var cost = ringTravelCost(r);
            if (player.gold >= cost) {
                listed++;
                items.push({
                    label: '走向' + RING_SHORT[r] + '之环 · ' + districtName(r, 'poor') +
                        (cost ? '（' + cost + ' 金币）' : '（持证免检）'),
                    fn: function() { moveToRing(r); }
                });
            }
        })(nbrs[i]);
    }
    if (!listed && !note) {
        note = '跨环要 ' + RING_TRAVEL_COST + ' 金币，你身上只有 ' + player.gold + '。先去挣点。';
    }

    items.push({ label: '打开七环地图', fn: function() { sceneWorldMap(); } });

    sceneSubmenu('移动 · ' + curName,
        '离开这一带。七环首尾相连，只能走相邻的一环，不能跳。' + (note ? ' ' + note : ''),
        items,
        function() { sceneExploreDistrict(ring, level); });
}

    if (typeof useDailyQuota === 'function' && !useDailyQuota('breathe')) {
        st('<p>你靠着墙坐下来，闭眼。脑子里该响的东西还是在响。</p>' +

// ---------- 打工 ----------

function industryWork(id, jobIdx) {
    var ind = INDUSTRY[id];
    if (!ind) return;
    var job = ind.jobs[jobIdx];
    if (!job) return;

    addTime(job.minutes);
    var pay = job.pay[0] + Math.floor(Math.random() * (job.pay[1] - job.pay[0] + 1));

    player.hp = clampStat('hp', player.hp + (job.hp || 0));
    player.sanity = clampStat('sanity', player.sanity + (job.san || 0));
    player.fatigue = clampStat('fatigue', player.fatigue + (job.fatigue || 0));
    if (job.food) player.food = clampStat('food', player.food + job.food);
    if (job.strength) player.strength = clampStat('strength', player.strength + job.strength);
    player.sinValue = (player.sinValue || 0) + (job.sin || 0);
    if (job.wanted) player.wantedLevel = Math.min(5, (player.wantedLevel || 0) + job.wanted);

    var hurt = '';
    if (job.risk && Math.random() < job.risk) {
        var extra = job.riskHp || 0;
        if (extra) player.hp = clampStat('hp', player.hp - extra);
        hurt = '<p style="color:#e85060;">' + job.riskText + '</p>';
        if (extra) hurt += '<p style="color:#e85060;">额外 HP -' + extra + '。</p>';
    }

    // 工伤可能直接把玩家打死 —— 走统一的濒死流程
    var before = player.hp;
    checkHp();
    ua();
    if (screenLocked()) return;

    player.gold += pay;
    addExp(Math.max(3, Math.floor(job.minutes / 20)));
    ua();

    var html = '<div class="scene-title">' + ind.name + ' · 开工</div>' +
        '<p>你在「' + ind.name + '」做了' + Math.floor(job.minutes / 60) + '个小时的活。' +
        '收工的时候手上有洗不掉的味道，工钱是当场结的，没有拖。</p>' + hurt +
        '<p style="color:#e8c060;">金币 +' + pay + '。</p>' +
        '<p style="font-size:0.85em;color:#8a5a62;">HP ' + (before - player.hp) + '，理智 ' +
        (job.san || 0) + '，疲劳 +' + (job.fatigue || 0) + '，罪业值 +' + (job.sin || 0) + '。</p>';
    st(html);
    cb();
    ab('收工', function() { sceneIndustry(id, ind.ring, ind.levels[0]); }, 'primary-btn');
}

// ---------- 产业商店 ----------

function industryShop(id) {
    var ind = INDUSTRY[id];
    if (!ind) return;
    var html = '<div class="scene-title">' + ind.name + ' · 货架</div>' +
        '<p style="font-size:0.85em;color:#9a6a6a;">你有 ' + player.gold + ' 金币。</p>';
    st(html);
    cb();
    for (var i = 0; i < ind.goods.length; i++) {
        (function(gd) {
            ab('买 ' + gd.name + '（' + gd.price + 'G）', function() {

// ---------- 恶魔股市 ----------

function stockInit() {
    if (!player.stockPrices) player.stockPrices = {};
    var keys = Object.keys(INDUSTRY);
    for (var i = 0; i < keys.length; i++) {
        if (!player.stockPrices[keys[i]]) {
            player.stockPrices[keys[i]] = 20 + Math.floor(Math.random() * 40);
        }
    }
    if (!player.stocks) player.stocks = {};
}

function tickStocks() {
    stockInit();
    var keys = Object.keys(INDUSTRY);
    var notice = null;
    for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var p = player.stockPrices[k];
        var drift = (Math.random() - 0.46) * 0.22;   // 轻微上行偏置，但会跌
        p = Math.round(p * (1 + drift));
        if (p < 5) p = 5;
        if (p > 320) p = 320;
        player.stockPrices[k] = p;
        // 暴涨暴跌提醒
        if (player.stocks[k] && Math.abs(drift) > 0.16) {
            notice = (drift > 0 ? '📈 ' : '📉 ') + INDUSTRY[k].name + ' 今日' +
                (drift > 0 ? '大涨' : '暴跌') + '，现价 ' + p + ' 金币/股。';
        }
    }
    if (notice) toast(notice, 'warn');
}

function sceneStockMarket(ring, level) {
    stockInit();
    var html = '<div class="scene-title">恶 魔 股 市</div>' +
        '<p>大厅中央的水晶板上滚着各环产业的价格。有人跪在下面数自己还剩多少，' +
        '有人站着笑。同一块板子，两种人。</p>' +
        '<p style="font-size:0.85em;color:#8a5a62;">你有 ' + player.gold + ' 金币。持股按当前价随时可卖。</p>';
    st(html);
    cb();

    var keys = Object.keys(INDUSTRY);
    for (var i = 0; i < keys.length; i++) {
        (function(k) {
            var ind = INDUSTRY[k];
            var price = player.stockPrices[k];
            var held = (player.stocks[k] || 0);
            ab(ind.name + ' · ' + price + 'G/股 · 持' + held + '股', function() {
                var h = '<div class="scene-title">' + ind.name + '</div>' +
                    '<p style="font-size:0.85em;color:#8a5a62;">' + ind.sub + ' · ' + ind.ring + '</p>' +
                    '<p>现价 <span class="gold-text">' + price + 'G</span>／股。你持有 ' + held + ' 股。</p>' +
                    '<p>你有 ' + player.gold + ' 金币。</p>';
                st(h);
                cb();
                ab('买 1 股（' + price + 'G）', function() {
                    if (player.gold < price) {
                        st('<p class="highlight">⚠️ 金币不够。</p>');
                        cb(); ab('返回', function() { sceneStockMarket(ring, level); });
                        return;
                    }
                    player.gold -= price;
                    player.stocks[k] = (player.stocks[k] || 0) + 1;
                    addTime(10);
                    st('<p>你以 ' + price + 'G 买入 1 股「' + ind.name + '」。</p>');
                    ua();
                    cb(); ab('继续', function() { sceneStockMarket(ring, level); });
                }, 'gold-btn');
                ab('买 5 股（' + price * 5 + 'G）', function() {
                    var cost = price * 5;
                    if (player.gold < cost) {
                        st('<p class="highlight">⚠️ 金币不够。</p>');
                        cb(); ab('返回', function() { sceneStockMarket(ring, level); });
                        return;
                    }
                    player.gold -= cost;
                    player.stocks[k] = (player.stocks[k] || 0) + 5;
                    addTime(20);
                    st('<p>你以 ' + price + 'G 一股买了 5 股「' + ind.name + '」，一共 ' + cost + 'G。</p>');
                    ua();
                    cb(); ab('继续', function() { sceneStockMarket(ring, level); });
                }, 'gold-btn');
                if (held > 0) {
                    ab('全卖掉（' + held + '股，共 ' + price * held + 'G）', function() {
                        var total = price * held;
                        player.gold += total;
                        player.stocks[k] = 0;
                        player.sinValue = (player.sinValue || 0) + 2;
                        addTime(20);
                        st('<p>你把 ' + held + ' 股「' + ind.name + '」全部出掉，换回 ' + total + 'G。</p>');
                        ua();
                        cb(); ab('继续', function() { sceneStockMarket(ring, level); });
                    }, 'primary-btn');
                }
                ab('返回', function() { sceneStockMarket(ring, level); });
            });
        })(keys[i]);
    }
    ab('离开', function() { sceneExploreDistrict(ring || '贪婪之环', level || 'middle'); });
}

// ---------- 罪业银行 ----------

function sceneBank(ring, level) {
    if (!player.bankDeposit) player.bankDeposit = 0;
    var html = '<div class="scene-title">罪 业 银 行</div>' +
        '<p>柜台高到你必须仰头。铜管里传出来的声音不急不缓：</p>' +
        '<p style="color:#c09080;font-style:italic;">「存取自由。日息两厘。不设上限，只设底线——底线下的人我们不留。」</p>' +
        '<p>你的存款：<span class="gold-text">' + player.bankDeposit + '</span> 金币。' +
        '身上：' + player.gold + ' 金币。</p>';
    st(html);
    cb();
    ab('存入 50 金币', function() {
        if (player.gold < 50) { st('<p class="highlight">⚠️ 金币不够。</p>'); cb(); ab('返回', function() { sceneBank(ring, level); }); return; }
        player.gold -= 50; player.bankDeposit += 50;
        st('<p>你把 50 金币推进柜台下的槽里，它们滑走了，没有声音。</p>');
        ua(); cb(); ab('继续', function() { sceneBank(ring, level); });
    }, 'gold-btn');
    ab('存入全部', function() {
        if (player.gold <= 0) { st('<p class="highlight">你身上没有金币。</p>'); cb(); ab('返回', function() { sceneBank(ring, level); }); return; }
        var g0 = player.gold;
        player.bankDeposit += g0; player.gold = 0;
        st('<p>你把身上所有 ' + g0 + ' 金币都推进去了。口袋忽然很轻。</p>');
        ua(); cb(); ab('继续', function() { sceneBank(ring, level); });
    }, 'gold-btn');
    ab('取出全部', function() {
        if (player.bankDeposit <= 0) { st('<p class="highlight">你在这里没有存款。</p>'); cb(); ab('返回', function() { sceneBank(ring, level); }); return; }
        var d0 = player.bankDeposit;
        player.gold += d0; player.bankDeposit = 0;
        st('<p>铜管里传出数钱的声音。你取回 ' + d0 + ' 金币。</p>');
        ua(); cb(); ab('继续', function() { sceneBank(ring, level); });
    }, 'primary-btn');
    ab('离开', function() { sceneExploreDistrict(ring || '贪婪之环', level || 'middle'); });
}

// ---------- 产业主界面 ----------

function sceneIndustry(id, ring, level) {
    var ind = INDUSTRY[id];
    if (!ind) return;
    ring = ring || ind.ring;
    level = level || ind.levels[0];

    var html = '<div class="scene-title">' + ind.name + '</div>' +
        '<p style="font-size:0.85em;color:#9a6a6a;">' + ind.sub + ' · 所属：' + ind.lord + '</p>' +
        '<div class="divider">◆ ◆ ◆</div>' +
        '<p>' + ind.desc + '</p>' +
        '<p style="font-size:0.85em;color:#8a5a62;">金币 ' + player.gold +
        '　HP ' + player.hp + '/' + player.maxHp + '　理智 ' + player.sanity + '/' + player.maxSanity + '</p>';
    st(html);
    cb();

    for (var i = 0; i < ind.jobs.length; i++) {
        (function(idx) {
            var job = ind.jobs[idx];
            ab(job.label, function() { industryWork(id, idx); }, 'primary-btn');
        })(i);
    }

    ab('🛒 去货架看看', function() { industryShop(id); }, 'gold-btn');

    if (ind.special) {
        if (ind.special.indexOf('bank') >= 0) {
            ab('🏦 罪业银行（存取）', function() { sceneBank(ring, level); });
        }
        if (ind.special.indexOf('stock') >= 0) {
            ab('📈 恶魔股市', function() { sceneStockMarket(ring, level); }, 'gold-btn');
        }
    }

    ab('离开', function() { addTime(5); sceneExploreDistrict(ring, level); });
}

function addIndustryButtons(ring, level) {
    var keys = Object.keys(INDUSTRY);
    for (var i = 0; i < keys.length; i++) {
        (function(id) {
            var ind = INDUSTRY[id];
            if (ind.ring !== ring) return;
            if (ind.levels.indexOf(level) === -1) return;
            ab(ind.promo, function() { addTime(10); sceneIndustry(id, ring, level); });
        })(keys[i]);
    }
}

function npcStoryStage(id) {
    if (!player.flags) player.flags = {};
    return player.flags['story_' + id] || 0;
}

function npcStoryAvailable(id) {
    var story = NPC_STORY[id];
    if (!story || !story.stages) return -1;
    var done = npcStoryStage(id);
    if (done >= story.stages.length) return -1;
    var stage = story.stages[done];
    var love = getNpcLove(id);
    var day = player.daysSurvived || 1;
    if (love < (stage.love || 0) || day < (stage.day || 1)) return -1;
    if (typeof storyStageReady === 'function' && !storyStageReady(id, stage)) return -1;
    return done;
    return -1;
}

function addNpcStoryButton(id) {
    var story = NPC_STORY[id];
    if (!story || !story.stages) return;
    var done = npcStoryStage(id);
    if (done >= story.stages.length) {
        ab('剧情「' + story.title + '」· 已经结束', function() {
            st('<div class="scene-title">' + story.title + '</div><p>' +
                '这条线已经走完了。你想不起来是从哪一步开始的，' +
                '但你知道它结束了。</p>');
            cb();
            ab('返回', function() { sceneNativeNpcMenu(id); });
        }, 'disabled-btn');
        return;
    }
    var avail = npcStoryAvailable(id);
    if (avail < 0) {
        var need = story.stages[done];
        ab('剧情「' + story.title + '」· 还没到时候', function() {
            var lines = [];
            if (getNpcLove(id) < (need.love || 0)) {
                lines.push('好感还不够（' + getNpcLove(id) + ' / ' + (need.love || 0) + '）');
            }
            if ((player.daysSurvived || 1) < (need.day || 1)) {
                lines.push('时间还太早（第 ' + (player.daysSurvived || 1) + ' 天 / 要第 ' + (need.day || 1) + ' 天）');
            }
            if (typeof storyStageReady === 'function' && !storyStageReady(id, need)) {
                lines.push(need.reqText || '还缺一件先发生的事');
            }
            st('<div class="scene-title">' + story.title + '</div>' +
                '<p style="color:#8a5a62;">他还没打算跟你说这件事。</p>' +
                '<p style="font-size:0.85em;color:#6a4a52;">还差：' + lines.join('；') + '。</p>');
            cb();
            ab('返回', function() { sceneNativeNpcMenu(id); });
        }, 'disabled-btn');
        return;
    }
    ab('剧情「' + story.title + '」', function() { playNpcStory(id); }, 'primary-btn');
}

function playNpcStory(id) {
    var story = NPC_STORY[id];
    var idx = npcStoryAvailable(id);
    if (idx < 0) { sceneNativeNpcMenu(id); return; }
    var stage = story.stages[idx];
    var html = '<div class="scene-title">' + story.title + ' · ' + (idx + 1) + '/' + story.stages.length + '</div>' +
        '<p>' + stage.text + '</p>' +
        '<p style="color:#c09080;font-style:italic;">' + (stage.then || '') + '</p>';
    st(html);
    cb();
    ab('……', function() {
        if (typeof stage.eff === 'function') {
            try { stage.eff(); } catch (e) {}
        }
        // 第三幕之后的余波：上一次的结局会影响他之后怎么对你
        if (typeof storyAftermath === 'function') {
            try { storyAftermath(id, idx); } catch (e) {}
        }
        player.flags['story_' + id] = idx + 1;
        addTime(20);
        checkHp();
        ua();
        var next = idx + 1;
        var tail = next >= story.stages.length
            ? '<p style="color:#8a5a62;">这条线到此为止。他之后还会在，只是不再有新的东西要说。</p>'
            : '<p style="color:#8a5a62;">（还有下文。等他愿意的时候。）</p>';
        st('<div class="scene-title">' + story.title + '</div>' + tail);
        cb();
        ab('返回', function() { sceneNativeNpcMenu(id); });
    }, 'primary-btn');
}

function tryPoolEvent(ring, level) {
    var pool = EXPLORE_EVENTS[ring];
    if (!pool) return false;
    var fresh = [];
    for (var i = 0; i < pool.length; i++) {
        if (!player.flags['evt_' + pool[i].id]) fresh.push(pool[i]);
    }
    if (!fresh.length) return false;
    var ev = fresh[Math.floor(Math.random() * fresh.length)];
    player.flags['evt_' + ev.id] = true;

    st('<div class="scene-title">' + ring + '</div><p>' + ev.text + '</p>');
    cb();
    for (var j = 0; j < ev.opt.length; j++) {
        (function(o) {
            ab(o.label, function() { applyEventOutcome(o, ring, level); });
        })(ev.opt[j]);
    }
    return true;
}

function applyEventOutcome(o, ring, level) {
    var t = o.text || '';
    var parts = (o.fn || '').split(' ');
    for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (!p) continue;
        var m = p.match(/^([a-zA-Z]+)([+-]?\d+)?$/);
        if (!m) continue;
        var key = m[1], val = m[2] === undefined ? 0 : parseInt(m[2], 10);

        if (key === 'goldGamble') {
            if (Math.random() < 0.5) { player.gold += 20; t += '你赢了 20 金币。'; }
            else { player.gold = Math.max(0, player.gold - 20); t += '你输了 20 金币。'; }
            continue;
        }
        if (key === 'gluttonyMark') { player.flags.gluttonyMark = true; continue; }
        if (key === 'insight') { player.abilities.push('旁观者'); continue; }

        var stat = key === 'sanity' ? 'sanity' : key === 'repentance' ? null : key;
        if (key === 'repentance') {
            player.repentance = Math.max(0, (player.repentance || 0) + val);
        } else if (key === 'sin') {
            player.sinValue = (player.sinValue || 0) + val;
        } else if (key === 'wanted') {
            player.wantedLevel = Math.max(0, Math.min(5, (player.wantedLevel || 0) + val));
        } else if (key === 'gold') {
            player.gold = Math.max(0, player.gold + val);
        } else if (key === 'food') {
            player.food = clampStat('food', player.food + val);
        } else if (key === 'fatigue') {
            player.fatigue = clampStat('fatigue', player.fatigue + val);
        } else if (player[stat] !== undefined) {
            player[stat] = clampStat(stat, player[stat] + val);
        }
    }
    addTime(10);
    checkHp();
    ua();
    st('<p>' + (t || '（你做了选择。）') + '</p>');
    cb();
    ab('继续', function() { sceneExploreDistrict(ring, level); });
}

// ---------- 步骤条 ----------

function createStepLine(n, total, label) {
    var html = '<div class="step-line">';
    for (var i = 1; i <= total; i++) {
        var cls = i < n ? 'done' : (i === n ? 'now' : '');
        html += '<span class="step-dot ' + cls + '">' + (i < n ? '✓' : i) + '</span>';
        if (i < total) html += '<span class="step-bar ' + (i < n ? 'done' : '') + '"></span>';
    }
    html += '<span class="step-label">第 ' + n + ' / ' + total + ' 步 · ' + label + '</span></div>';
    return html;
}

function sceneTitle() {
    var saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
        try {
            var data = JSON.parse(saved);
            Object.assign(player, data);
        } catch(e) {}
    }
    stage = 'title'; selectedRace = ''; player.race = ''; st('<div style="text-align:center;padding:30px 0;"><div style="font-size:1.6em;letter-spacing:0.12em;color:#e8c060;text-shadow:0 0 20px rgba(200,60,40,0.5);margin-bottom:6px;">七 环 地 狱</div><div style="color:#9a5a5a;font-size:0.8em;letter-spacing:0.1em;">—— 傲慢之醒 ——</div><div class="divider">◆ ◆ ◆</div><p>在人间与天堂之下，横亘着<span class="highlight">七环地狱</span>。七个环形领域层层嵌套，每一环由一位原罪君主统治。</p><p>你即将坠入这片永恒黑暗。你是谁？</p></div>'); cb(); ab('🔥 开始角色创建', function() { sceneCreate(); }, 'primary-btn'); }

function sceneCreate() { stage = 'create'; selectedRace = ''; selectedGender = ''; st('<div class="scene-title">角 色 创 建</div><p>选择你的<span class="highlight">种族</span>：</p><p><span class="highlight">罪人</span>：曾是人类，犯下罪孽后坠入地狱。在傲慢之环接受路西法的审判。</p><p><span class="gold-text">原生恶魔</span>：诞生于地狱混沌能量。在诞生环直接觐见君主。每个环有独特的诞生场景和君主对话。</p><div class="input-group"><div class="race-select" id="race-btns"><span class="clickable" id="race-sinner" onclick="sr(\'sinner\')">⚰️ 罪人</span><span class="clickable" id="race-demon" onclick="sr(\'demon\')">👿 原生恶魔</span></div></div><div id="race-desc" style="font-size:0.85em;color:#9a6a6a;margin-top:8px;"></div><p style="margin-top:10px;">选择你的<span class="highlight">性别</span>：</p><div class="input-group"><div class="race-select" id="gender-btns"><span class="clickable" id="gender-male" onclick="sg(\'male\')">♂ 男性</span><span class="clickable" id="gender-female" onclick="sg(\'female\')">♀ 女性</span></div></div><div class="input-group" style="margin-top:12px;"><label>输入你的<span class="highlight">姓名</span>：</label><input type="text" id="name-input" placeholder="输入姓名……" maxlength="20"></div>'); cb(); ab('✅ 确认并继续', function() { var nv = document.getElementById('name-input').value.trim(); if (!selectedRace) { st('<p class="highlight">请先选择种族！</p>'); cb(); ab('返回', function() { sceneCreate(); }); return; } if (!selectedGender) { st('<p class="highlight">请先选择性别！</p>'); cb(); ab('返回', function() { sceneCreate(); }); return; } if (!nv) { st('<p class="highlight">请输入姓名！</p>'); cb(); ab('返回', function() { sceneCreate(); }); return; } player.name = nv; player.race = selectedRace; player.gender = selectedGender; ua(); if (selectedRace === 'sinner') { sceneSinSelect(); } else { sceneDemonBirthRing(); } }, 'primary-btn'); }

function sr(race) { selectedRace = race; document.getElementById('race-sinner').classList.toggle('active', race === 'sinner'); document.getElementById('race-demon').classList.toggle('active', race === 'demon'); var d = document.getElementById('race-desc'); if (race === 'sinner') d.innerHTML = '<span class="highlight">罪人</span>——背负生前罪孽。在傲慢环接受路西法审判。初始理智-3。'; else d.innerHTML = '<span class="gold-text">原生恶魔</span>——在诞生环觐见君主。初始理智+3，随机属性+3。每个环有独特的诞生场景和君主对话。'; }

function sg(gender) { selectedGender = gender; document.getElementById('gender-male').classList.toggle('active', gender === 'male'); document.getElementById('gender-female').classList.toggle('active', gender === 'female'); }

// ==================== 罪人生前背景故事库 ====================
var sinBackstories = {
    '傲慢': [{ crime: '你是一位天才外科医生。从医学院毕业那天起，你的导师就说你拥有"神之手"——精准、稳定、从不颤抖。你救过三百条命。每一个被你切开又缝合的身体，都是你才华的证明。但你忘记了一件事：你不是神。在一次高难度心脏手术中，助手反复提醒你患者的血压正在危险下降。你连头都没抬——你从不听助手的话，因为你觉得他们不配。患者死在了手术台上。事后你伪造了病历，把责任推给了那位助手。他在法庭上哭了。你没有任何感觉。直到某天深夜，他在停车场等着你。', flavor: '刀尖刺入时，你脑中闪过的不是疼痛，而是那句"我怎么可能错"。你救过三百条命，但你始终认为那是理所应当。直到冰冷的停车场地面告诉你——你也不过是一具肉体。' },{ crime: '你是某跨国企业的CEO。从白手起家到行业巨头，你用了二十年。你的座右铭刻在办公室的墙上：商场如战场，弱者活该被淘汰。你主导的商业欺诈导致数万人失业，数十家供应商破产。当记者在镜头前质问你时，你微笑着说：我只是做了一个商人该做的事。三年后的一个雨夜，一位破产供应商的老板闯入了你的办公室。他手里拿着的东西，不是你惯常见到的合同。', flavor: '枪响时你还在整理领带。你最后看到的东西，是自己倒映在落地窗上的脸——那张脸上没有恐惧，只有不可思议。你到死都不相信，有人会因为"钱"这种东西杀人。' }],
    '暴怒': [{ crime: '你在公司被上司当众羞辱了整整十年。十年。每天早上走进办公室，你都能听到同事的窃窃私语。他在会议上把你的方案扔在地上，在茶水间叫你废物，在年会舞台上当着一千人的面模仿你的口吃。你忍了十年。然后某天下午，当他又一次把你的报告摔在桌上时，你拿起了旁边的办公椅。之后的事情像一部快进的电影——你砸了他十七下。然后你点燃了办公室。火焰蔓延到整个楼层。七名同事没能逃出来。你坐在火焰中央，看着这一切发生，感到了一种从未有过的平静。浓烟灌入肺部的最后一刻，你想：这比忍耐容易多了。', flavor: '火焰比你想象中更吵。它吞噬隔间挡板的声音像野兽咀嚼骨头。你在浓烟中听到有人在哭——那声音和十年前你在镜子前听到的，一模一样。' },{ crime: '你是战场上的老兵。三次服役，两次负伤，一枚勋章。你在战壕里学会了如何在半秒内判断敌友，如何在黑暗中徒手杀死一个成年人。但没人教过你如何回到和平的生活。退役后你做过保安、货车司机、工地搬运工——每一份工作都以打架告终。那天在街上，一个年轻人撞到了你的肩膀。他没有道歉。你的手在他脖子上停留了四十五秒——你数的。法官问你为什么，你说：他撞了我。法警把你按在地上时，你还在挣扎。不是因为你想逃跑——是因为你无法忍受被压制的屈辱。', flavor: '法庭的灯光很亮。你看着陪审团的脸，每一张脸上都写着恐惧。你忽然意识到——在他们眼中，你不是老兵，不是英雄。你只是一头该被关起来的野兽。' }],
    '贪婪': [{ crime: '你是巴黎某银行的出纳员。二十年间，你每天坐在同一个窗口后面，经手数以百万计的资金——但没有一分钱属于你。你可以摸到它们、数它们、闻它们——但你不能拥有它们。这种折磨持续了三年后，你找到了系统的漏洞。一开始只是小数点后的零头，然后是几十、几百、几千。二十年后，你已经转移了足够让数千名储户养老金蒸发的巨款。当那些老人因为失去毕生积蓄而自杀的消息传来时，你正在摩纳哥的赌场挥霍。最终，一位受害者的儿子找到了你。他在酒店阳台上对你说了三句话，然后扣动了扳机。', flavor: '海风把钞票吹散的那一刻，你还在笑。直到子弹穿过胸口，你才想起那些储户的名字——他们的脸你从未看过，但他们的钱，你每一分都记得。你最后看到的东西，是漫天飞舞的纸币，像一场你永远无法兑现的梦。' },{ crime: '你是医疗公司的销售代表。你的任务很简单——把过期疫苗和假药卖到贫困地区。你觉得这不是什么大不了的事。反正那些地方的人本来就活不长。你用赚来的钱在市中心买了三套房，开上了跑车。无数孩子因为你的"药品"落下终身残疾，但你没有看过任何一张照片——你刻意不去看。直到一个受害者的父亲跟踪了你六个月。他研究你的作息、你的路线、你车库里那个监控死角。那天晚上你加班到很晚，车库里很暗。你听到身后有脚步声——然后什么都不知道了。', flavor: '铁管砸下来之前，你还在算这个月的佣金有多少。最后一个念头不是悔恨、不是恐惧——而是"我还没收完那笔账"。你到死都在算。' }],
    '嫉妒': [{ crime: '你嫉妒挚友的成功——他比你晚入行五年，却先你一步升职。他的晋升晚宴上，所有人都举杯为他庆祝。你也在笑。你举着酒杯走到他面前，说了一大段感人至深的祝酒词。所有人都被你感动了——包括他在内。他一口喝完了那杯酒。但你的酒杯，自始至终没有碰过嘴唇。你下错了杯子。挚友的妻子——坐在他旁边，怀着他们的第一个孩子——拿错了他的酒杯。她喝下了你准备的毒酒，当场倒地。你在混乱中逃出了宴会厅，在火车站跳上了一辆不知开往何方的列车。铁轨的震动比你想象中更冰冷——然后一切归于黑暗。', flavor: '你记得那晚香槟气泡在玻璃杯中破裂的声音，记得她倒下时瓷器碎裂的声响，记得挚友跪在她身边时发出的那声嘶吼。你不记得自己是怎么跑到火车站的。你只记得铁轨的震动——比所有你嫉妒过的东西都要真实。' },{ crime: '你是一名二流画家。你知道自己是二流的——这才是最痛苦的地方。如果你不知道，你可以活在无知中；如果你是一流的，你可以活在天才中。但你卡在中间，清清楚楚地知道自己不够好。而你最好的朋友——那个和你一起学画的、你一直觉得不如你的人——成为了举世闻名的艺术家。你去参加他的画展，对着镜头说"我为他感到骄傲"。然后你在深夜潜入他的工作室，毁掉了他即将展出的全部作品。放火时，你被困在了自己点的火里。', flavor: '火焰吞噬画布时，你看着那些比你优秀的作品化为灰烬——你笑了。然后一根房梁砸了下来。在生命的最后一秒，你忽然想到：这些画被烧了，他还会画新的。而你永远不会再画了。' }],
    '暴食': [{ crime: '你是食品公司质检主管。你的工作很简单——确保进入市场的每一批原料都符合安全标准。但你发现了一个更简单的赚钱方式：只要在报告上改几个数字，就有供应商愿意付你一大笔钱。你经手的过期肉制品、变质奶源、污染蔬菜，进入了无数超市和餐厅。大规模食物中毒事件发生时，你正在家里享用一顿六道菜的晚餐。电视新闻里播放着遇难者家属的采访——二十三人死亡，其中包括七个孩子。你换了一个台。入狱前夜，你没有收拾行李，没有写遗书。你只是坐在餐桌前，把冰箱里所有的食物都吃完了。然后你的身体终于承受不住了。', flavor: '你倒在餐桌前，嘴里还塞着半块奶油蛋糕。讽刺的是——你放行的腐肉让二十三人死去，而你，是被"过量"杀死的。只不过用的是奶油和糖霜。这大概是你一生中最诚实的死法。' },{ crime: '你是美食评论家，以刻薄著称。你的一支笔可以成就一家餐厅，也可以毁掉它。你享受这种权力。当一家三代经营的老餐馆被你的一篇恶意差评彻底摧毁时——老板在店铺倒闭后饮弹自尽——你毫不在意，继续吃遍全城。你觉得自己的味蕾是这个行业最高的裁判。直到有一天深夜，你在餐厅后巷被一个蒙面人拦住。他手里拿着的不是刀——是一把切肉刀。一刀，又一刀。那把刀刺入的位置，正是你用来品尝美食的胃。', flavor: '你一生都在用这个胃评判别人——最后它也被别人评判了。你倒在湿漉漉的后巷地面上，闻到的不是食物的香气，而是垃圾桶的味道。这是你这辈子品鉴过的最后一道"菜"。' }],
    '色欲': [{ crime: '你以美色为诱饵，专门接近富裕的老人并与其结婚。你的套路很简单——温柔、体贴、让他们在晚年感受到从未有过的激情。然后，在继承遗产的时机成熟时，给他们注射过量的胰岛素。制造"自然死亡"。你成功了三次。第四次时，那位丈夫的儿子——一个沉默寡言的中年男人——发现了端倪。他在一次争执中将你推下了楼梯。那楼梯比你想象中更长。你数了每一级台阶——十八级，正好是你第一次结婚时的年龄。', flavor: '坠落时，你看到了楼梯墙上挂着的照片——那是你第四任丈夫的全家福。照片里他的妻子还活着，他的孩子还在笑。你忽然想到：如果没有你，这张照片也许永远不会被取下来。血在地板上晕开，像你最喜欢的那条红裙。' },{ crime: '你是地下色情产业的幕后老板。你毁掉了无数年轻人的人生，把他们当作可以随意买卖的商品。你觉得这没什么——需求决定供给，你只是满足市场。你的办公室里挂着一幅字：生意就是生意。直到你最信任的助手把你出卖给了竞争对手。子弹射进胸口时，你听到助手在你耳边轻声说：这也是生意。你一直教我的，不是吗？', flavor: '你教会了他一切——如何谈判、如何压价、如何在交易中永远占据上风。你唯一没有教他的，是什么时候该收手。因为你自己也不知道。' }],
    '懒惰': [{ crime: '你是桥梁工程的安全监理。你的工作很重要——确保每一座桥梁在通车前都经过了严格的安全检查。但你从不认真做这件事。你只是坐在办公室里，在报告上签字。你懒得去现场，懒得检查数据，懒得打任何一个电话。你经手的最后一座桥，通车第三年坍塌了。四十五人丧生。事故调查组发现你的报告全是伪造的。事发后你躲在家中，拉上所有窗帘，拒绝接任何电话。你假装什么都没发生——就像你对待每一份安全报告那样。警方破门时，你的心脏已经停止了跳动。', flavor: '桥塌的时候你在看电视。电视里播着肥皂剧，窗外传来巨响。你关掉了声音，假装什么都没发生——就像你对待每一份安全报告那样。但大地不会假装。它替你记住了每一个坠落的人。' },{ crime: '你是一家福利院的院长。你从不虐待儿童——你只是懒。懒得检查食物质量，所以孩子们吃了发霉的面包。懒得维修暖气，所以冬天时孩子们裹着薄毯挤在一起取暖。懒得回应任何一个孩子的求助——你觉得他们只是闹脾气。那年冬天特别冷。三个孩子在睡梦中停止了呼吸——不是冻死的，是肺炎。调查时你说：我以为暖气修好了。实际上你从未拨过维修电话。你只是懒得拨。', flavor: '法庭宣判那天你还在打哈欠。直到狱警把囚服扔到你面前，你才意识到：这次你真的懒得逃了。囚服的布料很粗糙，但你懒得抱怨。你连抱怨都懒。' }]
};

// ==================== 罪孽选择函数 ====================
function sceneSinSelect() {
    st('<div class="scene-title">选 择 罪 孽</div><p>在坠入地狱之前，你曾是人间的一个灵魂。你的名字是<span class="highlight">' + player.name + '</span>。</p><p>每一个罪人坠入地狱，都不是偶然。在傲慢之环——地狱的中心——每一个灵魂都要面对自己生前所犯罪孽的审判。你的罪孽将决定你灵魂的属性，也将决定路西法对你的第一印象。</p><p>七宗罪——<span class="gold-text">傲慢、暴怒、嫉妒、贪婪、暴食、色欲、懒惰</span>——每一种罪孽都是一条将你拖入深渊的锁链。现在，面对你的罪孽。选择一条锁链，然后看看它在你生前是如何缠绕你的。</p><p style="color:#9a6a6a;font-size:0.82em;">选择罪孽后，系统将随机生成一段生前背景故事。属性修正将影响你的初始数值。</p>');
    cb();
    var sins = [{ name: '傲慢', desc: '魔力+2 · 魅力+1 · 理智-1' },{ name: '暴怒', desc: '力量+3 · 理智-2' },{ name: '嫉妒', desc: '敏捷+2 · 魔力+1' },{ name: '贪婪', desc: '魅力+2 · 魔力+1' },{ name: '暴食', desc: '力量+1 · 敏捷-1 · 理智-1' },{ name: '色欲', desc: '魅力+3 · 力量-1' },{ name: '懒惰', desc: '理智+2 · 敏捷-2' }];
    for (var i = 0; i < sins.length; i++) {
        (function(s) {
            ab(s.name + '（' + s.desc + '）', function() {
                player.sin = s.name;
                player.birthRing = s.name + '之环';
                var stories = sinBackstories[s.name];
                if (!stories || stories.length === 0) { st('<p class="highlight">背景故事缺失，请刷新重试。</p>'); cb(); return; }

                var reroll = function() {
                    var newStory = stories[Math.floor(Math.random() * stories.length)];
                    player.flags.crimeStory = newStory.crime;
                    player.flags.crimeFlavor = newStory.flavor;
                    st('<div class="scene-title">' + s.name + '——生 前 之 罪</div><div class="divider">◆ ◆ ◆</div><p><span class="highlight">' + player.name + '</span>——这就是将你推入地狱的罪行。</p><p style="margin-top:10px;line-height:1.9;">' + newStory.crime + '</p><div class="divider">◆ ◆ ◆</div><p style="color:#c09080;font-style:italic;">"' + newStory.flavor + '"</p><div class="divider">◆ ◆ ◆</div><p>属性修正：<span class="highlight">' + s.desc + '</span></p><p style="color:#9a6a6a;font-size:0.82em;">一切罪孽的根源都是傲慢——你将首先坠入傲慢之环，接受路西法的审判。</p>');
                    cb();
                    ab('🎲 接受此背景，掷出命运之骰', function() { sceneDiceSinner(); }, 'primary-btn');
                    ab('🔄 再换一个', reroll);
                };

                var chosenStory = stories[Math.floor(Math.random() * stories.length)];
                player.flags.crimeStory = chosenStory.crime;
                player.flags.crimeFlavor = chosenStory.flavor;
                ua();
                st('<div class="scene-title">' + s.name + '——生 前 之 罪</div><div class="divider">◆ ◆ ◆</div><p><span class="highlight">' + player.name + '</span>——这就是将你推入地狱的罪行。</p><p style="margin-top:10px;line-height:1.9;">' + chosenStory.crime + '</p><div class="divider">◆ ◆ ◆</div><p style="color:#c09080;font-style:italic;">"' + chosenStory.flavor + '"</p><div class="divider">◆ ◆ ◆</div><p>属性修正：<span class="highlight">' + s.desc + '</span></p><p style="color:#9a6a6a;font-size:0.82em;">一切罪孽的根源都是傲慢——你将首先坠入傲慢之环，接受路西法的审判。</p>');
                cb();
                ab('🎲 接受此背景，掷出命运之骰', function() { sceneDiceSinner(); }, 'primary-btn');
                ab('🔄 再换一个', reroll);
            });
        })(sins[i]);
    }
}

function sceneDiceSinner() { player.strength = roll(); player.agility = roll(); player.magic = roll(); player.charisma = roll(); player.sanity = Math.max(1, roll() - 3); switch (player.sin) { case '暴怒': player.strength += 3; player.sanity -= 2; break; case '贪婪': player.charisma += 2; player.magic += 1; break; case '嫉妒': player.agility += 2; player.magic += 1; break; case '色欲': player.charisma += 3; player.strength -= 1; break; case '傲慢': player.magic += 2; player.charisma += 1; player.sanity -= 1; break; case '暴食': player.strength += 1; player.agility -= 1; player.sanity -= 1; break; case '懒惰': player.sanity += 2; player.agility -= 2; break; } setSinTraits(); ua(); st('<div class="scene-title">命 运 之 骰</div><div class="divider">🎲 🎲 🎲</div><p><span class="highlight">' + player.name + '</span> | 罪人 | <span class="gold-text">' + player.sin + '</span></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:12px 0;padding:14px;background:#14040a;border-radius:6px;border:1px solid #2a0a14;"><span>💪 力量：<span class="highlight">' + player.strength + '</span></span><span>🏃 敏捷：<span class="highlight">' + player.agility + '</span></span><span>✨ 魔力：<span class="highlight">' + player.magic + '</span></span><span>💋 魅力：<span class="highlight">' + player.charisma + '</span></span><span>🧠 理智：<span class="highlight">' + player.sanity + '</span></span></div>'); cb(); ab('⚡ 坠入傲慢之环……', function() { sceneSinnerAwaken(); }, 'primary-btn'); }

function setSinTraits() {
    if (player.sin === '暴食' || player.birthRing === '暴食之环') {
        player.sinTrait = '暴食';
    } else if (player.sin === '懒惰' || player.birthRing === '懒惰之环') {
        player.sinTrait = '懒惰';
    } else if (player.sin === '色欲' || player.birthRing === '色欲之环') {
        player.sinTrait = '色欲';
    }
}

function sceneSinnerAwaken() { player.hp = player.maxHp; player.currentRing = '傲慢之环'; ua(); st('<div class="scene-title">傲 慢 之 环</div><p>意识像一根被拉出水面的绳索，缓慢而痛苦地凝聚。然后——你睁开了眼。</p><p>头顶不是天空。是<span class="highlight">水晶</span>。暗紫色的水晶穹顶覆盖着整个视野，望不到边际。从中透出的光不来自任何星辰，不来自任何太阳——那光是傲慢本身发出的冷光，将一切照得清晰而残酷。你从不知道光也可以如此冰冷。你躺在黑色的石板上，石板表面刻满了你看不懂的古老符文——那是审判的文字，在你接触它的瞬间便印入了你的意识。</p><p>周围是和你一样刚坠入地狱的灵魂。有的蜷缩着无声哭泣，有的疯狂咒骂着这片黑暗，有的已经吓得说不出话，只是呆呆地望着头顶的水晶穹顶。空气中弥漫着一种难以形容的压迫感——不是重量，是<span class="highlight">目光</span>。仿佛有什么不可名状的存在正从上方俯视着这一切。</p><p>远处，一座水晶宫殿悬浮在半空。它不依附于任何支撑，只是静静地漂浮在暗紫色的光晕中。塔尖刺入更深层的黑暗。你知道那座宫殿属于谁。地狱中的每一个存在都知道。</p><p>一阵脚步声接近。一个穿着暗色长袍的低阶恶魔走到你面前。他的面孔模糊不清，仿佛五官只是临时拼凑的。他用不带任何感情的声音说：</p><p><em>新到的罪人。君主今日亲自审判。起来。去审判厅。</em></p>'); cb(); ab('挣扎着站起来，跟随恶魔前往审判厅', function() { sceneSinnerHall(); }); }

function sceneSinnerHall() { st('<div class="scene-title">审 判 厅</div><p>审判厅比你想象中更大。大到你无法看到尽头。暗紫色的光从穹顶的棱镜中折射下来，将整个空间切割成无数明暗交错的碎片。厅堂两侧矗立着巨大的水晶柱，每根柱子都有数十米高——但让你脊背发凉的，不是柱子的宏伟，而是柱中封存的东西。</p><p><span class="highlight">罪人的遗骸。</span>不知多少年前的灵魂，保持着坠入地狱时的姿态，被永远凝固在水晶之中。他们的表情清晰可见——有的惊恐，有的愤怒，有的在最后一刻终于流露出了悔恨。他们已成为这座厅堂的装饰，成为对每一位新到者的无声警告。</p><p>你被推搡着站到了厅堂中央。周围是数十个和你一样的新到者，挤在一起，像待宰的牲畜。哭泣声渐渐停止了——因为所有人都感觉到了——空气变了。不是变冷。是变得<span class="highlight">稀薄</span>。然后你听到了脚步声。每一下都像踩在所有人的心脏上。</p><p>银白色的长发，赤金色的眼眸，暗紫金边的长袍——<span class="highlight">路西法</span>降临在审判席上。他没有看任何人。他的目光越过所有新到的罪人，仿佛他们只是一片不值得聚焦的模糊背景。</p>'); cb(); ab('屏住呼吸，等待审判', function() { var verdictText = ''; switch (player.sin) { case '傲慢': verdictText = '他的目光在你身上多停了半秒——在那双赤金色的眼眸中，你捕捉到了一丝几乎不可察觉的玩味。<em>傲慢——</em>他微微侧头，银白长发从肩上滑落，<em>倒是与吾同源。但你配不上这份罪孽。你犯下的傲慢如此渺小，连给吾提鞋都不配。不过——至少你选择了最高贵的罪。</em>'; break; case '暴怒': verdictText = '他的目光扫过你，嘴角微微下撇——那表情介于轻蔑和厌烦之间。<em>暴怒——野蛮人的罪孽。</em>他连评价都懒得多说一个字。在他眼中，你的愤怒不过是一只野兽在笼中的咆哮——吵闹，但毫无意义。'; break; case '贪婪': verdictText = '他看了你一眼——那眼神中闪过一丝毫不掩饰的鄙夷。<em>贪婪——为铜臭折腰的灵魂。</em>他的语气里没有愤怒，只有一种居高临下的嫌恶，<em>连罪孽都犯得如此庸俗。你追逐了一辈子的东西，在吾眼中不过是脚下的尘埃。</em>'; break; case '嫉妒': verdictText = '他甚至没有正眼看你。<em>嫉妒——最卑微的罪孽。</em>他的声音里带着一种独特的蔑视——那种蔑视不是针对你的罪行，而是针对你选择了如此低劣的罪，<em>连罪都不配光明正大地犯。永远活在别人的阴影里，连自己站出来的勇气都没有。</em>'; break; case '暴食': verdictText = '他的目光冷冷掠过你，像掠过一块不值得停留的残渣。<em>暴食——把灵魂浪费在填饱肚子上。</em>他轻轻摇了摇头，<em>真是可悲。你一生的追求，不过是满足一个永远填不满的胃。连罪都犯得如此没有野心。</em>'; break; case '色欲': verdictText = '他轻哼了一声——那声音里混合着厌倦和轻微的不耐烦。<em>色欲——被欲望驱使的动物。</em>他的手指在王座扶手上轻轻敲了一下，<em>连自制都做不到，也配称罪人？你不过是欲望的奴隶，而奴隶——在任何地方都是最底层的存在。</em>'; break; case '懒惰': verdictText = '他几乎懒得开口。沉默了许久，才吐出几个字：<em>懒惰——连罪都犯得如此敷衍。</em>他挥了挥手，仿佛连审判你都是一种浪费，<em>你甚至不配被审判。你的存在本身，就是对地狱效率的侮辱。</em>'; break; } st('<div class="scene-title">审 判</div><p>路西法的目光终于扫过你——当那双赤金色的眼眸与你短暂接触时，你感到一阵前所未有的<span class="highlight">自惭形秽</span>。仿佛你的一生、你的罪孽、你自认为刻骨铭心的痛苦——在他眼中都轻如尘埃。</p><p>' + verdictText + '</p><p>他轻轻挥了挥手，语气恢复了平淡：<em>罪孽浅薄。平庸至极。按惯例，依罪孽送往对应环层。至于这些连罪孽都犯得如此平庸的——暂留傲慢环底层。若有价值，自有去处。若无价值——</em></p><p>他没有说完。他不需要说完。那个未完成的句子像一把悬在半空的刀，让每一个人都清楚地意识到：在这里，你的存在本身，不过是一种<span class="highlight">暂缓</span>。</p>'); player.flags.judged = true; cb(); ab('低头承受审判结果', function() { sceneSinnerAfter(); }); }); ab('直视路西法', function() { player.sanity -= 1; player.flags.daredToLook = true; ua(); var dareText = ''; switch (player.sin) { case '傲慢': dareText = '在所有低垂的头颅中，你抬起了头。路西法的嘴角微微上扬——那不是赞赏，而是看到一只蚂蚁试图模仿飞鸟时的嘲弄。他微微偏头，银白长发从肩上滑落。<em>有趣。</em>他说这两个字时，眼中终于映出了你的倒影——但那倒影如此渺小，<em>你至少还有抬头的勇气。但这不能改变你的平庸。傲慢——是需要实力来支撑的。而你没有。</em>'; break; case '暴怒': dareText = '你抬起头。路西法甚至没有回应你的目光——他的无视本身就是最锋利的回应。他沉默了很久，久到你的脖子开始酸痛。然后他才开口：<em>你以为愤怒能让你与众不同？每一个暴怒的灵魂在审判时都会抬头。你们都一样——除了蛮力一无所有。</em>'; break; case '贪婪': dareText = '你抬起头。路西法终于正眼看了你——但只是短短一瞬。随即移开，仿佛你的存在污染了他的视线。<em>连审判都要讨价还价？</em>他语气里的嫌恶加深了，<em>你以为直视吾能让你获得更好的待遇？贪婪——真是从头到脚都写着廉价。</em>'; break; case '嫉妒': dareText = '你抬起头。路西法的目光掠过你，像掠过一片不值得停留的阴影。<em>你在看吾？还是你在想——凭什么坐在上面的是他而不是你？</em>他替你回答了：<em>因为你永远只敢在下面看。嫉妒者最大的可悲，是永远不敢伸手去拿自己想要的东西。</em>'; break; case '暴食': dareText = '你抬起头。路西法微微偏头——那姿态不像在看你，更像在确认一件物品是否值得被踢开。<em>你的胃填不满，你的胆量倒是不小。</em>他的语气中带着一丝意外的玩味，<em>但饥饿带来的勇气，和饥饿本身一样——不过是本能。</em>'; break; case '色欲': dareText = '你抬起头。路西法面无表情，你的直视在他眼中和一只飞虫掠过面前没有区别。<em>你在试图诱惑谁？</em>他的声音冷淡至极，<em>吾见过最美的天使坠落，也见过最丑陋的欲望膨胀。你的这点小把戏，连让吾多看一眼的资格都没有。</em>'; break; case '懒惰': dareText = '你抬起头。路西法甚至懒得回应你的目光。他挥了挥手——那动作随意得像在赶走一阵无关紧要的风。<em>连抬头都抬得这么敷衍。</em>他的语气中没有愤怒，只有一种深深的疲惫，<em>退下吧。你连被审判的价值都没有。</em>'; break; } st('<p>你不知从哪来的勇气——或许是愚蠢，或许是残存的尊严——在所有头颅都低垂的时刻，你抬起了头。你直视了那双赤金色的眼眸。仅仅一瞬。但那一瞬间漫长得像一个世纪。</p><p>你没有感到愤怒。没有感到惩罚。你只感到一种<span class="highlight">彻底的无视</span>——比蔑视更令人窒息的，是他甚至懒得对你施加蔑视。一个人类抬头看天，天不会感到被冒犯。一只蚂蚁举起前肢，踩死它的人不会觉得那是挑衅。</p><p>' + dareText + '</p>'); cb(); ab('……', function() { sceneSinnerAfter(); }); }, 'danger-btn'); }

function sceneSinnerAfter() { st('<div class="scene-title">灰 烬 区</div><p>审判结束了。路西法的身影从审判席上消失，仿佛从未存在过。只有空气中残留的星尘粒子提醒你，刚才的一切都是真实的——那位傲慢君主真的曾经坐在那张座椅上，用最漫不经心的语气决定了所有新到者的命运。</p><p>你和其他被判定为"平庸"的存在一起，被带到了傲慢环的底层区域。这里被称为<span class="highlight">灰烬区</span>——罪人、低阶恶魔、以及各种不入流的存在混杂的地方。水晶宫殿的光芒到这里已经变得稀薄，暗紫色的辉煌被灰色的平庸取代。街道狭窄而肮脏，两旁是歪歪扭扭的建筑。</p><p>但至少——你还存在。一个路过的低阶恶魔告诉你，被判定为罪孽平庸的存在可以在七环中自行选择居所。这是傲慢之主的"仁慈"——在他看来，安排你们这些平庸者的去向根本不值得他亲自费神。</p><p>你抬起头，望向灰烬区昏暗的天际线。远处，通往其他环层的通道隐约可见。你的地狱之旅——真正属于你自己的旅程——从现在开始。</p>'); cb(); ab('🗺️ 选择定居环', function() { sceneChooseResidence(); }); ab('🔍 在灰烬区探索', function() { sceneExploreDistrict('傲慢之环', 'poor'); }); }

function sceneDemonBirthRing() { st('<div class="scene-title">诞 生 之 环</div><p><span class="highlight">' + player.name + '</span>——你是地狱的造物。选择你的<span class="gold-text">诞生环</span>，每个环都有独特的诞生场景和君主。</p>'); cb(); var rings = ['傲慢之环', '贪婪之环', '暴怒之环', '色欲之环', '嫉妒之环', '暴食之环', '懒惰之环']; var sinMap = { '傲慢之环': '傲慢', '贪婪之环': '贪婪', '暴怒之环': '暴怒', '色欲之环': '色欲', '嫉妒之环': '嫉妒', '暴食之环': '暴食', '懒惰之环': '懒惰' }; var attrMap = { '傲慢': '魔力+2·魅力+1·理智-1', '暴怒': '力量+3·理智-2', '嫉妒': '敏捷+2·魔力+1', '贪婪': '魅力+2·魔力+1', '暴食': '力量+1·敏捷-1·理智-1', '色欲': '魅力+3·力量-1', '懒惰': '理智+2·敏捷-2' }; for (var i = 0; i < rings.length; i++) { (function(r) { var s = sinMap[r]; var cls = ''; if (r === '贪婪之环') cls = 'gold-btn'; if (r === '暴怒之环') cls = 'danger-btn'; ab(r + '（' + attrMap[s] + '）', function() { player.birthRing = r; player.sin = s; player.currentRing = r; ua(); st('<div class="scene-title">' + r + '</div><p>属性修正：<span class="highlight">' + attrMap[s] + '</span></p><p>君主：<span class="gold-text">' + L[s].name + '</span></p>'); cb(); ab('🎲 掷出命运之骰', function() { sceneDiceDemon(); }, 'primary-btn'); }, cls); })(rings[i]); } }

function sceneDiceDemon() { player.strength = roll(); player.agility = roll(); player.magic = roll(); player.charisma = roll(); player.sanity = roll() + 3; var bs = ['strength', 'agility', 'magic', 'charisma']; var bst = bs[Math.floor(Math.random() * 4)]; var bn = { strength: '力量', agility: '敏捷', magic: '魔力', charisma: '魅力' }; player[bst] += 3; switch (player.sin) { case '暴怒': player.strength += 3; player.sanity -= 2; break; case '贪婪': player.charisma += 2; player.magic += 1; break; case '嫉妒': player.agility += 2; player.magic += 1; break; case '色欲': player.charisma += 3; player.strength -= 1; break; case '傲慢': player.magic += 2; player.charisma += 1; player.sanity -= 1; break; case '暴食': player.strength += 1; player.agility -= 1; player.sanity -= 1; break; case '懒惰': player.sanity += 2; player.agility -= 2; break; } setSinTraits(); ua(); st('<div class="scene-title">命 运 之 骰</div><div class="divider">🎲 🎲 🎲</div><p><span class="highlight">' + player.name + '</span> | 原生恶魔 | ' + player.sin + '</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:12px 0;padding:14px;background:#14040a;border-radius:6px;border:1px solid #2a0a14;"><span>💪 力量：<span class="highlight">' + player.strength + '</span></span><span>🏃 敏捷：<span class="highlight">' + player.agility + '</span></span><span>✨ 魔力：<span class="highlight">' + player.magic + '</span></span><span>💋 魅力：<span class="highlight">' + player.charisma + '</span></span><span>🧠 理智：<span class="highlight">' + player.sanity + '</span></span></div><p>混沌能量额外强化了<span class="highlight">' + bn[bst] + '</span>（+3）。</p>'); cb(); ab('⚡ 在' + player.birthRing + '中苏醒……', function() { sceneDemonAwaken(); }, 'primary-btn'); }

function sceneDemonAwaken() { player.hp = player.maxHp; player.currentRing = player.birthRing; ua(); var ld = L[player.sin]; st('<div class="scene-title">诞 生</div><p>' + ld.birthScene + '</p><p style="margin-top:10px;">你诞生于<span class="highlight">' + player.birthRing + '</span>。你的君主——<span class="highlight">' + ld.name + '</span>——正在等你。</p>'); cb(); ab('前往觐见' + ld.name, function() { sceneDemonAudience(); }, 'primary-btn'); }

function sceneDemonAudience() { var ld = L[player.sin]; st('<div class="scene-title">觐 见 君 主</div><p>' + ld.audience.replace(/\n/g, '<br>') + '</p>'); player.flags.audiencedLord = true; player.relationships[ld.name] = { love: 5, desire: 0, anger: 0, opinion: '一个刚诞生的原生恶魔。' }; player.residenceRing = player.birthRing; if (player.sin === '贪婪') { player.gold += 1; st(tc.innerHTML + '<p style="margin-top:10px;"><span class="gold-text">获得玛门的投资：1金币。</span></p>'); } cb(); ab('选择居所', function() { sceneDemonChooseDistrict(); }, 'primary-btn'); }

function sceneDemonChooseDistrict() { var ring = player.birthRing; var d = RD[ring]; st('<div class="scene-title">选 择 居 所</div><p><span class="highlight">' + d.poor.name + '</span>——' + d.poor.desc + '</p><p><span class="gold-text">' + d.middle.name + '</span>——' + d.middle.desc + '</p><p><span style="color:#ff6080;">' + d.rich.name + '</span>——' + d.rich.desc + '</p>'); cb(); ab('在' + d.poor.name + '落脚（免费）', function() { player.currentDistrict = d.poor.name; ua(); sceneExploreDistrict(ring, 'poor'); }); ab('在' + d.middle.name + '落脚（需要10金币）', function() { if (player.gold >= 10) { player.gold -= 10; player.currentDistrict = d.middle.name; ua(); sceneExploreDistrict(ring, 'middle'); } else { st('<p class="highlight">金币不足。需要10金币。</p>'); cb(); ab('去贫民区免费落脚', function() { player.currentDistrict = d.poor.name; ua(); sceneExploreDistrict(ring, 'poor'); }); } }, 'gold-btn'); ab('尝试进入' + d.rich.name, function() { st('<p class="highlight">贵族区需要君主许可。</p><p>' + d.rich.desc + '</p><p>守卫拦住了你。</p>'); cb(); ab('返回', function() { sceneDemonChooseDistrict(); }); }, 'danger-btn'); }

function sceneExploreDistrict(ring, level) {
    if (level === 'middle') { renderMiddleRing(ring); return; }
    var d = RD[ring][level];
    player.currentRing = ring;
    player.currentDistrict = d.name;
    if (!player.residenceRing) player.residenceRing = ring;
    addTime(5);
    ua();
    var fl = '';
    for (var i = 0; i < d.features.length; i++) { fl += '<p>—— ' + d.features[i] + '</p>'; }
    var bmStatus = isBlackMarketOpen() ? '<p style="color:#ff6080;font-weight:bold;">🌙 黑市已开放！</p>' : '';
    st('<div class="scene-title">' + d.name + '</div><p>' + d.desc + '</p>' + bmStatus + '<div class="divider">◆ ◆ ◆</div><p><span class="gold-text">可探索地点：</span></p>' + fl);
    cb();
    if (level === 'poor' && d.featureScenes) {
        var keys = Object.keys(d.featureScenes);
        for (var i = 0; i < keys.length; i++) {
            (function(key) {
                var label = '📍 ' + key;
                if (key === '破旧酒馆') label = '🍺 走进破旧酒馆';
                else if (key === '诚信典当行') label = '💰 走进诚信典当行';
                else if (key === '碎骨铁匠铺') label = '⚔️ 走进碎骨铁匠铺';
                else if (key === '暗红之门') label = '💋 走进暗红之门';
                else if (key === '栈桥下的阴影') label = '👁️ 走向栈桥下的身影';
                else if (key === '铁锅旁的棚子') label = '🍖 走向铁锅旁的棚子';
                else if (key === '灰雾中的躺椅') label = '💤 走向灰雾中的躺椅';
                else if (key === '低阶市场') label = '🛒 逛低阶市场';
                else if (key === '流浪者聚集地') label = '🏕️ 走进流浪者聚集地';
                else if (key === '暗巷角落') label = '🌑 探索暗巷角落';
                else if (key === '失宠者收容所') label = '🏚️ 走进失宠者收容所';
                else if (key === '拾荒者营地') label = '🗑️ 探索拾荒者营地';
                ab(label, function() {
                    var scene = d.featureScenes[key];
                    if (typeof scene === 'function') { scene(ring, level); }
                    else { st('<div class="scene-title">' + key + '</div><p>' + scene + '</p>'); addTime(5); cb(); ab('返回（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(ring, level); }); }
                });
            })(keys[i]);
        }
    }
    ab('👗 服装店', function() { enterShop('cloth'); });
    ab('🍽️ 食品店', function() { enterShop('food'); });
    ab('📦 道具店', function() { enterShop('item'); });
    ab('🌙 黑市（22:00-02:00）', function() { enterBlackMarket(); });
    ab('🔨 寻找工作（耗时30分钟）', function() { addTime(30); findJob(); });
    ab('😴 睡觉（选择住处）', function() { chooseSleepPlace(); });
    if (ring === '傲慢之环' && level === 'poor' && !player.hasClock) { ab('🕐 购买时钟（10金币）', function() { buyClock(); }); }
    // 随机任务生成
    if (Math.random() < 0.2 && player.activeTasks.length < 3) {
        ab('📋 接取随机任务', function() {
            var task = generateTask();
            st('<div class="scene-title">📋 新任务</div><p><span class="gold-text">' + task.title + '</span></p><p>' + task.desc + '</p><p style="color:#e85060;">截止：第' + task.deadline + '天</p><p style="color:#e8c060;">奖励：' + task.rewardGold + '金币，' + task.rewardExp + '经验</p>');
            cb();
            ab('接受任务', function() { acceptTask(task); });
            ab('拒绝', function() { sceneExploreDistrict(ring, level); });
        });
    }
    if (level === 'poor' && RD[ring].middle) { ab('🚶 前往' + RD[ring].middle.name + '（需要10金币，耗时20分钟）', function() { if (player.gold >= 10) { player.gold -= 10; addTime(20); ua(); sceneExploreDistrict(ring, 'middle'); } else { st('<p class="highlight">金币不足。需要10金币。</p>'); cb(); ab('返回', function() { sceneExploreDistrict(ring, 'poor'); }); } }, 'gold-btn'); }
    ab('🗺️ 前往其他环层', function() { sceneChooseResidence(); });
    ab('📋 打开属性面板', function() { toggleSidebar(); });
}

function chooseSleepPlace() {
    var ring = player.currentRing || '傲慢之环';
    var level = 'poor';
    var d = RD[ring];
    if (player.currentDistrict) {
        if (d.rich && player.currentDistrict === d.rich.name) level = 'rich';
        else if (d.middle && player.currentDistrict === d.middle.name) level = 'middle';
    }
    var places = getSleepPlaces(ring, level);
    if (places.length === 0) {
        st('<p>当前区域没有可用的住宿地点。</p>');
        cb();
        ab('返回', function() { sceneExploreDistrict(ring, 'poor'); });
        return;
    }
    var html = '<div class="scene-title">◆ 休 息 ◆</div>';
    html += '<p>当前所在：<span style="color:#e8c060;">' + (player.currentDistrict || ring) + '</span></p>';
    html += '<p>当前疲劳：' + Math.floor(player.fatigue) + '/' + player.maxFatigue + '</p>';
    html += '<div style="background:#180610;border:1px solid #2a0a16;border-radius:6px;padding:10px;margin:8px 0;">';
    html += '<p style="color:#8a5a62;font-size:0.78em;margin-bottom:6px;">🛏️ 可用住处（仅限当前区域）：</p>';
    for (var i = 0; i < places.length; i++) {
        var p = places[i];
        html += '<p>· ' + p.name + '</p>';
        html += '<p style="color:#6a4a4a;font-size:0.78em;padding-left:12px;">' + p.desc + '</p>';
    }
    html += '</div>';
    html += '<p style="color:#8a5a62;font-size:0.78em;margin-top:8px;">选择住处：</p>';
    st(html);
    cb();
    for (var i = 0; i < places.length; i++) {
        (function(p) {
            ab(p.name, function() {
                if (player.gold < p.cost) {
                    st('<p class="highlight">⚠️ 金币不足。需要 ' + p.cost + ' 金币，你只有 ' + player.gold + ' 金币。</p>');
                    cb();
                    ab('返回', function() { chooseSleepPlace(); });
                    return;
                }
                player.gold -= p.cost;
                if (player.hasClock) {
                    var currentHour = Math.floor(player.gameTime / 60) % 24;
                    showSleepClock(p, currentHour);
                } else {
                    var baseHours = 4 + (player.fatigue / 100) * 6;
                    baseHours = Math.round(baseHours * 10) / 10;
                    doSleep(p, baseHours);
                }
            });
        })(places[i]);
    }
    ab('取消', function() { sceneExploreDistrict(ring, 'poor'); });
}

function showSleepClock(place, currentHour) {
    var html = '<div class="scene-title">◆ 设置起床时间 ◆</div>';
    html += '<p>当前时间：<span style="color:#8ab4d4;">' + getTimeString() + '</span></p>';
    html += '<p>选择住处：' + place.name + '</p>';
    html += '<div style="background:#180610;border:1px solid #2a0a16;border-radius:6px;padding:10px;margin:8px 0;">';
    html += '<p style="color:#8a5a62;font-size:0.78em;">⏰ 选择睡眠时长：</p>';
    var options = [4, 6, 8, 10];
    for (var i = 0; i < options.length; i++) {
        var h = options[i];
        var wakeHour = (currentHour + h) % 24;
        var wakeStr = (wakeHour < 10 ? '0' : '') + wakeHour + ':00';
        html += '<p>· <span class="clickable" onclick="doSleepWithHours(' + h + ',\'' + place.name.replace(/'/g, "\\'") + '\')">睡 ' + h + ' 小时 → ' + wakeStr + ' 起床</span></p>';
    }
    html += '</div>';
    st(html);
    cb();
    ab('取消', function() { chooseSleepPlace(); });
}

function doSleepWithHours(hours, placeName) {
    var ring = player.currentRing || '傲慢之环';
    var level = 'poor';
    var d = RD[ring];
    if (player.currentDistrict) {
        if (d.rich && player.currentDistrict === d.rich.name) level = 'rich';
        else if (d.middle && player.currentDistrict === d.middle.name) level = 'middle';
    }
    var places = getSleepPlaces(ring, level);
    var place = null;
    for (var i = 0; i < places.length; i++) {
        if (places[i].name.indexOf(placeName) >= 0 || placeName.indexOf(places[i].name.split('（')[0]) >= 0) {
            place = places[i];
            break;
        }
    }
    if (!place) place = places[0];
    if (!place) place = { fatiguePerHour: 12, hpPerHour: 5, sanityPerHour: 2, quality: 'medium' };
    doSleep(place, hours);
}

function doSleep(place, hours) {
    player.flags.isSleeping = true;
    sleepRest(place.quality, hours, place.fatiguePerHour, place.hpPerHour, place.sanityPerHour);
    st('<div class="scene-title">睡 眠</div><p>你在' + place.name + '睡了 ' + hours + ' 小时，精力得到了恢复。</p>');
    cb();
    ab('继续（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
}

function sceneChooseResidence() { st('<div class="scene-title">选 择 居 所</div><p>选择你想前往的环层。跨环移动需要支付5金币路费并耗时。</p>'); cb(); var rings = ['傲慢之环', '贪婪之环', '暴怒之环', '色欲之环', '嫉妒之环', '暴食之环', '懒惰之环']; for (var i = 0; i < rings.length; i++) { (function(r) { var cls = ''; if (r === '贪婪之环') cls = 'gold-btn'; if (r === '暴怒之环') cls = 'danger-btn'; ab('前往' + r, function() { travelToRing(r); }, cls); })(rings[i]); } }

// ==================== 存档系统 ====================
function saveGame() {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(player));
        var data = JSON.stringify(player, null, 2);
        var blob = new Blob([data], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '七环地狱_存档.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        st('<p style="color:#80c080;">✅ 已保存到浏览器（自动存档）并导出文件。</p>');
    } catch(e) {
        st('<p class="highlight">保存失败：' + e.message + '</p>');
    }
    cb();
    ab('返回', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
}

function loadGame(event) {
    var saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
        try {
            var data = JSON.parse(saved);
            Object.assign(player, data);
            ua();
            st('<p style="color:#e8c060;">✅ 存档加载成功（来自浏览器自动存档）！</p>');
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
            return;
        } catch(e) {}
    }
    if (!event || !event.target.files.length) {
        st('<p class="highlight">未找到存档。</p>');
        cb();
        ab('返回', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
        return;
    }
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            Object.assign(player, data);
            ua();
            st('<p style="color:#e8c060;">✅ 存档加载成功（来自文件）！</p>');
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
        } catch (err) {
            st('<p class="highlight">存档加载失败：' + err.message + '</p>');
            cb();
            ab('返回', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
        }
    };
    reader.readAsText(file);
}

function resetGame() {
    if (confirm('确定要重置游戏吗？所有进度将丢失。')) {
        location.reload();
    }
}

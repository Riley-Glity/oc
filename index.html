function updateCreateSummary() {
    var el = document.getElementById('create-summary');
    if (!el) return;
    var nameEl = document.getElementById('name-input');
    var nm = nameEl && nameEl.value ? nameEl.value.trim() : '';
    var race = selectedRace === 'sinner' ? '罪人' : selectedRace === 'demon' ? '原生恶魔' : '';
    var gen = selectedGender === 'male' ? '男性' : selectedGender === 'female' ? '女性' : '';
    var parts = [];
    if (race) parts.push(race);
    if (gen) parts.push(gen);
    if (nm) parts.push('「' + nm + '」');
    if (!parts.length) { el.innerHTML = ''; return; }
    el.innerHTML = '当前：<span class="gold-text">' + parts.join(' · ') + '</span>';
}

function sr(race) {
    selectedRace = race;
    var map = { 'race-sinner': 'sinner', 'race-demon': 'demon' };
    for (var id in map) {
        var el = document.getElementById(id);
        if (!el) continue;
        var on = map[id] === race;
        el.classList.toggle('sel', on);
        var mark = document.getElementById(id + '-mark');
        if (mark) mark.textContent = on ? '✓ 已选择' : '未选择';
    }
    var d = document.getElementById('race-desc');
    if (d) {
        d.innerHTML = race === 'sinner'
            ? '<span class="highlight">罪人</span>　初始理智 −3。有完整的生前罪行背景，坠入傲慢之环。'
            : '<span class="gold-text">原生恶魔</span>　初始理智 +3、随机属性 +3。在诞生环直接觐见君主。';
    }
    var err = document.getElementById('create-err');
    if (err) err.textContent = '';
    updateCreateSummary();
}

function sg(gender) {
    selectedGender = gender;
    var map = { 'gender-male': 'male', 'gender-female': 'female' };
    for (var id in map) {
        var el = document.getElementById(id);
        if (!el) continue;
        var on = map[id] === gender;
        el.classList.toggle('sel', on);
        var mark = document.getElementById(id + '-mark');
        if (mark) mark.textContent = on ? '✓ 已选择' : '未选择';
    }
    var err = document.getElementById('create-err');
    if (err) err.textContent = '';
    updateCreateSummary();
}

function submitCreate() {
    var errEl = document.getElementById('create-err');
    var nameEl = document.getElementById('name-input');
    var nv = nameEl ? nameEl.value.trim() : '';

    var problems = [];
    if (!selectedRace) problems.push('种族');
    if (!selectedGender) problems.push('性别');
    if (!nv) problems.push('姓名');

    if (problems.length) {
        // 行内提示，不换屏，输入内容保留
        if (errEl) errEl.textContent = '还没填：' + problems.join('、');
        if (!selectedRace) { var r = document.getElementById('race-row'); if (r) r.classList.add('shake'); setTimeout(function() { if (r) r.classList.remove('shake'); }, 400); }
        if (!selectedGender) { var gg = document.getElementById('gender-row'); if (gg) gg.classList.add('shake'); setTimeout(function() { if (gg) gg.classList.remove('shake'); }, 400); }
        return;
    }

    player.name = nv;
    player.race = selectedRace;
    player.gender = selectedGender;
    checkHp();
    ua();
    if (selectedRace === 'sinner') sceneSinSelect();
    else sceneDemonBirthRing();
}

            ab(s.name + '　' + s.desc, function() { pickSin(s); });
        })(sins[i]);
    }
    ab('返回上一步', function() { sceneCreate(true); });
}

function pickSin(s) {
    player.sin = String(arguments[0] || arguments[1] || player.sin || '');
    player.sin = s.name;
    player.birthRing = s.name + '之环';
    var stories = sinBackstories[s.name];
    if (!stories || !stories.length) {
        st('<p class="highlight">背景故事缺失，请刷新重试。</p>');
        cb();
        ab('返回', function() { sceneSinSelect(); });
        return;
    }

    var showStory = function(newStory) {
        player.flags.crimeStory = newStory.crime;
        player.flags.crimeFlavor = newStory.flavor;
        var html = createStepLine(3, 4, '生前之罪') +
            '<div class="scene-title">' + s.name + ' · 生 前 之 罪</div>' +
            '<p><span class="highlight">' + player.name + '</span>——这就是将你推入地狱的罪行。</p>' +
            '<div class="divider">◆ ◆ ◆</div>' +
            '<p style="line-height:1.9;">' + newStory.crime + '</p>' +
            '<div class="divider">◆ ◆ ◆</div>' +
            '<p style="color:#c09080;font-style:italic;">「' + newStory.flavor + '」</p>' +
            '<p style="color:#9a6a6a;font-size:0.85em;">属性修正：<span class="highlight">' + s.desc +
            '</span>　一切罪孽的根源都是傲慢——你将首先坠入傲慢之环。</p>';
        st(html);
        cb();
        ab('塑造外貌', function() { sceneAppearance(true); }, 'primary-btn');
        ab('再换一个故事', function() {
            showStory(stories[Math.floor(Math.random() * stories.length)]);
        });
        ab('返回上一步', function() { sceneSinSelect(); });
    };

    checkHp();
    ua();
    showStory(stories[Math.floor(Math.random() * stories.length)]);
}

// ---------- 第三步：外貌（原地更新，不跳页面） ----------

function sceneAppearance(isSinner) {
    st(createStepLine(3, 4, '外貌') +
        '<div class="scene-title">塑 造 外 貌</div>' +
        '<p class="menu-intro">点哪一项就换哪一项，不会离开本页。选好之后点下面的按钮。</p>' +
        '<div id="appearance-container">' + renderAppearanceOptions(isSinner) + '</div>');
    cb();
    ab('确认外貌，进入地狱', function() {
        player.appearance = JSON.parse(JSON.stringify(currentAppearance));
        if (isSinner) sceneDiceSinner();
        else sceneDiceDemon();
    }, 'primary-btn');
    ab('返回上一步', function() {
        if (isSinner) sceneSinSelect();
        else sceneDemonBirthRing();
    });
}

// 只替换子容器，不动外层滚动位置
window.setAppearance = function(key, val, color) {
    if (key === 'hairColor' || key === 'eyeColor') {
        currentAppearance[key] = { name: val, color: color };
    } else {
        currentAppearance[key] = val;
    }
    var c = document.getElementById('appearance-container');
    if (c) {
        c.innerHTML = renderAppearanceOptions(player.race === 'sinner');
    } else {
        sceneAppearance(player.race === 'sinner');
    }
};

// ---------- 外貌选项渲染：改成分组 chip + 选中态 ----------

function renderAppearanceOptions(isSinner) {
    var pool = appearanceOptions.sinner;
    if (!isSinner) {
        var ringPool = appearanceOptions.demon[player.birthRing] || appearanceOptions.demon['傲慢之环'];
        pool = {
            hairColor: ringPool.hairColor,
            hairStyle: appearanceOptions.demonGeneral.hairStyle,
            eyeColor: ringPool.eyeColor,
            height: appearanceOptions.demonGeneral.height,
            bodyType: appearanceOptions.demonGeneral.bodyType,
            mutation: ringPool.mutation
        };
    }

    // 兜底：当前值不在池子里就回到第一项
    if (!pool.hairColor.find(function(c) { return c.name === currentAppearance.hairColor.name; })) currentAppearance.hairColor = pool.hairColor[0];
    if (pool.hairStyle.indexOf(currentAppearance.hairStyle) === -1) currentAppearance.hairStyle = pool.hairStyle[0];
    if (!pool.eyeColor.find(function(c) { return c.name === currentAppearance.eyeColor.name; })) currentAppearance.eyeColor = pool.eyeColor[0];
    if (pool.height.indexOf(currentAppearance.height) === -1) currentAppearance.height = pool.height[0];
    if (pool.bodyType.indexOf(currentAppearance.bodyType) === -1) currentAppearance.bodyType = pool.bodyType[0];
    if (pool.mutation.indexOf(currentAppearance.mutation) === -1) currentAppearance.mutation = pool.mutation[0];

    var group = function(title, chips) {
        return '<div class="chip-group"><div class="chip-label">' + title + '</div>' +
            '<div class="chip-row">' + chips + '</div></div>';
    };
    var plainChip = function(key, val, isOn) {
        return '<span class="chip' + (isOn ? ' sel' : '') + '" onclick="setAppearance(\'' + key + '\', \'' + val + '\')">' + val + '</span>';
    };

    var html = '<div class="chip-panel">';

    html += group('发色', pool.hairColor.map(function(c) {
        var on = currentAppearance.hairColor.name === c.name;
        return '<span class="chip' + (on ? ' sel' : '') + '" style="border-left:3px solid ' + c.color + ';" ' +
            'onclick="setAppearance(\'hairColor\', \'' + c.name + '\', \'' + c.color + '\')">' + c.name + '</span>';
    }).join(''));

    html += group('发型', pool.hairStyle.map(function(c) {
        return plainChip('hairStyle', c, currentAppearance.hairStyle === c);
    }).join(''));

    html += group('瞳色', pool.eyeColor.map(function(c) {
        var on = currentAppearance.eyeColor.name === c.name;
        return '<span class="chip' + (on ? ' sel' : '') + '" style="border-left:3px solid ' + c.color + ';" ' +
            'onclick="setAppearance(\'eyeColor\', \'' + c.name + '\', \'' + c.color + '\')">' + c.name + '</span>';
    }).join(''));

    html += group('身高', pool.height.map(function(c) {
        return plainChip('height', c, currentAppearance.height === c);
    }).join(''));

    html += group('体型', pool.bodyType.map(function(c) {
        return plainChip('bodyType', c, currentAppearance.bodyType === c);
    }).join(''));

    html += group(isSinner ? '惩罚烙印' : '深渊特征', pool.mutation.map(function(c) {
        return plainChip('mutation', c, currentAppearance.mutation === c);
    }).join(''));

    html += '</div>';

    // 预览
    var desc = '<p class="appearance-preview">';
    desc += '你有着一头<span style="color:' + currentAppearance.hairColor.color + ';font-weight:bold;">' +
        currentAppearance.hairColor.name + '</span>的' + currentAppearance.hairStyle + '。';
    desc += '一双<span style="color:' + currentAppearance.eyeColor.color + ';font-weight:bold;">' +
        currentAppearance.eyeColor.name + '</span>的眼睛。';
    desc += '身姿' + currentAppearance.height + '，体型' + currentAppearance.bodyType + '。';
    desc += isSinner
        ? '前世罪孽在你重塑的肉体上留下了痕迹：<span style="color:#c04050;font-weight:bold;">' + currentAppearance.mutation + '</span>。'
        : '混沌能量在你身上留下了鲜明的深渊特征：<span style="color:#c04050;font-weight:bold;">' + currentAppearance.mutation + '</span>。';
    desc += '</p>';

    return html + desc;
}



// ==================================================================
// 七环地图
// 规则：
//   · 环与环之间只和相邻的两环相通，不能跳着走
//   · 环内三层只能逐层上下，不能跳层
//   · 上行与跨环要钱；钱不够的选项不出现在移动菜单里
// 地图是内联 SVG，点节点即走，点不动的地方会说明为什么。
// ==================================================================

var RING_ORDER = ['傲慢之环', '贪婪之环', '暴怒之环', '色欲之环', '嫉妒之环', '暴食之环', '懒惰之环'];
var RING_SHORT = {
    '傲慢之环': '傲慢', '贪婪之环': '贪婪', '暴怒之环': '暴怒',
    '色欲之环': '色欲', '嫉妒之环': '嫉妒', '暴食之环': '暴食', '懒惰之环': '懒惰'
};
var TIER_ORDER = ['poor', 'middle', 'rich'];
var TIER_LABEL = { poor: '底层', middle: '中层', rich: '上层' };
var RING_TRAVEL_COST = 5;
var TIER_UP_COST = { middle: 10, rich: 25 };

function ringIndex(r) {
    for (var i = 0; i < RING_ORDER.length; i++) if (RING_ORDER[i] === r) return i;
    return 0;
}
function ringNeighbors(r) {
    var i = ringIndex(r), n = RING_ORDER.length;
    return [RING_ORDER[(i - 1 + n) % n], RING_ORDER[(i + 1) % n]];
}
function isRingAdjacent(a, b) { return ringNeighbors(a).indexOf(b) >= 0; }

function tierIndex(t) { return TIER_ORDER.indexOf(t); }
function isTierAdjacent(a, b) { return Math.abs(tierIndex(a) - tierIndex(b)) === 1; }

function hasFreePass() {
    return (player.inventory || []).some(function(it) {
        return it.name === '跨环通行证（永久）';
    });
}
function hasMidPass() {
    return (player.inventory || []).some(function(it) {
        return it.name === '中层通行证' || it.name === '跨环通行证（永久）';
    });
}

// 上行到某一层要多少钱
function tierUpCost(level) {
    if (level === 'middle') return hasMidPass() ? 0 : TIER_UP_COST.middle;
    if (level === 'rich') return hasFreePass() ? 0 : TIER_UP_COST.rich;
    return 0;
}

// 跨环要多少钱（通行证 / 许可都算）
function ringTravelCost(ring) {
    if (hasFreePass() || (typeof hasRingPermit === 'function' && hasRingPermit(ring))) return 0;
    return RING_TRAVEL_COST;
}

function districtName(ring, level) {
    var rd = RD[ring];
    if (!rd || !rd[level]) return '—';
    return rd[level].name;
}

// ---------------- 地图 SVG ----------------

function renderMapSvg() {
    var W = 720, H = 620, cx = 360, cy = 300, R = 210;
    var cur = player.currentRing;
    var curLevel = getCurrentLevel();
    var n = RING_ORDER.length;

    var pos = [];
    for (var i = 0; i < n; i++) {
        var ang = (-90 + i * 360 / n) * Math.PI / 180;
        pos.push({ x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang) });
    }

    var s = [];
    s.push('<svg class="world-map" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="七环地狱地图">');
    s.push('<defs>');
    s.push('<radialGradient id="mapBg" cx="50%" cy="45%" r="62%">');
    s.push('<stop offset="0%" stop-color="#1a0810"/><stop offset="70%" stop-color="#0d0308"/><stop offset="100%" stop-color="#070104"/>');
    s.push('</radialGradient>');
    s.push('<filter id="mapGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');
    s.push('</defs>');
    s.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="url(#mapBg)"/>');

    // 外圈装饰
    s.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (R + 70) + '" fill="none" stroke="#2a1018" stroke-width="1" stroke-dasharray="3 9"/>');
    s.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (R - 78) + '" fill="none" stroke="#1e0a12" stroke-width="1"/>');

    // 连线
    for (var k = 0; k < n; k++) {
        var a = pos[k], b = pos[(k + 1) % n];
        var hereAdj = (RING_ORDER[k] === cur || RING_ORDER[(k + 1) % n] === cur);
        s.push('<line class="map-edge' + (hereAdj ? ' adj' : '') + '" x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) +
            '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) + '"/>');
    }

    // 中心
    s.push('<circle cx="' + cx + '" cy="' + cy + '" r="54" fill="#0e040a" stroke="#3a1420" stroke-width="1"/>');
    s.push('<text class="map-core" x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle">七 环</text>');
    s.push('<text class="map-core-sub" x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle">地狱</text>');

    // 节点
    for (var j = 0; j < n; j++) {
        var ring = RING_ORDER[j];
        var p = pos[j];
        var isCur = ring === cur;
        var isAdj = !isCur && isRingAdjacent(cur, ring);
        var cost = ringTravelCost(ring);
        var canPay = player.gold >= cost;
        var cls = 'map-node' + (isCur ? ' cur' : (isAdj ? ' adj' : ' far')) + (isCur ? '' : (canPay ? '' : ' broke'));

        var nx = p.x - 62, ny = p.y - 32;
        s.push('<g class="' + cls + '" data-ring="' + ring + '" onclick="mapClickRing(\'' + ring + '\')">');
        s.push('<rect class="mn-box" x="' + nx.toFixed(1) + '" y="' + ny.toFixed(1) + '" width="124" height="64" rx="6"/>');
        s.push('<text class="mn-title" x="' + p.x.toFixed(1) + '" y="' + (p.y - 10).toFixed(1) + '" text-anchor="middle">' + RING_SHORT[ring] + '</text>');
        s.push('<text class="mn-sub" x="' + p.x.toFixed(1) + '" y="' + (p.y + 8).toFixed(1) + '" text-anchor="middle">' + districtName(ring, isCur ? curLevel : 'poor') + '</text>');

        // 三层小格
        for (var t = 0; t < 3; t++) {
            var px = p.x - 22 + t * 16, py = p.y + 18;
            var on = isCur && TIER_ORDER[t] === curLevel;
            var reach = isCur && isTierAdjacent(curLevel, TIER_ORDER[t]);
            s.push('<rect class="mn-pip' + (on ? ' on' : (reach ? ' reach' : '')) + '" x="' + px.toFixed(1) +
                '" y="' + py.toFixed(1) + '" width="11" height="7" rx="1"/>');
        }

        // 状态角标
        if (isCur) {
            s.push('<text class="mn-tag here" x="' + (p.x + 62).toFixed(1) + '" y="' + (ny + 12).toFixed(1) + '">你在这里</text>');
        } else if (isAdj && !canPay) {
            s.push('<text class="mn-tag need" x="' + (p.x + 62).toFixed(1) + '" y="' + (ny + 12).toFixed(1) + '">需 ' + cost + ' 金</text>');
        }
        s.push('</g>');
    }

    s.push('</svg>');
    return s.join('');
}

// ---------------- 地图场景 ----------------

function sceneWorldMap() {
    var cur = player.currentRing || '傲慢之环';
    var curLevel = getCurrentLevel();
    var nbrs = ringNeighbors(cur);
    var canMove = nbrs.filter(function(r) { return player.gold >= ringTravelCost(r); });

    var intro = '你现在在 <span class="gold-text">' + districtName(cur, curLevel) +
        '</span>（' + RING_SHORT[cur] + '之环 · ' + TIER_LABEL[curLevel] + '）。' +
        '七环首尾相连，只能走向左右相邻的两环；环内三层也只能一层一层上下。';

    st('<div class="scene-title">七 环 地 图</div>' +
        '<p class="menu-intro">' + intro + '</p>' +
        renderMapSvg() +
        '<div class="map-legend">' +
            '<span class="lg cur">◆ 你在这里</span>' +
            '<span class="lg adj">◆ 相邻，可以走</span>' +
            '<span class="lg far">◆ 隔着别的环，走不过去</span>' +
            '<span class="lg pip">▪ 小格是该环的三层</span>' +
        '</div>');
    if (typeof mapTierPlaces === 'function') {
        tc.innerHTML += mapTierPlaces(player.currentRing, getCurrentLevel());
    }
    cb();

    // 相邻环
    for (var i = 0; i < nbrs.length; i++) {
        (function(r) {
            var cost = ringTravelCost(r);
            if (player.gold < cost) return;   // 没钱就不给这个选项
            ab('走向' + RING_SHORT[r] + '之环' + (cost ? '（' + cost + ' 金币）' : '（通行证）'), function() {
                moveToRing(r);
            });
        })(nbrs[i]);
    }

    // 环内上下层
    var ti = tierIndex(curLevel);
    if (ti > 0) {
        var down = TIER_ORDER[ti - 1];
        ab('下到' + districtName(cur, down) + '（免费）', function() { moveToTier(down); });
    }
    if (ti < 2) {
        var up = TIER_ORDER[ti + 1];
        var ucost = tierUpCost(up);
        if (player.gold >= ucost) {
            ab('上到' + districtName(cur, up) + (ucost ? '（' + ucost + ' 金币）' : '（通行证）'), function() { moveToTier(up); });
        }
    }

    ab('回到' + districtName(cur, curLevel), function() { sceneExploreDistrict(cur, curLevel); });

    if (!canMove.length && ti === 2) {
        // 什么都走不了，给句话
        st(tc.innerHTML + '<p class="menu-intro" style="color:#c08070;">你身上只有 ' +
            player.gold + ' 金币，走不动。先去谋生或翻点东西。</p>');
        cb();
        ab('回到' + districtName(cur, curLevel), function() { sceneExploreDistrict(cur, curLevel); });
    }
}

// 点地图上的环
function mapClickRing(ring) {
    var cur = player.currentRing || '傲慢之环';
    if (ring === cur) { sceneExploreDistrict(cur, getCurrentLevel()); return; }

    if (!isRingAdjacent(cur, ring)) {
        var via = ringNeighbors(cur);
        st('<div class="scene-title">走 不 过 去</div>' +
            '<p>从' + RING_SHORT[cur] + '之环到' + RING_SHORT[ring] + '之环，中间还隔着别的环。' +
            '七环首尾相连，你只能先到相邻的那一环。</p>' +
            '<p style="color:#9a6a6a;">先往' + via.map(function(v) { return RING_SHORT[v] + '之环'; }).join(' 或 ') + '走。</p>');
        cb();
        for (var i = 0; i < via.length; i++) {
            (function(v) {
                if (player.gold < ringTravelCost(v)) return;
                ab('先去' + RING_SHORT[v] + '之环', function() { moveToRing(v); });
            })(via[i]);
        }
        ab('看地图', function() { sceneWorldMap(); });
        ab('留在原地', function() { sceneExploreDistrict(cur, getCurrentLevel()); });
        return;
    }

    moveToRing(ring);
}

// 真正跨环：先过相邻检查，再走原来的壁垒流程
function moveToRing(ring) {
    if (!isGameStarted()) {
        if (typeof toast === 'function') toast('尚未进入地狱。先完成角色创建。', 'warn');
        return;
    }
    var cur = player.currentRing || '傲慢之环';
    if (ring === cur) { sceneExploreDistrict(cur, getCurrentLevel()); return; }

    if (!isRingAdjacent(cur, ring)) {
        mapClickRing(ring);
        return;
    }

    var cost = ringTravelCost(ring);
    if (player.gold < cost) {
        st('<div class="scene-title">钱 不 够</div>' +
            '<p>跨到' + RING_SHORT[ring] + '之环要 ' + cost + ' 金币的路费，你身上只有 ' + player.gold + '。</p>');
        cb();
        ab('回去谋生', function() { sceneExploreDistrict(cur, getCurrentLevel()); });
        ab('看地图', function() { sceneWorldMap(); });
        return;
    }

    travelToRing(ring);
}

// 环内上下层
function moveToTier(level) {
    var ring = player.currentRing || '傲慢之环';
    var curLevel = getCurrentLevel();
    if (level === curLevel) { sceneExploreDistrict(ring, curLevel); return; }

    if (!isTierAdjacent(curLevel, level)) {
        st('<div class="scene-title">不 能 跳 层</div>' +
            '<p>从' + TIER_LABEL[curLevel] + '不能直接到' + TIER_LABEL[level] + '，中间隔着一层。</p>');
        cb();
        ab('看地图', function() { sceneWorldMap(); });
        ab('留在原地', function() { sceneExploreDistrict(ring, curLevel); });
        return;
    }

    var goingUp = tierIndex(level) > tierIndex(curLevel);
    if (!goingUp) {
        addTime(15);
        checkHp();
        ua();
        st('<p>你顺着斜坡往下走，越往下越暗、越脏，空气里的味道也越重。</p>' +
            '<p>回到了<span class="highlight">' + districtName(ring, level) + '</span>。</p>');
        cb();
        ab('进入', function() { sceneExploreDistrict(ring, level); });
        return;
    }

    var cost = tierUpCost(level);
    if (player.gold < cost) {
        st('<div class="scene-title">进 不 去</div>' +
            '<p>进' + districtName(ring, level) + '要 ' + cost + ' 金币，你身上只有 ' + player.gold + '。</p>');
        cb();
        ab('回去', function() { sceneExploreDistrict(ring, curLevel); });
        return;
    }
    if (cost > 0) player.gold -= cost;
    addTime(20);
    checkHp();
    ua();
    if (cost > 0) {
        st('<p>你把 ' + cost + ' 金币放在守卫手里，他数了数，侧身让开。</p>');
        cb();
        ab('进入' + districtName(ring, level), function() { sceneExploreDistrict(ring, level); });
        return;
    }
    sceneExploreDistrict(ring, level);
}



// ==================================================================
// 进度节奏层
// 目的：好感与属性不能靠重复点同一个按钮刷出来。
//   · 同一个 NPC 一天最多两次「有效的」交谈，第三次开始衰减，第五次归零
//   · 回理智 / 擦洗 / 翻找 这类可无限重复的动作有每日次数上限
//   · 剧情不再是「好感够了就解锁」，还要满足前置事件
// ==================================================================

var TALK_DECAY = [1, 1, 0.5, 0.2, 0];

function _dayKey() { return 'd' + (player.daysSurvived || 1); }

function _bump(scope, id) {
    if (!player.counters) player.counters = {};
    var k = _dayKey() + '|' + scope + '|' + id;
    player.counters[k] = (player.counters[k] || 0) + 1;
    return player.counters[k];
}
function _peek(scope, id) {
    if (!player.counters) player.counters = {};
    return player.counters[_dayKey() + '|' + scope + '|' + id] || 0;
}

// ---------- 好感：对话衰减 ----------

// 返回这次实际能给的好感（base 为正时按当天第几次交谈衰减；为负不衰减）
function loveGainGated(id, base) {
    if (base <= 0) return base;
    var n = _peek('talk', id);
    var f = n < TALK_DECAY.length ? TALK_DECAY[n] : 0;
    return Math.round(base * f);
}

function talkExhausted(id) {
    return _peek('talk', id) >= TALK_DECAY.length;
}

// 对话专用入口：衰减 + 计数（内部调原来的 addNpcLove）
function addNpcLoveFromTalk(id, base) {
    // 有时候一句话说得不对，就掉一点（测试模式下关闭，保证可复现）
    if ((typeof __disableNpcRoll === 'undefined' || !__disableNpcRoll) && Math.random() < 0.12) {
        var _dd = NPC_PACK[id];
        if (_dd) {
            if (!player.relationships[_dd.name]) player.relationships[_dd.name] = { love: 2, met: true };
            var _r = player.relationships[_dd.name];
            _r.love = Math.max(0, (_r.love || 0) - 1);
            return -1;
        }
    }
    var gain = loveGainGated(id, base);
    _bump('talk', id);
    if (gain === 0) return 0;
    // 返回真正加进去的数（addNpcLove 里还有单次上限 3）
    var _p = NPC_PACK[id];
    var _before = _p ? getNpcLove(id) : 0;
    addNpcLove(id, gain);
    var _after = _p ? getNpcLove(id) : 0;
    return _after - _before;
}

// ---------- 属性：每日次数上限 ----------

var STAT_DAILY_CAP = {
    breathe: 6,      // 喘口气：回理智
    wash: 3,         // 擦洗：回清洁
    scavenge: 5,     // 翻找：拿食物
    work: 6          // 打工：兼职次数
};

// 用掉一次额度。额度内返回 true，超了返回 false。
function useDailyQuota(kind, id) {
    var cap = STAT_DAILY_CAP[kind] || 3;
    var n = _peek('q', kind + ':' + (id || ''));
    if (n >= cap) return false;
    _bump('q', kind + ':' + (id || ''));
    return true;
}
function quotaLeft(kind, id) {
    var cap = STAT_DAILY_CAP[kind] || 3;
    return Math.max(0, cap - _peek('q', kind + ':' + (id || '')));
}

// 属性增益衰减：额度内全额，超额度直接为 0
function statGainGated(kind, base, id) {
    if (!useDailyQuota(kind, id)) return 0;
    return base;
}

// ---------- 剧情前置 ----------

// 一个剧情阶段是否「可以讲」：好感、天数、前置事件都对上
function storyStageReady(id, stage) {
    if (!stage) return false;
    if (typeof stage.req === 'function') {
        try { if (!stage.req()) return false; } catch (e) { return false; }
    }
    return true;
}

// 剧情推进时给的好感也要过一遍衰减，避免「点剧情刷好感」
function addNpcLoveFromStory(id, base) {
    if (base <= 0) { addNpcLove(id, base); return base; }
    var n = _peek('story', id);
    var f = n < 2 ? 1 : (n < 3 ? 0.6 : 0.3);
    var gain = Math.round(base * f);
    _bump('story', id);
    addNpcLove(id, gain);
    return gain;
}

    var story = NPC_STORY[id];
    if (!story) return;
    var done = idx + 1;

    if (story && done >= story.stages.length) {
        var d = NPC_PACK[id];
        if (d) player.flags['aftermath_' + id] = true;
        addNpcLoveFromStory ? null : null;
    }

    // 第二幕之后：解锁一条日常对话

        player.flags['unlockedTalk_' + id] = true;
    }

function worldNpcLove(id) {
    var d = WORLD_STORY[id];
    if (!d) return 0;
    var rel = player.relationships[d.name];
    return rel ? (rel.love || 0) : 0;
}
function worldStoryStage(id) {
    if (!player.flags) player.flags = {};
    return player.flags['wstory_' + id] || 0;
}
function worldStoryAvailable(id) {
    var d = WORLD_STORY[id];
    if (!d) return -1;
    var done = worldStoryStage(id);
    if (done >= d.stages.length) return -1;
    var stg = d.stages[done];
    if (worldNpcLove(id) < (stg.love || 0)) return -1;
    if ((player.daysSurvived || 1) < (stg.day || 1)) return -1;
    if (typeof stg.req === 'function') {
        try { if (!stg.req()) return -1; } catch (e) { return -1; }
    }
    return done;
}


// 世界 NPC 属于哪一环（剧情入口挂在「人物」菜单里，不走场景后置注入）
var WORLD_NPC_RING = {
    '傲慢之环': ['riley'],
    '贪婪之环': ['freddy'],
    '嫉妒之环': ['elias'],
    '色欲之环': ['evan']
};

function addWorldStoryMenuButtons(ring, level) {
    var ids = WORLD_NPC_RING[ring] || [];
    for (var i = 0; i < ids.length; i++) {
        (function(id) {
            var d = WORLD_STORY[id];
            if (!d) return;
            var done = worldStoryStage(id);
            if (done >= d.stages.length) return;
            var avail = worldStoryAvailable(id);
            if (avail < 0) {
                var need = d.stages[done];
                var lack = [];
                if (worldNpcLove(id) < (need.love || 0)) lack.push('好感 ' + worldNpcLove(id) + '/' + (need.love || 0));
                if ((player.daysSurvived || 1) < (need.day || 1)) lack.push('第 ' + (player.daysSurvived || 1) + '/' + (need.day || 1) + ' 天');
                if (typeof need.req === 'function') {
                    var r = true; try { r = need.req(); } catch (e) { r = false; }
                    if (!r) lack.push(need.reqText || '还缺一件先发生的事');
                }
                ab('剧情「' + d.title + '」 · ' + d.name + '（还差 ' + lack.join('；') + '）',
                   function() { districtPeopleMenu(ring, level); }, 'disabled-btn');
                return;
            }
            ab('剧情「' + d.title + '」 · ' + d.name, function() { playWorldStory(id); }, 'primary-btn');
        })(ids[i]);
    }
}

function addWorldStoryButton(id) {
    var d = WORLD_STORY[id];
    if (!d || typeof tc === 'undefined' || !tc) return;
    // 只在真的渲染了这个 NPC 的界面时才加，避免挂到地区菜单上
    try {
        if (tc.textContent.indexOf(d.name) < 0) return;
    } catch (e) { return; }

    var done = worldStoryStage(id);
    if (done >= d.stages.length) return;   // 走完了就不再占位置

    // 有些场景会 lockScreen，ab() 在锁屏时会丢弃按钮。
    // 这里借用内部的渲染旗标，把这一下算作一次正常渲染。
    var _prevRenderLock = (typeof __renderingLocked === 'undefined') ? null : __renderingLocked;
    if (_prevRenderLock !== null) __renderingLocked = true;
    try {
    addWorldStoryButtonInner(id, d, done);
    } finally {
        if (_prevRenderLock !== null) __renderingLocked = _prevRenderLock;
    }
}

function addWorldStoryButtonInner(id, d, done) {
    var avail = worldStoryAvailable(id);
    if (avail < 0) {
        var need = d.stages[done];
        var lack = [];
        if (worldNpcLove(id) < (need.love || 0)) lack.push('好感 ' + worldNpcLove(id) + '/' + (need.love || 0));
        if ((player.daysSurvived || 1) < (need.day || 1)) lack.push('第 ' + (player.daysSurvived || 1) + '/' + (need.day || 1) + ' 天');
        if (typeof need.req === 'function') {
            var r = true; try { r = need.req(); } catch (e) { r = false; }
            if (!r) lack.push(need.reqText || '还缺一件先发生的事');
        }
        ab('剧情「' + d.title + '」· 还差 ' + lack.join('；'), function() {
            sceneExploreDistrict(player.currentRing, getCurrentLevel());
        }, 'disabled-btn');
        return;
    }
    ab('剧情「' + d.title + '」', function() { playWorldStory(id); }, 'primary-btn');
}

function playWorldStory(id) {
    var d = WORLD_STORY[id];
    var idx = worldStoryAvailable(id);
    if (!d || idx < 0) { sceneExploreDistrict(player.currentRing, getCurrentLevel()); return; }
    var stg = d.stages[idx];
    st(('<div class="scene-title">' + d.title + ' · ' + (idx + 1) + '/' + d.stages.length + '</div>') +
        '<p>' + stg.text + '</p>' +
        '<p style="color:#c09080;font-style:italic;">' + (stg.then || '') + '</p>');
    cb();
    ab('……', function() {
        if (typeof stg.eff === 'function') { try { stg.eff(); } catch (e) {} }
        player.flags['wstory_' + id] = idx + 1;
        addTime(20);
        checkHp();
        ua();
        var nxt = idx + 1;
        var tail = nxt >= d.stages.length
            ? '<p style="color:#8a5a62;">这条线到此为止。他之后还会在，只是不再有新的东西要说。</p>'
            : '<p style="color:#8a5a62;">（还有下文。等他愿意的时候。）</p>';
        st('<div class="scene-title">' + d.title + '</div>' + tail);
        cb();
        ab('返回', function() { drawNpcBack(id); });
    });
}

function drawNpcBack(id) {
    var map = { riley: 'sceneRiley', freddy: 'sceneFreddy', elias: 'sceneElias', evan: 'sceneEvan' };
    var fn = window[map[id]];
    if (typeof fn === 'function') { fn(); return; }
    sceneExploreDistrict(player.currentRing, getCurrentLevel());
}

function mapTierPlaces(ring, tier) {
    var d = RD[ring] && RD[ring][tier];
    if (!d) return '';
    var ringName = ring;
    return '<div class="map-places">' +
        '<div class="mp-head">' + districtName(ring, tier) + ' · 可以去的去处</div>' +
        '<div class="mp-list">' +
        (d.features || []).map(function(f) {
            return '<span class="mp-chip" onclick="mapGoPlace(\'' + ringName + '\',\'' + tier + '\',\'' + f + '\')">' + f + '</span>';
        }).join('') +
        '</div></div>';
}

function mapGoPlace(ring, tier, place) {
    // 只允许去当前所在环当前所在层，跨环跨层仍然走 moveToRing / moveToTier
    if (ring !== player.currentRing || tier !== getCurrentLevel()) {
        toast('那个地方在别处。先走到那一环、那一层。', 'warn');
        return;
    }
    sceneExploreDistrict(ring, tier);

// NPC 移动 + 君主偶遇 + 泽洛斯
//
// 1. 每个 NPC 有自己的活动规律，性格决定他怎么动：
//    守铺子的不动，跟钱走的换层，夜里才出来的白天找不到。
// 2. 高层区（rich）有极低概率撞见该环君主，概率按性格分配。
// 3. 泽洛斯是混沌之神，位置不是「在哪」而是「他找不找你」。
// 4. NPC 之间会插一段与主线无关的小事，选错会掉好感。
// ==================================================================

// play: hour（只在某时段出现）/ hop（每隔几天换一次层）/ stay（不挪窝）
var NPC_DRIFT = {
    kangte:   { play: 'stay' },                                          // 守着灶台
    xavier:   { play: 'chase' },                                         // 哪儿有钱往哪儿靠
    rocco:    { play: 'chase' },                                         // 跟钱走
    violette: { play: 'hour', from: 18, to: 6 },                          // 夜里才出来唱
    virid:    { play: 'stay' },                                          // 守当铺，不动
    murphi:   { play: 'stay' },                                          // 不挪窝
    earle:    { play: 'stay' },                                          // 角斗场，固定
    ciper:    { play: 'stay' },                                          // 躺着
    samuel:   { play: 'stay' },                                          // 守门
    cecilia:  { play: 'hop', period: 4 }                                 // 上层轮换
};

var TIER_RANK = { poor: 0, middle: 1, rich: 2 };

// 返回 null 表示「按原样待着」，返回 {ring, level} 表示他挪到哪了，
// 返回 {away:true} 表示今天在这个地方找不到他。
function npcPlace(id) {
    var p = NPC_DRIFT[id];
    var d = NPC_PACK[id];
    if (!p || !d || !d.levels || !d.levels.length) return null;

    if (p.play === 'stay') return null;

    // 时段型：不在窗口里就是不在
    if (p.play === 'hour') {
        var h = currentHour();
        var inWindow = (p.from <= p.to)
            ? (h >= p.from && h < p.to)
            : (h >= p.from || h < p.to);
        if (!inWindow) return { away: true, why: '他只在夜里出现。' };
        return null;
    }

    // 轮换型：只在他能去的层里挑
    if (p.play === 'hop') {
        var day = player.daysSurvived || 1;
        var idx = Math.floor((day - 1) / (p.period || 3)) % d.levels.length;
        return { ring: d.ring, level: d.levels[idx] };
    }

    // 跟钱型：目标层取最近的可去层，不会跑到他去不了的地方
    if (p.play === 'chase') {
        var g = player.gold || 0;
        var targetRank = g >= 200 ? 2 : (g >= 60 ? 1 : 0);
        var best = d.levels[0];
        var bestGap = 99;
        for (var i = 0; i < d.levels.length; i++) {
            var gap = Math.abs((TIER_RANK[d.levels[i]] || 0) - targetRank);
            if (gap < bestGap) { bestGap = gap; best = d.levels[i]; }
        }
        return { ring: d.ring, level: best };
    }

    return null;
}

// 地狱时间：gameTime 是分钟数
function currentHour() {
    if (typeof player.gameTime === 'number' && player.gameTime > 0) {
        return Math.floor((player.gameTime % 1440) / 60);
    }
    if (typeof player.hour === 'number') return player.hour;
    return 12;
}

// 这个 NPC 此刻是否在这一层
function npcHere(id, ring, level) {
    var d = NPC_PACK[id];
    if (!d) return false;
    var pl = npcPlace(id);
    if (!pl) return d.ring === ring && d.levels.indexOf(level) !== -1;
    if (pl.away) return false;
    return pl.ring === ring && pl.level === level;
}

// 他今天在哪（给玩家看的提示）
function npcWhereText(id) {
    var d = NPC_PACK[id];
    var pl = npcPlace(id);
    if (!d) return '';
    if (!pl) return '';
    if (pl.away) return pl.why || '他今天不在这儿。';
    if (pl.ring !== d.ring || pl.level !== pl.level) {
        return '他这会儿在' + RD[pl.ring][pl.level].name + '。';
    }
    return '';
}

function tryNpcInterlude(id, ring, level) {
    var e = NPC_INTERLUDE[id];
    if (!e) return false;
    if (typeof __disableNpcRoll !== 'undefined' && __disableNpcRoll) return false;
    if (!player.flags) player.flags = {};
    var k = 'interludeD' + (player.daysSurvived || 1) + '_' + id;
    if (player.flags[k]) return false;
    if (getNpcLove(id) < 10) return false;      // 还不熟，不会当着你面发生
    if (Math.random() >= 0.18) return false;
    player.flags[k] = true;

    st('<div class="scene-title">插 曲</div>' +
        e.text.split('\n').map(function(p) { return '<p>' + p + '</p>'; }).join(''));
    cb();
    e.opts.forEach(function(o) {
        ab(o.label, function() {
            addTime(15);
            if (o.love) addNpcLove(id, o.love);
            st(o.text.split('\n').map(function(p) { return '<p>' + p + '</p>'; }).join('') +
                (o.love ? '<p style="font-size:0.82em;color:' + (o.love > 0 ? '#80c080' : '#e85060') + ';">好感 ' +
                    (o.love > 0 ? '+' : '') + o.love + '</p>' : ''));
            checkHp(); ua();
            cb();
            ab('离开', function() { sceneExploreDistrict(ring, level); });
        }, o.love < 0 ? 'danger-btn' : '');
    });
    return true;
}

function npcIdleBand(love) {
    return love >= 50 ? 2 : (love >= 25 ? 1 : 0);
}

function npcIdleAvailable(id) {
    var pool = NPC_IDLE[id];
    if (!pool) return null;
    if (!player.flags) player.flags = {};
    var day = player.daysSurvived || 1;
    if (player.flags['idle_d' + day + '_' + id]) return null;
    var band = npcIdleBand(getNpcLove(id));
    for (var i = 0; i < pool.length; i++) {
        if (pool[i].band === band) return pool[i];
    }
    return null;
}

function playNpcIdle(id) {
    var s = npcIdleAvailable(id);
    if (!s) { sceneNativeNpcMenu(id); return; }
    player.flags['idle_d' + (player.daysSurvived || 1) + '_' + id] = true;
    st('<div class="scene-title">' + NPC_PACK[id].name + '</div>' +
        s.text.split('\n').map(function(p) { return '<p>' + p + '</p>'; }).join('') +
        (s.then ? '<p style="color:#c09080;font-style:italic;">' + s.then + '</p>' : ''));
    cb();
    ab('就这样待着', function() {
        addTime(15);
        addNpcLoveFromTalk(id, 1);
        checkHp(); ua();
        sceneNativeNpcMenu(id);
    }, 'primary-btn');
    ab('走吧', function() { addTime(5); sceneNativeNpcMenu(id); });
}

function npcHomeOpen(id) {
    var h = NPC_HOME[id];
    if (!h) return false;
    if (getNpcLove(id) < h.need) return false;
    if (!npcAlive(id)) return false;
    return true;
}

function sceneNpcHome(id) {
    var h = NPC_HOME[id];
    var d = NPC_PACK[id];
    if (!h || !d) { sceneNativeNpcMenu(id); return; }
    st('<div class="scene-title">' + h.name + '</div>' +
        h.intro.split('\n').map(function(p) { return '<p>' + p + '</p>'; }).join(''));
    cb();
    ab('问一句', function() {
        addTime(20);
        var first = !(player.flags && player.flags['home_' + id]);
        if (!player.flags) player.flags = {};
        if (first) {
            player.flags['home_' + id] = true;
            addNpcLoveFromTalk(id, 3);
            player.repentance = (player.repentance || 0) + 1;
        }
        st('<p>' + h.line.split('\n').join('</p><p>') + '</p>' +
            (first ? '<p style="color:#80c080;font-size:0.85em;">你看见了他不给人看的那一面。</p>' : ''));
        cb();
        checkHp(); ua();
        ab('离开', function() { sceneNativeNpcMenu(id); });
    }, 'primary-btn');
    ab('到处看看', function() {
        addTime(10);
        st('<p>' + (d.homeLook || '这里的东西都摆得很整齐，整齐得像是怕被人看出什么。') + '</p>');
        cb();
        ab('离开', function() { sceneNativeNpcMenu(id); });
    });
    ab('出去', function() { sceneNativeNpcMenu(id); });
}

// 菜单入口：陪他待一会儿 + 去他住的地方
function addNpcLowFavorButtons(id) {
    var pool = NPC_IDLE[id];
    if (pool) {
        var s = npcIdleAvailable(id);
        if (s) ab('陪他待一会儿', function() { playNpcIdle(id); });
    }
    var h = NPC_HOME[id];
    if (h) {
        if (npcHomeOpen(id)) {
            ab('去' + h.name, function() { sceneNpcHome(id); }, '');
        } else if (getNpcLove(id) >= h.need - 10) {
            ab(h.name + '（好感 ' + getNpcLove(id) + '/' + h.need + '）',
                function() { sceneNativeNpcMenu(id); }, 'disabled-btn');
        }
    }
}

// 罪人 / 原生恶魔 的菜单里各多一个专属选项
function addRaceOption(id) {
    var r = RACE_ATTITUDE[id];
    if (!r) return;
    var isSinner = player.race === 'sinner';
    var day = player.daysSurvived || 1;
    if (player.flags && player.flags['race_' + day + '_' + id]) return;
    var label = isSinner ? r.s : r.d;
    var body = isSinner ? r.sText : r.dText;
    if (!label || !body) return;
    ab((isSinner ? '【罪人】' : '【恶魔】') + label, function() {
        if (!player.flags) player.flags = {};
        player.flags['race_' + (player.daysSurvived || 1) + '_' + id] = true;
        addTime(10);
        addNpcLoveFromTalk(id, 1);
        st('<p>' + body.split('\n').join('</p><p>') + '</p>');
        cb();
        checkHp(); ua();
        ab('继续', function() { sceneNativeNpcMenu(id); });
    }, 'primary-btn');
}

function slowFavorInit() {
    if (!player.relationships) return;
    // 初遇原本直接给 5，压到 2
    for (var name in player.relationships) {
        var r = player.relationships[name];
        if (r && r.met && r.love === 5 && !r._seeded) {
            r.love = 2;
            r._seeded = true;

function worldIdleBand(love) { return love >= 50 ? 2 : (love >= 25 ? 1 : 0); }

function worldIdleAvailable(name) {
    var pool = WORLD_IDLE[name];
    if (!pool) return null;
    if (!player.flags) player.flags = {};
    var day = player.daysSurvived || 1;
    if (player.flags['widle_d' + day + '_' + name]) return null;
    var band = worldIdleBand(worldNpcLove(name));
    for (var i = 0; i < pool.length; i++) if (pool[i].band === band) return pool[i];
    return null;
}

function playWorldIdle(name, backFn) {
    var s = worldIdleAvailable(name);
    if (!s) { backFn(); return; }
    player.flags['widle_d' + (player.daysSurvived || 1) + '_' + name] = true;
    st('<div class="scene-title">' + name + '</div>' +
        s.text.split('\n').map(function(p) { return '<p>' + p + '</p>'; }).join('') +
        (s.then ? '<p style="color:#c09080;font-style:italic;">' + s.then + '</p>' : ''));
    cb();
    ab('待一会儿', function() {
        addTime(15);
        var cur = worldNpcLove(name);
        player.relationships[name] = player.relationships[name] || { love: cur, met: true };
        player.relationships[name].love = Math.max(0, Math.min(100, cur + 1));
        checkHp(); ua();
        backFn();
    }, 'primary-btn');
    ab('离开', function() { backFn(); });
}

function playerSin() {
    if (player.sin) return player.sin;
    if (player.flags && player.flags.crimeStory) return player.flags.crimeStory;
    return '';
}

function sinImpression(id) {
    if (id === '__zelos__' || id === '泽洛斯') {
        var _s = playerSin();
        var _liked = (_s === '傲慢' || _s === '嫉妒');
        return {
            love: 2,
            good: _liked,
            line: _liked
                ? '「' + _s + '。」他重复了一遍，语气里第一次有了点东西，「至少你还知道自己是什么。」'
                : '他看了你一眼，什么也没说。这比说了更难受。'
        };
    }
    var npc = NPC_PACK[id];
    if (!npc) return null;
    var t = SIN_IMPRESSION[id];
    var sin = playerSin();
    var liked = !!(t && sin && t.like === sin);
    // 同罪 +2，不同罪 +1，原生恶魔再 +1（这地方还是看血统）
    var love = 2 + (liked ? 2 : 0) + (player.race === 'demon' ? 1 : 0);
    var line;
    if (liked) line = t.line;
    else if (sin) line = '「' + sin + '的。」他把这三个字在嘴里嚼了一下，「……行吧。」';
    else line = '他没看出你带着哪一宗。这让他有点不高兴。';
    return { love: Math.min(love, 6), line: line, good: liked };
}

// ==================================================================
// 衣柜：把买到的衣服真正穿上去
//
// 原来只有 equipCloth 这个函数，没有任何地方能调它——买完衣服
// 就堆在背包里，永远穿不上。这里补一个能进的衣柜界面。
// ==================================================================

function isClothItem(it) {
    if (!it) return false;
    if (it.type === 'cloth' || it.type === '衣服' || it.type === '服装') return true;
    // 没有 type 的，按有没有魅力/力量这类字段判断
    return (it.charisma || it.strength || it.magic || it.agility || it.sanity ||
            it.buffs) ? true : false;
}

function ownedClothes() {
    var out = [];
    if (!player.inventory) return out;
    for (var i = 0; i < player.inventory.length; i++) {
        var it = player.inventory[i];
        if (isClothItem(it)) out.push(it);
    }
    return out;
}

function sceneWardrobe() {
    var list = ownedClothes();
    var cur = player.equippedClothData;
    var html = '<div class="scene-title">衣 柜</div>';

    html += '<p style="font-size:0.9em;color:#9a9a9a;">' +
        (player.outfit ? '身上：' + player.outfit : '身上：你坠入地狱时的那身') + '</p>';

    if (cur) {
        var eff = [];
        if (cur.charisma) eff.push('魅力 ' + (cur.charisma > 0 ? '+' : '') + cur.charisma);
        if (cur.strength) eff.push('力量 ' + (cur.strength > 0 ? '+' : '') + cur.strength);
        if (cur.magic) eff.push('魔力 ' + (cur.magic > 0 ? '+' : '') + cur.magic);
        if (cur.agility) eff.push('敏捷 ' + (cur.agility > 0 ? '+' : '') + cur.agility);
        if (cur.sanity) eff.push('理智 ' + (cur.sanity > 0 ? '+' : '') + cur.sanity);
        if (eff.length) {
            html += '<p style="font-size:0.86em;color:#7ab47a;">当前效果：' + eff.join('　') + '</p>';
        }
    }

    if (!list.length) {
        html += '<p>' + '衣柜是空的。你身上那身已经磨得看不出原本的颜色了。' +
            '去店里买点什么吧——衣服在这儿不只是遮体，它决定别人怎么看你。' + '</p>';
    } else {
        html += '<p style="font-size:0.86em;color:#9a9a9a;">一共 ' + list.length + ' 件。</p>';
    }

    st(html);
    cb();

    for (var i = 0; i < list.length; i++) {
        (function(it) {
            var isOn = player.outfit === it.name;
            var label = (isOn ? '✓ ' : '　') + it.name;
            var marks = [];
            if (it.charisma) marks.push('魅' + (it.charisma > 0 ? '+' : '') + it.charisma);
            if (it.strength) marks.push('力' + (it.strength > 0 ? '+' : '') + it.strength);
            if (it.magic) marks.push('魔' + (it.magic > 0 ? '+' : '') + it.magic);
            if (it.agility) marks.push('敏' + (it.agility > 0 ? '+' : '') + it.agility);
            if (it.sanity) marks.push('理' + (it.sanity > 0 ? '+' : '') + it.sanity);
            if (marks.length) label += '（' + marks.join(' ') + '）';

            ab(label, function() {
                if (isOn) { sceneWardrobe(); return; }
                addTime(10);
                unequipCurrentCloth();
                equipCloth(it);
                player.outfit = it.name;
                toast('换上了 ' + it.name);
                sceneWardrobe();
            }, isOn ? 'disabled-btn' : '');
        })(list[i]);
    }

    if (cur || player.outfit) {
        ab('脱下来', function() {
            addTime(5);
            unequipCurrentCloth();
            toast('你换回了那身破衣服');
            sceneWardrobe();
        }, 'danger-btn');
    }

    ab('离开衣柜', function() {
        sceneExploreDistrict(player.currentRing || '傲慢之环', getCurrentLevel());
    });
}

// 进衣柜的入口：加在起居/住处里，也加在地区菜单
function addWardrobeButton() {
    if (!ownedClothes().length && !player.outfit) return;
    ab('打开衣柜（' + ownedClothes().length + ' 件）', function() { sceneWardrobe(); });
}

// ==================================================================
// DoL 式的好感与菜单
//
// 一、好感一天最多涨 2 点（不分途径），想看剧情就得一天天来。
// 二、NPC 菜单不再平铺一堆按钮，收成「和他相处」一个入口。
// 三、好感阶段用一句话标出来，像 DoL 那样让人一眼知道到哪了。
// ==================================================================

var FAVOR_STAGE = [
    { min: 0,  name: '陌生',   line: '他看你的眼神，和看街上任何一件东西没有区别。' },
    { min: 15, name: '眼熟',   line: '他记得见过你。仅此而已。' },
    { min: 30, name: '能说上话', line: '他开始跟你说些不跟别人说的。' },
    { min: 50, name: '亲近',   line: '他不自觉地把位置往你这边腾了一点。' },
    { min: 70, name: '自己人', line: '他已经默认你会来，也开始担心你不来。' },
    { min: 88, name: '放不下', line: '他会为你改变主意。这在地狱里几乎不可能。' }
];

function favorStage(love) {
    var s = FAVOR_STAGE[0];
    for (var i = 0; i < FAVOR_STAGE.length; i++) {
        if (love >= FAVOR_STAGE[i].min) s = FAVOR_STAGE[i];
    }
    return s;
}

// 一天一个 NPC 最多 +2（所有途径合计）
function _favorDayKey(id) {
    return 'fav_d' + (player.daysSurvived || 1) + '_' + id;
}

function _favorToday(id) {
    if (!player.counters) player.counters = {};
    return player.counters[_favorDayKey(id)] || 0;
}

function _favorAddToday(id, n) {
    if (!player.counters) player.counters = {};
    player.counters[_favorDayKey(id)] = _favorToday(id) + n;
}

function clampDailyFavor(id, delta) {
    if (delta <= 0) return delta;
    var used = _favorToday(id);
    var room = 2 - used;
    if (room <= 0) return 0;
    return Math.min(delta, room);
}

// ---------- 「和他相处」子菜单 ----------
function addNpcTogetherButton(id) {
    var love = getNpcLove(id);
    var st = favorStage(love);
    var hasIdle = (typeof npcIdleAvailable === 'function') && npcIdleAvailable(id);
    var hasHome = (typeof NPC_HOME !== 'undefined') && NPC_HOME[id];
    var hasRace = (typeof RACE_ATTITUDE !== 'undefined') && RACE_ATTITUDE[id];
    var cnt = (hasIdle ? 1 : 0) + (hasHome ? 1 : 0) + (hasRace ? 1 : 0);
    if (!cnt) return;
    ab('与他相处（' + st.name + '）', function() { sceneNpcTogether(id); });
}

function sceneNpcTogether(id) {
    var d = NPC_PACK[id];
    var love = getNpcLove(id);
    var st = favorStage(love);
    var html = '<div class="scene-title">' + d.name + '</div>' +
        '<p style="color:#9a9a9a;font-size:0.88em;">' + st.name + '　好感 ' + love + '/100</p>' +
        '<p style="font-size:0.9em;">' + st.line + '</p>';
    var todayUsed = _favorToday(id);
    if (todayUsed >= 2) {
        html += '<p style="color:#c09080;font-size:0.84em;">' +
            '今天已经聊得够多了。再待下去反而是打扰。</p>';
    } else {
        html += '<p style="color:#7ab47a;font-size:0.84em;">今天还能再亲近 ' + (2 - todayUsed) + ' 点。</p>';
    }
    st(html);
    cb();

    if (typeof npcIdleAvailable === 'function' && npcIdleAvailable(id)) {
        ab('陪他待一会儿', function() { playNpcIdle(id); });
    }

    if (typeof NPC_HOME !== 'undefined' && NPC_HOME[id]) {
        var h = NPC_HOME[id];
        if (typeof npcHomeOpen === 'function' && npcHomeOpen(id)) {
            ab('去' + h.name, function() { sceneNpcHome(id); });
        } else {
            ab(h.name + '（好感 ' + love + '/' + h.need + '）',
                function() { sceneNpcTogether(id); }, 'disabled-btn');
        }
    }

    if (typeof addRaceOption === 'function' && typeof RACE_ATTITUDE !== 'undefined' && RACE_ATTITUDE[id]) {
        addRaceOption(id);
    }

    ab('回到 ' + d.name, function() { sceneNativeNpcMenu(id); });
}



// ==================================================================
// 地点优先的探索：先选去哪儿，进去再决定干什么
//
// 原来是「探索 / 谋生 / 交易 / 人物 / 打理 / 移动」六个分类平铺，
// 你得先想清楚要做什么，再去找地方。DoL 是反过来的：
// 屏幕上只有地点，走进去以后才有「搜刮 / 打听 / 交易 / 见人」。
// ==================================================================

function placeList(ring, level) {
    var d = RD[ring] && RD[ring][level];
    var out = [];
    if (!d) return out;
    if (d.featureScenes) {
        for (var k in d.featureScenes) out.push(k);
    }
    return out;
}

function districtPlacesMenu(ring, level) {
    var d = RD[ring][level];
    var places = placeList(ring, level);

    st('<div class="scene-title">' + d.name + '</div>' +
        '<p>' + d.desc + '</p>' +
        '<p style="font-size:0.86em;color:#9a9a9a;">你要去哪儿。</p>');
    cb();

    for (var i = 0; i < places.length; i++) {
        (function(key, idx) {
            // 同一层里也有远近：靠门口的三分，往里走要久一点
            var d2 = idx === 0 ? 'near' : (idx < 3 ? 'mid' : 'far');
            var dd = (typeof SHOP_DIST !== 'undefined' && SHOP_DIST[d2]) ? SHOP_DIST[d2] : { label: '', cost: 5 };
            ab(key + (dd.label ? '（' + dd.label + '）' : ''), function() {
                addTime(dd.cost);
                scenePlace(ring, level, key);
            });
        })(places[i], i);
    }

    if (typeof addGamblePlace === 'function') addGamblePlace(ring, level);
    ab('在大街上走走', function() { districtExploreMenu(ring, level); });
    ab('看地图，换个地方', function() { districtGoMenu(ring, level); });
}

function scenePlace(ring, level, key) {
    var d = RD[ring][level];
    var scene = d.featureScenes ? d.featureScenes[key] : null;

    st('<div class="scene-title">' + key + '</div>' +
        '<p style="font-size:0.86em;color:#9a9a9a;">' + d.name + ' · 你在这里。</p>');
    cb();

    ab('仔细看看这地方', function() {
        if (typeof scene === 'function') { scene(ring, level); return; }
        st('<div class="scene-title">' + key + '</div><p>' + (scene || '这里没什么特别的。') + '</p>');
        addTime(5);
        cb();
        ab('回去', function() { scenePlace(ring, level, key); });
    }, 'primary-btn');

    ab('找活干', function() { districtWorkMenu(ring, level); });
    ab('买卖东西', function() { districtShopMenu(ring, level); });
    ab('看看这一带的人', function() { districtPeopleMenu(ring, level); });
    ab('在这里打理自己', function() { districtCareMenu(ring, level); });
    ab('离开这里', function() { sceneExploreDistrict(ring, level); });
}

function gambleAvailable() {
    if (!player.counters) player.counters = {};
    var key = 'gamble_d' + (player.daysSurvived || 1);
    return (player.counters[key] || 0) < 6;
}

function gambleUsed() {
    if (!player.counters) player.counters = {};
    return player.counters['gamble_d' + (player.daysSurvived || 1)] || 0;

    var used = gambleUsed();
    st('<div class="scene-title">铜板巷 · 赌桌</div>' +
        '<p>一张圆桌，四条腿都垫过。桌主是个没长脸的东西，' +
        '只在应该长脸的位置有一块磨得发亮的骨头。</p>' +
        '<p style="font-size:0.86em;color:#9a9a9a;">三颗骰子，比点数。' +
        '押中两颗以上算赢，三颗全同赔三倍。庄家永远有优势——这就是它能开下去的原因。</p>' +
        '<p style="font-size:0.86em;color:' + (used >= 6 ? '#c09080' : '#7ab47a') + ';">' +
        (used >= 6 ? '今天你已经坐得太久了。庄家在看你。' : '今天还能玩 ' + (6 - used) + ' 把。') + '</p>');
    cb();

    if (!gambleAvailable()) {
        ab('站起来，走人', function() { sceneExploreDistrict(ring, level); });
        return;
    }

    var stakes = [10, 25, 50];
    for (var i = 0; i < stakes.length; i++) {
        (function(bet) {
            ab('押 ' + bet + ' 金币', function() {
                if (player.gold < bet) {
                    toast('你拿不出 ' + bet + ' 金币。');
                    sceneGambleDen(ring, level);
                    return;
                }
                player.counters['gamble_d' + (player.daysSurvived || 1)] = gambleUsed() + 1;
                player.gold -= bet;
                addTime(15);
                var a = 1 + Math.floor(Math.random() * 6);
                var b = 1 + Math.floor(Math.random() * 6);
                var c = 1 + Math.floor(Math.random() * 6);
                var mine = a + b + c;
                var theirs = 1 + Math.floor(Math.random() * 6) + 1 + Math.floor(Math.random() * 6)
                    + 1 + Math.floor(Math.random() * 6);
                var same = (a === b && b === c);
                var out, text;
                if (same) {
                    out = bet * 3; text = DICE_LINES.win3;
                } else if (mine > theirs) {
                    out = Math.round(bet * 1.6); text = DICE_LINES.win2;
                } else if (mine === theirs) {
                    out = bet; text = DICE_LINES.tie;
                } else {
                    out = 0; text = DICE_LINES.lose;
                }
                player.gold += out;
                st('<div class="scene-title">开 骰</div>' +
                    '<p>你：' + a + ' ' + b + ' ' + c + '（' + mine + '）　' +
                    '庄家：' + theirs + '</p>' +
                    '<p>' + text + '</p>' +
                    '<p style="color:' + (out > bet ? '#7ab47a' : (out === 0 ? '#e85060' : '#9a9a9a')) + ';">' +
                    (out === 0 ? '输掉 ' + bet + ' 金币' :
                        (out > bet ? '净赚 ' + (out - bet) + ' 金币' : '拿回 ' + out + ' 金币')) + '</p>');
                cb();
                ab('再来一把', function() { sceneGambleDen(ring, level); });
                ab('不玩了', function() { sceneExploreDistrict(ring, level); });
            }, 'primary-btn');
        })(stakes[i]);
    }
    ab('不玩了', function() { sceneExploreDistrict(ring, level); });
}

// ---------- 卖东西：把包里用不上的换成钱 ----------
function itemValue(it) {
    if (!it) return 0;
    if (it.price) return it.price;
    if (it.value) return it.value;
    return 5;
}

function sellableItems() {
    var out = [];
    if (!player.inventory) return out;
    for (var i = 0; i < player.inventory.length; i++) {
        var it = player.inventory[i];
        if (!it || !it.name) continue;
        out.push(it);
    }
    return out;
}

function sceneSellItems(ring, level) {
    var list = sellableItems();
    var html = '<div class="scene-title">' + RD[ring][level].name + ' · 收购</div>';
    if (!list.length) {
        html += '<p>你包里没什么能卖的东西。</p>';
    } else {
        html += '<p style="font-size:0.86em;color:#9a9a9a;">' +
            '店主按半价收。他不问你哪来的，你也别问他怎么出手。</p>';
    }
    st(html);
    cb();

    for (var i = 0; i < list.length; i++) {
        (function(it) {
            var v = Math.max(1, Math.floor(itemValue(it) * 0.5));
            ab('卖掉 ' + it.name + '（+' + v + ' 金币）', function() {
                // 直接在背包里找，别用 hasItem（它查的是另一套账）
                var _idx = -1;
                for (var _k = 0; _k < (player.inventory || []).length; _k++) {
                    if (player.inventory[_k] === it) { _idx = _k; break; }
                }
                if (_idx < 0) { sceneSellItems(ring, level); return; }
                player.inventory.splice(_idx, 1);
                player.gold += v;
                addTime(5);
                toast('卖出 ' + it.name + '，+' + v + ' 金币');
                sceneSellItems(ring, level);
            });
        })(list[i]);
    }

    ab('不卖了', function() { districtShopMenu(ring, level); });
}

// 把两个入口接到该去的地方
function addGamblePlace(ring, level) {
    if (ring !== '贪婪之环') return;
    if (level !== 'poor') return;
    ab('铜板巷的赌桌', function() { addTime(8); sceneGambleDen(ring, level); });
}

// 派系事务 / 工作加钟 / 委托板
// 三个系统原来都只有一层：能加入、能打工、能接任务。
// 但加入之后没有事做，打工没有上升，任务只有随机给的那几单。

var FACTION_RANK = [
    { min: 0,  name: '记名',   mul: 1.0 },
    { min: 30, name: '执事',   mul: 1.25 },
    { min: 80, name: '干事',   mul: 1.6 },
    { min: 160, name: '核心',  mul: 2.0 }
];

function factionOfRing(ring) {
    return (window.factions && window.factions[ring]) ? window.factions[ring] : null;
}

function factionRank(ring) {
    if (!player.factionFavor) player.factionFavor = {};
    var f = player.factionFavor[ring] || 0;
    var r = FACTION_RANK[0];
    for (var i = 0; i < FACTION_RANK.length; i++) if (f >= FACTION_RANK[i].min) r = FACTION_RANK[i];
    return { favor: f, rank: r };
}

var FACTION_DUTIES = [
    { label: '替会里跑一趟腿', min: 30, gold: [12, 20], favor: 6,
      line: '一趟腿而已。你在门房那儿报了名字，对方连头都没抬，只把封好的东西推过来。' },
    { label: '在门口站两个钟头', min: 60, gold: [20, 34], favor: 10,
      line: '站就是站着。有人进出，你记下脸；有人想进，你拦住。没人教过你怎么拦，你自己看出来的。' },
    { label: '跟人出去一趟，别多问', min: 90, gold: [35, 60], favor: 16,
      line: '对方一路上没说话，你也没问。回来的路上他忽然说：「你比上一个懂事。」' }
];

function sceneFactionHall(ring, level) {
    var f = factionOfRing(ring);
    if (!f) { ab('离开', function() { districtPeopleMenu(ring, level); }); return; }

    if (player.faction !== ring) {
        st('<div class="scene-title">' + f.name + '</div>' +
            '<p>' + f.desc + '</p>' +
            '<p style="font-size:0.86em;color:#9a9a9a;">' +
            (player.faction ? '你已经是别处的人了。这里不会给你位置。' : '他们只收自己人。') + '</p>');
        cb();
        ab('离开', function() { districtPeopleMenu(ring, level); });
        return;
    }

    var info = factionRank(ring);
    var todayKey = 'facduty_d' + (player.daysSurvived || 1) + '_' + ring;
    player.flags = player.flags || {};
    var done = player.flags[todayKey] || 0;

    st('<div class="scene-title">' + f.name + ' · 事务</div>' +
        '<p>' + f.desc + '</p>' +
        '<p style="font-size:0.88em;">你的位置：<b>' + info.rank.name + '</b>' +
        '（贡献 ' + info.favor + '）　报酬系数 ×' + info.rank.mul + '</p>' +
        '<p style="font-size:0.84em;color:' + (done >= 3 ? '#c09080' : '#7ab47a') + ';">' +
        (done >= 3 ? '今天的事已经做完了。会里不缺你这一趟。' : '今天还能做 ' + (3 - done) + ' 件事。') + '</p>');
    cb();

    if (done < 3) {
        for (var i = 0; i < FACTION_DUTIES.length; i++) {
            (function(duty, idx) {
                ab(duty.label + '（' + duty.min + ' 分钟）', function() {
                    player.flags[todayKey] = (player.flags[todayKey] || 0) + 1;
                    addTime(duty.min);
                    var g = Math.round((duty.gold[0] + Math.floor(Math.random() * (duty.gold[1] - duty.gold[0] + 1))) * info.rank.mul);
                    player.gold += g;
                    if (!player.factionFavor) player.factionFavor = {};
                    player.factionFavor[ring] = (player.factionFavor[ring] || 0) + duty.favor;
                    var ni = factionRank(ring);
                    var up = (ni.rank.name !== info.rank.name);
                    st('<p>' + duty.line + '</p>' +
                        '<p style="color:#7ab47a;">金币 +' + g + '　贡献 +' + duty.favor + '</p>' +
                        (up ? '<p class="highlight">会里给你换了称呼：' + ni.rank.name + '。报酬系数 ×' + ni.rank.mul + '。</p>' : ''));
                    cb();
                    ab('回去', function() { sceneFactionHall(ring, level); });
                });
            })(FACTION_DUTIES[i], i);
        }
    }
    ab('离开', function() { districtPeopleMenu(ring, level); });
}

// ---------- 工作加钟：同一天多做一班，钱多但身体垮得快 ----------
function sceneOvertime(ring, level) {
    var pay = 18 + Math.round((player.strength || 0) * 0.8) + Math.round((player.agility || 0) * 0.5);
    st('<div class="scene-title">加班</div>' +
        '<p>监工说今天缺人手，问你要不要再顶一班。</p>' +
        '<p style="font-size:0.86em;color:#c09080;">顶一班：' + pay + ' 金币，两小时，' +
        'HP −12、疲劳 +25。累了不给你换人。</p>');
    cb();
    ab('顶这一班', function() {
        addTime(120);
        player.gold += pay;
        player.hp = Math.max(1, (player.hp || 0) - 12);
        player.fatigue = Math.min(100, (player.fatigue || 0) + 25);
        st('<p>你顶完了这一班。收工的时候手抬不起来，但钱是现的。</p>' +
            '<p style="color:#7ab47a;">金币 +' + pay + '</p>');
        cb();
        ab('回去', function() { districtWorkMenu(ring, level); });
    }, 'primary-btn');
    ab('不了，我还想活着', function() { districtWorkMenu(ring, level); });
}

// ---------- 委托板：把现成的活写成委托，接了就得按期交 ----------
function makeBoardTask(ring, level) {
    var pool = [
        { title: '把一封信送到隔壁街', desc: '收信人没有名字，只有一个门牌。送到就行，别问。',
          need: 'explore', gold: 25, exp: 12, days: 2, ring: ring },
        { title: '替人看一夜门', desc: '从入夜看到天亮。中间有人来，你就说里面没人。',
          need: 'explore', gold: 40, exp: 18, days: 3, ring: ring },
        { title: '找一件丢了的东西', desc: '失主说不清是什么样子，只说「银的，很小」。',
          need: 'explore', gold: 35, exp: 15, days: 3, ring: ring },
        { title: '陪一个人走完这段夜路', desc: '他不肯说为什么需要人陪。走完就好。',
          need: 'explore', gold: 30, exp: 20, days: 2, ring: ring }
    ];
    var t = pool[Math.floor(Math.random() * pool.length)];
    var task = {
        id: 'board_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        title: t.title, desc: t.desc,
        deadline: (player.daysSurvived || 1) + t.days,
        rewardGold: t.gold, rewardExp: t.exp,
        type: t.need, target: t.ring,
        boardRing: ring, boardLevel: level,
        status: 'active', progress: 0, needCount: 3
    };
    return task;
}

function sceneTaskBoard(ring, level) {
    st('<div class="scene-title">委托板</div>' +
        '<p>一块钉在墙上的木板，上面用图钉按着几张纸。' +
        '大部分已经泛黄，边角卷起来，是没人接的。</p>' +
        '<p style="font-size:0.86em;color:#9a9a9a;">板上现在挂着 ' +
        Math.max(1, 4 - (player.activeTasks || []).length) + ' 张还能接的。</p>');
    cb();

    if ((player.activeTasks || []).length >= 3) {
        ab('你手上已经有三单了', function() { districtPeopleMenu(ring, level); }, 'disabled-btn');
        return;
    }

    var shown = 3;
    for (var i = 0; i < shown; i++) {
        (function() {
            var t = makeBoardTask(ring, level);
            ab(t.title + '（' + t.rewardGold + ' 金币，' + (t.deadline - (player.daysSurvived || 1)) + ' 天内）',
                function() {
                    st('<div class="scene-title">' + t.title + '</div><p>' + t.desc + '</p>' +
                        '<p style="font-size:0.86em;color:#9a9a9a;">报酬 ' + t.rewardGold +
                        ' 金币，' + t.rewardExp + ' 经验。期限：第 ' + t.deadline + ' 天。</p>');
                    cb();
                    ab('接下', function() { acceptTask(t); }, 'primary-btn');
                    ab('放回去', function() { sceneTaskBoard(ring, level); });
                });
        })();
    }
    ab('离开', function() { districtPeopleMenu(ring, level); });
}

                    '「台下那些东西，我一个都不认识。灯一亮，我就得唱给他们听。」' +
                    '「你不一样。」他说，「你在后台。」',
              then: '那点东西的药效过去了，他还坐在你旁边，没走。' }
        ],
        earle: [
            { text: '暴怒环边缘的废弃小巷，有人在小声地哭。' +
                    '厄尔蜷在墙角，灰白的左手死死掐着自己暗红色的右半边脖子，指甲抠进肉里，' +
                    '右边的三只眼睛却睁着，兴奋地转。' +
                    '「杀了我。」左边哭着说，「求求你，随便什么，捅这里。」' +
                    '「别听这个废物的。」右边的嘴角猛地扯上去，声音一下变得又冷又尖，' +
                    '「过来啊，让我看看你的肠子是什么颜色。」' +
                    '黑血从他右眼角淌下来，滴在地上，嘶地烧出一个小坑。' +
                    '他抬起眼看你，一张脸上两种神情，同时看着你。',
              then: '你站着没动。两边都没再说话，只是看着你。' },
            { text: '你第二次去的时候，他缩在一个倒扣的木箱后面。' +
                    '「别出声。」左边的声音压得极低，抖得厉害，' +
                    '「是他的脚步声。皮鞋，右脚有点拖。」' +
                    '巷口真的有人走过，走得很慢，嘴里哼着什么调子。' +
                    '厄尔整个人贴在箱子上，右边的三只眼睛全闭上了——他连看都不敢看。' +
                    '脚步声远了以后，他才敢喘气。' +
                    '「他每次来，都是笑着的。」厄尔说，' +
                    '「他说『我来看看我的成功』。」' +
                    '「你能不能，」左边的声音忽然抓住你的袖子，' +
                    '「下次他问起，你说没见过我。」',
              then: '你答应了。他松开手的时候，袖子已经被捏皱了。' }
        ],
        ciper: [
            { text: '你还没看清，手已经伸进你口袋里了。' +
                    '西珀倒挂在屋檐上，雪白的碎发往下坠，一只手捏着你的东西翻来覆去地看。' +
                    '「铜板，三枚。药，半包。」他撇了撇嘴，把东西塞回你怀里，' +
                    '「不好玩。」' +
                    '尾巴一甩，他人已经蹲到你旁边了，离得极近，' +
                    '「你身上有没有那种——很难拿到的东西？」' +
                    '「我不缺钱。」他说得很干脆，' +
                    '「我就要那种，很多人看着、很多锁锁着、别人一辈子碰不到的。」' +
                    '他歪着头看你，「有的话，叫上我。」',
              then: '说完他就不见了。你回头，屋檐上什么都没有。' },
            { text: '「跟我来。」他从高处跳下来，落地没有声音。' +
                    '你被他带到一条巷子深处，一面墙上嵌着一个保险柜，锁孔复杂得不像给人用的。' +
                    '他蹲下去，拆开工具包，一坐就是三个时辰。' +
                    '你问他里面有什么。他说不知道。' +
                    '「问了就不想拆了。」他头也不抬，' +
                    '「我要是知道里面是什么，这锁就没意思了。」' +
                    '锁开了。里面是空的。' +
                    '他看了一会儿，忽然笑起来，笑得很响，像风铃，' +
                    '「空的多好啊。」他说，' +
                    '「说明难的部分是我的，好玩的部分也是我的。」',
              then: '那面墙他再没去过。锁孔里插着一张折好的纸飞机。' }
        ]
    };
    for (var id in T) {
        var st = NPC_STORY[id];
        if (!st || !st.stages) continue;
        for (var k = 0; k < T[id].length && k < 2; k++) {
            st.stages[k].text = T[id][k].text;
            if (T[id][k].then) st.stages[k].then = T[id][k].then;
        }
    }

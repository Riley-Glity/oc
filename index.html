            padding: 6px 4px;
            min-height: 32px;
            border-radius: 6px;
            background: rgba(24, 6, 16, 0.6);
            border-color: rgba(40, 10, 20, 0.4);
        }

        #sidebar-tabs button.active {
            border-color: #c04050;
            color: #ff8090;
            background: rgba(30, 8, 18, 0.8);
            box-shadow: 0 0 20px rgba(200, 40, 60, 0.05);
        }

        /* 内容区点击选项优化 */
        #text-content .clickable {
            padding: 10px 16px;
            min-height: 44px;
            display: inline-block;
            line-height: 1.5;
            margin: 4px 0;
            border-radius: 8px;
            background: rgba(20, 4, 10, 0.4);
            border: 1px solid rgba(40, 10, 20, 0.2);
            transition: all 0.25s ease;
            text-decoration: none;
            color: #d4a040;
            font-weight: normal;
            width: 100%;
            text-align: left;
        }

        #text-content .clickable:active {
            background: rgba(200, 80, 40, 0.12);
            border-color: rgba(200, 80, 40, 0.3);
            transform: scale(0.98);
            box-shadow: 0 0 24px rgba(200, 80, 40, 0.05);
        }

        #text-content .clickable.danger {
            color: #e85060;
            border-color: rgba(200, 40, 60, 0.2);
        }

        #text-content .clickable.danger:active {
            background: rgba(200, 40, 60, 0.12);
            border-color: rgba(200, 40, 60, 0.3);
        }

        #text-content .clickable.gold {
            color: #e8c060;
            border-color: rgba(200, 180, 60, 0.15);
        }

        #text-content .clickable.gold:active {
            background: rgba(200, 180, 60, 0.08);
            border-color: rgba(200, 180, 60, 0.25);
        }

        /* 场景标题优化 */
        .scene-title {
            font-size: 1.1em;
            letter-spacing: 0.15em;
            color: #e8c060;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(200, 180, 60, 0.1);
            text-shadow: 0 0 30px rgba(200, 180, 60, 0.05);
        }
        /* 成就弹出通知样式 */
        .achievement-popup {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            width: 280px; background: rgba(18, 1, 8, 0.95); border: 1px solid #d4a040;
            border-radius: 12px; padding: 12px 16px; z-index: 2000;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212,160,64,0.2);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; pointer-events: auto;
        }
        .achievement-popup.show { top: 30px; }
        .achievement-popup .popup-icon { font-size: 24px; filter: drop-shadow(0 0 5px rgba(212,160,64,0.5)); }
        .achievement-popup .popup-content { flex: 1; }
        .achievement-popup .popup-title { font-size: 0.85em; color: #e8c060; font-weight: bold; margin-bottom: 2px; }
        .achievement-popup .popup-desc { font-size: 0.7em; color: #9a6a6a; line-height: 1.3; }
        .achievement-popup .popup-badge { font-size: 0.55em; color: #5a2a30; text-transform: uppercase; margin-top: 4px; letter-spacing: 1px; }
        
        .achievement-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(212,160,64,0.15) 0%, transparent 70%);
            z-index: 1999; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }
        .achievement-flash.show { opacity: 1; }

/* ==================== v0.8 新增：状态条 / 提示 / 响应式 ==================== */
.qs-blue { color: #7fa8d8; }

#stat-bars {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    padding: 6px 16px 8px; background: #0a0106;
    border-bottom: 1px solid #200a10; flex-shrink: 0;
}
.statbar { display: flex; align-items: center; gap: 5px; font-size: 0.66em; min-width: 118px; flex: 1 1 118px; }
.statbar .sb-name { color: #6a5a5a; width: 26px; flex-shrink: 0; letter-spacing: 0.05em; }
.statbar .sb-track {
    flex: 1; height: 6px; background: #180410; border-radius: 3px; overflow: hidden;
    border: 1px solid #240a14;
}
.statbar .sb-fill { height: 100%; width: 100%; transition: width 0.35s ease, background 0.35s ease; border-radius: 3px; }
.statbar .sb-num { color: #8a6a6a; width: 26px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.sb-hp    { background: linear-gradient(90deg, #7a1020, #e85060); }
.sb-san   { background: linear-gradient(90deg, #2a3a6a, #7fa8d8); }
.sb-food  { background: linear-gradient(90deg, #6a4a10, #d4a040); }
.sb-fat   { background: linear-gradient(90deg, #3a1a4a, #9a6ac0); }
.sb-des   { background: linear-gradient(90deg, #6a1030, #e06090); }
.sb-hyg   { background: linear-gradient(90deg, #10505a, #60c0c0); }
.sb-cloth { background: linear-gradient(90deg, #3a3a2a, #a0a060); }
.statbar.low .sb-fill { animation: sbPulse 1.4s ease-in-out infinite; }
@keyframes sbPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

/* 提示层 */
#toast-layer {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 3000; display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; width: min(420px, calc(100% - 24px));
}
.toast {
    background: rgba(18, 2, 10, 0.96);
    border: 1px solid #3a1020; border-left: 3px solid #d4a040;
    border-radius: 6px; padding: 8px 12px; font-size: 0.78em; color: #c8a888;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    animation: toastIn 0.35s ease, toastOut 0.4s ease 3.4s forwards;
    line-height: 1.5;
}
.toast.warn { border-left-color: #e85060; color: #e0a8a8; }
.toast.good { border-left-color: #80c080; color: #a8d0a8; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

/* 侧栏标签可换行，避免挤成一坨 */
#sidebar-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
#sidebar-tabs button { flex: 1 1 auto; font-size: 0.7em; padding: 5px 6px; }

/* 键盘提示 */
.kbd-hint { font-size: 0.68em; color: #4a3a3a; text-align: right; padding: 2px 16px 4px; }


/* ==================== v0.10 · DoL 式紧凑界面 ==================== */

/* 分组主按钮：一行一个，左对齐，去掉花哨边框 */
.clickable.nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    margin: 5px 0;
    background: #14070f;
    border: 1px solid #2e1220;
    border-left: 2px solid #6a4030;
    border-radius: 4px;
    color: #c8a888;
    font-size: 0.86em;
    letter-spacing: 0.04em;
    transition: background 0.12s, border-left-color 0.12s;
}
.clickable.nav-btn:hover {
    background: #1e0c18;
    border-left-color: #d4a040;
    color: #e8d0b0;
}

/* 禁用项 */
.clickable.disabled-btn {
    color: #4e3e44;
    border-left-color: #2a1a20;
    cursor: not-allowed;
}
.clickable.disabled-btn:hover { background: #14070f; border-left-color: #2a1a20; color: #4e3e44; }

/* 子菜单说明 */
.menu-intro {
    font-size: 0.78em;
    color: #8a6a72;
    line-height: 1.6;
    margin: 2px 0 8px;
}

/* 子菜单里的普通条目：比主菜单轻 */
.scene-submenu .clickable {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    margin: 3px 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid #22101a;
    border-radius: 0;
    font-size: 0.82em;
    color: #b09088;
}
.scene-submenu .clickable:hover { background: #180a12; color: #e0c0a8; }

/* ==================== 存档面板 ==================== */
.save-section { padding: 4px 2px; }
.panel-title {
    font-size: 0.8em; color: #d4a040; letter-spacing: 0.3em;
    text-align: center; margin: 6px 0 12px;
}

.slot-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 8px 6px;
    border-bottom: 1px solid #1e0e18;
    font-size: 0.74em;
}
.slot-row.empty { opacity: 0.45; }
.slot-name { color: #a08078; min-width: 3.4em; }
.slot-meta { color: #7a6068; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-btns { display: flex; gap: 4px; }

button.mini {
    font-family: inherit;
    font-size: 0.95em;
    padding: 3px 9px;
    background: #1a0e16;
    border: 1px solid #33202c;
    border-radius: 3px;
    color: #b8a09a;
    cursor: pointer;
}
button.mini:hover { background: #26141f; color: #e0c8b8; }
button.mini.danger { border-color: #4a1a24; color: #c07078; }
button.mini.danger:hover { background: #2a0c14; color: #e85060; }

.save-io { display: flex; gap: 6px; margin-top: 12px; }
button.wide {
    flex: 1;
    font-family: inherit;
    font-size: 0.76em;
    padding: 9px 8px;
    background: #140a12;
    border: 1px solid #2a1522;
    border-radius: 4px;
    color: #b09890;
    cursor: pointer;
}
button.wide:hover { background: #1e0e18; color: #e0c8b8; }
button.wide.danger { border-color: #4a1a24; color: #c07078; width: 100%; flex: none; }
button.wide.danger:hover { background: #2a0c14; color: #e85060; }

/* 窄屏时按钮区域不再撑满，避免误触 */
@media (max-width: 420px) {
    .clickable.nav-btn { padding: 12px 12px; font-size: 0.9em; }
    .slot-row { font-size: 0.7em; }
}

/* ==================== v0.11 · 建角界面 ==================== */

/* 步骤条 */
.step-line {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 2px 12px; font-size: 0.7em; color: #6a4a52;
}
.step-dot {
    width: 18px; height: 18px; line-height: 18px; text-align: center;
    border-radius: 50%; border: 1px solid #3a2028; color: #6a4a52;
    font-size: 0.9em; flex: none;
}
.step-dot.done { border-color: #4a6a4a; color: #80a080; }
.step-dot.now { border-color: #d4a040; color: #e8c060; box-shadow: 0 0 8px rgba(212,160,64,0.35); }
.step-bar { flex: 1; height: 1px; background: #2a1820; }
.step-bar.done { background: #3a4a3a; }
.step-label { margin-left: 8px; letter-spacing: 0.1em; color: #8a6a72; }

/* 字段标签 */
.field-label {
    margin: 16px 0 8px; font-size: 0.78em; letter-spacing: 0.25em;
    color: #c09080; border-left: 2px solid #6a2a34; padding-left: 8px;
}
.field-note {
    margin-top: 8px; font-size: 0.76em; line-height: 1.6; color: #8a6a72;
    min-height: 1.2em;
}

/* 选择卡片 */
.choice-row { display: flex; gap: 8px; flex-wrap: wrap; }
.choice-card {
    flex: 1 1 180px;
    padding: 12px 14px;
    background: #10060c;
    border: 1px solid #2e1420;
    border-radius: 5px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
}
.choice-card:hover { background: #180a12; border-color: #4a2430; }
.choice-card .cc-name { font-size: 0.92em; color: #d0b0a0; letter-spacing: 0.08em; }
.choice-card .cc-desc { margin-top: 6px; font-size: 0.72em; line-height: 1.55; color: #7a6068; }
.choice-card .cc-mark { margin-top: 8px; font-size: 0.68em; color: #4e3e44; letter-spacing: 0.1em; }
.choice-card.compact { flex: 0 1 auto; min-width: 96px; text-align: center; padding: 10px 12px; }
.choice-card.compact .cc-mark { margin-top: 6px; }

/* 选中态：边框发光 + 底色 + ✓ */
.choice-card.sel {
    background: #1e0a14;
    border-color: #d4a040;
    box-shadow: 0 0 0 1px rgba(212,160,64,0.25), inset 0 0 18px rgba(212,160,64,0.07);
}
.choice-card.sel .cc-name { color: #f0d090; }
.choice-card.sel .cc-desc { color: #a88a78; }
.choice-card.sel .cc-mark { color: #80c080; }

/* 校验失败时抖一下 */
@keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    80% { transform: translateX(-2px); }
}
.choice-row.shake { animation: shakeX 0.35s ease; }

/* 行内错误 + 汇总 */
.create-err { margin-top: 8px; font-size: 0.76em; color: #e85060; min-height: 1.2em; }
.create-summary { margin-top: 4px; font-size: 0.78em; color: #8a6a72; }

/* 外貌 chip 面板 */
.chip-panel {
    background: rgba(16, 6, 12, 0.7);
    border: 1px solid #2a1420;
    border-radius: 5px;
    padding: 12px 14px;
}
.chip-group { margin-bottom: 12px; }
.chip-group:last-child { margin-bottom: 0; }
.chip-label {
    font-size: 0.72em; color: #8a6a72; letter-spacing: 0.2em; margin-bottom: 6px;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    display: inline-block;
    padding: 5px 11px;
    font-size: 0.76em;
    color: #a08880;
    background: #140a12;
    border: 1px solid #2a1822;
    border-radius: 3px;
    cursor: pointer;
    transition: 0.12s;
    user-select: none;
}
.chip:hover { background: #1e0e18; color: #d0b0a0; border-color: #4a2430; }
.chip.sel {
    background: #2a1018;
    border-color: #d4a040;
    color: #f0d090;
    box-shadow: 0 0 0 1px rgba(212,160,64,0.2);
}

/* 外貌预览 */
.appearance-preview {
    margin-top: 14px; line-height: 1.9; font-style: italic;
    font-size: 0.85em; padding: 10px 12px;
    border-left: 3px solid #5a1a28;
    background: rgba(0, 0, 0, 0.3);
    color: #c0a090;
}

@media (max-width: 420px) {
    .choice-card { flex: 1 1 100%; }
    .step-label { font-size: 0.9em; }
}

/* ==================== v0.12 · 七环地图 ==================== */

.world-map {
    display: block;
    width: 100%;
    max-width: 720px;
    margin: 10px auto 6px;
    border: 1px solid #2a1018;
    border-radius: 6px;
    background: #070104;
    user-select: none;
}

/* 连线 */
.map-edge { stroke: #241018; stroke-width: 1.5; }
.map-edge.adj { stroke: #5a2a38; stroke-width: 2; }

/* 中心 */
.map-core { fill: #c8a070; font-size: 19px; letter-spacing: 4px; font-weight: bold; }
.map-core-sub { fill: #7a5a52; font-size: 11px; letter-spacing: 3px; }

/* 节点 */
.map-node { cursor: pointer; }
.map-node .mn-box {
    fill: #0f0509;
    stroke: #2e1420;
    stroke-width: 1.2;
    transition: 0.15s;
}
.map-node .mn-title { fill: #b09088; font-size: 17px; letter-spacing: 2px; font-weight: bold; }
.map-node .mn-sub { fill: #6a5058; font-size: 10.5px; }

.map-node.far { cursor: not-allowed; opacity: 0.42; }
.map-node.far .mn-box { stroke-dasharray: 3 3; }
.map-node.far:hover .mn-box { stroke: #3a2028; }

.map-node.adj .mn-box { stroke: #a07040; fill: #16070d; }
.map-node.adj:hover .mn-box { stroke: #e8c060; fill: #221018; }
.map-node.adj .mn-title { fill: #d8b48c; }

.map-node.cur .mn-box {
    stroke: #e8c060;
    stroke-width: 2;
    fill: #24100c;
    filter: url(#mapGlow);
}
.map-node.cur .mn-title { fill: #ffe0a0; }
.map-node.cur .mn-sub { fill: #c09080; }

.map-node.broke.adj { opacity: 0.7; }

/* 三层小格 */
.mn-pip { fill: #1c0a12; stroke: #2e1420; stroke-width: 0.6; }
.mn-pip.reach { fill: #3a2018; stroke: #6a4030; }
.mn-pip.on { fill: #e8c060; stroke: #ffe0a0; }

/* 角标 */
.mn-tag { font-size: 9px; }
.mn-tag.here { fill: #e8c060; }
.mn-tag.need { fill: #a06050; }

/* 图例 */
.map-legend {
    display: flex; flex-wrap: wrap; gap: 14px;
    justify-content: center;
    margin: 4px 0 10px;
    font-size: 0.7em;
    color: #6a5058;
}
.map-legend .lg { white-space: nowrap; }
.map-legend .lg.cur { color: #e8c060; }
.map-legend .lg.adj { color: #a07040; }
.map-legend .lg.far { color: #4a3038; }
.map-legend .lg.pip { color: #5a4048; }

@media (max-width: 560px) {
    .map-legend { gap: 8px; font-size: 0.65em; }
}


/* ==================================================================
   桌面端适配
   原本是照手机竖屏写的：正文铺满整个宽度，在 1920 屏幕上会长到
   一行六七十个字，读起来很累，按钮也挤成一条。
   这里把正文收进中间一栏，字号放大，按钮改成整行块级。
   ================================================================== */

@media (min-width: 900px) {
    #text-area {
        padding: 28px 40px 56px;
        scrollbar-width: thin;
    }
    #text-content {
        max-width: 860px;
        margin: 0 auto;
        font-size: 1.04em;
        line-height: 2.05;
    }
    #text-content p { margin: 0 0 1em; }

    /* 选项：整行块级，左边对齐，鼠标好点 */
    #text-content .clickable {
        display: block;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        padding: 12px 18px;
        margin: 9px 0;
        font-size: 1em;
        line-height: 1.6;
        border-radius: 5px;
    }
    #text-content .clickable:hover {
        background: rgba(200, 40, 60, 0.14);
        border-color: #8a2a3a;
    }
    #text-content .clickable:active { transform: translateY(1px); }
    #text-content .primary-btn { border-left: 3px solid #e8c060; }
    #text-content .danger-btn { border-left: 3px solid #e85060; }
    #text-content .disabled-btn {
        opacity: 0.55;
        cursor: default;
        border-left: 3px solid #3a2a30;
    }
    #text-content .disabled-btn:hover { background: none; border-color: inherit; }

    /* 顶栏与状态条也跟着收一栏 */
    #topbar { padding: 13px 32px; }
    #quick-stats {
        padding: 10px 32px 10px;
        gap: 8px 24px;
        font-size: 0.82em;
        justify-content: center;
    }
    #sidebar { width: 420px; }
    #main.sidebar-open { margin-right: 420px; }

    /* 滚动条 */
    #text-area::-webkit-scrollbar { width: 10px; }
    #text-area::-webkit-scrollbar-track { background: #0a0005; }
    #text-area::-webkit-scrollbar-thumb { background: #3a1020; border-radius: 5px; }
    #text-area::-webkit-scrollbar-thumb:hover { background: #5a1a28; }

    /* 场景标题别缩在左边 */
    .scene-title { font-size: 1.12em; margin-bottom: 18px; }
}

@media (min-width: 1500px) {
    #text-content { max-width: 960px; font-size: 1.07em; }
    #text-area { padding: 34px 60px 64px; }
}

/* 键盘可见焦点（桌面用户会 Tab） */
#text-content .clickable:focus-visible,
#menuBtn:focus-visible {
    outline: 2px solid #e8c060;
    outline-offset: 2px;
}

/* 简洁化：去掉多余装饰，收紧间距 */
#text-content .divider { letter-spacing: 0.1em; color: #3a1a20; margin: 14px 0; }
#text-content p { margin: 0 0 0.85em; }
.scene-title { letter-spacing: 0.08em; }
#quick-stats { border-bottom: 1px solid #1a060c; }
#topbar .title { letter-spacing: 0.05em; }
#text-content .clickable { border: 1px solid #2a0e18; background: rgba(255,255,255,0.012); }
#text-content .clickable:hover { background: rgba(220,60,90,0.10); border-color: #6a2030; }
#text-content .disabled-btn { background: none; opacity: 0.5; }

</style>
</head>
<body>
<div id="app">
    <div id="main">
        <div id="topbar">
            <div>
                <div class="title">七环地狱</div>
                <div class="subtitle">傲慢之醒 <span style="font-size:0.65em;color:#6a5a5a;margin-left:6px;">v0.8.0</span></div>
            </div>
            <button id="menuBtn" onclick="toggleSidebar()">⚙️ 属性</button>
        </div>
        <div id="quick-stats">
            <span><span class="qs-label">时间</span> <span class="qs-time" id="qs-time">08:00</span></span>
            <span><span class="qs-label">日期</span> <span class="qs-val" id="qs-date">第1天</span></span>
            <span><span class="qs-label">姓名</span> <span class="qs-special" id="qs-name">???</span></span>

var RD = {
    '傲慢之环': {
        poor: {
            name: '灰烬区',
            desc: '傲慢之环的最底层，被称为“灰烬区”。这里常年不见天日，上方垂落的暗紫色光芒穿透层层阴霾到达此处时，已经变得极其稀薄黯淡。破败粗糙的街道上，随处可见游荡的低阶恶魔与堕入地狱的罪人。他们混杂在一起，在狭窄、满是污垢的巷道里警惕地穿行。街道两侧排列着高低不平、结构严重歪斜的石砌建筑。大部分房屋的沉重木门都死死紧闭着，只有少数几扇半掩的门缝里，向外透出浑浊微弱的油灯光晕。空气中弥漫着刺鼻的气味，并悬浮着大量细小的水晶粉尘。这些粉尘在周围冰冷微光的折射下，像是一层散落的星尘，缓慢而无声地在死寂的街道上空漂浮、沉降。',
            features: ['破旧酒馆', '废弃水晶矿场', '低阶市场', '流浪者聚集地', '暗巷角落'],
            featureScenes: {
                '破旧酒馆': function(ring, level) { sceneTavernTutorialIntro(ring, level); },
                '废弃水晶矿场': function(ring, level) {
                    st('<div class="scene-title">废弃水晶矿场</div><p>灰烬区的边缘地带，横亘着一座早已废弃的水晶矿场。巨大的矿坑入口大半已经被崩塌的碎石死死掩埋，只剩下一个勉强能让人通过的狭窄豁口。偶尔会有底层的拾荒者钻进这里，试图在废墟底层挖出几块残留的傲慢环水晶碎片。矿洞内部的空气极其沉闷，漂浮着呛人的矿石粉尘，并混杂着常年不见光滋生出的浓重霉味。你向矿坑深处望去，幽深的黑暗中隐约有微弱的暗紫色光芒在断续闪烁——那光晕或许来自尚未被彻底挖空的水晶矿脉，又或许是某种未知的东西。在深处微光的映照下，一块倾斜的巨大水晶板旁边坐着一个身影。那人有着一头灰色的短发，头顶的猫耳微微向后压着，透着一丝防备。他正低着头，手里握着一把小刀，刀刃抵着一块金属片，正一下下用力削刮着。金属碎屑随着刀锋的摩擦，无声地剥落掉在满是灰尘的地上。</p>');
                    addTime(5);
                    cb();
                    ab('返回', function() { sceneExploreDistrict(ring, 'middle'); });
                    addNpcButton('莱利', ring, level);
                },
                '低阶市场': function(ring, level) {
                    st('<div class="scene-title">低阶市场</div><p>灰烬区的低阶市场是一片嘈杂混乱的露天交易地。几张高低不平、木腿歪斜的破旧桌子勉强拼凑在一起，充当着临时摊位。桌面上杂乱地堆满了各种来源不明的廉价商品：锈迹斑斑的旧武器、边缘破损且沾着暗色污渍的皮质护甲、大小不一且光泽暗淡的水晶碎片，甚至还有几个浸泡在浑浊液体里、疑似从某种活物身上生剜下来的残缺器官。周围充斥着商贩们沙哑刺耳的叫卖声。他们正为了几枚金币的差价，与买家进行着激烈的讨价还价，空气里弥漫着汗臭与劣质烟草的味道。看到你走近，其中一个满脸污垢的商贩立刻停下了手里的动作。他用力向你挥了挥手，咧开嘴露出几颗发黄的牙齿。"嘿，新面孔！"他扯着沙哑的嗓子大声招呼，从杂乱的桌面上抓起一块指甲盖大小的暗紫色石头，直接递向你的方向。"看看这个——绝对上好的傲慢环水晶碎片，只要8个金币！"</p>');
                    addTime(5);
                    cb();
                    ab('购买水晶碎片（8金币）', function() {
                        if (player.gold >= 8) { player.gold -= 8; addItem('crystal_frag_' + Date.now(), '傲慢水晶碎片', 'material', '一块拇指大小的暗紫色水晶碎片，散发着微弱的冷光。', 1); st('<p>你买下了一块水晶碎片。</p>'); } else { st('<p class="highlight">金币不足。</p>'); }
                        cb(); ab('返回', function() { sceneExploreDistrict(ring, 'middle'); });
                    });
                    ab('返回', function() { sceneExploreDistrict(ring, 'middle'); });
                },
                '流浪者聚集地': function(ring, level) {
                    st('<div class="scene-title">流浪者聚集地</div><p>在灰烬区最偏僻的角落，坐落着一片混乱拥挤的流浪者聚集地。这里聚集着大量没有固定居所的低阶恶魔和罪人。地面上到处是用废弃金属板、烂木头和破布随意搭建的低矮棚屋。几个衣衫褴褛的身影正蜷缩着围坐在一起。他们的正中央放着一个用废弃铁桶改造的简易火堆，桶里燃烧着散发黑烟的燃料。空气中弥漫着浓重的劣质酒精气味和难以名状的酸臭。听到你靠近的脚步声，火堆旁的一个老者停下了动作。他缓缓抬起头，布满皱纹和污垢的脸上没有多余的表情，视线在你身上快速扫过。"新来的？"他用极其沙哑的声音开了口，随后向火堆另一侧努了努下巴。"这里没什么值钱的东西——但如果你需要消息，可以问问那边的瘸腿恶魔。他什么都知道，就是不太爱说话。"</p>');
                    addTime(5);
                    cb();
                    ab('和瘸腿恶魔交谈（耗时10分钟）', function() {
                        addTime(10);
                        var r = Math.random();
                        if (r < 0.3) {
                            st('<p>瘸腿恶魔看到你走近，微微前倾身体。他警惕地环顾了一圈四周，确认没人注意这边后，压低声音凑向你。"东边矿场深处有一条密道，通往中层区域。但那里盘踞着一些危险的东西。"</p><p style="color:#e8c060;">获得情报：废弃矿场密道。</p>');
                        } else if (r < 0.6) {
                            st('<p>瘸腿恶魔看了你一眼，随后毫无兴致地摇了摇头。他将身上破旧的衣物裹得更紧了一些，直接移开视线不再看你。"今天不想说话。改天吧。"</p>');
                        } else {
                            st('<p>瘸腿恶魔上下打量了你一番，目光在你的腰间和口袋处短暂停留。"你身上有金币吗？有的话我可以告诉你一些有趣的事。"</p>');
                            cb();
                            ab('给他3金币', function() {
                                if (player.gold >= 3) { player.gold -= 3; st('<p>你拿出3枚金币递了过去。他迅速伸手接过，熟练地将金币藏进破烂的衣兜深处。确认钱收好后，他再次凑近你，刻意压低了嗓音。"贪婪环的金丝街最近不太平——有人在大规模收购灵魂碎片。如果你有货，可以去那里碰碰运气。"</p>'); } else { st('<p class="highlight">金币不足。</p>'); }
                                cb(); ab('返回', function() { sceneExploreDistrict(ring, 'middle'); });
                            });
                            ab('拒绝', function() { sceneExploreDistrict(ring, level); });
                            return;
                        }
                        cb(); ab('返回', function() { sceneExploreDistrict(ring, 'middle'); });
                    });
                    ab('返回', function() { sceneExploreDistrict(ring, 'middle'); });
                },
                '暗巷角落': function(ring, level) {
                    st('<div class="scene-title">暗巷角落</div><p>这是一条极其狭窄的暗巷。两侧高耸的石墙将光线完全遮挡，墙面上大面积地爬满了暗色、湿滑的苔藓。巷子深处一片昏暗，寂静中不时传来单调的滴水声，以及某种微弱、低沉的痛苦呻吟。你踩过满是泥泞与污垢的地面，脚边杂乱地散落着一些破碎的陶器，以及几根已经完全发黑的残缺骨头。你注意到前方的墙角处，有一个人影正紧紧蜷缩成一团。他将自己缩在阴影里，身体正不受控制地剧烈发抖。</p>');
                    addTime(5);
                    cb();
                    ab('靠近查看', function() {
                        addTime(5);
                        var r = Math.random();
                        if (r < 0.4) {
                            st('<p>你放轻脚步靠近墙角，看清了那个发抖的人影。那是一个身受重伤的低阶恶魔。他的腹部被利器撕开了一道深可见骨的巨大伤口，暗红色的血液正不断向外涌出，浸透了周围的衣物和满是泥垢的地面。察觉到你的靠近，他费力地抬起头，满是冷汗的脸上透着濒死的虚弱。"……帮帮我……"他用极其微弱、断断续续的声音向你求救。</p>');
                            cb();
                            ab('帮他包扎（耗时10分钟）', function() {
                                addTime(10);
                                player.hp = Math.min(player.maxHp, player.hp + 5);
                                player.gold += 3;
                                st('<p>你蹲下身，从自己衣服的下摆撕下一块还算干净的布料。你将布料用力勒紧他腹部的伤口，迅速打结帮他包扎止血。恶魔靠在满是苔藓的墙壁上，喘息着看向你，眼神里透出感激。"谢谢你……我没什么值钱的东西，但这些金币你拿着。"他颤抖着手，从破烂的口袋里摸出3枚金币递给了你。你获得3金币，HP+5。</p>');

        middle: { name: '星尘区', desc: '星尘区：这里是君主直属手下的居所。所有建筑均由极其罕见的暗色星辰石砌成，每一块石砖的拼接都经过了极为严苛的计算，排列极其整齐、对称，不容许哪怕一毫米的误差。街道被高阶清洁魔打扫得一尘不染，甚至能倒映出天空惨淡的光芒。但这里的空气中没有任何声响与温度，连恶魔的呼吸声都被刻意压制，透着一股死寂的冰冷与令人窒息的压迫感，仿佛每一次心跳都是对这里完美秩序的亵渎。', features: ['审判厅附属建筑', '执事宿舍', '档案库', '训练场'] },

// 统一的读档还原：以全新状态为底，避免旧存档残留当前局的分支/派系数据
function applyLoadedPlayer(data) {
    if (!data || typeof data !== 'object') throw new Error('存档数据为空');
    var base = createCleanPlayerState(data.name, data.race, data.gender, data.sin, data.birthRing);
    for (var k in base) {
        if (!base.hasOwnProperty(k)) continue;
        if (data[k] === undefined) base[k] = base[k];
        else base[k] = data[k];
    }
    for (var k2 in data) {
        if (data.hasOwnProperty(k2) && base[k2] === undefined) base[k2] = data[k2];
    }
    base.flags = base.flags || {};
    base.relationships = base.relationships || {};
    base.inventory = base.inventory || [];
    base.buffs = base.buffs || [];
    base.achievements = base.achievements || [];
    base.activeTasks = base.activeTasks || [];
    base.npcTalkDaily = base.npcTalkDaily || {};
    base.storyProgress = base.storyProgress || {};
    base.stats = base.stats || { battlesWon: 0, battlesLost: 0, npcsMet: 0, ringsVisited: [], tasksCompleted: 0, itemsCrafted: 0, monstersSlain: 0 };
    base.factionReputation = base.factionReputation || {};
    // 清理瞬时状态
    base.gameOver = false;
    base.flags.isSleeping = false;
    base.flags.isFainting = false;
    base.buffs.forEach(function(b) {
        if (b.startAbsolute === undefined && b.startTime !== undefined) {
            b.startAbsolute = (base.daysSurvived || 0) * 1440 + b.startTime;
        }
    });
    for (var k3 in base) { if (base.hasOwnProperty(k3)) player[k3] = base[k3]; }
    unlockScreen();
    return player;
}

function importSaveFile(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            applyLoadedPlayer(data.player || data);
            saveToSlot(0);
            checkHp();
            ua();
            st('<p style="color:#e8c060;">导入成功！已自动保存到槽位1。</p>');
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing || "傲慢之环", getCurrentLevel()); });
        } catch (err) {
            st('<p class="highlight">格式错误。</p>');
            cb();
            ab('返回', function() { switchTab('save'); });
        }
    };
    reader.readAsText(file);
}

function playSound(freq = 600, duration = 0.1, vol = 0.15) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + duration);
    } catch(e) {}
}

// 状态条：宽度按比例，低于 25% 加脉冲提醒
function renderStatBars() {
    var bars = [
        { id: 'hp',    val: player.hp,      max: player.maxHp },
        { id: 'san',   val: player.sanity,  max: player.maxSanity },
        { id: 'food',  val: player.food,    max: player.maxFood },
        { id: 'fat',   val: player.fatigue, max: player.maxFatigue, invert: true },
        { id: 'des',   val: player.desire,  max: player.maxDesire, invert: true },
        { id: 'hyg',   val: player.hygiene === undefined ? 80 : player.hygiene, max: player.maxHygiene || 100 },
        { id: 'cloth', val: player.clothingCondition === undefined ? 100 : player.clothingCondition, max: player.clothingMax || 100 }
    ];
    for (var i = 0; i < bars.length; i++) {
        var b = bars[i];
        var fill = document.getElementById('bar-' + b.id);
        var num = document.getElementById('num-' + b.id);
        if (!fill) continue;
        var mx = b.max || 1;
        var pct = Math.max(0, Math.min(100, (b.val / mx) * 100));
        fill.style.width = pct + '%';
        if (num) num.textContent = Math.round(b.val);
        var critical = b.invert ? pct >= 80 : pct <= 25;
        var wrap = fill.parentNode && fill.parentNode.parentNode ? fill.parentNode.parentNode : null;
        if (wrap && wrap.classList) wrap.classList.toggle('low', critical);
    }
}

    setTimeout(function() {

    }, 4200);
}

// ==================== Buff / 属性修正引擎（重写） ====================
// 旧实现在加/减两侧都做 Math.max(1, ...) 截断，导致疲劳层反复叠加后
// 力量/敏捷被永久抬高；食物加成也从不回收。现在每个 buff 记录
// 「实际生效的增量」(applied)，到期时按记录精确回滚。
var buffMod = {
    'weapon_attack': { strength: 3 },
    'armor_defense': { agility: 2 },
    'crystal_dust': { magic: 1 },
    'energy_drink': { magic: 1 },
    'gold_chocolate': { charisma: 1 },
    'lava_meat': { strength: 1 },
    'desire_wine': { charisma: 1 },
    'stew_fill': {},
    'lazy_rest': { sanity: 1 },
    'velvet_satisfaction': { charisma: 2 },
    'dark_deed': { agility: 1 },
    'scavenger_eye': { agility: 1 },
    'fatigue_layer_1': { strength: -1, agility: -1 },
    'fatigue_layer_2': { strength: -2, agility: -2 },
    'fatigue_layer_3': { strength: -3, agility: -3 },
    'fatigue_layer_4': { strength: -4, agility: -4 },
    'fatigue_layer_5': { strength: -5, agility: -5 },
    'exhausted': { strength: -2, agility: -2 },
    'starvation': { strength: -2, agility: -2 },
    'satiety': {}
};

// 统一数值边界：属性 0..60，派生资源各自吃到上限，全部取整（避免 51.2000001 这类显示）
function clampStat(stat, val) {
    if (typeof val !== 'number' || isNaN(val)) val = 0;
    if (stat === 'strength' || stat === 'agility' || stat === 'magic' || stat === 'charisma') {
        return Math.max(0, Math.min(60, Math.round(val)));
    }
    if (stat === 'sanity') return Math.max(0, Math.min(player.maxSanity, Math.round(val)));
    if (stat === 'desire') return Math.max(0, Math.min(player.maxDesire, Math.round(val)));
    if (stat === 'fatigue') return Math.max(0, Math.min(player.maxFatigue, Math.round(val)));
    if (stat === 'food') return Math.max(0, Math.min(player.maxFood, Math.round(val)));
    if (stat === 'hp') return Math.max(0, Math.min(player.maxHp, Math.round(val)));
    if (stat === 'hygiene') return Math.max(0, Math.min(player.maxHygiene || 100, Math.round(val)));
    return val;
}

// 把玩家身上所有资源类数值收敛回合法区间
function normalizePlayer() {
    player.hp = clampStat('hp', player.hp);
    player.sanity = clampStat('sanity', player.sanity);
    player.desire = clampStat('desire', player.desire);
    player.fatigue = clampStat('fatigue', player.fatigue);
    player.food = clampStat('food', player.food);
    player.hygiene = clampStat('hygiene', player.hygiene === undefined ? 80 : player.hygiene);
    player.strength = clampStat('strength', player.strength);
    player.agility = clampStat('agility', player.agility);
    player.magic = clampStat('magic', player.magic);
    player.charisma = clampStat('charisma', player.charisma);
    if (typeof player.gold !== 'number' || isNaN(player.gold)) player.gold = 0;
    if (typeof player.exp !== 'number' || isNaN(player.exp)) player.exp = 0;
    if (typeof player.sinValue !== 'number' || isNaN(player.sinValue)) player.sinValue = 0;
}

// 应用一组修正并返回实际生效量
function applyBuffMod(mod, sign) {
    var applied = {};
    if (!mod) return applied;
    for (var stat in mod) {
        if (!mod.hasOwnProperty(stat)) continue;
        if (stat === 'sanity' || stat === 'desire' || stat === 'fatigue' || stat === 'hp' || stat === 'food') {
            if (Object.prototype.hasOwnProperty.call(player, stat) || stat === 'sanity') {
                var before0 = player[stat] || 0;
                var after0 = clampStat(stat, before0 + sign * mod[stat]);
                applied[stat] = after0 - before0;
                player[stat] = after0;
            }
            continue;
        }
        if (typeof player[stat] !== 'number') continue;
        var before = player[stat];
        var after = clampStat(stat, before + sign * mod[stat]);
        applied[stat] = after - before;
        player[stat] = after;
    }
    return applied;
}

// 兼容层：供旧调用点使用（按 id 反查全局表）
function applyBuffEffects(id, add) {
    return applyBuffMod(buffMod[id], add ? 1 : -1);
}

function addBuff(id, name, desc, type, duration, modOverride) {
    // 同名 buff 先回滚再重建，避免叠加
    var old = null;
    for (var i = 0; i < player.buffs.length; i++) {
        if (player.buffs[i].id === id) { old = player.buffs[i]; break; }
    }
    if (old) removeBuff(id);

    var absoluteTime = player.daysSurvived * 1440 + player.gameTime;
    var mod = modOverride || buffMod[id] || null;
    var applied = applyBuffMod(mod, 1);
    player.buffs.push({
        id: id,
        name: name,
        desc: desc,
        type: type,
        duration: duration,
        startAbsolute: absoluteTime,
        startTime: player.gameTime,
        applied: applied
    });
    return applied;
}

function removeBuff(id) {
    for (var i = 0; i < player.buffs.length; i++) {
        if (player.buffs[i].id !== id) continue;
        var b = player.buffs[i];
        player.buffs.splice(i, 1);
        // 按记录的增量精确回滚
        if (b.applied) {
            for (var stat in b.applied) {
                if (!b.applied.hasOwnProperty(stat)) continue;
                var val = (player[stat] || 0) - b.applied[stat];
                player[stat] = clampStat(stat, val);
            }
        } else if (buffMod[id]) {
            applyBuffMod(buffMod[id], -1);
        }
        return;
    }
}
function addExp(amount) { player.exp = (player.exp||0) + amount; while (player.exp >= player.level * 20) { player.exp -= player.level * 20; player.level++; player.maxHp += 10; player.hp = player.maxHp; player.maxSanity += 2; player.sanity = Math.min(player.maxSanity, player.sanity + 2); } checkHp();
    ua(); }
function addItem(id, name, type, desc, quantity, effects, equipped) {
    quantity = quantity || 1;
    effects = effects || {};
    equipped = equipped || false;
    for (var i = 0; i < player.inventory.length; i++) {
        if (player.inventory[i].id === id) {
            player.inventory[i].quantity += quantity;
            return;
        }
    }
    var item = { id: id, name: name, type: type, desc: desc, quantity: quantity, effects: effects, equipped: equipped, buffs: effects.buffs || [] };
    player.inventory.push(item);
}
function removeItem(id, quantity) { quantity = quantity || 1; for (var i = 0; i < player.inventory.length; i++) { if (player.inventory[i].id === id) { player.inventory[i].quantity -= quantity; if (player.inventory[i].quantity <= 0) { player.inventory.splice(i, 1); } return true; } } return false; }
function hasItem(id) { for (var i = 0; i < player.inventory.length; i++) { if (player.inventory[i].id === id && player.inventory[i].quantity > 0) { return true; } } return false; }
function getItemCount(id) { for (var i = 0; i < player.inventory.length; i++) { if (player.inventory[i].id === id) { return player.inventory[i].quantity; } } return 0; }
function findItemById(id) {
    for (var i = 0; i < player.inventory.length; i++) {
        if (player.inventory[i].id === id) {
            return player.inventory[i];
        }
    }
    return null;
}

// ==================== NPC好感审视系统 ====================
function getNpcAttitude(npcId) {
    var rel = player.relationships[npcId];
    if (!rel) return { text: '你们尚未相识。', level: 'unknown', color: '#5a5a6a' };
    var love = rel.love || 0;
    var des = rel.desire || 0;
    if (love <= -50) return { text: '【死敌】他视你为必除之物，空气中凝结着纯粹的杀意。', level: 'nemesis', color: '#ff0000' };
    if (love <= -20) return { text: '【敌视】极度的厌恶，他甚至不屑于掩饰对你的反感。', level: 'hostile', color: '#e85060' };
    if (love <= 0) return { text: '【冷淡】视若空气，那种刻骨的疏离感令你如坐针毡。', level: 'cold', color: '#9a6a6a' };
    if (love <= 20) return { text: '【陌路】维持着最基本的社交礼仪，礼貌而空洞。', level: 'neutral', color: '#c0c0c0' };
    if (love <= 40) return { text: '【熟识】偶尔会露出放松的表情，愿意分享些许琐事。', level: 'friendly', color: '#80c080' };
    if (love <= 60) return { text: '【信任】你在他心中占据了一席之地，眼神多了一丝温度。', level: 'trusted', color: '#8ab4d4' };
    if (love <= 80) return { text: '【羁绊】无需多言的默契，他是你在地狱最坚实的依靠。', level: 'bond', color: '#c090ff' };
    if (love <= 100) {
        if (des > 50) return { text: '【渴求】那份情感已近乎偏执，瞳孔中闪烁着危险的火花。', level: 'obsession', color: '#ff6080' };
        return { text: '【至爱】灵魂的共鸣，在这永恒的黑暗中，你是他唯一的锚点。', level: 'soulmate', color: '#ffb3ba' };
    }
    return { text: '未知的情感状态', level: 'unknown', color: '#5a5a6a' };
}

// ==================== NPC对话次数限制 ====================
function canTalkNPC(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcMet) player.npcMet = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    return data.count < 5;
}
function incrementNpcTalk(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcMet) player.npcMet = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    data.count++;
}
function getNpcTalkRemaining(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcMet) player.npcMet = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    return Math.max(0, 5 - data.count);
}

function unequipCurrentCloth() {
    if (!player.equippedClothId) return;
    var oldData = player.equippedClothData;
    if (oldData) {
        player.charisma -= (oldData.charisma || 0);
        player.strength -= (oldData.strength || 0);
        player.magic -= (oldData.magic || 0);
        player.agility -= (oldData.agility || 0);
        player.sanity = Math.min(player.maxSanity, player.sanity - (oldData.sanity || 0));
        
        if (oldData.buffs) {
            for (var i = 0; i < oldData.buffs.length; i++) {
                removeBuff('armor_' + oldData.buffs[i].id);
            }
        }
        
        var oldItem = findItemById(player.equippedClothId);
        if (oldItem) {
            oldItem.equipped = false;
        }
    }
    player.equippedClothId = null;
    player.equippedClothData = null;
    player.outfit = '基础衣着';
    player.outfitDesc = '你穿着一身坠入地狱时的简陋衣物，已经有些磨损。';
}
function equipCloth(item) {
    var id = item.name.replace(/\s/g,'_');
    player.equippedClothId = id;
    player.equippedClothData = {
        charisma: item.charisma || 0,
        strength: item.strength || 0,
        magic: item.magic || 0,
        agility: item.agility || 0,
        sanity: item.sanity || 0,
        buffs: item.buffs || []
    };
    player.charisma += (item.charisma || 0);
    player.strength += (item.strength || 0);
    player.magic += (item.magic || 0);
    player.agility += (item.agility || 0);
    player.sanity = Math.min(player.maxSanity, player.sanity + (item.sanity || 0));
    player.outfit = item.name;
    player.outfitDesc = item.desc;
}

// ==================== 消耗品使用（修复：增加饱食度） ====================
function useConsumable(itemId) {
    var item = findItemById(itemId);
    if (!item || item.type !== 'consumable' || item.quantity <= 0) return;
    var e = item.effects || {};

    player.hp = Math.min(player.maxHp, player.hp + (e.hp || 0));
    if (e.sanity) player.sanity = Math.min(player.maxSanity, player.sanity + e.sanity);
    if (e.desire) player.desire = Math.min(player.maxDesire, player.desire + e.desire);
    if (e.fatigue !== undefined) {
        player.fatigue = Math.max(0, Math.min(player.maxFatigue, player.fatigue + e.fatigue));
    }
    if (e.food) {
        player.food = Math.min(player.maxFood, player.food + e.food);
        if (e.satietyBuff) {
            addBuff('satiety', e.satietyBuff.name, e.satietyBuff.desc, 'positive', e.satietyBuff.duration || 1440);
            player.satietyTimer = e.satietyBuff.duration || 1440;
        }
    }

    var attrMap = { strength: '力量', agility: '敏捷', magic: '魔力', charisma: '魅力' };
    var attrMod = {};
    var attrBuffs = [];
    if (e.strength) { attrMod.strength = e.strength; attrBuffs.push({ stat: 'strength', value: e.strength }); }
    if (e.agility) { attrMod.agility = e.agility; attrBuffs.push({ stat: 'agility', value: e.agility }); }
    if (e.magic) { attrMod.magic = e.magic; attrBuffs.push({ stat: 'magic', value: e.magic }); }
    if (e.charisma) { attrMod.charisma = e.charisma; attrBuffs.push({ stat: 'charisma', value: e.charisma }); }

    if (attrBuffs.length > 0) {
        var buffId = 'food_stat_' + item.name.replace(/\s/g, '_');
        var buffName = item.name + ' 效果';
        var buffDesc = attrBuffs.map(function(a) {
            return attrMap[a.stat] + (a.value > 0 ? '+' : '') + a.value;
        }).join('、') + '（持续60分钟）';
        // 加成只作为限时 buff 生效，到期精确回收，不再永久抬高属性
        addBuff(buffId, buffName, buffDesc, 'positive', 60, attrMod);
    }

    if (e.buffs) {
        for (var i = 0; i < e.buffs.length; i++) {
            var b = e.buffs[i];
            // 使用固定组合ID：物品名 + Buff名，彻底封死动态ID累积通道
            var fixedBuffId = 'food_' + item.name.replace(/\s/g, '_') + '_' + b.name.replace(/\s/g, '_');
            addBuff(fixedBuffId, b.name, b.desc, b.type || 'positive', b.duration || 60);
        }
    }

    removeItem(itemId, 1);
    checkHp();
    ua();
    usb();
    st('<p>你使用了 ' + item.name + '。</p>');
    
    if (item.name === '极乐致幻剂' || item.name === '高纯度恶魔脑髓液') {
        player.flags.addicted = true;
        player.flags.drugTakenToday = true;
        player.flags.withdrawal = false;
        st('<p style="color:#ff6080;font-weight:bold;text-shadow:0 0 8px #ff6080;">你感受到前所未有的极乐与力量，但深渊的毒素已深深扎根在你的灵魂中。你上瘾了。</p>');
    }
    
    cb();
    ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
}

// ==================== 饱食度系统（每日检查） ====================
function checkSatiety() {
    // 每天检查一次饱食度状态
    if (player.food <= 0) {
        if (!player.buffs.find(function(b){ return b.id === 'starvation'; })) {
            addBuff('starvation', '饥饿', '你饥肠辘辘，身体开始虚弱。力量-2，敏捷-2，疲劳恢复速度降低。', 'negative', 1440);
        }
    } else {
        if (player.buffs.find(function(b){ return b.id === 'starvation'; })) {
            removeBuff('starvation');
        }
    }
    if (player.satietyTimer > 0) {
        player.satietyTimer = Math.max(0, player.satietyTimer - 1440);
        if (player.satietyTimer <= 0) {
            removeBuff('satiety');
        }
    }
}

function startCombat(enemyData, flagKey, returnRing, returnLevel) {
    var enemy = {
        id: enemyData.id || enemyData.name || 'unknown',

        expReward: enemyData.expReward || 0,
        sinReward: enemyData.sinReward || 0,
        desireReward: enemyData.desireReward || 0,
        desc: enemyData.description || '',
        weakness: enemyData.weakness || null,
        weaknessUsed: false
    };

    var playerAtk = Math.floor(player.strength * 1.2) + 2;
    var playerDef = Math.floor(player.agility * 0.8) + 1;

    // 四处重复的四个按钮集中到一处，弱点按钮才能在所有状态下都出现
    function combatActions() {
        cb();
        ab('攻击', function() { playerTurn('attack'); });

function endCombat(victory) {

                }
            });
        }
    }
function playerTurn(action) {
        if (enemy.hp <= 0) { endCombat(true); return; }
        if (player.hp <= 0) { endCombat(false); return; }

        if (action === 'attack') {
            playSound(900, 0.1);
            var dmg = Math.max(1, playerAtk - enemy.defense + Math.floor(Math.random() * 4) - 1);
            enemy.hp = Math.max(0, enemy.hp - dmg);
            renderCombat('你攻击了 ' + enemy.name + '，造成 ' + dmg + ' 点伤害！');
            if (enemy.hp <= 0) { endCombat(true); return; }
            enemyTurn();
        } else if (action === 'defend') {
            playSound(400, 0.15);
            var recovered = Math.floor(player.maxHp * 0.05) + 2;
            player.hp = Math.min(player.maxHp, player.hp + recovered);
            renderCombat('你采取了防御姿态，恢复了 ' + recovered + ' 点生命。');
            enemyTurn();
        } else if (action === 'flee') {
            playSound(200, 0.2);
            var fleeChance = 0.4 + (player.agility * 0.02);
            if (Math.random() < fleeChance) {
                st('<div class="scene-title">🏃 逃 跑</div><p>你成功脱离了战斗！</p>');
                cb();
                ab('继续', function() {
                    if (returnRing && returnLevel) {
                        sceneExploreDistrict(returnRing, returnLevel);
                    } else {
                        sceneExploreDistrict(player.currentRing, getCurrentLevel());
                    }
                });
                return;
            } else {
                renderCombat('逃跑失败！');
                enemyTurn();
            }
        } else if (action === 'item') {
            var consumables = player.inventory.filter(function(it) { return it.type === 'consumable' && it.quantity > 0; });
            if (consumables.length === 0) {
                renderCombat('没有可用的消耗品。');
                combatActions();
                return;
            }
            var html = '<div class="scene-title">🧪 使 用 物 品</div>';
            for (var i = 0; i < consumables.length; i++) {
                html += '<p>' + consumables[i].name + ' x' + consumables[i].quantity + ' — ' + consumables[i].desc + '</p>';
            }
            st(html);
            cb();
            for (var i = 0; i < consumables.length; i++) {
                (function(item) {
                    ab('使用 ' + item.name, function() {
                        var e = item.effects || {};
                        player.hp = Math.min(player.maxHp, player.hp + (e.hp || 0));
                        if (e.strength) player.strength += e.strength;
                        if (e.magic) player.magic += e.magic;
                        if (e.charisma) player.charisma += e.charisma;
                        if (e.sanity) player.sanity = Math.min(player.maxSanity, player.sanity + e.sanity);
                        if (e.desire) player.desire = Math.min(player.maxDesire, player.desire + e.desire);
                        if (e.fatigue !== undefined) {
                            player.fatigue = Math.max(0, Math.min(player.maxFatigue, player.fatigue + e.fatigue));
                        }
                        if (e.food) {
                            player.food = Math.min(player.maxFood, player.food + e.food);
                        }
                        removeItem(item.id, 1);
                        checkHp();
    ua();
                        renderCombat('你使用了 ' + item.name + '。');
                        enemyTurn();
                    });
                })(consumables[i]);
            }
            ab('取消', function() {
                renderCombat('');
                combatActions();
            });
            return;
        } else if (action === 'weakness') {
            // 设定里的「致命弱点」：一场战斗只能用一次，得先摸清对方怕什么
            if (!enemy.weakness || enemy.weaknessUsed) {
                renderCombat('你已经用过这一招了，对方不会再上当。');
                combatActions();
                return;
            }
            enemy.weaknessUsed = true;
            playSound(600, 0.12);
            var wMsg = '';
            try { wMsg = enemy.weakness.apply(enemy) || ''; } catch (e) { wMsg = '你抓住了他的破绽。'; }
            if (enemy.hp <= 0) {
                renderCombat(wMsg);
                endCombat(true);
                return;
            }
            renderCombat(wMsg);
            // 打中弱点有一半概率打断这一回合的反击
            if (Math.random() < 0.5) {
                combatActions();
            } else {
                enemyTurn();
            }
            return;
        }
    }
function enemyTurn() {
        if (enemy.hp <= 0) { endCombat(true); return; }
        if (player.hp <= 0) { endCombat(false); return; }
        var dmg = Math.max(1, enemy.attack - playerDef + Math.floor(Math.random() * 3) - 1);
        player.hp = Math.max(0, player.hp - dmg);
        renderCombat(enemy.name + ' 攻击了你，造成 ' + dmg + ' 点伤害！');
        if (player.hp <= 0) { endCombat(false); return; }
        combatActions();
    }

    renderCombat('战斗开始！');
    combatActions();
}

function updateFatigue() {
    // 疲劳惩罚只用一条 buff 承载（按下标取当前总惩罚），
    // 否则 5 层叠加会变成 -15，玩家属性直接被清零。
    removeBuff('fatigue_penalty');
    removeBuff('exhausted');

    if (!player.flags.isSleeping) {
        var period = getTimePeriod();
        if (period === 'night') player.fatigue = Math.min(player.maxFatigue, player.fatigue + 2);
        var h = Math.floor(player.gameTime / 60) % 24;
        if (h >= 0 && h < 6) player.fatigue = Math.min(player.maxFatigue, player.fatigue + 2);
    }

    var f = player.fatigue;
    var level = 0;
    if (f >= 20) level = 1;
    if (f >= 40) level = 2;
    if (f >= 60) level = 3;
    if (f >= 80) level = 4;
    if (f >= 95) level = 5;
    var name = ['', '疲倦', '疲乏', '力竭', '濒临崩溃', '油尽灯枯'];
    var penalty = [0, 1, 1, 2, 2, 3][level];
    if (level > 0) {
        addBuff('fatigue_penalty', name[level],
            '力量-' + penalty + '，敏捷-' + penalty + '（疲劳 ' + Math.floor(f) + '/100）',
            'negative', 9999, { strength: -penalty, agility: -penalty });
    }
    player.fatigueLayer = level;

    if (f >= 100 && !player.flags.isSleeping && !player.flags.isFainting) {
        player.fatigue = 50;
        triggerFaint();
        return;
    }
    ua();
}

function tickBuffs() {
    var currentAbsolute = player.daysSurvived * 1440 + player.gameTime;
    for (var i = player.buffs.length - 1; i >= 0; i--) {
        var b = player.buffs[i];
        if (b.duration && b.duration < 9999 && b.startAbsolute !== undefined) {
            var elapsed = Math.floor((currentAbsolute - b.startAbsolute) / 60);
            if (elapsed >= b.duration) {
                removeBuff(b.id);
            }
        }
    }
}

// 饥饿按时间流逝：每 12 分钟消耗 1 点饱食（暴食之罪 ×2）
// 旧实现每次动作固定 -1，5 分钟的小动作和 8 小时的睡眠等价，经济完全失真。
function updateFood(minutes) {
    if (player.flags.isSleeping) { checkSatiety(); return; }
    var m = (typeof minutes === 'number' && minutes > 0) ? minutes : 10;
    var rate = (player.sin === '暴食' || player.birthRing === '暴食之环') ? 2 : 1;
    player.foodDrainAcc = (player.foodDrainAcc || 0) + (m / 12) * rate;
    while (player.foodDrainAcc >= 1) {
        player.foodDrainAcc -= 1;
        player.food = Math.max(0, player.food - 1);
    }
    if (player.food <= 0) {
        // 饥饿不再立刻掉血，而是持续消耗：每 15 分钟 1 点
        player.hungerStarveAcc = (player.hungerStarveAcc || 0) + m;
        while (player.hungerStarveAcc >= 15) {
            player.hungerStarveAcc -= 15;
            player.hp = Math.max(0, player.hp - 1);
        }
        player.statusMood = '胃里像塞了一把砂子。你已经饿得开始发昏了。';
    } else {
        player.hungerStarveAcc = 0;
    }
    checkSatiety();
    updateHungerStage();
}

// 饥饿阶段（DoL 式分档，影响文案与惩罚）
function updateHungerStage() {
    var f = player.food, max = player.maxFood || 100;
    var stage = 0;
    if (f <= 0) stage = 4;
    else if (f <= max * 0.15) stage = 3;
    else if (f <= max * 0.35) stage = 2;
    else if (f <= max * 0.6) stage = 1;
    if (stage === player.hungerStage) return;
    player.hungerStage = stage;
    var names = ['饱足', '微饿', '饥饿', '极度饥饿', '濒临饿死'];
    player.hungerStageLabel = names[stage];
}

// 清洁度：持续活动自然下降，过低影响魅力与理智（DoL 的卫生惩罚）
function updateHygiene(minutes) {
    var m = (typeof minutes === 'number' && minutes > 0) ? minutes : 10;
    player.hygieneAcc = (player.hygieneAcc || 0) + m;
    while (player.hygieneAcc >= 60) {
        player.hygieneAcc -= 60;
        player.hygiene = Math.max(0, (player.hygiene || 0) - 1);
    }
}

// ==================== 每日结算 ====================
// DoL 式压力来源：房租、衣着磨损、卫生、通缉度、许可过期。
// 全部走 pendingNotices，不用 alert、不打断当前场景。
function dailySettlement() {
    if (!player.pendingNotices) player.pendingNotices = [];
    var day = player.daysSurvived;

    // 1. 衣着磨损
    var wear = 3;
    if (player.currentDistrict && /灰烬|水沟|秽|贫/.test(player.currentDistrict)) wear += 1;
    if (player.fatigue > 60) wear += 1;
    player.clothingCondition = Math.max(0, (player.clothingCondition === undefined ? 100 : player.clothingCondition) - wear);
    if (player.clothingCondition <= 0) {
        player.pendingNotices.push('你的衣物已经破烂不堪，遮不住什么了。魅力判定 -3。');
    } else if (player.clothingCondition < 30) {
        player.pendingNotices.push('衣物磨损严重（' + player.clothingCondition + '/100），该去服装店修补了。');
    }

    // 2. 卫生
    player.hygiene = Math.max(0, (player.hygiene || 0) - 8);
    if (player.hygiene < 25) {
        player.pendingNotices.push('你已经很久没洗过澡了。身上的味道让路人绕着你走。');
        player.sanity = Math.max(0, player.sanity - 1);
    }

    // 3. 房租（只有住得起房子的人才交）
    if (player.rentDue > 0) {
        if (player.gold >= player.rentDue) {
            player.gold -= player.rentDue;
            player.pendingNotices.push('房东收走了 ' + player.rentDue + ' 金币房租。');
        } else {
            player.wantedLevel = (player.wantedLevel || 0) + 1;
            player.sanity = Math.max(0, player.sanity - 2);
            player.pendingNotices.push('你交不出 ' + player.rentDue + ' 金币房租，被记上了欠账（通缉度 +1）。');
        }
        player.rentDue = 0;
    }

    // 3b. 租约到期：没续租就只能睡街上
    if (player.rentPaidUntilDay && (player.daysSurvived || 1) > player.rentPaidUntilDay) {
        player.flags = player.flags || {};
        var _expKey = 'rentExpired_d' + (player.daysSurvived || 1);
        if (!player.flags[_expKey]) {
            player.flags[_expKey] = true;
            player.pendingNotices.push('租约到期了。今晚你没有地方可去。');
            player.sanity = Math.max(0, (player.sanity || 0) - 2);
            player.fatigue = Math.min(100, (player.fatigue || 0) + 10);
        }
    }

    // 4. 通缉度自然衰减 / 惩罚
    if (player.wantedLevel > 0) {
        if (player.wantedLevel >= 3) {
            player.pendingNotices.push('通缉度 ' + player.wantedLevel + '：巡逻队开始盯上你了，随时可能被盘查。');
        } else if (Math.random() < 0.5) {
            player.wantedLevel--;
        }
    }

    // 5. 通行许可按天过期
    if (player.permits) {
        for (var k in player.permits) {
            if (!player.permits.hasOwnProperty(k)) continue;
            if (player.permits[k] <= day) {
                delete player.permits[k];
                player.pendingNotices.push('「' + k + '」的通行许可已于今日失效。');
            }
        }
    }

    // 6. 悔悟与克制：连续不犯罪会缓慢削弱罪业（世界观点：人的克制会削弱君主）
    if (player.lastSinDay !== day) {
        player.daysWithoutSin = (player.daysWithoutSin || 0) + 1;
        if (player.daysWithoutSin >= 2) {

function sleepRest(quality, hours, fatiguePerHour, hpPerHour, sanityPerHour) {
    var fatigueRecovery = fatiguePerHour * hours;
    var hpRecovery = hpPerHour * hours;
    var sanityRecovery = sanityPerHour * hours;
    var foodCost = Math.floor(hours * 2);

    player.hp = Math.min(player.maxHp, player.hp + hpRecovery);
    player.sanity = Math.min(player.maxSanity, player.sanity + sanityRecovery);
    player.fatigue = Math.max(0, player.fatigue - fatigueRecovery);
    player.food = Math.max(0, player.food - foodCost);

    if (player.alarmTime !== null) {
        var currentMin = player.gameTime % 1440;
        var alarmMin = player.alarmTime % 1440;
        if (alarmMin > currentMin) {
            player.gameTime += (alarmMin - currentMin);
        } else if (alarmMin < currentMin) {
            player.gameTime += (1440 - currentMin + alarmMin);
        }
        player.alarmTime = null;
    } else {
        addTime(Math.floor(hours * 60));
    }
    player.flags.isSleeping = false; saveToSlot(0);
    removeBuff('exhausted');

    var keys = Object.keys(player.flags);
    for (var i = 0; i < keys.length; i++) {
        if (keys[i].indexOf('npcLeft_') === 0) {
            delete player.flags[keys[i]];
        }
    }
    player.npcTalkCounts = {};

    player.statusMood = '你好好休息了一觉，感到精力充沛。';
    checkHp();
    ua();
}

function showAchievementPopup(id, name, desc) {
    // 播放音效
    try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
        setTimeout(function() {
            var osc2 = ctx.createOscillator();
            var gain2 = ctx.createGain();
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.frequency.value = 1100;
            osc2.type = 'sine';
            gain2.gain.setValueAtTime(0.12, ctx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
            osc2.start(ctx.currentTime);
            osc2.stop(ctx.currentTime + 0.25);
        }, 150);
    } catch(e) {}

    var popup = document.createElement('div');
    popup.className = 'achievement-popup';
    // 直接内联样式覆盖，确保位置，放在 body 下避免任何容器干扰
    popup.style.cssText = 'position:fixed; top:30px; right:20px; left:auto; transform:none; opacity:1; z-index:9999; max-width:320px; width:auto; min-width:200px; background:rgba(18,1,8,0.95); border:1px solid #d4a040; border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212,160,64,0.2); cursor:pointer; pointer-events:auto; transition: opacity 0.4s;';
    popup.innerHTML =
        '<span class="popup-icon" style="font-size:24px;filter:drop-shadow(0 0 5px rgba(212,160,64,0.5));"></span>' +
        '<span class="popup-content" style="flex:1;">' +
        '<div class="popup-title" style="font-size:0.85em;color:#e8c060;font-weight:bold;margin-bottom:2px;">成就解锁：' + name + '</div>' +
        '<div class="popup-desc" style="font-size:0.7em;color:#9a6a6a;line-height:1.3;">' + desc + '</div>' +
        '<div class="popup-badge" style="font-size:0.55em;color:#5a2a30;text-transform:uppercase;margin-top:4px;letter-spacing:1px;">✦ 七环地狱 ✦</div>' +
        '</span>';

    document.body.appendChild(popup);

    // 点击关闭
    popup.addEventListener('click', function(e) {
        e.stopPropagation();
        popup.style.opacity = '0';
        setTimeout(function() { if (popup.parentNode) popup.remove(); }, 400);
    });

    // 4秒后自动关闭
    setTimeout(function() {
        if (popup.parentNode) {
            popup.style.opacity = '0';
            setTimeout(function() { if (popup.parentNode) popup.remove(); }, 400);
        }
    }, 4000);
}

                    buffDesc = '<p style="font-size:0.65em;color:#80c080;margin-top:2px;">' + item.effects.buffs.map(function(b){return b.name + ' (' + b.desc + ')';}).join('; ') + '</p>';

                    if (!item.equipped) {

                    if (item.effects.attack) eff.push('攻击+' + item.effects.attack);

            }

        sc.innerHTML = renderFactionHtml();
    } else if (sidebarTab === 'achievement') {
        sc.innerHTML = renderAchievementHtml();
    } else if (sidebarTab === 'save') {
        sc.innerHTML = renderSavePanelHtml();
    } else if (sidebarTab === 'map') {
        sc.innerHTML = renderMapHtml();
    } else if (sidebarTab === 'tasks') {
        sc.innerHTML = renderTasksHtml();
    }
}


// ==================== 地图系统 ====================
function renderMapHtml() {
    var cur = player.currentRing || '傲慢之环';
    var curLevel = getCurrentLevel();
    var html = '<div class="status-box"><div style="text-align:center;font-weight:bold;color:#e8c060;margin-bottom:6px;">七 环 地 图</div>';
    html += renderMapSvg();
    html += '<p style="font-size:0.68em;color:#8a6a72;margin-top:4px;line-height:1.6;">' +
        '你在 <span style="color:#e8c060;">' + districtName(cur, curLevel) + '</span>（' + RING_SHORT[cur] +
        '之环 · ' + TIER_LABEL[curLevel] + '）。相邻的两环才能走，环内只能逐层上下。</p>';
    html += '<div class="map-legend">' +
        '<span class="lg cur">◆ 你在这里</span>' +
        '<span class="lg adj">◆ 相邻</span>' +
        '<span class="lg far">◆ 隔着别的环</span></div>';
    html += '<p style="font-size:0.66em;color:#7a5a62;margin-top:2px;">点环名可以走过去；走不过去的地方会告诉你为什么。</p>';
    html += '</div>';

    var rd = RD[cur];
    if (rd) {
        html += '<div class="status-box" style="margin-top:6px;">';
        html += '<p style="font-size:0.75em;color:#e8c060;">' + RING_SHORT[cur] + '之环 · 三层</p>';
        for (var t = 0; t < TIER_ORDER.length; t++) {
            var lv = TIER_ORDER[t];
            if (!rd[lv]) continue;
            var here = lv === curLevel;
            html += '<p style="font-size:0.7em;color:' + (here ? '#e8c060' : '#9a6a6a') + ';">' +
                (here ? '▸ ' : '　') + TIER_LABEL[lv] + '：' + rd[lv].name + '</p>';
        }
        html += '</div>';
    }

    var nbrs = ringNeighbors(cur);
    html += '<div class="status-box" style="margin-top:6px;">';
    html += '<p style="font-size:0.75em;color:#e8c060;">相邻的两环</p>';
    for (var k = 0; k < nbrs.length; k++) {
        var r = nbrs[k];
        var cost = ringTravelCost(r);
        var can = player.gold >= cost;
        html += '<p style="font-size:0.7em;color:' + (can ? '#9a6a6a' : '#4e3e44') + ';">' +
            RING_SHORT[r] + '之环 · 路费 ' + cost + ' 金' + (can ? '' : '（钱不够）') + '</p>';
    }
    html += '<p style="font-size:0.66em;color:#5a4048;margin-top:2px;">另外四环隔得太远，必须一环一环走过去。</p>';
    html += '</div>';
    return html;
}

function acceptTask(task) {
    if (player.activeTasks.length >= 3) {
        st('<p class="highlight">你已有太多未完成的任务（3/3）。先了结手头的委托再来。</p>');
        cb();
        ab('返回', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
        return;
    }
    player.activeTasks.push(task);
    playSound(820, 0.08);
    st('<p>你承接了任务：<span class="gold-text">' + task.title + '</span></p><p style="color:#9a6a6a;font-size:0.82em;">' + task.desc + '</p><p style="color:#e85060;">截止日期：第' + task.deadline + '天</p>');
    cb();
    ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
}
function checkTaskDeadlines() {
    var expired = [];
    for (var i = player.activeTasks.length - 1; i >= 0; i--) {
        var t = player.activeTasks[i];
        // 到期当天仍然可以交付，隔天才算失败
        if (player.daysSurvived > t.deadline) {
            t.status = 'failed';
            player.failedTasks.push(t);
            player.activeTasks.splice(i, 1);
            player.sanity = Math.max(0, player.sanity - 2);
            player.gold = Math.max(0, player.gold - 3);
            expired.push(t.title);
        }
    }
    if (expired.length) {
        player.pendingNotices = player.pendingNotices || [];
        for (var k = 0; k < expired.length; k++) {
            player.pendingNotices.push('⚠️ 委托「' + expired[k] + '」已过期：理智-2，金币-3。');
        }
    }
}

        html += '<p style="color:#80c080;font-size:0.78em;margin-top:6px;">已完成：' + player.completedTasks.length + ' 项</p>';
    }
    if (player.failedTasks.length > 0) {
        html += '<p style="color:#e85060;font-size:0.78em;margin-top:6px;">已失败：' + player.failedTasks.length + ' 项</p>';

function completeTask(taskId) {
    for (var i = 0; i < player.activeTasks.length; i++) {
        if (player.activeTasks[i].id === taskId) {
            var t = player.activeTasks[i];
            var canComplete = false;
            switch (t.type) {
                case 'collect':
                    if (getItemCount(t.target) >= t.quantity) {
                        removeItem(t.target, t.quantity);
                        canComplete = true;
                    }
                    break;
                case 'combat':
                    if (player.flags['task_combat_done_' + t.id]) canComplete = true;
                    break;
                case 'escort':
                case 'steal':
                case 'social':
                case 'explore':
                    if (player.flags['task_done_' + t.id]) canComplete = true;
                    break;
            }
            if (canComplete) {
                t.status = 'completed';
                player.completedTasks.push(t);
                player.activeTasks.splice(i, 1);
                var rGold = (typeof t.rewardGold === 'number') ? t.rewardGold : 0;
                var rExp = (typeof t.rewardExp === 'number') ? t.rewardExp : 0;
                player.gold += rGold;
                if (t.sinReward) player.sinValue += t.sinReward;
                if (t.desireReward) player.desire = clampStat('desire', player.desire + t.desireReward);
                var rewardLine = '奖励：' + rGold + ' 金币，' + rExp + ' 经验值' +
                    (t.sinReward ? '，罪业值 +' + t.sinReward : '') +
                    (t.desireReward ? '，欲望 +' + t.desireReward : '') + '。';
                addExp(rExp); // addExp 内部会刷新 UI 与等级
                st('<div class="scene-title" style="color:#e8c060;">委 托 完 成</div><p style="color:#e8c060;">' + t.title + '</p><p>' + rewardLine + '</p>');
                checkAchievement('task_1');
                cb();
                ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
                return;
            } else {
                st('<p class="highlight">任务目标尚未达成。</p>');
                cb();
                ab('返回', function() { switchTab('tasks'); });
                return;
            }
        }
    }
}

function abandonTask(taskId) {
    for (var i = 0; i < player.activeTasks.length; i++) {
        if (player.activeTasks[i].id === taskId) {
            var t = player.activeTasks[i];
            t.status = 'failed';
            player.failedTasks.push(t);
            player.activeTasks.splice(i, 1);
            st('<p style="color:#e85060;">你放弃了任务：' + t.title + '</p>');
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
            return;
        }
    }
}

function enterBlackMarket() {
    if (!isBlackMarketOpen()) {
        st('<div class="scene-title">黑市</div><p>黑市只在夜晚开放（22:00-02:00）。现在还未到营业时间。</p>');
        cb();
        ab('返回', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
        return;
    }
    refreshBlackMarket();
    var html = '<div class="scene-title">黑 市</div><p>暗巷深处，一个被阴影笼罩的摊位前，一个戴着兜帽的商人正在等你。</p><p style="color:#ff6080;font-size:0.82em;">"欢迎光临……我这里有些……特别的货物。"</p>';
    html += '<div style="background:#180610;border:1px solid #2a0a16;border-radius:6px;padding:10px;margin:8px 0;">';
    var availableItems = player.blackMarketItems.filter(function(it) { return !it.sold; });
    if (availableItems.length === 0) {
        html += '<p style="color:#5a5a6a;text-align:center;">今天的货都卖完了……改天再来吧。</p>';
    } else {
        for (var i = 0; i < availableItems.length; i++) {
            var it = availableItems[i];
            html += '<p>· ' + it.name + ' <span style="color:#e85060;">' + it.price + 'G</span> — ' + it.desc + '</p>';
        }
    }
    html += '</div>';
    st(html);
    cb();
    // 生成购买按钮（只针对未售商品）
    for (var i = 0; i < player.blackMarketItems.length; i++) {
        (function(item) {
            if (item.sold) return;
            ab('购买 ' + item.name + '（' + item.price + 'G）', function() {
                if (player.gold >= item.price) {
                    player.gold -= item.price;
                    var type = item.type || 'misc';
                    var effects = item.effects || {};
                    if (type === 'consumable') {
                        addItem(item.id, item.name, 'consumable', item.desc, 1, effects);
                    } else if (type === 'weapon') {
                        addItem(item.id, item.name, 'weapon', item.desc, 1, effects);
                    } else if (type === 'armor') {
                        addItem(item.id, item.name, 'armor', item.desc, 1, effects);
                    } else {
                        addItem(item.id, item.name, 'misc', item.desc, 1, effects);
                    }
                    checkHp();
    ua();
                    st('<p>你购买了 <span style="color:#ff6080;">' + item.name + '</span>。</p>');
                    // 标记为已售（不删除）
                    item.sold = true;
                } else {
                    st('<p class="highlight">⚠️ 金币不足。需要 ' + item.price + ' 金币，你只有 ' + player.gold + ' 金币。</p>');
                }
                cb();
                ab('继续购物', function() { enterBlackMarket(); });
                ab('离开', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
            }, 'danger-btn');
        })(player.blackMarketItems[i]);
    }
    ab('离开黑市', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
}

    var pool2 = (typeof generateNegativeEventPool2 === 'function') ? generateNegativeEventPool2() : null;

            { name: '香水试嗅员', desc: '魅骨时装店的地下室里，一位调香师正在研发新款魅惑香水。她需要"未经训练的鼻子"来测试不同配方的前调、中调和后调。你需要在闻了二十几种香精之后，准确描述每种气味给人的感受。', stat: 'magic', dc: 10, reward: 7, exp: 8, time: 40, failMsg: '闻到第十五种时，你的嗅觉彻底失灵，大脑一阵眩晕。调香师遗憾地收起记录本，只付了最基础的测试费。', successMsg: '你连续吸入二十几种刺鼻香精，依然极其精准地在纸上写下了所有的气味层次。调香师兴奋地塞给你报酬和一管试用装香水。' }

        '嫉妒之环': [
            { name: '黑水打捞', desc: '水沟区的黑水齐腰深，水面上常年漂浮着从上层环层冲下来的废弃物品。有人专门雇人在黑水中打捞——运气好的话，能捞到完整的旧家具、还能转卖的破损饰品、甚至某位贵族不慎冲进下水道的金笔。', stat: 'strength', dc: 11, reward: 7, exp: 9, time: 50, failMsg: '你在黑水里泡得浑身发抖，捞上来的全是一堆生锈的废铁和破布。雇主冷眼一扫，直接将东西重新踢回水里。', successMsg: '你强忍着恶臭，在齐腰深的冰冷黑水中不断摸索，成功捞出了一把镀银餐具和一只旧怀表。雇主仔细端详后，满意地付了全款。' },
            { name: '谣言集市散播', desc: '镜面街区的谣言集市里，一个情报贩子正在招募"扩音器"——将几条真假难辨的消息传遍嫉妒之环的各个角落。你需要在茶馆、栈桥和地下通道之间穿梭，用不经意的口吻把话递出去。', stat: 'charisma', dc: 10, reward: 8, exp: 8, time: 45, failMsg: '你的表演极其僵硬刻意，周围的恶魔立刻识破了你的意图。情报贩子失望地摇摇头，只给了你一点路费。', successMsg: '你如同幽灵般穿梭在茶馆与地下通道间，用极其自然的闲聊口吻将虚假消息散布出去。傍晚时分，谣言已彻底传开，情报贩子痛快地支付了报酬。' },
            { name: '仿冒品加工', desc: '镜面街区的深渊镜像工坊正在赶制一批仿冒的"傲慢环水晶吊坠"——实际上只是用普通玻璃染色后打磨而成。你的工作是给这些假吊坠刻上以假乱真的暗纹，让它们看起来像是从晨星高地上捡来的。', stat: 'agility', dc: 12, reward: 9, exp: 10, time: 55, failMsg: '你的刻刀一滑，直接刮废了好几片玻璃。工坊主看着残次品眉头紧锁，直接扣下了一半的工钱。', successMsg: '你手中的刻刀极其精准地在廉价玻璃表面游走，刻下的暗纹足以以假乱真。工坊主举起成品对着灯光仔细端详，满意地点头付钱。' }

        '暴食之环': [
            { name: '食材分拣', desc: '美食大道的永饥食品厂后门，堆满了从各环运来的食材原料。你的工作是将腐烂的部分切掉，把勉强能用的部分分拣进不同的筐里。这项工作对胃的承受力是一种考验——腐烂的肉类散发着令人窒息的恶臭。', stat: 'strength', dc: 10, reward: 6, exp: 8, time: 45, failMsg: '你在极其刺鼻的酸臭味中没撑过半小时，直接冲到后巷干呕起来。工头看着你惨白的脸色，只给结算了半个工时。', successMsg: '你强忍着令人窒息的腐肉恶臭，面不改色地挥刀切除腐烂部分，分拣完三大筐食材。工头看着你干净的围裙，竖起拇指支付了报酬。' },
            { name: '食教传教站帮厨', desc: '食教传教站的执事正在准备今日的免费汤品。他需要人手帮忙削皮、切菜和搅拌那一口永远填不满的大锅。执事一边干活一边低声向你讲述食教的教义——"吞噬是万物最终的归宿"。', stat: 'magic', dc: 10, reward: 7, exp: 9, time: 50, failMsg: '你一个走神，锋利的菜刀直接切破了手指，鲜血滴落。执事面无表情地帮你包扎伤口，随后只付了最低的帮厨费。', successMsg: '你手脚麻利地切菜、投料，极其默契地配合执事搅拌那口巨大的浓汤锅。工作结束后，执事在塞给你报酬的同时，悄悄往你口袋里放了一包干燥香料。' },
            { name: '残渣区拾荒', desc: '残渣区的深处，堆积如山的食物残渣中偶尔能翻出还能吃的东西。有人在招募拾荒者——从腐臭的垃圾中翻出还能转卖的边角料。这工作需要敏锐的眼力和强大的胃。', stat: 'agility', dc: 11, reward: 8, exp: 10, time: 50, failMsg: '你徒手翻找了半天，只掏出一堆彻底发黑腐烂的烂泥。雇主捏着鼻子嫌弃地看了一眼，扔下一点辛苦费便转身离开。', successMsg: '你极其敏锐地在堆积如山的腐臭垃圾中翻找，挖出了半箱未变质的罐头和干粮。雇主惊喜地拍打你的后背，连钱带两罐罐头一起塞给了你。' }
        ],
        '懒惰之环': [
            { name: '帮人躺平', desc: '停滞区的惰性休闲馆正在招募"陪伴躺平员"。你的工作很简单——躺在体验区的躺椅上当活招牌，向路过的恶魔展示躺椅的舒适度。唯一的挑战是不能真的睡着——虽然就算睡着了也没人在乎。', stat: 'charisma', dc: 8, reward: 4, exp: 6, time: 40, failMsg: '你直接陷入了深度睡眠，醒来时嘴角还挂着口水。经理面无表情地看着你，直接扣掉了一半的工资。', successMsg: '你躺在柔软的体验椅上，极其完美地保持着半睡半醒的慵懒状态，成功吸引了几个路人恶魔当场掏钱购买。经理难得地点头夸奖并支付了全额。' },
            { name: '文件代交', desc: '懒鬼外包公司的前台趴在一叠积压了数月的文件上，用极其缓慢的语速告诉你——他们需要人帮客户把一份拖延了半年的申请表交到对面那栋楼。距离：不到一百米。原因：客户懒得亲自走过去。', stat: 'agility', dc: 5, reward: 3, exp: 5, time: 20, failMsg: '你拿着文件站在原地，连腿都懒得迈出一步。前台用同样慵懒的眼神看了你一眼，表达了惺惺相惜的失望。', successMsg: '你拿着那份拖延了半年的申请表，步行不到一百米塞进了对面的信箱。前台恶魔用极其缓慢的动作竖起大拇指，将报酬推到你面前。' },
            { name: '灰雾冥想指导', desc: '停滞区的一间低价惰性休闲馆里，几个长期失眠的恶魔正在参加"灰雾冥想"课程。你的工作是坐在他们面前，用最缓慢、最催眠的语调念出指导语，帮助他们进入深层放松状态。', stat: 'magic', dc: 9, reward: 5, exp: 7, time: 35, failMsg: '你的语速没有控制好，显得极其急躁，直接导致前排的恶魔烦躁地睁开眼。老师无奈地夺过指导词，只支付了一半的钱。', successMsg: '你盘腿坐在前方，用极其缓慢、温柔的语调念出指导语。所有失眠的恶魔都在你的声音中陷入了深沉的睡眠。老师轻手轻脚地递上了丰厚报酬。' }
        ]
    };

    var jobs = ringJobs[ring];
    if (!jobs || jobs.length === 0) {
        jobs = [
            { name: '矿场搬运', desc: '在水晶矿场搬运矿石。需要体力。', stat: 'strength', dc: 12, reward: 8, exp: 10, time: 60, failMsg: '你体力不支，只拿到一半报酬。', successMsg: '工作顺利完成！' },
            { name: '酒馆招待', desc: '在酒馆端盘子。需要魅力。', stat: 'charisma', dc: 10, reward: 6, exp: 8, time: 60, failMsg: '你笨手笨脚，只拿到一半报酬。', successMsg: '工作顺利完成！' },
            { name: '街头卖艺', desc: '用你的魔力表演杂耍。', stat: 'magic', dc: 10, reward: 7, exp: 9, time: 50, failMsg: '你的表演无人喝彩，只拿到一半报酬。', successMsg: '表演大获成功！' },
            { name: '暗巷交易', desc: '参与地下交易，需要敏捷和胆量。', stat: 'agility', dc: 12, reward: 12, exp: 12, time: 40, failMsg: '交易搞砸了，只拿到一半报酬。', successMsg: '交易顺利完成！' }
        ];
    }

    var job = jobs[Math.floor(Math.random() * jobs.length)];
    // 工作事件随机文本
    var eventTexts = [
        '工作中，你听到工友在谈论一个隐藏的宝库。',
        '你发现了一个偷懒的好地方，休息了一会儿。',
        '监工今天心情不错，多给了你一些报酬。',
        '一个同事试图偷你的东西，你及时发现了。',
        '你无意中听到了一段关于某个君主的秘密谈话。'
    ];
    var eventChance = Math.random();
    var extraEvent = '';
    if (eventChance < 0.15) {
        extraEvent = '<p style="color:#c09080;font-style:italic;">' + eventTexts[Math.floor(Math.random() * eventTexts.length)] + '</p>';
    }

    st('<div class="scene-title">工作机会</div><p>' + job.desc + '</p><p>需求：' + statNames[job.stat] + ' ≥ ' + job.dc + '</p>' + extraEvent);
    cb();
    ab('接受（耗时' + job.time + '分钟）', function() {
        addTime(job.time);
        player.fatigue = Math.min(player.maxFatigue, player.fatigue + 15 + Math.floor(player.fatigue/10));
        // 工作意外事件
        var accident = Math.random();
        if (accident < 0.05) {
            st('<p style="color:#e85060;">⚠️ 工作中发生了意外！你被掉落的石块砸伤，HP-15。</p>');
            player.hp -= 15;
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
            return;
        }
        if (player[job.stat] >= job.dc) {
            var reward = Math.floor(job.reward * (1 + player.level * 0.1));
            var exp = Math.floor(job.exp * (1 + player.level * 0.05));
            player.gold += reward;
            addExp(exp);
            st('<p>' + (job.successMsg || '工作顺利完成！获得了 ' + reward + ' 金币，' + exp + ' 经验。') + '</p><p style="color:#e8c060;">获得了 ' + reward + ' 金币，' + exp + ' 经验。</p>' + extraEvent);
        } else {
            var half = Math.floor(Math.floor(job.reward * (1 + player.level * 0.1)) / 2);
            player.gold += half;
            st('<p>' + (job.failMsg || '你勉强完成，但效果不佳。') + '</p><p style="color:#e85060;">获得了 ' + half + ' 金币。</p>' + extraEvent);
        }
        cb();
        ab('返回（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
    });
    ab('拒绝', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
}

// ==================== NPC 交互（修复：次数限制+好感审视） ====================
function getNpcFirstMeetText(npcId) {
    var sin = player.sin, race = player.race;

    if (npcId === '泽洛斯') {
        if (race === 'sinner') {
            return '你走过的地方，空气忽然凝了一下。不是冷，是那种被人从背后盯住、' +
                '后颈的汗毛全部立起来的那种凝。' +
                '前方的暗紫色幻光像水一样从地缝里渗出来，缓慢地向上堆，' +
                '堆到一人高的时候停住了，然后从中间裂开一道口子。' +
                '泽洛斯从里面迈出来，步子很慢，慢得像是这场出现他已经排练过很多遍。' +
                '他隔着那副细框眼镜看你，暗红色的瞳孔里没有惊讶，也没有兴趣，' +
                '只有一种被打扰之后才浮上来的厌倦。\n\n' +
                '「罪人。」他把这个词念得很轻，像在念一个早就不新鲜的名字，' +
                '「' + (sin ? sin + '的。' : '') +
                '你们这种东西我见得太多了——一进来就以为自己是被冤枉的，' +
                '哭完就想着怎么往上爬，爬到一半发现自己还是那个东西。」\n\n' +
                '他抬起右手，指尖的黑雾在空气里绕了一圈，' +
                '「我本来不该出现的。可我今天实在无聊。」' +
                '他把手放下，「你最好别让我更无聊。」';
        }
        return '你身上的魔力波动先一步惊动了这条街——不对，是这条街先安静了下来，' +
            '像所有东西同时屏住了呼吸。' +
            '暗紫色的幻光在你正前方三尺处绽开，没有任何征兆，也不带一丝声响，' +
            '一个修长的身影从光里走出来，衣摆边缘还挂着未散尽的雾。' +
            '泽洛斯站在那儿，很随意地打量你，那副细框眼镜后面的暗红色瞳孔里，' +
            '有一种只有活得太久的东西才会有的东西——不是敌意，是乏味。\n\n' +
            '「原生的。」他开口，声音低而慢，' +
            '「' + (sin ? sin + '这一宗，你们那边也不缺。' : '') +
            '你们这些生来就站在上面，从来不问自己凭什么。」\n\n' +
            '他忽然笑了一下，那笑里没有一点温度，' +
            '「不过没关系。站得高，摔下来的时候声音好听。」' +
            '他往前半步，黑雾在他脚边铺开，「我是泽洛斯。记住这个名字，' +
            '因为你大概会用上很多次。」';
    }

    if (npcId === '弗雷迪') {
        var _sp = sin ? ('「' + sin + '的，我闻得出来。') : '';
        if (race === 'sinner') {
            return '栈桥下的阴影里堆着一排木箱，箱盖上摆着账本，账本旁边压着一把枪。' +
                '弗雷迪从箱堆后面绕出来，一边走一边把手上的灰擦在裤子上，' +
                '那双眼睛在你看清他之前，已经把你从头到脚称过一遍了。\n\n' +
                '「罪人。」他吐得很干脆，' + _sp +
                '你们这种人进我的货，我只能给你次一等的，还得先收钱。」\n\n' +
                '他坐下来，账本翻开到一半，笔尖悬着，' +
                '「说说吧。你身上有什么，能让我把这一页写下去。」';
        }
        return '栈桥下的空气里有铁锈和旧木头的味道。你走近的时候，箱子后面的枪口先探出来，' +
            '停了半秒才收回去。弗雷迪走出来，脸上挂着这些年练出来的那种笑，' +
            '但那笑没到眼睛——他在算你这单值多少，也在算弄死你要多大代价。\n\n' +
            '「原生的。」他把账本合上，' + _sp +
            '你们这些天生站在上面的，从不还价，只讲条件。」\n\n' +
            '他挪开一只箱子空出位置，' +
            '「坐。生意做完之前，我们不谈别的。」';
    }

    if (npcId === '伊莱亚斯') {
        var _sp2 = sin ? ('「' + sin + '这一宗，样本很多。我的意思是，你们不稀缺。」') : '「你们这一类，样本够多了。」';
        if (race === 'sinner') {
            return '水沟区的地下实验室里，灯管坏了一根，一直在闪。' +
                '伊莱亚斯背对着门站在一排玻璃罐前，罐子里泡着的东西有些还在动。' +
                '他没有回头，只在你推门的时候停了一下笔。\n\n' +
                '「罪人。」他翻过一页，语气跟念实验记录没有区别，' + _sp2 + '\n\n' +
                '他终于转过来，推了推裂开的眼镜，' +
                '「不过稀缺与否，要看我怎么切。」他指了指最远的凳子，' +
                '「坐下。别碰我的东西，也别问罐子里是谁。」';
        }
        return '实验室的灯在闪。你还没走到门口，里面就有人开口：「站住。」' +
            '伊莱亚斯从操作台后面抬起眼睛，镜片的裂纹让他的目光像被切成了几块。' +
            '他上下打量你，不是在看一个人，是在核对一份标本的成色。\n\n' +
            '「原生恶魔。」他把手上的东西放下，' + _sp2 + '\n\n' +
            '「你们最有意思的地方是，从不觉得自己会坏，所以我总能找到坏掉的那一步。」' +
            '他把一张空表格推到你面前，' +
            '「坐。聊十分钟。这十分钟里，你是活的样本。」';
    }

    if (npcId === '埃文') {
        var _sp3 = sin ? ('「' + sin + '的……这地方这样的太多了。」') : '';
        if (race === 'sinner') {
            return '暗巷拐角处的门半开着，里面没有灯，只有一支快燃尽的蜡烛。' +
                '埃文坐在门内的旧椅子上，脚边放着半瓶酒和一只缺口的碗。' +

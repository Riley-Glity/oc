    if (npcId === '维德') {
        if (race === 'sinner') return '昏暗的地下当铺里弥漫着一股潮湿的海腥味。维德正坐在水族箱前的阴影里，深渊海蓝色的西装几乎与黑暗融为一体。听到动静，他缓缓转过头，海藻般的幽绿短发微微晃动。右眼眶里那几个荧光绿色的复眼在暗处幽幽亮起，像深海探照灯一样锁定了你。\n\n<em>"一股快要溺水窒息的绝望味道……罪人。"</em>他咧开嘴，露出交错的鲨鱼尖牙，脖颈处的鳃裂兴奋地开合着，声音低沉得仿佛带着海底的回音，<em>"欢迎来到深渊。想要抓住那根救命稻草吗？用你的灵魂来换，我保证过程……会像沉入海底一样安静。"</em>';
        return '维德把玩着手里一颗散发着幽光的深海珍珠，印着气泡图案的领带在昏暗光线下显得格外诡异。他苍白透绿的修长手指轻轻敲击着桌面，右眼的多个绿色瞳孔同时缩紧，冷冷地审视着你。\n\n<em>"嫉妒环的深海水压……可不是每个原生恶魔都能承受得住的。"</em>他将珍珠随手抛进旁边的水杯里，发出一声沉闷的入水声，脸上的假笑毫无温度，<em>"既然敢走进我的当铺，就说明你已经做好了被深渊吞噬的准备。说吧，你想从海底捞出什么东西？"</em>';
    }
    if (npcId === '莱利') {
        if (race === 'sinner' && (sin === '贪婪' || sin === '色欲')) return '傲慢之环灰烬区的边缘地带，一座废弃的水晶矿场笼罩在暗紫色的微光中。地面上满是碎石，断裂的巨大水晶柱犹如巨兽的残骨般杂乱地刺向半空。空气中悬浮着呛人的矿石粉尘，混杂着常年不见天日滋生出的浓重霉味。你放轻脚步，小心翼翼地跨过地上散落的石块。就在这时，一阵细微却尖锐的金属摩擦声传入耳中。你立刻停下脚步，判断出前方不远处有人。\n\n你借着掩体靠近，在一块倾斜的巨大水晶板后方看到了那个人。他身形高挑却偏瘦，穿着一件黑色的连帽卫衣。灰色的头发显得有些凌乱，左半边的发色深灰近黑。头顶的猫耳微微翕动，身后一条长长的灰色猫尾正贴着地面缓慢地左右摇晃。他正背对着你，手里握着一把小刀，刀刃抵着一块金属片，正专注而谨慎地削刮着，动作极轻。似乎是察觉到了你的视线，他突然停下手里的动作，转过头来。昏暗的光线下，他那双左眼鎏金、右眼银灰的异色瞳孔闪过一丝冷厉的光。\n\n他的两只猫耳瞬间向后折起，进入高度警觉的状态。原本还在缓慢晃动的长尾巴猛地绷直，尾尖的毛发微微炸开。他浑身的肌肉肉眼可见地紧绷起来，目光死死地锁定在你的位置。<em>贪婪……还是色欲？</em>他的声音没有丝毫情绪起伏，语气生硬且冷漠，如同从这座废弃矿坑最深处吹上来的寒风，带着明显的排斥与防备。<em>我不喜欢这两种味道。离我远点。</em>他收回视线，转过身去再次背对着你。他手中的小刀在金属片上重重地划过，刺耳的摩擦声中迸发出几点明亮的火星。周围的金属碎屑和地上的废弃铁器开始发生有规律的轻微震颤。你能清晰地感觉到，一股由金属幻化而成的锁链力量正被他强行压制在掌心之中。只要你再向前靠近半步，那些锁链就会瞬间爆发。';
        if (race === 'sinner') return '傲慢之环灰烬区的边缘地带，一座废弃的水晶矿场笼罩在暗紫色的微光中。地面上满是碎石，断裂的巨大水晶柱犹如巨兽的残骨般杂乱地刺向半空。空气中悬浮着呛人的矿石粉尘，混杂着常年不见天日滋生出的浓重霉味。你放轻脚步，小心翼翼地跨过地上散落的石块。就在这时，一阵细微却尖锐的金属摩擦声传入耳中。你立刻停下脚步，判断出前方不远处有人。\n\n你借着掩体靠近，在一块倾斜的巨大水晶板后方看到了那个人。他身形高挑却偏瘦，穿着一件黑色的连帽卫衣。灰色的头发显得有些凌乱，左半边的发色深灰近黑。头顶的猫耳微微翕动，身后一条长长的灰色猫尾正贴着地面缓慢地左右摇晃。他正背对着你，手里握着一把小刀，刀刃抵着一块金属片，正专注而谨慎地削刮着。似乎是察觉到了你的视线，他突然停下手里的动作，转过头来。昏暗的光线下，他那双左眼鎏金、右眼银灰的异色瞳孔闪过一丝冷厉的光。\n\n他的视线越过倾斜的水晶板，直直地投向你。那双左金右银的异色瞳孔里既没有被打扰的愤怒，也没有任何欢迎的意味，只剩下一种夹杂着深度戒备与疲惫的冷漠审视。<em>……又是一个罪人。</em>他冷冷地吐出几个字，常年极少与人交谈让他的声音听起来有些干涩沙哑。他站在原地没有动，连脸上的表情都凝固着，只有头顶竖起的猫耳微微转动了一下方向，敏锐地捕捉着你这边的每一丝呼吸声。<em>我也曾是。如果你是来找茬的，现在就可以走了。</em>刀刃刮擦金属的声音重新在死寂的矿区里响起。但他握刀的手腕没有了刚才那种专注的流畅感，金属片被剥落的节奏明显变慢、变沉了。那条原本因警惕而僵直的长尾巴也缓缓松懈下来，垂在地上，尾尖在满是粉尘的石块上无意识地轻轻扫动。他虽然没有再抬头看你，但紧绷的肩膀和停顿的刀尖都暴露出他并没有放松警惕——他在安静地等待你开口，或是走出下一步。';
        return '傲慢之环灰烬区的边缘地带，一座废弃的水晶矿场笼罩在暗紫色的微光中。地面上满是碎石，断裂的巨大水晶柱犹如巨兽的残骨般杂乱地刺向半空。空气中悬浮着呛人的矿石粉尘，混杂着常年不见天日滋生出的浓重霉味。你放轻脚步，小心翼翼地跨过地上散落的石块。就在这时，一阵细微却尖锐的金属摩擦声传入耳中。你立刻停下脚步，判断出前方不远处有人。\n\n你借着掩体靠近，在一块倾斜的巨大水晶板后方看到了那个人。他身形高挑却偏瘦，穿着一件黑色的连帽卫衣。灰色的头发显得有些凌乱，左半边的发色深灰近黑。头顶的猫耳微微翕动，身后一条长长的灰色猫尾正贴着地面缓慢地左右摇晃。他正背对着你，手里握着一把小刀，刀刃抵着一块金属片，正专注而谨慎地削刮着。似乎是察觉到了你的视线，他突然停下手里的动作，转过头来。昏暗的光线下，他那双左眼鎏金、右眼银灰的异色瞳孔闪过一丝冷厉的光。\n\n他的头顶，那对灰色的猫耳敏锐地捕捉到了你靠近的细微声响，耳尖向后微不可察地抖动了一下。紧接着，那条原本垂落在地上的长尾巴迅速收拢，带着十足的防备，紧紧卷住了他自己的小腿。<em>新面孔。</em>他率先开了口。由于极少与人交谈，他的嗓音听起来有些发干。语气像生铁一样生硬冷淡，但并没有直接表露出攻击的敌意。察觉到你的视线正落在他左金右银的异色瞳孔上，他浑身的肌肉瞬间紧绷。他下意识地偏过头，利用黑色卫衣的兜帽阴影遮挡住部分侧脸，声音骤然沉了下来，透出一股烦躁。<em>别盯着我的眼睛看。如果你是来嘲笑我的，现在就可以走了。</em>警告完，他重新转回视线。那双锐利的异色瞳自上而下快速扫过你的全身，目光在你的双手和腰间短暂停留，默默评估着你身上是否带有武器或潜在威胁。但在你持续的直白注视下，他的眼神很快出现了细微的闪躲。他显然极不习惯被人这样盯着看。他握着金属片的手指无意识地收紧，指关节因用力而微微泛白。同时，他身体的重心悄然向后脚跟偏移了半寸，做好了随时隐蔽或拉开距离的准备。';
    }
    if (npcId === '弗雷迪') {

        return '你走进这座没有墙壁的建筑，流动的欲望之光像半透明的丝织品在你周围缠绕。空气中甜腻的香气几乎让你感到眩晕，那种味道像是熟透的浆果混合着某种催情烟草的余味。阿斯蒙蒂斯正慵懒地斜卧在秀场中央那张由深红天鹅绒铺就的长榻上，他酒红色的短发凌乱地散开，几缕刘海半遮住他那双带有黄绿叠色的瑰丽瞳孔。\n\n他的上衣扣子随意地开了三颗，露出苍白却有着优美线条的锁骨，皮肤在霓虹光影下泛着珍珠般的冷光。看到你时，他微微张开那抹暗红色的嘴唇，分叉的舌尖轻触上唇的银色舌钉，发出一声极其微弱的叮当声。那种动作并非刻意诱惑，而是一种骨子里透出来的、理所当然的玩弄。两缕如活物般的红雾乖巧地盘旋在他肩头，其中一缕甚至大胆地向你飘来，试图嗅闻你灵魂的气息。';
    }
    if (npcId === '利维坦') {
        return '利维坦并没有站在镜厅中央，他像是一缕被潮湿水汽凝结成的阴影，漂浮在那些不断闪烁的镜面之间。他那一头深海蓝色的长发湿漉漉地贴在苍白的青灰色脊背上，如同一丛腐烂的海藻在暗色的水面上蔓延，发丝间缠绕着几根闪烁着寒光的银色水草饰品。当他缓慢地转过身时，动作僵硬且迟缓，仿佛这具躯壳正承受着某种无形的、来自深海的巨大压力。\n\n他的眼距比常人略宽，这让他那双灰绿色的瞳孔显得异常浑浊且缺乏焦点，总是带着一种挥之不去的、近乎怯懦的卑微感。但当你试图直视他时，你会发现那种“怯懦”只是一层薄薄的冰壳，冰壳之下是足以冻结灵魂的阴冷与锋利。他伸出指尖同样生有半透明蹼膜的长手，在身侧的一面镜子上轻轻划过，留下一道暗色的水痕，那镜子里原本映照出的路西法的背影瞬间如瓷器般碎裂。';
    }
    if (npcId === '别力西卜') {
        return '你踏入暴食之环那座号称“永恒盛宴”的巨型宫殿时，首先击中你的是一种近乎实质化的、由腐肉、名贵香料与陈年佳酿混合而成的浓郁气味。地板上铺着厚厚的、被油脂浸透的暗紫色地毯，每走一步都会发出令人不安的粘稠挤压声。别力西卜正坐在一张由无数巨兽颅骨堆砌而成的王座上，他那宽大的墨绿色长袍上点缀着细碎的、如苍蝇复眼般的复古宝石，在昏暗的烛光下闪烁着诡异的虹彩。\n\n他正在进食，动作却优雅得令人心惊。他那头浅绿色的卷发里点缀着几根黑色的短角，发丝间偶尔有细小的、泛着金属蓝光的苍蝇拍打着翅膀飞出又落下。当他停下手中那柄纯金的餐刀，缓缓抬起头看向你时，你才发现他的瞳孔呈现出一种极其深沉的暗绿色，眼底深处重叠着无数细小的复眼虚影。那目光并不饥渴，反而带着一种看透万物皆为“养分”的极度冷静。他随手将一块滴着血水的肉排抛向半空，几只巨大的毒蝇瞬间从阴影中窜出将其撕碎，他却只是用洁白的丝绸餐巾轻轻擦拭了一下唇角。\n\n<em>“新来的食客吗？”</em>他的声音低沉且富有磁性，却带着一种震颤灵魂的嗡鸣感，<em>“希望你的灵魂，比那些无聊的残渣更有嚼劲。”</em>';
    }
    if (npcId === '贝尔芬格') {
        return '懒惰之环的“沉眠之塔”顶端，空气呈现出一种如梦境般迷离的淡紫色，无数巨大的齿轮在半空中缓慢且无声地咬合着。你感到双腿像是灌了铅一样沉重，强烈的睡意如潮水般一波波袭来。贝尔芬格就那样半瘫坐在一张悬浮的、由无数精密机械零件与云朵般柔软的织物构成的软榻上。他那一头如雪般苍白的乱发长到垂落在地，发丝中缠绕着几根带有黄黑色警戒纹路的机械触须，正随着他的呼吸有节奏地律动着。\n\n他闭着眼，半透明的眼罩滑落到鼻梁一侧，露出那张精致到近乎无暇、却透着病态倦怠的脸庞。听到动静，他连眼皮都懒得抬一下，只是发出一声极其慵懒的鼻音。一根机械触须像蛇一样游到你面前，末端的感应器发出微弱的红光。<em>“啊……又一个试图叫醒梦境的蠢货。”</em>他终于撑开了一道眼缝，那是一双如冰晶般剔透的淡蓝色瞳孔，其中没有丝毫温度，只有对永恒寂静的向往。他微微动了下手指，周围的时钟同步发出了一声低沉的咔哒声，仿佛整个世界都因为他的一个念头而变慢了。';

    '康特·恩顿': { ring: '暴食之环', level: 'poor', timeStart: 1080, timeEnd: 300, dislikeSins: [], workPlace: '暴食之环废弃化工厂', homeDesc: '一个散发着刺鼻化学废料气味的垃圾堆。', firstMeetText: '推开废弃化工厂的铁门，震耳欲聋的重金属音乐夹杂着诡异的笑声扑面而来。康特正倒挂在天花板的生锈管道上，紫红相间的条纹夹克松垮地垂落。他的身体以一种扭曲的姿势晃动着，手里正把玩着一支装着荧光绿色液体的注射器。\n\n听到动静，他猛地扭过头。巨大的半垂眼布满血丝，亮粉色的瞳孔极度涣散，但又在瞬间锁定了你。脸上的肌肉不受控制地抽搐着，扯出一个撕裂般夸张的笑容，露出满口尖锐的荧光粉色獠牙。\n\n<em>咯咯咯……又来了一个试药的？还是来找乐子的？</em>他松开脚，整个人像一滩没有骨头的烂泥一样砸在地上，却似乎感觉不到任何疼痛，扭曲着肢体迅速爬向你，<em>没关系，我这里有最顶级的货！保证让你的脑子像烟花一样炸开！</em>' },
    '泽维尔': { ring: '贪婪之环', level: 'middle', timeStart: 1320, timeEnd: 480, dislikeSins: [], workPlace: '黑市深巷', homeDesc: '没有固定住所，隐藏在城市的阴影中。', firstMeetText: '暗巷的尽头，浓重的血腥味还未散去。一具残缺的尸体倒在血泊中，而那个身影正站在尸体上方。\n\n他转过身，身形高挑，穿着一件熨烫平整的白色翻领西装衬衫，打着整齐的黑色领带。凌乱的浅色短发下，是一双半眯的狭长双眼，纯黑色的巩膜和白色的细长瞳孔在阴暗中散发着令人毛骨悚然的愉悦。最让人毛骨悚然的是他的下半身和手肘以下——那不是血肉，而是深渊暗影构成的流体，正像粘稠的活物般蠕动、蔓延。\n\n他裂开嘴，一直裂到非人的角度，露出交错的尖锐獠牙，发出一阵神经质的低笑。<em>哦？有目击者？</em>他由阴影构成的手臂化作一柄锐利的黑刃，滴着黑色的粘液，<em>不巧，我现在是下班时间。不过……如果你愿意支付一笔可观的封口费，我或许可以当做没看见你。</em>' },
    '塞西莉亚': { ring: '贪婪之环', level: 'rich', timeStart: 1020, timeEnd: 1440, dislikeSins: ['色欲'], workPlace: '贪婪之环高级宴会厅', homeDesc: '一栋极其奢华的私人宅邸。', firstMeetText: '贪婪之环的高级宴会厅里，塞西莉亚正端着一杯红酒，耀眼的金发在水晶灯下熠熠生辉。她脖子上的红宝石项圈完美遮盖着断头切痕与掐痕。察觉到你毫不掩饰的打量视线，她蔚蓝的眼底极快地闪过一丝嫌恶与生理性反胃，但转瞬即逝。\n\n<em>哎呀，一位陌生的客人。</em>她立刻换上温柔无辜的笑容，提着裙摆款款走来，随身散发着致命香水味，<em>在这个冰冷的地狱里，能遇到您这样有趣的灵魂真是太好了。不知道您是否愿意，听一个可怜女人诉说她的委屈呢？</em>' },

    '莱利': { ring: '傲慢之环', level: 'poor', timeStart: 1080, timeEnd: 1320, dislikeSins: ['贪婪','色欲'], workPlace: '废弃水晶矿场', homeDesc: '一间由碎水晶搭建的简陋棚屋。', firstMeetText: '傲慢之环灰烬区的边缘地带，一座废弃的水晶矿场笼罩在暗紫色的微光中。地面上满是碎石，断裂的巨大水晶柱犹如巨兽的残骨般杂乱地刺向半空。空气中悬浮着呛人的矿石粉尘，混杂着常年不见天日滋生出的浓重霉味。\n\n你借着掩体靠近，在一块倾斜的巨大水晶板后方看到了那个人。他身形高挑却偏瘦，穿着一件黑色的连帽卫衣。灰色的头发显得有些凌乱，左半边的发色深灰近黑。头顶的猫耳微微翕动，身后一条长长的灰色猫尾正贴着地面缓慢地左右摇晃。他正背对着你，手里握着一把小刀，刀刃抵着一块金属片，正专注而谨慎地削刮着。似乎是察觉到了你的视线，他突然停下手里的动作，转过头来。昏暗的光线下，他那双左眼鎏金、右眼银灰的异色瞳孔闪过一丝冷厉的光。\n\n<em>……你站那里多久了？</em>他的声音冷淡，带着明显的戒备。那条原本垂落在地上的长尾巴迅速收拢，紧紧卷住了他自己的小腿。<em>如果你是来嘲笑我的眼睛的，现在就可以走了。</em>' },
    '弗雷迪': { ring: '贪婪之环', level: 'middle', timeStart: 720, timeEnd: 1140, dislikeSins: ['暴怒','嫉妒'], workPlace: '万宝商行分店', homeDesc: '金丝街一间挂着深色窗帘的公寓。', firstMeetText: '贪婪之环的金丝街上，整条街道的地面都铺满了金币。万宝商行分店的奢华建筑在这片反光中投下巨大的倒影。你推开沉重的水晶大门，一股混合了陈旧羊皮纸、浓郁檀香以及生锈金属的复杂气味立刻扑面而来。\n\n柜台后方站着一个身形极高的男人。他穿着一件深棕色、边缘镶嵌着金线的长袍，深红棕色的披肩长发垂落在肩侧。他的右眼角横亘着一道狰狞的刀疤，右眼戴着一枚单片眼镜。最引人注目的是他的右臂——那不是血肉，而是一只巨大的灰色乌鸦羽翼，末端长着尖锐的利爪，羽毛边缘在灯光下泛着幽暗的蓝光。暗红色的锋利瞳孔透过镜片审视着你，目光犹如刀锋般锐利，充满了商人评估货物价值时的算计。<em>新面孔。欢迎光临。</em>' },
    '埃文·格雷': { ring: '色欲之环', level: 'poor', timeStart: 1080, timeEnd: 1380, dislikeSins: [], workPlace: '暗巷深处', homeDesc: '暗巷一间被封死的房间。', firstMeetText: '色欲之环暗巷的最深处，在一堆散发着霉味的废弃木箱后方，你看到了那个极其畸形的身影。他只有大半截躯干，双腿从大腿根部被完全截断，双臂也只剩下肩膀以下极短的一截残端。残缺的切面狰狞而泥泞，正向外渗着浑浊的体液。他的脖子上紧紧扣着一个粗糙的黑色皮质项圈，上面连着一条沉重的银色锁链。头顶一对浅紫色的软塌兔耳无力地拖拽在满是污垢的地面上，绒毛上结满了干涸发黑的血块。\n\n察觉到你的存在，他费力地仰起那张病态苍白的脸。他的左眼被浸透血污的绷带死死缠住，仅露出的右眼是一只浅金色的瞳孔。那眼神空洞而麻木，却在看向你的瞬间闪过一丝复杂的光芒——恐惧、期待、和某种更深层的病态渴求。<em>请……请不要伤害我……</em>他的声音细弱且不断发颤，干裂的嘴角却不受控制地微微上扬。' },
    '卡恩': { ring: '色欲之环', level: 'middle', timeStart: 900, timeEnd: 1260, dislikeSins: ['嫉妒'], workPlace: '霓虹大道酒吧', homeDesc: '霓虹大道一间装饰着十字架元素的公寓。', firstMeetText: '色欲之环的喧闹酒吧内，光线暧昧而昏暗。空气中弥漫着甜腻的香水味与酒精的气息。卡恩慵懒地斜靠在吧台上，白皙的皮肤上泛着一层自然的红晕。他棕红与玫红相间的蓬松中长发随着动作微微晃动，发丝间隐约可见缝合线与十字架的装饰物。头顶带有白色十字花纹的玫红色尖角在灯光下泛着微光，脖颈处的黑色项圈上挂着一枚金色十字架吊坠。\n\n看到你走近，他立刻被吸引了注意力。那双狡黠的狐狸眼微微弯起，眼尾带有玫红色十字线花纹的眼妆随着笑容微微上扬。玫红色的瞳孔毫不避讳地在你身上来回打量。嘴唇开合间，隐约露出尖锐的獠牙和分叉舌尖上的银色舌钉。<em>嗯~新面孔。来酒吧坐坐？</em>' },
    '伊莱亚斯': { ring: '暴食之环', level: 'poor', timeStart: 1200, timeEnd: 1440, dislikeSins: [], workPlace: '残渣区深处小巷', homeDesc: '残渣区一间散发化学试剂气味的实验室。', firstMeetText: '暴食之环残渣区深处的小巷里，空气中弥漫着刺鼻的化学试剂与腐烂食物的混合气味。一扇锈迹斑斑的铁门半掩着，门缝里透出幽绿色的微光。你推门而入，实验室内只亮着几盏最低亮度的指示灯，空气中持续回荡着单调沉闷的400赫兹白噪音。\n\n听到脚步声，伊莱亚斯从实验台前转过身。墨绿色杂乱的及肩长发垂在苍白病态的脸侧，发丝上还沾着几滴浑浊的试剂。他抬起手，用指甲缝里嵌满暗褐色污渍的手指，推了推鼻梁上那副布满裂痕与血污的厚重银边圆框眼镜。那双布满血丝的橄榄绿色瞳孔死死地锁定了你，目光冰冷而专注，如同审视一件刚送到的实验样本。<em>……你挡到我的路了。</em>他的语调平稳如仪器报数，没有任何情绪起伏。' },
    '泽洛斯': { ring: 'random', level: 'random', timeStart: 0, timeEnd: 1440, dislikeSins: [], workPlace: '游荡于各环', homeDesc: '泽洛斯没有固定居所。', firstMeetText: '你正穿行在地狱的街巷之间，周围的空间突然产生了一阵诡异的扭曲。伴随着一团凭空涌现的浓重黑雾，泽洛斯直接跨出阴影，毫无预兆地出现在你的面前。他那一头蓬松凌乱的紫色短发在暗光下泛着微光，发间几支漆黑的尖角显得极具攻击性。锯齿状的披风下摆随着他出现的动作轻轻扬起又落下，身上那件黑色的露脐短上衣和短裤的链条装饰在暗光中泛着冷光。\n\n他稳稳地站在你面前，微微低下头。那双浓郁的暗红色眼瞳透过鼻梁上的细框眼镜，毫不掩饰地上下审视着你。瞳孔边缘泛起一圈暗红色的微光，同时，萦绕在他周身的黑雾随着他情绪的波动，迅速凝结成暗紫色的幻光。他的嘴角向两边拉扯出一个诡异且充满兴味的弧度。<em>啊~又一个有趣的灵魂。</em>' }

        { text: '问他为什么独自一人', loveChange: -1, response: '你问他为什么独自一人，莱利的猫耳瞬间竖了起来——不是警觉，而是那种被人猝不及防戳中软肋的应激反应。他手上的动作顿了一下，刀刃在金属片上留下一道歪斜的划痕。他没有立刻回答。矿场里死寂了几秒，只有远处暗紫色水晶发出的嗡嗡低鸣。<em>……这和你无关。</em>他冷冷地说，声音里带着一丝不易察觉的颤抖。他转过身去，背对着你，那条长尾巴僵硬地卷在腿边。但他转身的瞬间，你捕捉到了——在他那双异色瞳孔的深处，闪过一丝极其短暂的、被刻意压制的落寞。他没有再说话。但他也没有离开。也许他不是真的不想回答。只是不知道该怎么开口。' },

        return;
    }

    ensureNpcInSocial(npcId);
    var rel = player.relationships[npcId];
    var data = player.npcTalkDaily[npcId];
    var count = data.count;

    // 检查是否已满5次
    if (count >= 5) {
        player.flags['npcLeft_'+npcId] = true;
        st('<div class="scene-title">' + npcId + '</div><p>' + npcId + '看了你一眼，摇了摇头：<em>今天已经聊得够多了。我需要一些自己的空间。</em></p><p>他转身离开了。</p>');
        addTime(15);
        cb();
        ab('继续探索（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(returnRing, returnLevel); });
        return;
    }

    var pool = npcInteractionData[npcId] || [{ text: '随便聊聊', loveChange: 0, response: '<em>……嗯。</em>' }];
    var interaction = pool[count % pool.length];
    // 增加NPC对话计数
    incrementNpcTalk(npcId);
    addTime(10);

    var newLove = Math.min(100, Math.max(0, (rel.love || 5) + interaction.loveChange));
    rel.love = newLove;
    var attitude = getNpcAttitude(npcId);
    var loveBarHtml = '<div style="width:100%;height:4px;background:#1a0a1a;margin-top:10px;border-radius:2px;overflow:hidden;">' +
        '<div style="width:' + newLove + '%;height:100%;background:linear-gradient(90deg, #8a5a62, #e85060);transition:width 0.5s;"></div>' +
        '</div>';

    st('<div class="scene-title">交 谈 · ' + npcId + '</div><p>' + interaction.response + '</p>' + loveBarHtml + '<p style="color:' + attitude.color + ';font-size:0.78em;margin-top:6px;">' + attitude.text + ' <span style="float:right;color:#e8c060;">好感度 ' + newLove + (interaction.loveChange >= 0 ? ' ↑' : ' ↓') + '</span></p>');
    cb();
    if (count < 4) {
        ab('继续交谈（耗时10分钟）', function() { addTime(10); sceneNpcInteraction(npcId, returnRing, returnLevel); });
    }
    ab('结束对话', function() {
        sceneExploreDistrict(returnRing, returnLevel);
    });
}
function addNpcButton(npcId, ring, level) {

            }

                ab('返回', function() { sceneExploreDistrict(ring, level); });

// ==================== 商店数据（扩展已被合并） ====================
function enterShop(type) {
            var ring = player.currentRing;
            var level = getCurrentLevel();
            var items = shopData[ring] && shopData[ring][level] ? shopData[ring][level][type] : [];
            if (!items || !items.length) {
                st('<p>这里暂时没有商品。</p>');
                cb();
                ab('返回', function() { sceneExploreDistrict(ring, level); });
                return;
            }
            var typeName = { food: '食品店', cloth: '服装店', item: '道具店' } [type];
            var html = '<div class="scene-title">◆ ' + typeName + ' ◆</div>';
            html += '<div style="background:#180610;border:1px solid #2a0a16;border-radius:6px;padding:10px;margin:8px 0;">';
            html += '<p style="color:#8a5a62;font-size:0.78em;margin-bottom:6px;">可购买物品：</p>';
            for (var i = 0; i < items.length; i++) {
                var it = items[i];
                var extra = '';
                if (it.food) extra += ' 🍖+' + it.food;
                if (it.hp) extra += ' ❤️+' + it.hp;
                if (it.strength) extra += ' 💪+' + it.strength;
                if (it.charisma) extra += ' 💋+' + it.charisma;
                if (it.magic) extra += ' +' + it.magic;
                if (it.sanity) extra += ' 🧠+' + it.sanity;
                if (it.desire) extra += ' 🔥+' + it.desire;
                if (it.agility) extra += ' 🏃+' + it.agility;
                if (it.fatigue) extra += ' 😫' + (it.fatigue < 0 ? '' : '+') + it.fatigue;
                html += '<p>· ' + it.name + ' <span style="color:#e8c060;">' + it.price + 'G</span> — ' + (it.desc || '') +
                    extra + '</p>';
                if (it.buffs) {
                    for (var b = 0; b < it.buffs.length; b++) {
                        html += '<p style="font-size:0.65em;color:#80c080;padding-left:16px;">' + it.buffs[b].name +
                            ': ' + it.buffs[b].desc + '</p>';
                    }
                }
            }
            html += '</div>';
            html += '<p style="color:#8a5a62;font-size:0.78em;margin-top:8px;">请选择要购买的物品：</p>';
            st(html);
            cb();

            for (var i = 0; i < items.length; i++) {
                (function(item) {
                    ab('购买 ' + item.name + '（' + item.price + 'G）', function() {
                        if (player.gold >= item.price) {
                            player.gold -= item.price;
                            var effects = { hp: item.hp || 0, strength: item.strength || 0, magic: item.magic ||
                                    0, charisma: item.charisma || 0, sanity: item.sanity || 0,
                                desire: item.desire || 0, fatigue: item.fatigue || 0, food: item.food ||
                                    0, agility: item.agility || 0, buffs: item.buffs || [] };
                            if (type === 'food') {
                                addItem(item.name.replace(/\s/g, '_'), item.name, 'consumable', item.desc, 1,
                                    effects);
                            } else if (type === 'cloth') {
                                unequipCurrentCloth();
                                equipCloth(item);
                                addItem(item.name.replace(/\s/g, '_'), item.name, 'armor', item.desc, 1, {
                                    charisma: item.charisma || 0,
                                    strength: item.strength || 0,
                                    magic: item.magic || 0,
                                    agility: item.agility || 0,
                                    sanity: item.sanity || 0,
                                    buffs: item.buffs || []
                                }, true);
                            } else if (type === 'item') {
                                addItem(item.name.replace(/\s/g, '_'), item.name, 'misc', item.desc, 1, { buffs: item
                                        .buffs || [] });
                            }
                            checkHp();
    ua();
                            st('<p>你购买了 <span style="color:#e8c060;">' + item.name + '</span>。</p>');
                        } else {
                            st('<p class="highlight">⚠️ 金币不足。需要 ' + item.price + ' 金币，你只有 ' + player.gold +
                                ' 金币。</p>');
                        }
                        cb();
                        ab('继续购物', function() { enterShop(type); });
                        ab('离开', function() { sceneExploreDistrict(ring, level); });
                    });
                })(items[i]);
            }
            ab('离开', function() { sceneExploreDistrict(ring, level); });
        }

// ==================== 跨环移动 ====================
function travelToRing(ring) {
    if (ring === player.currentRing) { sceneExploreDistrict(ring, getCurrentLevel()); return; }
    
    if (player.stats.ringsVisited.indexOf(ring) === -1) {
        player.stats.ringsVisited.push(ring);
        setTimeout(function() { checkAchievement('first_ring'); }, 150);
    }

    var hasPass = player.inventory.some(function(it) { return it.name === '跨环通行证（永久）'; });
    var cost = hasPass ? 0 : 5;
    var time = 60 + Math.floor(Math.random() * 30);
    
    var msg = hasPass ? 
        '<p>你持有<span style="color:#e8c060;">跨环通行证</span>，无需支付马车费用。</p>' : 
        '<p>前往' + ring + '需要乘坐跨环马车，花费' + cost + '金币。</p>';
        
    st('<div class="scene-title">跨 环 旅 行</div>' + msg + '<p>路程预计耗时约 ' + time + ' 分钟。</p>');
    cb();
    ab('出发（耗时' + time + '分钟' + (cost > 0 ? '，-' + cost + '金币' : '') + '）', function() {
        if (player.gold >= cost) {
            player.gold -= cost;
            addTime(time);
            player.currentRing = ring;
            checkHp();
    ua();
            st('<p>马车在一阵颠簸中到达了<span class="highlight">' + ring + '</span>。</p>');
            // 护送任务达成逻辑
            player.activeTasks.forEach(function(t) {
                if (t.type === 'escort' && t.target === ring) {
                    player.flags['task_done_' + t.id] = true;
                    st(tc.innerHTML + '<p class="gold-text">任务 "' + t.title + '" 护送目标已达成！</p>');
                }
            });
            cb();
            ab('下车', function() { sceneExploreDistrict(ring, 'poor'); });
        } else {
            st('<p class="highlight">⚠️ 金币不足。你需要 ' + cost + ' 金币。</p>');
            cb();
            ab('返回', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
        }
    });
    ab('取消', function() { sceneExploreDistrict(player.currentRing, getCurrentLevel()); });
}

// ==================== 时钟购买 ====================
function buyClock() {
    if (player.hasClock) { st('<p>你已经有一个时钟了。</p>'); cb(); ab('返回', function() { sceneExploreDistrict('傲慢之环','poor'); }); return; }
    if (player.gold >= 10) { player.gold -= 10; player.hasClock = true; checkHp();
    ua(); st('<p>你花10金币购买了一个旧时钟。现在可以在睡觉前设置起床时间了。</p>'); cb(); ab('返回', function() { sceneExploreDistrict('傲慢之环','poor'); }); }
    else { st('<p class="highlight">金币不足。需要10金币。</p>'); cb(); ab('返回', function() { sceneExploreDistrict('傲慢之环','poor'); }); }
}

    '傲慢': { name: '路西法', title: '傲慢之主', ring: '傲慢之环', birthScene: '暗紫色的混沌能量在傲慢环的诞生之地凝聚——那姿态不像孕育，更像一场精确的排列。星尘粒子以几何线条编织你的身体：骨骼、神经、皮肤——每一个步骤都遵循着某种冰冷的秩序。这过程毫无痛苦，却也毫无温度。\n\n你睁开眼。头顶是暗紫色水晶穹顶，棱镜将冷光切割成锋利的碎片。你躺在黑色石板上，周围是同样新生的恶魔——但无人交谈。在这里，开口说话前必须确认自己配得上开口。\n\n一个高阶堕天使站在边缘，双臂交叉，目光扫过你们时没有任何表情。他开口时语气平淡得像在陈述地理坐标：\n\n<em>君主在等。走。</em>', audience: '晨星殿。大门在你面前自动滑开——不是你推开的，是门自己让步的。\n\n大殿空旷得近乎残酷。暗紫色的水晶棱柱从穹顶垂下，将冷光折射成明暗交错的几何线条。两侧墙壁镶嵌的水晶板中封存着堕天时的碎片——断裂的羽翼、破碎的光环、模糊的面孔。那不是陈列，那是警告：凡入此殿者，皆在历史面前。\n\n阶梯向上延伸。每一级都打磨得光滑如镜，映出你仰望时渺小的倒影。\n\n路西法坐在王座上。\n\n银白长发从王座靠背上垂落，如凝固的月光。他的肤色是冷调的象牙白，赤金色的眼眸微扬——那不是刻意的轻蔑，而是<span class="highlight">理所当然的俯视</span>。他穿着暗紫金边的长袍，衣摆绣着堕天使暗纹。周身萦绕着星尘粒子，每一粒都泛着冷冽的铂金光泽。\n\n他的目光落到你身上。不——不是"落到"。是<span class="gold-text">扫过</span>。像翻阅一本不值得细读的卷宗。\n\n<em>新生的。</em>\n\n声音清冷如冰凌碰撞。他说这两个字的时候没有看你——不是刻意回避，而是觉得持续注视一个新生恶魔是对他自身注意力的浪费。\n\n<em>你诞生于傲慢之环。这意味着你比地狱中绝大多数存在都更接近完美——</em>他微微调整了坐姿，手指在王座扶手上轻轻一点，整个大殿的空气随之震颤——<em>但这不意味着你本身完美。你只是一个起点。一个可能。</em>\n\n他的目光终于正视你——但那目光中没有任何温度。只有一种纯粹的、居高临下的<span class="highlight">评估</span>。\n\n<em>不要让这份本质蒙羞。平庸——是最大的罪。如果你做不到出众，那就做到消失。吾不需要平庸的子民。吾连对你们失望的时间都不屑于浪费。</em>\n\n他轻轻挥了挥手。那动作优雅而随意，像拂去衣袖上的一粒星尘。从头到尾，他的表情没有任何变化。\n\n<em>退下。证明你的价值——或者不要。吾不在乎。吾只接受已经被证明的结果。</em>', firstWords: '如果你做不到出众，那就做到消失。吾不需要平庸的子民。' },
    '贪婪': { name: '玛门', title: '贪婪之主', ring: '贪婪之环', birthScene: '金色的混沌能量在贪婪环的诞生之地翻涌——那景象就像一座融化的金币喷泉。每一滴飞溅的能量落到地面时都发出清脆的叮当声。空气中弥漫着金属的味道——崭新的黄金气味。\n\n你的身体从这片金色海洋中凝聚。最先成形的是手指——因为在贪婪环，<span class="highlight">先有抓取的能力，才有存在的意义</span>。然后是眼睛，用来评估一切的价值。\n\n周围新生的恶魔已经开始互相打量——那眼神不像好奇，更像在评估货物。你发现自己也在做同样的事。这本能不是学来的，是随能量一起编织进你体内的。\n\n一个戴单边金丝眼镜的执事站在旁边，手拿账本。他每写一笔就念叨一句："又一个。记下了。以后欠了债跑不掉的。"', audience: '万宝楼。金币铺成的地面在你脚下发出清脆的声响——每一枚都是真金，被嵌在透明的水晶地板下。墙壁更令人咋舌：来自不同世界的珍品堆砌在一起——东方的翡翠、西方的钻石、人间的油画、天堂的碎片。它们被随意地堆着，像仓库里的存货。\n\n玛门斜靠在一把纯金太师椅上，一条腿搭在扶手外面。他的手指间翻飞着一枚金币——那枚金币在他指缝间灵巧地翻转，从食指滚到小指，再从小指滚回拇指，周而复始，从不掉落。\n\n乌黑长发被一丝不苟地束成低垂的马尾，发间缀着金色高光。单边金丝眼镜后的双眼流动着金色的光芒——看你的眼神就像在<span class="highlight">评估一件刚到手的货物</span>。他穿着一身中式黑色长衫，衣襟袖口用暗金线绣着繁复的云纹与钱币纹样。十根手指上戴满了各式戒指——每一枚都刻着不同的契约符文。\n\n<em>啧，新来的。</em>\n\n他的语气带着漫不经心的痞气。说话时没有停下手中的金币——甚至没有正眼看你。\n\n<em>咱就直说了——你诞生在贪婪之环，说明你骨子里是个明白什么值钱、什么更值钱的家伙。这算是个优点。但优点不值钱——</em>他终于把目光移向你，嘴角勾起一个似笑非笑的弧度——<em>能变现的优点才值钱。</em>\n\n他从太师椅上坐起身，单手托腮，居高临下地打量你。那眼神里没有恶意——只有纯粹的、毫不掩饰的<span class="gold-text">精明</span>。\n\n<em>在这个地狱里，有钱的就是大爷，没钱的连大爷的鞋都舔不上。任何时候，任何东西，都有一个价格——包括你自己。你值多少钱，取决于你能创造多少价值。听明白了吗？</em>\n\n他从旁边的宝箱里摸出一枚最小的金币——指甲盖那么大——然后随手弹向你。金币在地上叮当一声滚到你脚边。那不是慷慨，那是投资。\n\n<em>第一笔启动资金。算咱投资你的。记住了——以后十倍还回来。还不上也没关系，咱有的是办法从你身上把本钱榨出来。</em>', firstWords: '任何时候，任何东西，都有一个价格——包括你自己。' },
    '暴怒': { name: '萨麦尔', title: '暴怒之主', ring: '暴怒之环', birthScene: '暴怒之环的诞生之地是一座火山口。墨绿色的混沌能量夹杂着暗红色的火星，从火山深处喷涌而出。每一次喷发都伴随着震耳欲聋的巨响——那不是爆炸，是<span class="highlight">愤怒</span>。纯粹的、未经修饰的愤怒。\n\n你的身体从这股狂暴的能量中凝聚——灼热、暴躁、充满力量。血液在你血管里奔涌——那温度远高于岩浆。它催促你去撞击、撕碎、摧毁任何阻挡在你面前的东西。\n\n周围新生的恶魔们还没完全成形就已经开始互相咆哮。有两个就在你旁边——四肢还没长全，就用已经成形的头颅互相撞击。骨头的碎裂声和嘶吼声混在一起。没人阻止。在暴怒之环，阻止一场战斗是侮辱。\n\n一个浑身伤疤的老角斗士站在火山口边缘俯视着你们。他咧嘴笑了——那笑容里全是暴力的期待。', audience: '血焰角斗场——一座倒置的火山。火山口朝下扣在大地上，岩浆从上方流淌下来，形成环形的火焰瀑布将角斗场包围。观众席沿火山内壁开凿，层层向上，挤满了狂热的恶魔。空气中弥漫着硫磺、血腥和汗水的味道。\n\n角斗场中央还残留着上一场战斗的痕迹——散落的碎骨、干涸的血迹、一把断成两截的巨斧。没人清理。这些痕迹本身就是角斗场的装饰。\n\n萨麦尔站在最高处的观战台上。\n\n不是坐在王座上——是<span class="highlight">站</span>在观战台边缘。一只脚踩在栏杆上，身体前倾，像一头随时会扑下来的猛兽。那把比他身体还大的巨斧靠在旁边的石柱上，斧刃上还留着暗红色的余温。\n\n墨绿短发如燃烧的火焰般张扬竖起，发间夹杂暗红挑染。额角那道从眉骨延伸到下颌的伤疤在岩浆光芒中泛着暗红色。他的双眼是熔岩般的橙红色——瞳孔里真的映着火焰，仿佛眼球本身就是两团永不熄灭的怒火。\n\n他看到你了。\n\n不是审视，不是打量。他<span class="gold-text">咧嘴</span>笑了——一种看到了新沙包的笑容。\n\n<em>哈！又来了一个！</em>\n\n声音像打雷一样在角斗场中炸开。观众席上的恶魔们爆发出震耳欲聋的欢呼。萨麦尔单手抓住栏杆，一个翻身从十米高的观战台跃下——落地时整个角斗场都震动了一下。\n\n他大步走向你。每一步都震得地面上的碎石跳动。他在你面前停下，居高临下地盯着你。你能闻到他身上的气味——硫磺、铁锈、和某种更深层的、属于纯粹暴力的气息。\n\n<em>听好了，新崽子——</em>\n\n他伸出一根手指点在你胸口上——那力道不重，但足以让你后退一步。\n\n<em>老子不在乎你长什么样、有什么本事。在暴怒之环，只有一个规矩——谁拳头硬谁说了算。你觉得自己够强？那就证明给老子看。你觉得自己不够强——</em>他的嘴角咧得更大了——<em>那就被打到够强为止。或者被打死。老子不在乎。反正每天都有新的崽子滚进来。</em>\n\n他转过身走了几步，又回头看了你一眼。那眼神里没有鼓励——只有不耐烦的期待。\n\n<em>去角斗场打一场。不管你输赢，至少让老子看看你有没有资格死在老子手里。</em>', firstWords: '你觉得自己够强？证明给老子看。不够强？那就被打到够强为止——或者被打死。老子不在乎。' },
    '色欲': { name: '阿斯蒙蒂斯', title: '色欲之主', ring: '色欲之环', birthScene: '色欲之环的诞生之地弥漫着甜腻的香气。暗红色的混沌能量如丝绸般柔软地缠绕着你的身体——没有痛苦，只有一种温热的、让人想要沉溺其中的舒适感。\n\n你的身体从欲望的能量中凝聚。最先成形的是皮肤——因为在这里，<span class="highlight">被触碰</span>是第一需求。然后是眼睛、嘴唇、手指——每一寸能够感知欲望的器官都优先成形。\n\n两缕有生命的红雾在诞生之地上方盘旋。它们偶尔俯冲下来，绕着一个新生的恶魔转一圈，发出只有彼此才能听懂的窃窃私语，然后飞走。所有新生的恶魔都本能地想要伸手触碰那两缕红雾——仿佛触碰它们就能带来某种不可言说的满足。\n\n周围新生的魅魔和梦魔们已经开始互相打量。那眼神里没有贪婪环的算计，也没有暴怒环的敌意——只有一种<span class="gold-text">玩味</span>。纯粹的、带着暧昧期待的玩味。', audience: '欲焰秀场。你踏入这座建筑的第一秒就意识到——这里没有墙壁。流动的欲望之光构成了所有的边界：霓虹般的光芒不断变幻着形状，有时像缠绕的肢体，有时像半开的嘴唇。地板柔软得像踩在云朵上，每走一步都会留下一道渐渐消散的光痕。\n\n空气中充满了低语——成百上千个低语层层叠叠，有些是诱惑，有些是笑声，有些是更露骨的邀请。这些低语不来自任何具体的声源，而是从墙壁、地板、空气中渗透出来的。\n\n阿斯蒙蒂斯斜倚在红色天鹅绒长椅上。\n\n一条腿搭在扶手外面轻轻晃动，另一条腿蜷在身下。酒红色的短发随意垂在眼前，前两缕刘海几乎遮住了半张脸——但遮不住那双黄绿色的瞳孔。瞳孔中流动着金色的光芒，像融化的蜂蜜里滴入了让人上瘾的毒药。\n\n嘴唇微张，露出尖利的犬齿。分叉的舌头从齿缝间探出来——上面戴着银色舌钉，在流动的光线下闪烁。两缕红雾乖顺地缠绕在他肩头。左肩的红雾正梳理他的发丝，右腰的红雾在他身边游弋，像一条等待命令的蛇。\n\n他看到你了。\n\n<em>嗯哼~</em>\n\n声音像羽毛一样轻，但精准地搔刮着听者的神经末梢。他说话时，右腰的红雾从长椅上游下来，在你身边绕了一圈——像在嗅你的气味——然后飞回他身边，在他耳边低语。他听了，嘴角勾起一个玩味的弧度。\n\n他缓缓坐起身。动作不紧不慢，每一个姿态的变化都经过了某种精密的计算——不是为效率，而是为<span class="highlight">观赏性</span>。\n\n<em>新生的孩子。欢迎来到色欲之环。</em>\n\n他托着腮，歪头看你。那眼神里混合着兴趣和某种更危险的期待。\n\n<em>在这里，欲望不是罪恶——是艺术。你能让别人为你着迷吗？你能看穿他们心底最隐秘的渴望吗？如果不能——</em>他用分叉的舌头碰了一下上唇，银色舌钉闪烁了一下——<em>那就学着点。不过学不学得会，关我什么事呢？</em>\n\n他站起来，踩着猫一样的步伐向你走近。两缕红雾紧随其后。他在离你一步远的地方停下——近到你能闻到他身上混合了甜食和某种更深层香气的味道，又远到刚好让你无法自然地伸手触碰他。\n\n<em>记住——最强大的力量不是拳头，是让敌人心甘情愿跪在你脚下的魅力。当然——</em>他俯身在你耳边低语——<em>也要小心别玩过头。我可是见识过太多被自己的欲望吞噬的蠢货了。如果你也成为其中之一——嗯哼，至少你死的时候会很快乐。</em>\n\n他后退一步，恢复了慵懒的笑容，随意地挥了挥手。\n\n<em>去吧。去玩玩。别让我失望——不过让我失望也无所谓，我明天就忘了你是谁。</em>', firstWords: '如果你也成为被欲望吞噬的蠢货——至少你死的时候会很快乐。' },
    '嫉妒': { name: '利维坦', title: '嫉妒之主', ring: '嫉妒之环', birthScene: '嫉妒之环的诞生之地是潮湿的。深蓝色的混沌能量裹挟着咸涩的暗流，在不见光的深水中缓慢地凝聚。水压很高——你的意识被无形的力量挤压着，像被一只大手反复揉捏的黏土。\n\n你的身体在嫉妒的能量中成形。但与其他环不同——成形伴随着持续的<span class="highlight">刺痛感</span>。不是身体上的痛，而是某种被植入你意识中的渴望。当你长出眼睛时，你本能地看向周围新生的恶魔——然后一阵不快涌上心头。为什么他的角比我长？为什么她的鳞片更有光泽？\n\n你还没有名字，但你已经开始嫉妒了。\n\n周围的新生恶魔都在互相偷瞄。没有人直接盯着别人看——嫉妒之环不教这个。所有人都学会了用眼角余光观察，用阴翳遮掩目光。水面偶尔翻涌，翻出一些破碎的遗骸——那是在嫉妒中沉沦到最底层、最终被黑水吞噬的旧恶魔的残渣。', audience: '深渊镜厅。这里的墙壁全是镜子——但不是普通的镜子。它们不照出你的倒影。它们照出<span class="highlight">别人拥有的、你没有的一切</span>。路西法的荣光、玛门的财富、萨麦尔的力量、阿斯蒙蒂斯的魅力……每一面镜子都在无声地质问你：凭什么他们有，你没有？\n\n地面浸在齐踝深的黑水中。水很冷——不是刺骨的冷，而是一种缓慢渗透的、让人不安的阴冷。每走一步，水面都泛起暗色的涟漪。\n\n利维坦漂浮在黑水之上。\n\n深海蓝的长发如海藻般在水面上散开，发丝间缠绕着银色水草状饰品。肤色是苍白的青灰色，透着水底生物特有的阴冷。灰绿色的眼眸在阴暗中闪烁着浑浊的光芒——眼距略宽，让他的表情总带着挥之不去的怯懦。\n\n但那是伪装。\n\n他正盯着一面镜子。镜中映出的是路西法的身影——银白长发、赤金眼眸、完美的身姿。利维坦的手指在镜面上划过，留下一道水痕，恰好划在镜中路西法的脸上。\n\n他察觉到你的到来。转身时动作很慢，像水中漂浮的浮萍。灰绿色的眼睛先是游移到你身上，又移开，又回来。\n\n<em>你来了。</em>\n\n声音细弱，带点口吃。说话时微微低头，眼睛却向上翻着看你——形成了既卑微又危险的对比。\n\n<em>我、我看到你了。你也看到这些镜子了吗？</em>\n\n他从黑水中缓缓漂近。近到你能看清他苍白面容和嘴角下垂的弧线。他手指在水面一划，一面新的镜子从黑水中升起——镜中映出你嫉妒的东西。\n\n<em>他们拥有的……凭什么？凭什么他们拥有而我没有？凭什么你也没有？</em>\n\n他的声音渐渐褪去了怯懦的伪装，变得阴冷而锋利。\n\n<em>但我们不一样。我只是暂时没有。而你——如果你够聪明，就知道该站在哪一边。在这个地狱里，最好的位置不是最耀眼的——是最不被注意的。从阴影里，你可以看到所有人的破绽。</em>\n\n他绕到你身后——你感到一阵潮湿的寒意擦过脖颈。\n\n<em>帮我看住那些骄傲的家伙。我们不需要打败他们——只需要等他们犯错。所有的傲慢都会跌跟头。所有的财富都会贬值。所有的力量都会耗尽。而我们——</em>他从你身后漂回你面前，嘴角浮现出一丝扭曲的笑容——<em>会在那个时候，拿走他们的一切。</em>\n\n他说完时，镜厅中所有镜子同时闪烁——每面镜中的人像都露出了破绽。路西法的脸上出现了裂痕，玛门的金币化为灰烬，萨麦尔的拳头炸开了伤口。\n\n然后一切恢复原样。利维坦退回阴影中。\n\n<em>去吧。记住——你从来不是一个人。嫉妒是所有人的。我只是比别人更诚实地面对它。虽然——</em>他的声音又恢复了怯懦的伪装——<em>这种诚实也没什么好骄傲的。</em>', firstWords: '所有的傲慢都会跌跟头。所有的财富都会贬值。而我们——会在那个时候，拿走他们的一切。' },
    '暴食': { name: '别力西卜', title: '暴食之主', ring: '暴食之环', birthScene: '暴食之环的诞生之地没有固定形状。它是一片不断变化的虚空——今天是巨大的胃袋，明天是看不到尽头的餐桌。唯一不变的，是那股<span class="highlight">无处不在的饥饿感</span>。\n\n粉紫色的混沌能量在虚空中翻涌，但它不凝聚——它吞噬。能量吞噬能量，空间吞噬空间，然后从吞噬的残骸中挤出新的生命。你的身体从这种无尽的吞噬循环中诞生。成形时的第一感觉不是疼痛，不是舒适——而是一种空洞的、深不见底的饥饿。\n\n你的胃在蠕动的第一秒就开始渴望食物。它在你体内发出咕噜声，提醒你它永远不会被填满。\n\n周围新生的恶魔一成形就开始四处寻找任何可以吞食的东西。有的低头啃咬诞生之地的虚空，有的互相打量——不是出于敌意，而是评估：他看起来能吃吗？她闻起来味道如何？\n\n一个身穿食教执事袍的高阶恶魔站在一旁，手捧厚册子，面无表情地记录，偶尔舔一下嘴唇。', audience: '虚无盛宴。一张看不到尽头的长桌从暴食之环中央延伸到视线极限。桌上摆满了来自各界各时代的珍馐——天使羽翼碎片做成酥脆薄片，人类记忆精华蒸馏成泛蓝光的液体，地狱各环特产琳琅满目排列在银盘上。但桌子永远没有被填满的一刻——因为它的主人一直在吃。\n\n空气本身就是一顿饭。你每呼吸一次，都吸入无数细小的食物粒子——甜腻的蛋糕屑、辛辣的调味粉、从未尝过的陌生味道。这些粒子自动融入你的身体，让你饥饿感暂时缓解——但仅仅是暂时。几秒钟后，饥饿会再次涌上，比之前更加强烈。\n\n长桌尽头——\n\n别力西卜<span class="highlight">正在进食</span>。\n\n"进食"这个词太温柔了。他的进食是<span class="gold-text">撕咬、吞噬、消灭</span>。他上身分布的数个额外的嘴同时张开——那些嘴平时是紧闭的黑色缝隙，此刻全部张开了，露出蓝绿色的利齿和内部深不见底的空洞。每一个嘴都在同时吞食不同的食物——天使羽翼、灵魂碎片、空间本身的边角料。撕咬的速度快得令人眼花，但咀嚼的声音出奇地安静——因为食物一旦被咬住，就直接被拖入嘴中的虚无空洞，连咀嚼都省略了。\n\n粉色长发如凝固的血色瀑布般垂在身后，纹丝不动。脸颊上黑色裂痕随每一次吞噬微微开合，缝隙间逸出空间气流。\n\n然后他停下了。\n\n那些额外的嘴同时闭合。他用绣着食教标志的餐巾优雅地擦了擦嘴角——这动作与刚才的暴烈形成了诡异的对比。\n\n他的眼白是纯粹的墨黑，瞳孔则是深邃的蓝绿色。看你的眼神不带任何情绪——但你能感觉到，在他眼中你被归类了。不是"盟友"或"敌人"。是<span class="highlight">"能吃"</span>或<span class="highlight">"不能吃"</span>。\n\n<em>新生的。</em>\n\n语调平淡无波。语速极其缓慢——每个字之间的停顿都长到让人不安，仿佛连说话都在咀嚼每个音节。\n\n<em>吾嗅到了你身上的饥饿。很好。饥饿是万物的本质——吞噬是最终的归宿。在暴食之环，吾不关心你吞下了什么——</em>\n\n他微微偏头，像在从不同角度评估你的"味道"。脖子上有一张额外的嘴悄悄张开一条缝——然后被他的手轻轻按住，重新闭合。\n\n<em>——只关心你有没有被吞噬的价值。让自己变得更有味道。否则——</em>他正中央的嘴微微上扬，露出了一丝几乎算不上笑容的弧度——<em>总有一天你会成为别人的盘中餐。也许就是吾的。</em>\n\n他转过身，拿起桌上一块半透明的胶状食物，随手丢进肩膀上一张张开的嘴里。然后头也不回地说：\n\n<em>去吧。去吃。去被吃。这就是暴食的法则。吾不在乎你选哪条路——反正最终都会进入某个胃袋。</em>', firstWords: '吾不在乎你吞下了什么——只关心你有没有被吞噬的价值。' },
    '懒惰': { name: '贝尔芬格', title: '懒惰之主', ring: '懒惰之环', birthScene: '懒惰之环的诞生之地是一片无边无际的灰雾。混沌能量不像其他环层那样活跃——它只是懒洋洋地弥漫着，偶尔才在某个角落凝聚出稍微浓一点的雾气。时间在这里流动得极为缓慢。\n\n你的身体从灰雾中缓慢地凝聚。那感觉不像诞生——更像是雾气在某天无聊时随意捏了个形状，然后忘了收回去。你的四肢先后成形——但顺序不重要。间隔的时间太长，长到你先成形的那条腿差点又散回了雾气。\n\n周围新生的恶魔一个接一个从雾中浮现——但"接一个"这说法太急了。他们更像是断断续续地从雾里探出头，又缩回去，再探出来。有的凝聚了一半就不动了——不是死了，只是<span class="highlight">懒得完成</span>。\n\n没有人在管理这片诞生之地。也许曾经有。但那个管理者大概率也懒得管了。', audience: '虚无之床。你花了很长时间才找到这里——不是因为路途复杂，而是因为每走几步就想停下来休息。懒惰之环的空气像温吞的糖浆，包裹着每个进入者的肢体，让人每迈一步都感到深深的、舒适的倦意。\n\n所谓的"宫殿"其实只是一片更浓稠的灰雾区域。雾中隐约可见一张由凝固的惰性能量构成的巨大床榻——不，是<span class="highlight">一整个床榻地貌</span>。床垫绵延到视线无法触及的地方，上面散落着各种柔软的东西：云朵状的能量团、褪色的天鹅绒枕头、不知从哪飘来的毛毯碎片。\n\n贝尔芬格蜷缩在床榻正中央。\n\n不——不是蜷缩。他<span class="gold-text">融化</span>在那里。灰雾包裹全身，只能勉强分辨出模糊的人形轮廓。雾气凝聚的"衣物"如未经打理的绒毛，松垮地堆在身上。周身散落着零星的羽毛状碎片——据说是"懒得维持完整形态"的产物。\n\n两点昏沉的淡金色光点——那大概算是眼睛——在雾气中闪烁了一下。然后又灭了。\n\n你等了很久。久到开始怀疑他是不是又睡着了。\n\n<em>……来了啊。</em>\n\n声音含混不清，像从三床被子下面传来的。语气既不是欢迎也不是冷漠——只是陈述了一个事实，连陈述本身都带着"说完就不想再开口"的疲惫。\n\n又是漫长的沉默。灰雾中传来了轻微的鼾声。\n\n然后他又醒了——大概是醒了。淡金色光点再次闪烁。\n\n<em>懒得说什么大道理……你能诞生在懒惰之环，说明你骨子里明白一个真理——</em>\n\n他翻了个身。动作缓慢到你能看清灰雾中每一个粒子的移动轨迹。\n\n<em>费力气的事情，多半不值得。别学其他环那些傻瓜——整天打打杀杀、算计来算计去。最后不都是要躺下来休息的吗？早点躺下不好吗？</em>\n\n他的手从雾中伸出来——如果那能算手的话。更像一团稍微浓密一点的雾凝聚成了手臂的形状——然后指了指床边。\n\n<em>那边有位置。想躺就躺。不想躺——</em>\n\n他打了个呵欠。灰雾中张开了一个比你想象中大得多的暗色空洞，然后又合上了。\n\n<em>想去哪就去哪。懒得拦你。走的时候轻点，别吵到我。反正你们这些新生的崽子待不了多久就会跑——要么去别的环折腾，要么折腾累了再滚回来躺着。都一样。</em>\n\n淡金色光点再次熄灭。鼾声几乎同时重新响起。这场觐见以一种完全不像觐见的方式结束了——没有命令，没有考验，没有任何仪式感。君主只是说了几句懒洋洋的话，然后就睡着了。\n\n但就在你转身准备离开时，一小团灰雾悄悄从床榻上滑下来，飘到你肩头。它很轻，轻到你几乎感觉不到。但它确实在那里——像一个无声的印记。你已经是懒惰之环的一员了。贝尔芬格不会记得你的名字，但他会让你躺在这里。只要你够安静。', firstWords: '费力气的事情，多半不值得。早点躺下不好吗？反正最后都要躺下来的。' }
};

var ringTutorialNPCs = {
    '贪婪之环': { npcName: '科尔温', placeName: '诚信典当行', introScene: '铜板巷的空气中弥漫着霉味和绝望。街道两旁是摇摇欲坠的当铺和债奴工坊，每一个路过的人都行色匆匆，眼神中混合着贪婪和恐惧——他们在计算每一个擦肩而过的人的价值，也在担心自己成为别人算计的对象。巷子深处，一间挂着"诚信典当"招牌的店铺突兀地亮着灯。那招牌上的金字已经褪色，但"诚信"两个字被人用新鲜的油漆重新描过——在这条街上，这几乎是一种讽刺。\n\n一个精瘦的男人倚在门框上。他穿着剪裁合体的深色外套，领口别着一枚褪色的金质徽章——那是曾经在玛门商行任职过的标志，如今只剩下装饰的意义。他戴着单边金丝眼镜，镜片后的眼睛在昏暗的灯光下闪烁着金色的光芒。他的手指在一把精致的黄铜算盘上飞速拨动，算珠碰撞的声音清脆而急促，像是在给这条街上每一个路过的灵魂标价。\n\n看到你走近，他停下了手指。算盘上的最后一颗珠子停在了某个数字上——仿佛那恰好是你的价格。', npcDesc: '科尔温——前玛门商行的中级职员。三年前因为一笔失败的内部投资被赶出了金丝街，如今在铜板巷经营这家典当行。他专门从走投无路的新人身上榨取价值，但和铜板巷其他放高利贷的不同——他至少会给你一份看起来公平的合同。至于合同的附属条款里写了什么，那就不是他的问题了。他的十根手指上戴满了各式戒指——每一枚都刻着不同的契约符文，据说这些戒指能让他感知到周围一切有价值的事物。', dialogue: '新面孔——而且，让我猜猜，口袋不太鼓。他摘下单片眼镜，用袖口擦了擦。别紧张。在贪婪之环，穷不是罪。穷还不愿意想办法变富，才是罪。我叫科尔温，以前在金丝街的罪业银行做事——你听说过罪业银行吗？没听过也没关系，你只需要知道，我曾经坐在比这条巷子高一万倍的地方数钱。现在嘛——他环顾了一下自己破旧的店铺，嘴角扯出一个自嘲的笑容——我在这里。但这不代表我不能帮你。\n\n我这儿有几条路给新人，看你想走哪条。听好了，我只说一遍，因为重复会浪费我的时间，而时间就是金钱——在贪婪之环，这句话不是比喻。\n\n第一条：典当。你身上有什么值钱的东西？武器？饰品？情报？哪怕是你的一颗牙，只要它值得什么东西，我就能给你一个价格。当然——这个价格不会是你想要的，但这就是典当的本质。\n\n第二条：借贷。我借你一笔启动资金，利息不高——每周15%，复利计算。别用那种眼神看我。在金丝街，最低的利率是每周20%。我已经给你打了折。\n\n第三条：我给你一份工作。看到巷子尽头那扇绿色的门了吗？里面住着一个欠了我三个月账的屠夫。帮我把账收回来——不管用什么方法——收回来的钱我们对半分。怎么样？选一个吧。', option1Text: '💰 典当身上值钱的东西（失去5-15金币，耗时5分钟）', option2Text: '📝 签借贷合同（获得10金币，但欠下高利贷，耗时3分钟）', option3Text: '帮他收烂账（触发战斗，胜利获得20金币，耗时10分钟）', option4Text: '↩ 离开典当行', hasSell: false, hasCombat: true, combatName: '欠债的屠夫', combatHp: 45, combatAtk: 9, combatDef: 3, combatReward: 20, combatSin: 3 },
    '暴怒之环': { npcName: '碎骨·乌尔里克', placeName: '碎骨铁匠铺', introScene: '碎骨巷的空气中弥漫着血腥和铁锈的混合气味。街道两侧的墙壁上布满了凹痕和裂缝——有些是拳头砸的，有些是刀刃砍的，还有一些是整具身体被摔上去时留下的。远处传来拳头撞击肉体的闷响和断断续续的嘶吼声，但巷子里的行人都像是没听见一样匆匆走过。在暴怒之环，打斗的声音和呼吸一样平常。\n\n巷子尽头是一间没有招牌的铁匠铺。门口堆满了废弃的兵器——断裂的长剑、凹陷的盾牌、卷刃的斧头——以及破碎的盔甲碎片。在这些废铁堆中，一个高大的身影正抡着铁锤砸在一块烧红的铁块上，每一次锤击都迸出璀璨的火星。他的左臂不是血肉——而是一只锈迹斑斑的粗重铁质义肢，随着每次锤击发出沉闷的金属撞击声，那声音混在铁锤的节奏中，形成了一种粗粝的、属于暴怒之环特有的打击乐。\n\n看到你走近，他放下铁锤，锤头砸在铁砧上发出一声巨响。他用一块黑乎乎的布擦了擦手——或者说擦了擦他剩下的那只手——然后转过身来。他的光头上有三道平行的抓痕，从左眼上方一直延伸到后脑，据说是和一头地狱猎犬搏斗时留下的。那道伤疤让他的表情永远带着一种狰狞的笑意。', npcDesc: '乌尔里克——血焰角斗场的前任角斗士。在血焰角斗场打了二十年，从最低级的铁笼格斗一路打到冠军赛，然后在拿到冠军的那天宣布退役。在暴怒之环，能够活着退役的角斗士屈指可数——大多数人要么死在角斗场上，要么在退役后被人寻仇杀死。乌尔里克是例外。他靠打铁维生，偶尔训练新来的角斗士。每一个想进血焰角斗场的年轻人，都会先来他的铁匠铺——不是为了武器，而是为了得到他的认可。', dialogue: '哈！新崽子！他咧嘴笑了，露出一口被金属碎片崩掉了一半的牙齿。你身上还没有血腥味——这得改。在暴怒之环，干净的拳头是最大的耻辱。我叫乌尔里克，以前在血焰角斗场打了二十年——看到这个了吗？他举起铁质义肢，那东西在炉火的映照下泛着暗红色的光——这是第八年的纪念品。一头地狱猎犬咬掉了我的左手，我把它宰了，用它的骨头打了一副新胳膊。它比原来的好用。\n\n在暴怒之环，只有一条规矩——强者活，弱者死。没有中间地带。你想变强？我这儿有三条路。\n\n第一条：把你的金币留下，换一把像样的武器。我打的每一把刀都能砍进骨头三寸深——这是我在角斗场用二十年经验换来的本事。\n\n第二条：进铁笼子跟我打一场。活下来，我免费给你打一把刀。死在里面——你的尸体就是下一把刀的淬火材料。\n\n第三条：滚出我的铺子，别浪费我的时间。我不是开慈善机构的。', option1Text: '用金币换武器（失去10金币，获得铁匠短刀，耗时5分钟）', option2Text: '💀 进铁笼和乌尔里克打一场（高强度战斗，胜利获得武器，耗时10分钟）', option3Text: '🏃 转身离开', option4Text: '', hasSell: false, hasCombat: true, combatName: '碎骨·乌尔里克', combatHp: 65, combatAtk: 15, combatDef: 6, combatReward: 0, combatSin: 0 },
    '色欲之环': { npcName: '薇尔维特', placeName: '暗红之门', introScene: '暗巷的光线昏暗而暧昧。墙壁上涂着褪色的霓虹颜料，在黑暗中泛着微弱的粉紫色光芒——那是最廉价的魅惑涂料，在欲望之环的任何一个街角都能买到。空气中有一种甜腻的香气，混合了过期的香水、汗水和某种更原始的、让人心跳加速的气息。巷子两侧的窗户大多封死了，但偶尔有一两扇窗户透出摇曳的烛光，窗帘后面隐约可见晃动的身影。\n\n巷子深处有一扇漆成暗红色的门。门框上挂着一串风铃——不是普通的风铃，而是由细小的骨骼和彩色玻璃碎片串成的。每一次微风吹过，风铃就发出细碎的响声，那声音不像音乐，更像是某种低沉的、撩拨神经的耳语。门半开着，透出柔和的粉色灯光。\n\n一个深紫色长发的魅魔倚在门边。她的长发垂到腰际，发丝间缠绕着细小的银铃。她的眼眸是与发色相配的紫罗兰色，在昏暗的光线下泛着温润的光泽。她的嘴角永远挂着一个似是而非的微笑——那弧度恰好让人无法判断她是在邀请还是在审视。她手指间夹着一根细长的烟管，烟雾在她面前缭绕，让她的面容若隐若现。\n\n她看到你时，嘴角的笑意加深了一分。那不是欢迎——而是一种评估，像一个经验丰富的鉴宝师在审视一件尚未定价的商品。', npcDesc: '薇尔维特——在暗巷经营着一家小型情欲旅馆的魅魔。她不是最高阶的魅魔——那些在霓虹大道上——但在暗巷这一带，她的名字就是通行证。她的旅馆是色欲之环底层最安全的交易场所，前提是你付得起她的价格。有人说她曾经是阿斯蒙蒂斯本人的宠儿，后来因为厌倦了红雾宫殿的勾心斗角而自愿下放到暗巷。她本人从不承认也不否认这个传闻——这让她的名声变得更加神秘。', dialogue: '嗯~新来的。她吐出一口烟雾，那烟雾在你面前盘旋了一瞬，然后消散在空气中。你身上还没有欲望之环的味道——太干净了。在别的地方，干净可能是优点。在这里——她歪了歪头，紫罗兰色的眼眸在昏暗中闪了一下——干净意味着你还没有被标记。没有被占有过。没有被欲望触碰过。在这里，这是一张白纸——而白纸的价值，取决于谁在上面写字。\n\n我叫薇尔维特。这家旅馆是我的。在暗巷，它是最安全的地方——因为你在这里遇到的每一个人，都是付了钱才进来的。付钱意味着守规矩。不守规矩的人——她用手指了指门框上那串风铃——在上面。\n\n我可以帮你——如果你愿意为我工作。在色欲之环，最大的资本不是金币。是你的身体，你的魅力，还有你让别人为你着迷的能力。如果你有这些，你可以在这里活得比任何地方都好。如果你没有——那你至少需要我的保护。\n\n第一条：把金币交出来，换取我的保护。你在暗巷不会被人骚扰——至少不会被人成功地骚扰。\n\n第二条：为我工作。提供服务，报酬丰厚。你的外表在这里是资本，别浪费它。\n\n第三条：如果你觉得自己够强，可以试着挑战我。不过——她吸了一口烟管，烟雾从她嘴角溢出——上一个尝试的人现在在我的风铃上。他的骨头很轻，风一吹就响。', option1Text: '💰 交出金币换取保护（失去8金币，耗时3分钟）', option2Text: '💋 为她工作（卖身路线，色欲环魅力判定加成，耗时30分钟）', option3Text: '挑战她（触发战斗，耗时10分钟）', option4Text: '↩ 离开暗红之门', hasSell: true, sellThreshold: 7, sellReward1: 10, sellReward2: 18, sellReward3: 30, hasCombat: true, combatName: '薇尔维特', combatHp: 35, combatAtk: 7, combatDef: 2, combatReward: 15, combatSin: 5 },
    '嫉妒之环': { npcName: '暗鳍', placeName: '栈桥下的阴影', introScene: '水沟区的地面上永远浸着一层齐踝深的黑水。这水不是普通的水——它带着腐蚀性，会缓慢地褪去一切光鲜的颜色。墙壁上所有的涂鸦都被它侵蚀成了模糊的灰色，路边的招牌上的字迹也被溶解成了无法辨认的墨迹。在黑水中走得太久，连皮肤都会开始发痒，然后蜕皮——但水沟区的人已经习惯了。他们的皮肤早就蜕过无数次了。\n\n在一个歪斜的木栈桥下面，你看到了一个蜷缩着的身影。栈桥原本连接着嫉妒之环的中层区域，但已经废弃多年——桥面上布满了裂缝，随时可能坍塌。没有人会到这里来——除了他。\n\n他蹲在水边，青灰色的手指在水中划来划去。那手指之间长着半透明的蹼，每划一次水面就泛起一圈圈暗色的涟漪。他时不时从黑水中捞起一些东西——一块生锈的徽章、半片破损的镜片、一段断了的手链、一片沾满污渍的羽毛。他把每一样东西都举到眼前仔细端详，灰绿色的眼眸中闪烁着一种复杂的、让你不安的光芒——那是在判断。在评估。在嫉妒。然后他把那些东西放进身后的一个防水皮袋里，继续捞下一样。\n\n察觉到你的目光，他转过头来。他的脸很瘦，颧骨突出，肤色是水底生物特有的青灰色。他的瞳孔在阴暗中收缩成两条细缝。', npcDesc: '暗鳍——没有人知道他的真名，也没有人知道他在这里待了多久。他总是在水沟区捡东西，那些被上层环层丢弃的、遗忘的、不屑一顾的东西。但如果你需要情报——任何情报——他总有办法搞到。他出售的情报价格低廉但真假参半，就像他从黑水中捞起来的所有东西一样：你需要自己判断什么是宝石，什么是垃圾。', dialogue: '我、我看到你了。他说话时没有抬头，仍然盯着水中的什么东西。你也是来捡东西的？还是来嘲笑我的？如果是嘲笑的话——他歪了歪头，灰绿色的眼眸终于看向你——你可以走了。我已经被嘲笑够了。如果你是想买东西——他拍了拍身后的皮袋——那就另当别论。\n\n我叫暗鳍。在嫉妒之环，每个人都在捡别人丢掉的东西。上面的环——他用手指朝上方指了指——傲慢环、贪婪环、暴怒环……他们每天都会丢掉很多东西。情报、物品、秘密。它们顺着黑水流下来，流到水沟区，然后——他做了一个捞的动作——被我捡起来。\n\n你知道水沟区最值钱的是什么吗？不是这些破东西——他摇了摇手中的半片镜片——是秘密。每一个人嫉妒别人的时候，都会暴露自己的弱点。我收集这些弱点。我出售这些弱点。如果你有兴趣——我这儿有几条路。\n\n第一条：花钱买情报。不贵——但我不保证情报是真的。在嫉妒之环，真假不重要。重要的是你想要什么。\n\n第二条：帮我除掉一个人——嫉妒之环的规矩很简单。你得不到的，别人也别想得到。如果你想让谁失去什么，我可以帮你。当然，收费的。\n\n第三条：你可以试着抢我的皮袋——他说这话的时候，眼睛突然变得锐利起来——但你要想清楚。在水沟区，我知道每一个可以藏身的角落和每一条可以逃跑的暗流。你不知道。', option1Text: '📜 花钱买情报（失去5金币，耗时3分钟）', option2Text: '🔪 委托他除掉一个人（失去10金币，罪业值+5，耗时5分钟）', option3Text: '抢他的皮袋（触发战斗，耗时10分钟）', option4Text: '↩ 离开栈桥', hasSell: false, hasCombat: true, combatName: '暗鳍', combatHp: 30, combatAtk: 6, combatDef: 1, combatReward: 8, combatSin: 8 },
    '暴食之环': { npcName: '饕餮·格鲁姆', placeName: '铁锅旁的棚子', introScene: '残渣区的气味几乎让人无法呼吸。腐烂的食物残渣堆积成山——果皮、骨头、变质的面包、发霉的蛋糕——它们层层叠叠地堆在街道两侧，形成了一道道令人作呕的堤坝。但在这片恶臭的海洋中，你却闻到了一丝奇异的香气。那是某种正在烹煮的食物的味道——浓烈、鲜美、带着一种让人无法抗拒的诱惑力。你的胃不由自主地发出了咕噜声。\n\n你顺着香气走过去。在残渣区深处的一个角落里，有人用废木板和破帆布搭了一个简陋的棚子。棚子下面，一个肥胖得不成比例的恶魔正坐在一个大铁锅旁边。他的身上挂着一条满是油渍的围裙，围裙上缝着大大小小十几个口袋，每个口袋里都塞满了各种调味料的小瓶子。他的脸圆得几乎看不到脖子，但那双小眼睛里闪烁着一种危险的精光——那不是一个单纯的厨师的温和，而是一种掠食者在进食前的专注。\n\n铁锅里咕嘟咕嘟地煮着深色的液体——那颜色太深了，看不出里面有什么。但那股香气就是从这口锅里飘出来的。锅的旁边摆着一排碗，碗的材质各不相同——有木头的、有金属的、有陶瓷的——显然是从不同的地方捡来的。\n\n他注意到你的目光，用一把大汤勺敲了敲锅沿。那声音沉闷而厚重，在残渣区的恶臭中回荡。', npcDesc: '格鲁姆——大家都叫他饕餮。他是暴食之环底层最有名的"厨师"——用别人丢弃的食材烹饪出让人欲罢不能的料理。他在暴食之环的底层已经混了太久，久到没有人记得他是从什么时候开始在这里煮汤的。有人说他的锅里煮过恶魔的尸体，有人说他的汤能让喝下去的人上瘾——但没有人能否认，在残渣区，他的汤是唯一让人感到温暖的东西。', dialogue: '哦！新来的！他的声音洪亮而愉快，与周围的腐烂形成了诡异的对比。你饿了。我闻得出来——你胃里的声音，我在十步之外就听到了。刚诞生的总是最饿的——那饥饿不是胃里来的，是骨子里来的。是灵魂深处的空洞在喊叫。你吃了东西，它安静一会儿，然后又饿了。永远是这样。\n\n我叫格鲁姆，不过大家都叫我饕餮。在暴食之环，饥饿是一切。它比你更了解你自己。它知道你想要什么，知道你能为了填饱肚子做到什么程度。我见过太多人为了吃一口东西把自己卖了的——不是比喻，是真的签了契约。\n\n我这儿有吃的——但吃的不是免费的。在暴食之环，天下没有白吃的午餐——也没有早餐和晚餐。第一条：把你身上的金币交出来，换一碗热汤。我保证，这碗汤比你吃过的任何东西都要好。当然——别问里面放了什么。\n\n第二条：帮我收集食材。看到那边那座残渣山了吗？去翻一翻，找一些还能用的边角料。不用多好——能吃的就行。我给你辛苦费。\n\n第三条——他用汤勺指着你，小眼睛里闪过一丝危险的光芒——如果你觉得你能打得过我，你可以试试。不过我要提前告诉你——我的锅还缺一点新鲜的肉。而你已经站在我的锅旁边了。', option1Text: '🍖 用金币换一碗热汤（失去5金币，恢复15HP，耗时5分钟）', option2Text: '🗑️ 帮忙收集食材（无战斗，获得5金币，耗时15分钟）', option3Text: '抢他的锅（触发战斗，耗时10分钟）', option4Text: '↩ 离开棚子', hasSell: false, hasCombat: true, combatName: '饕餮·格鲁姆', combatHp: 50, combatAtk: 10, combatDef: 4, combatReward: 5, combatSin: 8 },
    '懒惰之环': { npcName: '休眠者·莫尔', placeName: '灰雾中的躺椅', introScene: '停滞区的灰雾比懒惰之环其他地方更加浓稠。这里的雾不是飘在空中的——它是沉在地面上的，像一层厚重的灰色毯子，包裹着一切。每走一步都感到深深的倦意，那倦意不来自肌肉，而是从意识的深处涌上来的。它在你耳边低语：停下来。躺下。闭上眼睛。\n\n路边散落着分不清是睡着还是消亡的身影。他们的身体半埋在灰雾中，有些还在缓慢地呼吸——胸口每隔十几秒才起伏一次——有些则已经完全静止了。没有人能分辨出区别。在停滞区，沉睡和死亡之间的距离已经模糊到了近乎没有。\n\n就在这时，你注意到路边有一张由凝固的惰性能量构成的躺椅。那躺椅的形状完美贴合人体曲线——仿佛它已经在无数年的时间里被躺出了一个最舒适的形状。上面躺着一个几乎与灰雾融为一体的身影。他的呼吸极其缓慢，每一次胸口的起伏之间都隔了十几秒。周身散落着零星的羽毛状碎片——那是"懒得维持完整形态"的产物。\n\n就在你以为他已经睡着了的时候，两点昏沉的淡金色瞳孔突然在灰雾中亮了起来——像是两颗遥远的、快要熄灭的星星。他伸出一只手——如果那能算手的话，更像是一团稍微浓密一点的雾凝聚成了手臂的形状——指了指旁边另一张空的躺椅。', npcDesc: '莫尔——没有人知道他在这里躺了多久。有人说他从懒惰之环诞生那天就躺在这里了，也有人说他曾经是贝尔芬格的近侍，因为"太勤快"被赶了出来——当然，在懒惰之环，"太勤快"意味着一天之内做了两件事。他的身体几乎完全被灰雾包裹，只能勉强看到一张慵懒的面孔和两只淡金色的瞳孔。他的动作极其缓慢，但每一下都异常精准——仿佛他已经花了无尽的时间来优化每一个动作，使它们消耗尽可能少的能量。', dialogue: '……坐。他的声音含混不清，像是从三床被子下面传来的。别站着。站着太累了。\n\n你等了很久——久到开始怀疑他是不是又睡着了。然后那两点淡金色的光又亮了起来。\n\n我叫莫尔。不过没什么人叫我的名字——他们都叫我"那个一直躺着的家伙"。在懒惰之环，名字不重要。效率也不重要。只有一件事重要——你舒不舒服。\n\n我看你刚从外面来——他停顿了很久，久到那句话的尾音在灰雾中消散了——身上还带着其他环的灰尘。傲慢环的冷光、贪婪环的金屑、暴怒环的铁锈……它们粘在你身上，让你不舒服。它们让你的灵魂很重。\n\n我可以帮你——虽然帮人也很累。但他还是继续说了下去，仿佛是为了完成一个很久以前就答应过的承诺——你有两个选择。\n\n第一条：把金币留下，躺下来。在这里睡觉能恢复你的理智。灰雾会帮你把那些灰尘洗干净。\n\n第二条：帮我去那边的懒鬼外包公司跑个腿。我有一份文件——他用手指了指躺椅旁边一叠积满灰尘的纸张——三个月前就该交了。我不想动。你帮我去交一下。', option1Text: '💰 把金币留下，躺下休息（失去3金币，恢复5理智，耗时30分钟）', option2Text: '帮他跑腿（无战斗，获得15经验值，耗时20分钟）', option3Text: '↩ 离开灰雾', option4Text: '', hasSell: false, hasCombat: false, combatName: '', combatHp: 0, combatAtk: 0, combatDef: 0, combatReward: 0, combatSin: 0 }
};

// ==================== 通用新手教程入口 ====================
function sceneRingTutorial(ring, level) {
    if (level !== 'poor') { sceneExploreDistrict(ring, level); return; }
    var td = ringTutorialNPCs[ring];
    if (!td) { sceneExploreDistrict(ring, level); return; }
    var flagKey = 'tutorial_' + ring;
    if (player.flags[flagKey]) {
        st('<div class="scene-title">' + td.placeName + '</div><p>你再次来到了' + td.placeName + '。这里的景象和你上次离开时一样。' + td.npcName + '不在——也许他已经离开了，也许只是今天不想被人打扰。不管怎样，上次的遭遇让你对这个区域有了更多的了解。</p><p style="color:#9a6a6a;font-size:0.82em;">（该区域新手教程已完成。你可以自由探索。）</p>');
        cb();
        ab('离开', function() { sceneExploreDistrict(ring, level); });
        return;
    }
    player.currentRing = ring;
    player.currentDistrict = RD[ring].poor.name;
    if (!player.residenceRing) player.residenceRing = ring;
    ua();
    st('<div class="scene-title">' + td.placeName + '</div><p>' + td.introScene + '</p><p>' + td.npcDesc + '</p><p><em>"' + td.dialogue + '"</em></p>');
    cb();
    ab(td.option1Text, function() { sceneTutorialOption1(ring); });
    ab(td.option2Text, function() { sceneTutorialOption2(ring); });
    if (td.option3Text) {
        ab(td.option3Text, function() { sceneTutorialOption3(ring); }, td.option3Text.indexOf('战斗') >= 0 || td.option3Text.indexOf('打一场') >= 0 || td.option3Text.indexOf('挑战') >= 0 || td.option3Text.indexOf('抢') >= 0 ? 'danger-btn' : '');
    }
    if (td.option4Text) {
        ab(td.option4Text, function() { sceneExploreDistrict(ring, level); });
    }
}
function sceneTutorialOption1(ring) {
    var td = ringTutorialNPCs[ring];
    var flagKey = 'tutorial_' + ring;
    switch (ring) {
        case '贪婪之环':
            var lost = Math.min(player.gold, Math.floor(Math.random() * 10) + 5);
            player.gold = Math.max(0, player.gold - lost);
            player.flags[flagKey] = true;
            ua();
            st('<div class="scene-title">典 当</div><p>科尔温仔细检查了你身上所有值钱的东西——你的口袋、你的袖口、你腰带上的每一个夹层。他拿起一枚金币对着灯光看了看，又用牙齿咬了咬，然后面无表情地在算盘上拨了几个数字。<em>就这些。</em>他说，语气里没有任何商量的余地。<em>市场价的一半。你可以不接受——但这条街上其他当铺只会给你三分之一。</em></p><p>他把金币扫进柜台下面的抽屉里。抽屉关上的声音在安静的典当行中格外清脆。<em>成交。欢迎下次再来——如果你还有东西能当的话。</em></p><p style="color:#e85060;">失去了 ' + lost + ' 金币。</p>');

                }
                ua();
                st('<div class="scene-title">武 器 交 易</div><p>乌尔里克用铁锤在铁砧上重重敲了三下——那三声巨响在狭小的铁匠铺中回荡。<em>成交。</em>他从墙上取下一把短刀，在手中转了一圈。刀刃在炉火的映照下泛着暗红色的光芒，刀身上还留着锻造时的锤痕——每一道都是乌尔里克亲手敲上去的。<em>这把刀叫"碎骨"。不是我打过的最好的刀，但绝对是我打过的性价比最高的刀。它砍进骨头三寸深——别问我是怎么知道的。</em></p><p>他把刀扔给你。刀柄上还残留着炉火的余温。<em>好好用。别让我打的刀蒙羞。如果有一天我在角斗场上看到你用这把刀——我会期待你用得好。</em></p><p style="color:#e8c060;">失去10金币。获得武器：碎骨短刀（物攻+3，已自动装备）。</p>');
                cb();
                ab('离开铁匠铺', function() { sceneExploreDistrict(ring, 'poor'); });
            } else {

            addItem('薇尔维特的风铃碎片', '薇尔维特的风铃碎片', 'armor', '一串由三片彩色玻璃碎片串成的风铃。在色欲之环的暗巷中，它能证明你受到薇尔维特的保护。魅力+1。', 1, { charisma: 1 }, true);
            ua();

                ua();
                st('<div class="scene-title">情 报 交 易</div><p>暗鳍从皮袋里翻找了很久，最后掏出一块湿漉漉的水晶碎片递给你。碎片上沾着黑水的痕迹，但在那些污渍下面，你能看到微弱的紫色光芒在闪烁。<em>这是从傲慢环掉下来的。里面记录了一个低阶堕天使的秘密——不是什么大人物，但他的秘密足够你用来做点小交易。当然，是真是假你自己判断。我只负责收集——不负责验证。</em></p><p style="color:#e8c060;">获得道具：情报水晶碎片。失去5金币。</p>');

                ua();
                st('<div class="scene-title">一 碗 热 汤</div><p>格鲁姆用大汤勺舀了一碗深色的液体递给你。碗里的液体浓稠得几乎像粥，表面浮着一层金色的油光。你把碗举到嘴边——那味道难以形容。有肉的鲜美，有香料的辛辣，还有一种说不清道不明的回甘。一口下去，你的整个身体都感到了一阵暖意。格鲁姆还贴心地用一个小罐子装了一份让你带走。<em>留着路上喝。凉了也没关系——我的汤凉了也好喝。</em></p><p style="color:#e8c060;">失去5金币。获得道具：格鲁姆的秘制浓汤（使用后恢复15HP，饱食+20）。</p>');
                cb();
                ab('离开棚子', function() { sceneExploreDistrict(ring, 'poor'); });
            } else {
                st('<p class="highlight">金币不足！格鲁姆耸了耸肩：<em>没钱？那就继续饿着吧。下次带够了金币再来。</em></p>');
                cb();
                ab('返回', function() { sceneRingTutorial(ring, 'poor'); });
            }
            break;
        case '懒惰之环':

                player.sanity = Math.min(player.maxSanity, player.sanity + 5);
                player.flags[flagKey] = true;
                addBuff('lazy_rest', '灰雾之憩', '在灰雾中躺过的舒适感仍在。理智恢复速度略微提升。', 'positive', 10);
                ua();
                st('<div class="scene-title">躺 下 休 息</div><p>你在莫尔旁边的躺椅上躺了下来。灰雾立刻包裹了你——它不是冷的，而是带着一种温吞的、让人舒适的暖意。时间似乎变得无比缓慢，你能感到自己思绪中的那些尖锐的棱角在灰雾中被磨平。当你再次睁开眼时，不知道过了多久——但你的精神确实好了很多。身上还残留着灰雾的暖意，让你感到格外放松。<em>……舒服吧？</em>莫尔的声音从旁边飘来。<em>下次再来。我懒得动，你随时可以躺。只要不吵到我。</em></p><p style="color:#e8c060;">恢复5点理智。失去3金币。获得Buff：灰雾之憩（10小时内理智恢复速度提升）。</p>');
                cb();
                ab('离开灰雾', function() { sceneExploreDistrict(ring, 'poor'); });
            } else {
                st('<p class="highlight">金币不足！莫尔沉默了很久，然后说：<em>……没钱的话，也可以躺。但我不保证你能醒过来。免费的睡眠总是有代价的。</em></p>');
                cb();
                ab('返回', function() { sceneRingTutorial(ring, 'poor'); });
            }
            break;
    }
}

            ua();
            st('<div class="scene-title">为 薇 尔 维 特 工 作</div><p>薇尔维特带你走进暗红之门。门后是一条铺着紫色地毯的走廊，空气中弥漫着甜腻的香气。<em>你的第一个客人很快就到。放轻松——你的外表是资本，你用它来赚金币，和铁匠用他的铁锤赚金币没有区别。</em></p><p style="color:#c09080;font-style:italic;">[在薇尔维特的安排下，你完成了你的第一次服务。昏暗的灯光、柔软的床铺、陌生人短暂的亲密——这一切在欲望之环的暗巷中只是日常。]</p><p>结束后，薇尔维特把15枚金币放在你的手心。<em>不错。客人很满意——这是我很少听到的反馈。你身上现在带着一种满足的气息，在色欲之环，这种气息是最好的名片。</em></p><p style="color:#e8c060;">获得15金币。欲望值+4。罪业值+3。获得Buff：魅魔的满足（魅力+2，持续10小时）。</p>');

                ua();
                st('<div class="scene-title">委 托 暗 鳍</div><p>暗鳍收下了金币。那双灰绿色的眼睛中闪过一丝满足。<em>我会处理的。不会有人知道是你——在嫉妒之环，没人会追问是谁做的。他们只会庆幸不是自己。过几天你去水沟区下游找找——如果你看到什么东西浮在水面上，那就是你花了10金币买的结果。</em></p><p>你转身离开栈桥时，感到一阵阴冷从脊背爬上来。在嫉妒之环，你刚才做的事并不罕见——但这不代表它不会在你的灵魂上留下痕迹。</p><p style="color:#e85060;">失去10金币。罪业值+5。获得Buff：暗中作祟（理智-1，敏捷+1，持续20小时）。</p>');

            ua();
            st('<div class="scene-title">收 集 食 材</div><p>你在残渣堆里翻找了半天——手被碎玻璃划了几道口子，膝盖上也沾满了说不清来由的污渍。但你还是找到了几块勉强能用的肉、一把半干的香料和几个还没完全腐烂的蔬菜。格鲁姆接过这些"食材"，仔细检查了一遍，然后满意地点了点头。<em>不错——比大多数新人强。大多数人翻不到五分钟就吐了。你没有。这说明你真的饿了。而且——</em>他拍了拍你的肩膀——<em>你有了拾荒者的嗅觉。以后在残渣区找东西会更容易。</em></p><p>他把5枚油腻的金币塞到你手里。<em>辛苦费。下次如果你更饿了——我可以给你更好的活。</em></p><p style="color:#e8c060;">获得5金币。获得Buff：拾荒者的嗅觉（15小时内探索暴食环更容易发现道具）。</p>');
            cb();
            ab('离开棚子', function() { sceneExploreDistrict(ring, 'poor'); });
            break;
        case '懒惰之环':
            addExp(15);

            st('<div class="scene-title">跑 腿</div><p>你拿着莫尔那份积满灰尘的文件，穿过停滞区的灰雾，来到了懒鬼外包公司。办事员花了整整三分钟才拿起那张纸。<em>莫尔的。三个月了。他终于让人交了。</em>他盖了个章，把一张回执塞给你。<em>告诉莫尔，下次自己来。算了——他知道的。他不在乎。对了——这张回执你可以留着。在懒惰之环，有时候一张官方的盖章纸可以帮你省很多事。</em></p><p style="color:#e8c060;">获得15点经验值。获得道具：懒鬼外包公司回执。</p>');

    }
}

        '色欲之环': '薇尔维特不紧不慢地吸了一口烟管：<em>有趣。很久没有人敢挑战我了。上一个尝试的人现在在我的风铃上——他以为魅魔只会魅惑。他错了。</em>',
        '嫉妒之环': '暗鳍的眼睛突然变得锐利——那种怯懦的伪装瞬间消失了：<em>我就知道。我就知道你和他们一样——你只是想抢我的东西。来吧。在水沟区，没有人比我更了解该怎么杀人。</em>',
        '暴食之环': '格鲁姆放下汤勺，从围裙下面抽出了一把巨大的切肉刀：<em>我就知道总有一天会有人抢我的锅。没关系——新鲜的肉永远不嫌多。而且刚打过架的人，肉质最嫩。</em>',
        'default': '<em>有意思。来吧——让我看看你有什么本事。</em>'
    };

    var msg = combatMessages[ring] || combatMessages['default'];

    st('<div class="scene-title">战 斗</div><p>' + td.npcName + '看着你，眼中闪过一丝意外——然后是危险的兴奋。' + msg + '</p><p style="color:#e85060;">罪业值+' + (td.combatSin || 5) + '。战斗即将开始。</p>');
    cb();

    ab('战斗！', function() {
        var enemyData = {
            name: td.combatName,
            hp: td.combatHp,
            physicalAttack: td.combatAtk,
            defense: td.combatDef,
            goldReward: td.combatReward,
            sinReward: td.combatSin,
            description: td.npcDesc
        };
        startCombat(enemyData, 'tutorial_' + ring, ring, 'poor');
    }, 'danger-btn');
}

// ==================== 区域数据 ====================
/* Duplicate RD Removed */

// 中层区域事件
var middleRingScenes = {
    '傲慢之环': { name: '星尘区', desc: '你踏入了星尘区。这里是傲慢环的中层——君主直属手下的居所。低阶堕天使、审判厅的文书官、执事们在此居住与工作。建筑由暗色石材建成，每一块都经过精确的切割，棱角分明。街道干净得近乎冷酷——没有灰烬区的污渍，也没有晨星高地的辉煌。这里的一切都被一种冰冷的秩序所统治。每一个行人都穿着规整的制服，步履匆匆，面无表情。偶尔有几个低阶堕天使从你身边走过，他们的翅膀被整齐地折叠在背后，羽尖泛着暗紫色的微光。一个执事模样的恶魔站在公告栏前，正在张贴新的审判日程。', events: [{ name: '查看公告栏', desc: '公告栏上贴着最近的审判安排和招募信息。你仔细看了看——上面写着审判厅正在招募低阶文书官，要求是能读写地狱通用语。你目前还不符合条件，但至少知道了一条潜在的职业路径。一个正在看公告的执事注意到了你的目光：<em>想应征？先把通用语学好。审判厅不收文盲。</em>', effect: '获得情报：审判厅招募文书官' }, { name: '与路过的小贩交谈', desc: '一个推着木车的小贩在街角售卖水晶碎片——据说是从晨星高地的边缘捡来的边角料。他用沙哑的声音向你推销：<em>真正的傲慢环水晶，能让你在灰烬区显得与众不同。只要20金币一块。不贵——比起真正的地位，这点钱算什么？</em>', effect: '可购买水晶碎片（20金币）' }, { name: '参观训练场', desc: '星尘区的训练场是低阶堕天使们进行战斗训练的地方。你站在围栏外观看了一会儿——两个年轻的堕天使正在用木剑对练，他们的动作精准而优雅，每一击都经过了精密的计算。一个教官模样的老堕天使注意到了你：<em>新面孔？想加入训练的话，需要得到执事长的许可。不过——</em>他上下打量了你一番——<em>你大概还差得远。</em>', effect: '获得经验值+5' }] },
    '贪婪之环': { name: '金丝街', desc: '金丝街——贪婪之环的商业动脉。罪业银行的金色穹顶在远处闪耀，灵魂交易所的霓虹招牌不断滚动着当日的灵魂价格，恶魔股市大厅的门口挤满了紧张地盯着报价板的投资者。空气中充斥着讨价还价的声音、金币碰撞的脆响、以及契约魔法生效时特有的嗡鸣声。街道两旁是鳞次栉比的店铺——从万宝商行的连锁分店到只有一张桌子的小型契约公证处。每一个橱窗里都陈列着来自不同世界的珍品：人间的名画、天堂的残片、地狱各环的特产。一个穿着金丝镶边礼服的拍卖师正在街角大声宣传今晚的拍卖会。', events: [{ name: '📈 查看股市报价', desc: '你在恶魔股市大厅的门口驻足。门口的报价板上滚动着各种"罪业产出预期"——暴怒之环的武器公司股票在上涨，色欲之环的娱乐产业保持稳定，嫉妒之环的仿冒品产业被标注为"高风险"。你注意到最下方有一行小字：<em>首次开户免手续费，最低投资额10金币。</em>', effect: '获得情报：恶魔股市可投资' }, { name: '🛍️ 逛万宝商行分店', desc: '万宝商行的分店比铜板巷的任何店铺都要气派。门口的迎宾恶魔朝你微笑：<em>欢迎光临！本店今日特价——来自人间的古董怀表，只要50金币。或者您可以看看我们的特价区——一些轻微损坏的魔法物品，价格从5金币起。</em>', effect: '可购买特价魔法物品（5金币起）' }, { name: '📝 契约公证处', desc: '一家小型契约公证处门口坐着一个戴着厚厚眼镜的老恶魔。他看到你走近，从眼镜上方打量了你一番：<em>需要公证契约吗？无论商业合同、借贷协议还是灵魂契约，本处都可以提供公证服务。公证费10金币。在贪婪之环，一份公证过的契约比口头承诺值钱一百倍。</em>', effect: '可公证契约（10金币）' }] },
    '暴怒之环': { name: '铁砧大道', desc: '铁砧大道——暴怒之环的军工区。空气中弥漫着熔炉的灼热和淬火油的刺鼻气味。怒火熔炉的巨大厂房排列在道路两侧，昼夜不停地发出铁锤敲击的轰鸣声。每一次锤击都震得地面微微颤动。血焰角斗场的巨大轮廓在不远处若隐若现——那座倒置的火山口正喷出猩红的岩浆瀑布，角斗场内的观众嘶吼声隔着几条街都能听到。武器商店的橱窗里陈列着从简易匕首到巨型战斧的各种兵器，每一把都散发着淡淡的血腥味。一个浑身肌肉的角斗士训练师正在街边大声招揽学员。', events: [{ name: '参观血焰角斗场外围', desc: '你走近血焰角斗场。即使站在外围，你也能感受到从角斗场内部传来的热浪和声浪。门口的告示牌上写着今晚的角斗赛程——三场铁笼格斗，一场冠军挑战赛。一个售票恶魔朝你喊：<em>新面孔！想进场看比赛还是亲自上场？观众票5金币，角斗士报名费10金币——赢了能拿十倍奖金。</em>', effect: '可购买观众票（5金币）或报名角斗（10金币）' }, { name: '逛武器商店', desc: '你走进一家名为"碎骨武备"的武器商店。店主是个断了角的年迈恶魔，脸上有一道横跨整张脸的旧伤疤。<em>随便看。</em>他坐在柜台后面磨着一把匕首，<em>从5金币的简易匕首到500金币的定制战斧，什么都有。如果你手头紧——</em>他用磨刀石指了指角落里一堆旧兵器——<em>那边的二手货更便宜。</em>', effect: '可购买武器（5-500金币）' }, { name: '💪 角斗士训练营', desc: '角斗士训练营是一个露天的训练场。几十个角斗士正在泥地上进行各种训练——有的在举重，有的在对练，有的在教练的指导下学习新的格斗技巧。一个教练注意到你在观看：<em>想报名训练？一节课5金币——保证让你在角斗场上多活三十秒。</em>', effect: '可报名训练（5金币，获得少量经验值）' }] },
    '色欲之环': { name: '霓虹大道', desc: '霓虹大道——色欲之环的娱乐心脏。流动的欲望之光照亮了每一寸空间：欲焰秀场的外墙不断变幻着诱惑的图案，魅骨时装店的橱窗里陈列着用欲望丝线编织的华丽服饰，灵魂契约所的门前排着等待签订欲望契约的长队。空气中充满了各种层次的低语——有些是诱惑，有些是笑声，有些是更加露骨的邀请。魅魔和梦魔们在街角招揽顾客，每一个微笑都经过精确的计算。你注意到一家名为"欲望拍卖行"的建筑门口聚集了一群衣着华丽的恶魔，似乎在等待一场特殊的拍卖会。', events: [{ name: '🎭 欲焰秀场门口', desc: '欲焰秀场的门口站着两个身材高挑的魅魔迎宾。其中一个朝你眨了眨眼：<em>今晚的秀是"七罪之梦"——我们最好的表演。门票15金币起。当然——</em>她压低了声音——<em>如果你愿意在秀后留下来，也许可以和表演者进行更私人的交流。价格另算。</em>', effect: '可购买秀场门票（15金币）' }, { name: '逛魅骨时装店', desc: '魅骨时装店的橱窗里展示着一件用暗红色欲望丝线织成的晚礼服。标签上写着：<em>"魅惑之光"——穿戴者魅力+2。售价：80金币。</em>旁边还有更便宜的配饰区：一条能略微提升魅力的丝巾，只要15金币。', effect: '可购买魅力装备（15-80金币）' }, { name: '💝 灵魂契约所', desc: '灵魂契约所的门前排着长队。一个工作人员正在分发号码牌：<em>今天可以签订三种契约——短期欲望契约、长期情感契约和永久灵魂契约。每种的价格和条款都在墙上贴着。</em>你看了看价目表：短期契约10金币起。', effect: '可签订欲望契约（10金币起）' }] },
    '嫉妒之环': { name: '镜面街区', desc: '镜面街区——嫉妒之环的居民区。这里的建筑表面覆盖着模仿其他环层风格的装饰：仿冒的傲慢环水晶、仿冒的贪婪环金饰、拙劣的色欲环霓虹模仿。模仿得越不像，越显得可悲。暗潮之眼情报组织的总部就坐落在这条街的中心——一座外表不起眼的灰色建筑，但每一个进出的人都步履匆忙，眼神游移。谣言集市占据了街区的一角，各种真假难辨的消息在这里被大声叫卖。空气中弥漫着酸涩的黑水气味和一种更难以形容的、属于嫉妒本身的酸腐感。', events: [{ name: '👁️ 暗潮之眼总部', desc: '你走近那座灰色建筑。门口的守卫用灰绿色的眼睛扫了你一眼：<em>第一次来？进去左转是情报购买处，右转是情报出售处。记住——在这里，你说的话可能被记录下来。你买的情报可能是假的。但真的情报——</em>他压低声音——<em>能让你在嫉妒之环活得更久。</em>', effect: '可购买或出售情报' }, { name: '🗣️ 谣言集市', desc: '谣言集市挤满了交头接耳的恶魔。一个长着三只耳朵的情报贩子凑近你：<em>嘿！想听最新消息吗？据说利维坦最近看上了一件属于玛门的收藏品——嘘，别声张。这条消息只要3金币。如果你有消息要卖，我也可以收——价格看情报的价值。</em>', effect: '可购买谣言（3金币）或出售情报' }, { name: '🪞 镜厅', desc: '镜厅是镜面街区的标志性建筑——一座由无数面镜子构成的大厅。每一面镜子都映出不同的倒影：有的映出你最嫉妒的人，有的映出你最渴望的东西。一个导游模样的恶魔正在带一群游客参观：<em>请勿长时间注视任何一面镜子——曾经有人在这里站了三天三夜，最后被自己的嫉妒吞噬了。</em>', effect: '凝视镜子（获得经验值+5，理智-1）' }] },
    '暴食之环': { name: '美食大道', desc: '美食大道——暴食之环的饕餮天堂。从低端的"深渊秽食自助"到高端的"虚无珍馐会所"，各种档次的餐饮场所鳞次栉比。空气中混合着数百种食物的香气——烤肉的焦香、甜点的奶油味、发酵酒类的醇香、以及某种更深层的、让人无法抑制地感到饥饿的原始气息。你的胃在你踏入这条街的瞬间就开始咕咕作响。永饥食品厂的巨大烟囱在远处冒着暗色的烟雾，食教的传教站门口站着一个身穿执事袍的恶魔，正在向路人分发免费的汤品样品。', events: [{ name: '虚无珍馐会所', desc: '虚无珍馐会所的大门由两根巨大的骨头拱卫。门口的侍者穿着洁白的制服——在暴食之环，白色是最难保持的颜色。<em>欢迎。今晚的主厨推荐是"时间慢炖地狱牛尾"——用时间碎片慢炖了三百年的牛尾。价格是60金币一位。当然——</em>他看了看你的衣着——<em>我们也有更实惠的午间套餐，30金币。</em>', effect: '可购买珍馐套餐（30-60金币）' }, { name: '🥘 食教传教站', desc: '食教传教站的执事递给你一小杯暗色的汤品——免费的。<em>尝尝看。</em>他微笑着说，<em>这是用暴食之环最普通的食材熬制的。但如果你加入食教——</em>他的眼睛中闪过一丝蓝绿色的光芒——<em>你可以品尝到更高级的食材。天使的羽翼碎片、人类的记忆精华、甚至空间本身的边角料。一切都可以被吞噬。一切都可以成为你的养分。</em>', effect: '获得免费汤品（恢复5HP），了解食教' }, { name: '🍖 深渊秽食自助', desc: '深渊秽食自助的门面简陋得几乎像一个垃圾站——但门口的队伍却排得很长。一个服务员站在门口收钱：<em>5金币一位，随便吃！不限量！吃到你走不动为止！</em>从门口飘出来的气味混合了各种廉价食材的味道——不精致，但量大管饱。', effect: '可购买自助餐（5金币，恢复10HP）' }] },
    '懒惰之环': { name: '慵懒大道', desc: '慵懒大道——懒惰之环的居民区。时间在这里流动得极为缓慢，空气像温吞的糖浆包裹着一切。虚无躺椅总店的门口陈列着各种型号的躺椅——从基础款到可以自动调节惰性能量的豪华款。懒鬼外包公司的办事员们以令人抓狂的低效率处理着其他环委托来的事务，但没有人催促他们——在懒惰之环，催促本身就是一种冒犯。惰性能量采集站的巨大管道从地面延伸到灰雾深处，发出低沉的嗡嗡声。路边的长椅上躺着几个半睡半醒的恶魔，他们的呼吸缓慢到几乎不可察觉。', events: [{ name: '🛋️ 虚无躺椅总店', desc: '虚无躺椅总店的店员——一个几乎被灰雾完全包裹的恶魔——用极其缓慢的语速向你介绍：<em>这……是……我们……的……基础……款……只要……20……金币……可以……让你……更快……入睡……这……是……豪华……款……50……金币……自带……惰性……力场……调节……功能……</em>你听了整整五分钟才听完两句话。', effect: '可购买虚无躺椅（20-50金币）' }, { name: '📄 懒鬼外包公司', desc: '懒鬼外包公司的前台趴在一个抱枕上，抬头看了你一眼——那个动作花了十秒钟。<em>有……什么……需要……委托……的……吗……？</em>你看了看墙上的服务列表：文件抄写（3个工作日——但通常需要两周）、低阶清洁（可能只扫一半）、消息传递（如果传递者没有中途睡着的话）。价格倒是非常便宜——每项服务只要2金币。', effect: '可委托懒鬼公司服务（2金币起）' }, { name: '🌫️ 惰性能量采集站', desc: '惰性能量采集站的门口站着一个身穿灰色制服的技术员——在懒惰之环，能站着工作已经是最高级别的勤快了。他看到你走近，懒洋洋地指了指墙上的价目表：<em>惰性能量提取——10金币。让你在一小时内完全放松。副作用是可能会睡过头。不过——</em>他打了个呵欠——<em>在懒惰之环，睡过头是正常的。</em>', effect: '可购买惰性能量提取（10金币，恢复10理智，但可能触发随机睡眠事件）' }] }
};

function renderMiddleRing(ring) {
            var scene = middleRingScenes[ring];
            if (!scene) { sceneExploreDistrict(ring, 'poor'); return; }
            player.currentRing = ring;
            player.currentDistrict = scene.name;
            if (!player.residenceRing) player.residenceRing = ring;
            checkHp();
    ua();
            st('<div class="scene-title">' + scene.name + '</div><p>' + scene.desc +
                '</p><div class="divider">◆ ◆ ◆</div><p><span class="gold-text">可触发事件：</span></p>');
            cb();
            if (scene.events) {
                for (var i = 0; i < scene.events.length; i++) {
                    (function(event) {
                        ab(event.name, function() {
                            st('<div class="scene-title">' + scene.name + '</div><p>' + event.desc +
                                '</p><p style="color:#9a6a6a;font-size:0.82em;">' + event.effect +
                                '</p>');
                            cb();
                            ab('继续探索（耗时5分钟）', function() { addTime(5);
                                renderMiddleRing(ring); });
                            ab('返回贫民区', function() { sceneExploreDistrict(ring, 'poor'); });
                        });
                    })(scene.events[i]);
                }
            }
            if (RD[ring].middle && RD[ring].middle.npc) {

function sceneTavernStranger() {
    st('<div class="scene-title">角 落 的 陌 生 人</div><p>你在他对面坐下。木头椅子发出吱呀的抗议声——这把椅子显然已经承受过太多人的重量，每个榫头都在呻吟。从近处看，这张桌子比远处看更令人不安——桌面上那些刀痕不是随意的划痕，而是一道道有规律的、深深嵌入木头的沟壑。有些痕迹的边缘还残留着暗色的污渍——那颜色太深了，不像是酒。</p><p>兜帽下的面孔终于完全露了出来。这是一张你在地狱里会记住的脸——消瘦，棱角分明，皮肤像是被风沙打磨过的旧皮革。几道深浅不一的伤疤分布在他的额头、颧骨和下巴上，其中最引人注目的是那道从嘴角延伸到耳根的旧刀疤，泛着蜡白色的光泽。他的头发灰白交杂，乱糟糟地堆在头上，几缕油腻的发丝从兜帽边缘垂下来。</p><p>但他的眼睛——那双暗黄色的、瞳孔像蛇一样竖着的眼睛——才是你真正无法移开视线的地方。它们在昏暗中泛着冷光，像是在黑暗中狩猎的爬行动物。当他看着你的时候，你有一种被从头到脚衡量了一遍的感觉——不是审美上的衡量，而是评估。像屠夫评估一头待宰的牲口。</p><p>他打量了你一会儿。那种毫不掩饰的、从头到脚的目光，缓慢而精确。然后他咧嘴笑了，露出一口参差不齐的牙齿——其中有一颗是金的，在昏暗的灯光下闪了一下。</p><p><em>新面孔。</em>他的声音沙哑，像是喉咙里卡着一层砂纸。每个字都被刻意放慢了速度，仿佛他在享受对话中那种掌控节奏的感觉。<em>刚来灰烬区吧？我闻得出来——新来的身上有一种特别的味道。不是臭味，是……</em>他歪了歪头，蛇瞳中闪过一丝难以解读的光芒——<em>不确定。你不确定自己该站在哪里，该怕谁，该信谁。</em></p><p>他靠回椅背，双手交叉在胸前。椅子发出吱呀的声音。</p><p><em>我叫扎里克。在这片灰烬区混了——</em>他想了想——<em>算了，太久了，懒得数。我见过无数个像你一样的新面孔从这里经过。有的人走出去了，有的人——</em>他用手指在桌面上的一道深沟里划过——<em>没有。</em></p><p>他向前倾了倾身体，蛇瞳在昏暗的灯光下闪烁着冷光。</p><p><em>我这儿有几条路，看你想走哪条。听好了——我只说一遍。选完之后，不能反悔。这是我的规矩。</em></p><p>他伸出三根手指。指甲缝里嵌着洗不掉的暗褐色污渍——那是旧血痕和某种更深的痕迹的混合物。</p><p><em>第一条——</em>他弯下第一根手指，<em>我看你身上应该有点值钱的东西。把金币交出来，我不伤害你。这算抢劫。简单利落。你失去一些钱，但你可以完好无损地走出这扇门。用钱买命——在地狱里，这算划算的交易。</em></p><p><em>第二条——</em>他弯下第二根手指，目光在你身上上下扫了一遍，这次的眼神与之前不同——更像是一个买家在评估商品的质量，<em>你长得还不错。别误会，我不是在夸你。我只是在陈述一个事实——你的外表在这个区域有一定的……市场价值。如果你愿意提供一些服务，我可以付你一笔可观的金币。这算交易。公平买卖。事后两清，谁也不欠谁。</em></p><p><em>第三条——</em>他弯下最后一根手指，眼中闪过一丝毫不掩饰的危险光芒，嘴角的笑意变得锋利起来，像一把刚从刀鞘中抽出的刀刃，<em>我把你宰了，拿走你身上所有的东西。这算杀戮。你可以尝试反抗——很多人都试过。但你看——</em>他指了指桌面上那些刀痕——<em>他们现在都不在这里了。</em></p><p>他靠回椅背，双手交叉。椅子发出的吱呀声在安静的角落中格外清晰。</p><p><em>选吧。别让我等太久。我耐心不太好——</em>他的蛇瞳在昏暗中闪了一下——<em>而且我的茶已经凉了。</em></p>');
    cb();
    ab('💰 交出金币（抢劫路线，耗时5分钟）', function() { addTime(5); sceneTavernRobbery(); });
    ab('💋 提供"服务"（卖身路线，耗时15分钟）', function() { addTime(15); sceneTavernSellBody(); });
    ab('拒绝并攻击他（杀戮路线，耗时10分钟）', function() { addTime(10); sceneTavernMurder(); }, 'danger-btn');
}
function sceneTavernRobbery() {

    player.gold = Math.max(0, player.gold - goldLost);
    player.sinValue += 3;
    player.flags.tavernTutorialDone = true;
    checkHp();
    ua();
    st('<div class="scene-title">抢 劫</div><p>你咬了咬牙。在这个陌生的地狱里，你不知道自己能不能打得过眼前这个人——但你知道，命比金币重要。你把手伸进口袋，指尖触碰到那些冷冰冰的金属圆片。每一枚金币都是你在这个世界为数不多的筹码——但现在你必须把它们交出去。</p><p>你把金币放在桌上。它们在木头上发出沉闷的声响，在安静的角落中格外清晰。扎里克没有立刻伸手去拿——他先是用那双蛇瞳盯着你的眼睛，似乎在看你的表情。然后他满意地点了点头。</p><p><em>聪明。</em>他用手掌一扫——动作快得几乎看不清——金币就消失在他的袖子里，仿佛从未存在过。<em>不多不少，正好' + goldLost + '金币。你比大多数新来的都识相。有些人——</em>他用手指在桌面上一道特别深的刀痕上敲了敲——<em>宁愿挨一刀也不愿意交钱。最后呢？钱还是我的，命不是他们的了。你说他们蠢不蠢？</em></p><p>他站起身。站起来之后你才发现他比你想象中更高——至少高出你半个头。他伸手拍了拍你的肩膀，那力道比你想象中更重，让你肩膀隐隐发疼。你能感觉到他手指上的老茧隔着衣物摩擦着你的皮肤。</p><p><em>记住，新来的。在灰烬区，有时候主动交出东西比被迫交出东西要划算得多。你今天花了' + goldLost + '金币，买到了一个教训。这个教训不贵——比那些人付的学费便宜多了。</em>他朝桌面上那些刀痕努了努下巴。</p><p>他朝门口走去，路过吧台时手指一弹——一枚金币划过一道弧线落在酒保面前。酒保甚至没有抬头，只是用手掌盖住了金币，然后继续擦他的杯子。</p><p>扎里克推开木门，门外灰蒙蒙的光线照进来，在地面上投下他细长的影子。他在门口停了一秒，回头看了你一眼。</p><p><em>下次见面，也许我们可以谈点真正的生意。当然——前提是你还有金币。保重，新来的。</em></p><p>他消失在门外的灰色光线中。木门在他身后合上，门轴再次发出刺耳的呻吟。角落里又恢复了安静——只有那个对着墙壁喃喃自语的醉鬼还在继续他没说完的话。</p><p style="color:#e85060;">你失去了 ' + goldLost + ' 金币。罪业值 +3。</p>');
    player.statusMood = '你感到一阵屈辱，但同时也松了一口气。口袋轻了，但命还在。在灰烬区，这已经算是好结局了。你的手指还在隐隐作痛——不是因为被伤害了，而是因为在交出金币的那一刻，你攥紧拳头太用力了。';
    cb();
    ab('整理心情，离开酒馆（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });

function sceneTavernSellBody() {

        st('<div class="scene-title">交 易 失 败</div><p>扎里克靠在椅背上，那双蛇瞳上下打量着你——这次的目光比之前任何一次都要仔细，也更加挑剔。他歪着头，像是在审视一件不合心意的商品。然后他嗤笑了一声——那笑声短促而刺耳，像是金属片刮过石头。</p><p><em>就你？</em>他的语气里满是不加掩饰的轻蔑。他靠回椅背，摇了摇头，那动作里混合着失望和某种更接近于厌恶的情绪。<em>老子又不是收破烂的。你以为在这灰烬区，随便什么人脱了衣服就能赚金币？你得有资本——资本懂吗？</em></p><p>他用手指在空中画了个圈，指向你的脸。那根手指停在你面前几寸的地方——指甲缝里嵌着的暗色痕迹在昏暗的光线下格外显眼。</p><p><em>你这张脸——</em>他的蛇瞳眯了起来——<em>连欲望之环最低等的魅魔都不会多看一眼。我给了你一个机会，你浪费了它。而浪费我的时间——</em></p><p>他猛地站起来。椅子向后翻倒在地上，发出响亮的撞击声，在安静的角落中回荡。酒馆里其他几个醉鬼同时抬起头——然后又迅速低下，仿佛什么都没看到。他们知道接下来会发生什么。暗黄色的蛇瞳中闪过危险的光芒，他的手已经伸向了斗篷下面——你能看到那里藏着一把短刀的轮廓。</p><p><em>——是有代价的。</em></p><p style="color:#e85060;">魅力不足！你的魅力值（' + playerCharm + '）未达到阈值（' + charmThreshold + '），判定失败。触发战斗！</p>');

    player.desire = Math.min(player.maxDesire, player.desire + 3);
    player.sinValue += 1;
    checkHp();
    ua();
    st('<div class="scene-title">交 易 达 成</div><p>扎里克看着你。这次他的目光不同了——不再是审视，而是一种缓慢的、重新评估的凝视。他沉默了几秒，那双蛇瞳在昏暗中闪烁着微光。然后他缓缓点了点头，嘴角那道旧伤疤随着他的表情微微牵动。</p><p><em>嗯——仔细看看……</em>他歪着头，手指在桌面上敲了两下，节奏比之前慢——像是在仔细思考，<em>你确实有些可取之处。我刚才说的话可能重了点。别往心里去——在地狱里，你得学会不把别人的评价当回事。不管是好的还是坏的。</em></p><p>他重新坐回椅子里，手指交叉放在桌上。这次他的姿态放松了一些——交易已经进入了双方都认可的阶段。</p><p><em>好吧。我这人讲究公平交易——这是我在灰烬区混了这么多年还没被人捅死的唯一原因。你可以选择服务的方式。每种——价格不同。你自己挑，挑你舒服的。我不强迫。</em></p><p>他伸出三根手指——这次的动作比之前慢，每根手指都带着解释：</p><p><em>第一种，用你的手。简单，直接，没有太多……牵扯。适合第一次。</em></p><p><em>第二种，用你的嘴。需要一点技巧，但如果做得好——</em>他的蛇瞳闪了一下——<em>报酬翻倍。</em></p><p><em>第三种——</em>他收起手指，双手摊开，做了一个更开放的姿势——<em>全部。最深入的接触。报酬最高，但你也得付出最多。我不催你——你慢慢想。</em></p><p>他靠回椅背，双手交叉在胸前，静静地看着你。那双蛇瞳在昏暗的灯光下泛着冷静的光芒——没有催促，没有威胁。只有等待。</p>');
    cb();
    ab('✋ 手部侍奉（报酬: 8-12金币，耗时15分钟）', function() { addTime(15); sceneSellHand(); });
    ab('👄 口部侍奉（报酬: 15-22金币，耗时20分钟）', function() { addTime(20); sceneSellOral(); });

    ab('↩ 改变主意，拒绝交易', function() {

        st('<p>你沉默了一会儿，然后摇了摇头。<em>算了。我想了想——还是不了。</em></p><p>扎里克没有生气。他甚至没有露出失望的表情。他只是点了点头，重新把兜帽拉低，遮住了大半张脸。</p><p><em>行。我说过——我不强迫。你能在交易之前想清楚，比在交易之后后悔强。这条路不通，下次见面也许有别的路。保重，新来的。</em></p><p>他站起身，从你身边走过。你闻到他身上混合了皮革、硫磺和旧血的气味。他推开木门，灰蒙蒙的光线照进来一瞬，然后又随着门的关闭消失了。角落里只剩下你一个人。</p>');

}
function sceneTavernMurder() {

    checkHp();
    ua();
    st('<div class="scene-title">杀 戮</div><p>你冷冷地看着扎里克。你没有说话，但你的眼神已经说明了一切——那双眼睛里没有恐惧，没有犹豫，只有一种被逼到角落后的决绝。你的手在桌子下面悄悄握紧了——指节因为用力而发白。</p><p>扎里克察觉到了。毕竟他在这片灰烬区混了太多年——他见过无数双眼睛，恐惧的、贪婪的、绝望的。但你的眼神里有一种他不太常见的东西——<em>反抗</em>。真正的、准备以命相搏的反抗。</p><p>他嘴角的笑意消失了。那张消瘦的脸上的表情从玩味变成了冷酷——不，不是冷酷，是某种更接近于专业的态度。像一个猎人发现猎物不再逃跑而是转身面对他时，所做出的调整。他慢慢站起来，动作比之前任何一次都要谨慎。他的手伸进斗篷下面——当它再次出现时，握着一把短刀。刀身锈迹斑斑，但刀刃在昏暗的灯光下泛着寒光——那是被反复打磨过的痕迹。</p><p><em>哦？</em>他歪了歪头，蛇瞳眯成两条危险的细缝。<em>看来你选了第三条路。你知道——</em>他用空着的那只手在桌面上那些深深的刀痕上划过——<em>我最喜欢这条路。这是最诚实的路。没有讨价还价，没有交易，只有最简单的规则——活着的人拿钱，死了的人留在这里。</em></p><p>他把短刀在手中转了一圈——那动作熟练得令人不安。<em>来吧。让我看看你有多大本事。别让我失望——我最讨厌失望。</em></p><p style="color:#e85060;">你主动发起了攻击！罪业值大幅增加（+10）。战斗即将开始。</p>');

        }, 'tavernTutorial', returnRing, 'poor');
    }, 'danger-btn');
}

        function saveGame() {
            try {
                // 深拷贝并清理过期数据
                var cleanData = JSON.parse(JSON.stringify(player));
                if (cleanData.npcTalkDaily) {
                    var today = cleanData.daysSurvived || 0;
                    for (var key in cleanData.npcTalkDaily) {
                        if (cleanData.npcTalkDaily[key].day !== today) {

                        }
                    }
                }
                
                // 本地槽位保存逻辑
                var slots = JSON.parse(LS.g(SAVE_KEY + '_slots') || '[]');
                slots.push({
                    timestamp: Date.now(),
                    player: cleanData
                });
                if (slots.length > 5) slots.shift(); // 最多保留5个槽位
                LS.s(SAVE_KEY + '_slots', JSON.stringify(slots));
                
                LS.s(SAVE_KEY, JSON.stringify(cleanData));
                playSound(880, 0.12);
                var data = JSON.stringify(cleanData, null, 2);
                var blob = new Blob([data], { type: 'application/json' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = '七环地狱_存档.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                st('<p style="color:#80c080;">已保存并导出！过期对话数据已清理。</p>');
            } catch(e) {
                st('<p class="highlight">保存失败：' + e.message + '</p>');

            ab('返回', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', getCurrentLevel()); });
        }
function loadGame(event) {
            var saved = LS.g(SAVE_KEY);
            var processData = function(data) {
                // 合并数据，确保关键数组和对象存在
                Object.assign(player, data);
                if (!player.npcTalkDaily) player.npcTalkDaily = {};
                if (!player.buffs) player.buffs = [];
                
                // 兼容旧存档：使用绝对时间存储起始时刻
                var currentAbs = player.daysSurvived * 1440 + player.gameTime;
                player.buffs.forEach(function(b) {
                    if (b.startAbsolute === undefined && b.startTime !== undefined) {
                        b.startAbsolute = player.daysSurvived * 1440 + b.startTime;
                    }
                });

                if (!player.inventory) player.inventory = [];
                if (!player.flags) player.flags = {};
                if (!player.relationships) player.relationships = {};
                if (!player.activeTasks) player.activeTasks = [];
                checkHp();
    ua();
                st('<p style="color:#e8c060;">存档加载成功！</p>');
                cb();
                ab('继续步入地狱', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', getCurrentLevel()); });
            };

            if (event && event.target && event.target.files && event.target.files.length) {
                var file = event.target.files[0];
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        processData(JSON.parse(e.target.result));
                    } catch (err) {
                        st('<p class="highlight">文件解析失败。</p>');
                        cb();
                        ab('返回', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', getCurrentLevel()); });
                    }
                };
                reader.readAsText(file);
                return;
            }

            if (saved) {
                try { processData(JSON.parse(saved)); } catch (e) { st('<p class="highlight">浏览器存档损坏。</p>'); cb(); ab('返回', function() { sceneExploreDistrict(player.currentRing || '傲慢之环', getCurrentLevel()); }); }
            } else {
                st('<p class="highlight">未找到存档文件或浏览器存档。</p>');

            }
        }

        // ---- 罪人生前背景 ----
        var sinBackstories = {

    '傲慢': [{ crime: '你是一位天才外科医生。从医学院毕业那天起，你的导师就说你拥有"神之手"——精准、稳定、从不颤抖。你救过三百条命。每一个被你切开又缝合的身体，都是你才华的证明。但你忘记了一件事：你不是神。在一次高难度心脏手术中，助手反复提醒你患者的血压正在危险下降。你连头都没抬——你从不听助手的话，因为你觉得他们不配。患者死在了手术台上。事后你伪造了病历，把责任推给了那位助手。他在法庭上哭了。你没有任何感觉。直到某天深夜，他在停车场等着你。', flavor: '刀尖刺入时，你脑中闪过的不是疼痛，而是那句"我怎么可能错"。你救过三百条命，但你始终认为那是理所应当。直到冰冷的停车场地面告诉你——你也不过是一具肉体。' },{ crime: '你是某跨国企业的CEO。从白手起家到行业巨头，你用了二十年。你的座右铭刻在办公室的墙上：商场如战场，弱者活该被淘汰。你主导的商业欺诈导致数万人失业，数十家供应商破产。当记者在镜头前质问你时，你微笑着说：我只是做了一个商人该做的事。三年后的一个雨夜，一位破产供应商的老板闯入了你的办公室。他手里拿着的东西，不是你惯常见到的合同。', flavor: '枪响时你还在整理领带。你最后看到的东西，是自己倒映在落地窗上的脸——那张脸上没有恐惧，只有不可思议。你到死都不相信，有人会因为"钱"这种东西杀人。' }],
    '暴怒': [{ crime: '你在公司被上司当众羞辱了整整十年。十年。每天早上走进办公室，你都能听到同事的窃窃私语。他在会议上把你的方案扔在地上，在茶水间叫你废物，在年会舞台上当着一千人的面模仿你的口吃。你忍了十年。然后某天下午，当他又一次把你的报告摔在桌上时，你拿起了旁边的办公椅。之后的事情像一部快进的电影——你砸了他十七下。然后你点燃了办公室。火焰蔓延到整个楼层。七名同事没能逃出来。你坐在火焰中央，看着这一切发生，感到了一种从未有过的平静。浓烟灌入肺部的最后一刻，你想：这比忍耐容易多了。', flavor: '火焰比你想象中更吵。它吞噬隔间挡板的声音像野兽咀嚼骨头。你在浓烟中听到有人在哭——那声音和十年前你在镜子前听到的，一模一样。' },{ crime: '你是战场上的老兵。三次服役，两次负伤，一枚勋章。你在战壕里学会了如何在半秒内判断敌友，如何在黑暗中徒手杀死一个成年人。但没人教过你如何回到和平的生活。退役后你做过保安、货车司机、工地搬运工——每一份工作都以打架告终。那天在街上，一个年轻人撞到了你的肩膀。他没有道歉。你的手在他脖子上停留了四十五秒——你数的。法官问你为什么，你说：他撞了我。法警把你按在地上时，你还在挣扎。不是因为你想逃跑——是因为你无法忍受被压制的屈辱。', flavor: '法庭的灯光很亮。你看着陪审团的脸，每一张脸上都写着恐惧。你忽然意识到——在他们眼中，你不是老兵，不是英雄。你只是一头该被关起来的野兽。' }],
    '贪婪': [{ crime: '你是巴黎某银行的出纳员。二十年间，你每天坐在同一个窗口后面，经手数以百万计的资金——但没有一分钱属于你。你可以摸到它们、数它们、闻它们——但你不能拥有它们。这种折磨持续了三年后，你找到了系统的漏洞。一开始只是小数点后的零头，然后是几十、几百、几千。二十年后，你已经转移了足够让数千名储户养老金蒸发的巨款。当那些老人因为失去毕生积蓄而自杀的消息传来时，你正在摩纳哥的赌场挥霍。最终，一位受害者的儿子找到了你。他在酒店阳台上对你说了三句话，然后扣动了扳机。', flavor: '海风把钞票吹散的那一刻，你还在笑。直到子弹穿过胸口，你才想起那些储户的名字——他们的脸你从未看过，但他们的钱，你每一分都记得。你最后看到的东西，是漫天飞舞的纸币，像一场你永远无法兑现的梦。' },{ crime: '你是医疗公司的销售代表。你的任务很简单——把过期疫苗和假药卖到贫困地区。你觉得这不是什么大不了的事。反正那些地方的人本来就活不长。你用赚来的钱在市中心买了三套房，开上了跑车。无数孩子因为你的"药品"落下终身残疾，但你没有看过任何一张照片——你刻意不去看。直到一个受害者的父亲跟踪了你六个月。他研究你的作息、你的路线、你车库里那个监控死角。那天晚上你加班到很晚，车库里很暗。你听到身后有脚步声——然后什么都不知道了。', flavor: '铁管砸下来之前，你还在算这个月的佣金有多少。最后一个念头不是悔恨、不是恐惧——而是"我还没收完那笔账"。你到死都在算。' }],
    '嫉妒': [{ crime: '你嫉妒挚友的成功——他比你晚入行五年，却先你一步升职。他的晋升晚宴上，所有人都举杯为他庆祝。你也在笑。你举着酒杯走到他面前，说了一大段感人至深的祝酒词。所有人都被你感动了——包括他在内。他一口喝完了那杯酒。但你的酒杯，自始至终没有碰过嘴唇。你下错了杯子。挚友的妻子——坐在他旁边，怀着他们的第一个孩子——拿错了他的酒杯。她喝下了你准备的毒酒，当场倒地。你在混乱中逃出了宴会厅，在火车站跳上了一辆不知开往何方的列车。铁轨的震动比你想象中更冰冷——然后一切归于黑暗。', flavor: '你记得那晚香槟气泡在玻璃杯中破裂的声音，记得她倒下时瓷器碎裂的声响，记得挚友跪在她身边时发出的那声嘶吼。你不记得自己是怎么跑到火车站的。你只记得铁轨的震动——比所有你嫉妒过的东西都要真实。' },{ crime: '你是一名二流画家。你知道自己是二流的——这才是最痛苦的地方。如果你不知道，你可以活在无知中；如果你是一流的，你可以活在天才中。但你卡在中间，清清楚楚地知道自己不够好。而你最好的朋友——那个和你一起学画的、你一直觉得不如你的人——成为了举世闻名的艺术家。你去参加他的画展，对着镜头说"我为他感到骄傲"。然后你在深夜潜入他的工作室，毁掉了他即将展出的全部作品。放火时，你被困在了自己点的火里。', flavor: '火焰吞噬画布时，你看着那些比你优秀的作品化为灰烬——你笑了。然后一根房梁砸了下来。在生命的最后一秒，你忽然想到：这些画被烧了，他还会画新的。而你永远不会再画了。' }],
    '暴食': [{ crime: '你是食品公司质检主管。你的工作很简单——确保进入市场的每一批原料都符合安全标准。但你发现了一个更简单的赚钱方式：只要在报告上改几个数字，就有供应商愿意付你一大笔钱。你经手的过期肉制品、变质奶源、污染蔬菜，进入了无数超市和餐厅。大规模食物中毒事件发生时，你正在家里享用一顿六道菜的晚餐。电视新闻里播放着遇难者家属的采访——二十三人死亡，其中包括七个孩子。你换了一个台。入狱前夜，你没有收拾行李，没有写遗书。你只是坐在餐桌前，把冰箱里所有的食物都吃完了。然后你的身体终于承受不住了。', flavor: '你倒在餐桌前，嘴里还塞着半块奶油蛋糕。讽刺的是——你放行的腐肉让二十三人死去，而你，是被"过量"杀死的。只不过用的是奶油和糖霜。这大概是你一生中最诚实的死法。' },{ crime: '你是美食评论家，以刻薄著称。你的一支笔可以成就一家餐厅，也可以毁掉它。你享受这种权力。当一家三代经营的老餐馆被你的一篇恶意差评彻底摧毁时——老板在店铺倒闭后饮弹自尽——你毫不在意，继续吃遍全城。你觉得自己的味蕾是这个行业最高的裁判。直到有一天深夜，你在餐厅后巷被一个蒙面人拦住。他手里拿着的不是刀——是一把切肉刀。一刀，又一刀。那把刀刺入的位置，正是你用来品尝美食的胃。', flavor: '你一生都在用这个胃评判别人——最后它也被别人评判了。你倒在湿漉漉的后巷地面上，闻到的不是食物的香气，而是垃圾桶的味道。这是你这辈子品鉴过的最后一道"菜"。' }],
    '色欲': [{ crime: '你以美色为诱饵，专门接近富裕的老人并与其结婚。你的套路很简单——温柔、体贴、让他们在晚年感受到从未有过的激情。然后，在继承遗产的时机成熟时，给他们注射过量的胰岛素。制造"自然死亡"。你成功了三次。第四次时，那位丈夫的儿子——一个沉默寡言的中年男人——发现了端倪。他在一次争执中将你推下了楼梯。那楼梯比你想象中更长。你数了每一级台阶——十八级，正好是你第一次结婚时的年龄。', flavor: '坠落时，你看到了楼梯墙上挂着的照片——那是你第四任丈夫的全家福。照片里他的妻子还活着，他的孩子还在笑。你忽然想到：如果没有你，这张照片也许永远不会被取下来。血在地板上晕开，像你最喜欢的那条红裙。' },{ crime: '你是地下色情产业的幕后老板。你毁掉了无数年轻人的人生，把他们当作可以随意买卖的商品。你觉得这没什么——需求决定供给，你只是满足市场。你的办公室里挂着一幅字：生意就是生意。直到你最信任的助手把你出卖给了竞争对手。子弹射进胸口时，你听到助手在你耳边轻声说：这也是生意。你一直教我的，不是吗？', flavor: '你教会了他一切——如何谈判、如何压价、如何在交易中永远占据上风。你唯一没有教他的，是什么时候该收手。因为你自己也不知道。' }],
    '懒惰': [{ crime: '你是桥梁工程的安全监理。你的工作很重要——确保每一座桥梁在通车前都经过了严格的安全检查。但你从不认真做这件事。你只是坐在办公室里，在报告上签字。你懒得去现场，懒得检查数据，懒得打任何一个电话。你经手的最后一座桥，通车第三年坍塌了。四十五人丧生。事故调查组发现你的报告全是伪造的。事发后你躲在家中，拉上所有窗帘，拒绝接任何电话。你假装什么都没发生——就像你对待每一份安全报告那样。警方破门时，你的心脏已经停止了跳动。', flavor: '桥塌的时候你在看电视。电视里播着肥皂剧，窗外传来巨响。你关掉了声音，假装什么都没发生——就像你对待每一份安全报告那样。但大地不会假装。它替你记住了每一个坠落的人。' },{ crime: '你是一家福利院的院长。你从不虐待儿童——你只是懒。懒得检查食物质量，所以孩子们吃了发霉的面包。懒得维修暖气，所以冬天时孩子们裹着薄毯挤在一起取暖。懒得回应任何一个孩子的求助——你觉得他们只是闹脾气。那年冬天特别冷。三个孩子在睡梦中停止了呼吸——不是冻死的，是肺炎。调查时你说：我以为暖气修好了。实际上你从未拨过维修电话。你只是懒得拨。', flavor: '法庭宣判那天你还在打哈欠。直到狱警把囚服扔到你面前，你才意识到：这次你真的懒得逃了。囚服的布料很粗糙，但你懒得抱怨。你连抱怨都懒。' }]
};

        function sceneSinSelect() {
    st('<div class="scene-title">选 择 罪 孽</div><p>在坠入地狱之前，你曾是人间的一个灵魂。你的名字是<span class="highlight">' + player.name + '</span>。</p><p>每一个罪人坠入地狱，都不是偶然。在傲慢之环——地狱的中心——每一个灵魂都要面对自己生前所犯罪孽的审判。你的罪孽将决定你灵魂的属性，也将决定路西法对你的第一印象。</p><p>七宗罪——<span class="gold-text">傲慢、暴怒、嫉妒、贪婪、暴食、色欲、懒惰</span>——每一种罪孽都是一条将你拖入深渊的锁链。现在，面对你的罪孽。选择一条锁链，然后看看它在你生前是如何缠绕你的。</p><p style="color:#9a6a6a;font-size:0.82em;">选择罪孽后，系统将随机生成一段生前背景故事。属性修正将影响你的初始数值。</p>');
    cb();
    var sins = [{ name: '傲慢', desc: '魔力+2 · 魅力+1 · 理智-1' },{ name: '暴怒', desc: '力量+3 · 理智-2' },{ name: '嫉妒', desc: '敏捷+2 · 魔力+1' },{ name: '贪婪', desc: '魅力+2 · 魔力+1' },{ name: '暴食', desc: '力量+1 · 敏捷-1 · 理智-1' },{ name: '色欲', desc: '魅力+3 · 力量-1' },{ name: '懒惰', desc: '理智+2 · 敏捷-2' }];
    for (var i = 0; i < sins.length; i++) {
        (function(s) {
            ab(s.name + '（' + s.desc + '）', function() {
                player.sin = s.name;
                player.birthRing = s.name + '之环';
                var stories = sinBackstories[s.name];
                if (!stories || stories.length === 0) { st('<p class="highlight">背景故事缺失，请刷新重试。</p>'); cb(); return; }

                var reroll = function() {
                    var newStory = stories[Math.floor(Math.random() * stories.length)];
                    player.flags.crimeStory = newStory.crime;
                    player.flags.crimeFlavor = newStory.flavor;
                    st('<div class="scene-title">' + s.name + '——生 前 之 罪</div><div class="divider">◆ ◆ ◆</div><p><span class="highlight">' + player.name + '</span>——这就是将你推入地狱的罪行。</p><p style="margin-top:10px;line-height:1.9;">' + newStory.crime + '</p><div class="divider">◆ ◆ ◆</div><p style="color:#c09080;font-style:italic;">"' + newStory.flavor + '"</p><div class="divider">◆ ◆ ◆</div><p>属性修正：<span class="highlight">' + s.desc + '</span></p><p style="color:#9a6a6a;font-size:0.82em;">一切罪孽的根源都是傲慢——你将首先坠入傲慢之环，接受路西法的审判。</p>');
                    cb();
                    ab('塑造外貌', function() { sceneAppearance(true); }, 'primary-btn');
                    ab('再换一个', reroll);
                };

                var chosenStory = stories[Math.floor(Math.random() * stories.length)];
                player.flags.crimeStory = chosenStory.crime;
                player.flags.crimeFlavor = chosenStory.flavor;
                checkHp();
    ua();
                st('<div class="scene-title">' + s.name + '——生 前 之 罪</div><div class="divider">◆ ◆ ◆</div><p><span class="highlight">' + player.name + '</span>——这就是将你推入地狱的罪行。</p><p style="margin-top:10px;line-height:1.9;">' + chosenStory.crime + '</p><div class="divider">◆ ◆ ◆</div><p style="color:#c09080;font-style:italic;">"' + chosenStory.flavor + '"</p><div class="divider">◆ ◆ ◆</div><p>属性修正：<span class="highlight">' + s.desc + '</span></p><p style="color:#9a6a6a;font-size:0.82em;">一切罪孽的根源都是傲慢——你将首先坠入傲慢之环，接受路西法的审判。</p>');
                cb();
                ab('塑造外貌', function() { sceneAppearance(true); }, 'primary-btn');
                ab('再换一个', reroll);
            });
        })(sins[i]);
    }
}

function renderAppearanceOptions(isSinner) {
    var pool = appearanceOptions.sinner;
    if (!isSinner) {
        var ringPool = appearanceOptions.demon[player.birthRing] || appearanceOptions.demon['傲慢之环'];
        pool = {
            hairColor: ringPool.hairColor,
            hairStyle: appearanceOptions.demonGeneral.hairStyle,
            eyeColor: ringPool.eyeColor,
            height: appearanceOptions.demonGeneral.height,
            bodyType: appearanceOptions.demonGeneral.bodyType,
            mutation: ringPool.mutation
        };
    }
    
    // Auto-select valid first option
    if(!pool.hairColor.find(function(c) { return c.name === currentAppearance.hairColor.name; })) currentAppearance.hairColor = pool.hairColor[0];
    if(pool.hairStyle.indexOf(currentAppearance.hairStyle) === -1) currentAppearance.hairStyle = pool.hairStyle[0];
    if(!pool.eyeColor.find(function(c) { return c.name === currentAppearance.eyeColor.name; })) currentAppearance.eyeColor = pool.eyeColor[0];
    if(pool.height.indexOf(currentAppearance.height) === -1) currentAppearance.height = pool.height[0];
    if(pool.bodyType.indexOf(currentAppearance.bodyType) === -1) currentAppearance.bodyType = pool.bodyType[0];
    if(pool.mutation.indexOf(currentAppearance.mutation) === -1) currentAppearance.mutation = pool.mutation[0];

    var html = '<div style="margin-top:15px; background:rgba(20, 5, 10, 0.6); padding:15px; border:1px solid rgba(60, 16, 32, 0.8); border-radius:4px; box-shadow:inset 0 0 10px rgba(0,0,0,0.5);">';
    
    html += '<p style="margin-bottom:8px;"><span style="color:#9a6a6a;">发色：</span>' + pool.hairColor.map(function(c) { return '<span class="clickable" style="color:' + (currentAppearance.hairColor.name === c.name ? c.color : '#888') + '; text-shadow:' + (currentAppearance.hairColor.name === c.name ? ('0 0 6px ' + c.color) : 'none') + '; margin-right:8px;" onclick="setAppearance(\'hairColor\', \'' + c.name + '\', \'' + c.color + '\')">[' + c.name + ']</span>'; }).join('') + '</p>';
    
    html += '<p style="margin-bottom:8px;"><span style="color:#9a6a6a;">发型：</span>' + pool.hairStyle.map(function(c) { return '<span class="clickable" style="color:' + (currentAppearance.hairStyle === c ? '#e8c060' : '#888') + '; margin-right:8px;" onclick="setAppearance(\'hairStyle\', \'' + c + '\')">[' + c + ']</span>'; }).join('') + '</p>';
    
    html += '<p style="margin-bottom:8px;"><span style="color:#9a6a6a;">瞳色：</span>' + pool.eyeColor.map(function(c) { return '<span class="clickable" style="color:' + (currentAppearance.eyeColor.name === c.name ? c.color : '#888') + '; text-shadow:' + (currentAppearance.eyeColor.name === c.name ? ('0 0 6px ' + c.color) : 'none') + '; margin-right:8px;" onclick="setAppearance(\'eyeColor\', \'' + c.name + '\', \'' + c.color + '\')">[' + c.name + ']</span>'; }).join('') + '</p>';
    
    html += '<p style="margin-bottom:8px;"><span style="color:#9a6a6a;">身高：</span>' + pool.height.map(function(c) { return '<span class="clickable" style="color:' + (currentAppearance.height === c ? '#e8c060' : '#888') + '; margin-right:8px;" onclick="setAppearance(\'height\', \'' + c + '\')">[' + c + ']</span>'; }).join('') + '</p>';
    
    html += '<p style="margin-bottom:8px;"><span style="color:#9a6a6a;">体型：</span>' + pool.bodyType.map(function(c) { return '<span class="clickable" style="color:' + (currentAppearance.bodyType === c ? '#e8c060' : '#888') + '; margin-right:8px;" onclick="setAppearance(\'bodyType\', \'' + c + '\')">[' + c + ']</span>'; }).join('') + '</p>';
    
    html += '<p style="margin-bottom:8px;"><span style="color:#9a6a6a;">异化：</span>' + pool.mutation.map(function(c) { return '<span class="clickable" style="color:' + (currentAppearance.mutation === c ? '#e8c060' : '#888') + '; margin-right:8px;" onclick="setAppearance(\'mutation\', \'' + c + '\')">[' + c + ']</span>'; }).join('') + '</p>';
    
    html += '</div>';
    
    var desc = '<p style="margin-top:15px; line-height:1.9; font-style:italic; padding:10px; border-left:3px solid #5a1a28; background:rgba(0,0,0,0.3);">';
    desc += '你有着一头<span style="color:' + currentAppearance.hairColor.color + ';font-weight:bold;text-shadow:0 0 4px ' + currentAppearance.hairColor.color + ';">' + currentAppearance.hairColor.name + '</span>的' + currentAppearance.hairStyle + '。';
    desc += '一双<span style="color:' + currentAppearance.eyeColor.color + ';font-weight:bold;text-shadow:0 0 4px ' + currentAppearance.eyeColor.color + ';">' + currentAppearance.eyeColor.name + '</span>的眼睛正冷漠地审视着深渊。';
    desc += '你的身姿' + currentAppearance.height + '，体型' + currentAppearance.bodyType + '。';
    if (isSinner) {
        desc += '作为背负着罪孽坠入地狱的罪人，你的灵魂重塑的肉体上残留着前世的烙印与惩罚的痕迹：<span style="color:#c04050;font-weight:bold;">' + currentAppearance.mutation + '</span>。';
    } else {
        desc += '作为纯粹由混沌能量孕育的原生恶魔，你的身体带有鲜明的深渊特征：<span style="color:#c04050;font-weight:bold;">' + currentAppearance.mutation + '</span>。';
    }
    desc += '</p>';
    
    return html + desc;
}

window.setAppearance = function(key, val, color) {
    if (key === 'hairColor' || key === 'eyeColor') {
        currentAppearance[key] = { name: val, color: color };
    } else {
        currentAppearance[key] = val;
    }
    sceneAppearance(player.race === 'sinner');
}

function sceneAppearance(isSinner) {
    st('<div class="scene-title">塑 造 外 貌</div><p>在这里，你的灵魂将重塑肉体。你的模样将是你在地狱中存在的最直观印记。</p>' + renderAppearanceOptions(isSinner));

    ab('确认外貌', function() {

            sceneDiceDemon();
        }
    }, 'primary-btn');
}

function sceneDiceSinner() {
    var newPlayer = createCleanPlayerState(player.name, player.race, player.gender, player.sin, player.sin + '之环');
    newPlayer.currentRing = '傲慢之环';

    newPlayer.agility = roll();

    newPlayer.maxSanity = 20;
    newPlayer.hp = 100;
    newPlayer.maxHp = 100;
    newPlayer.food = 100;
    newPlayer.fatigue = 0;
    newPlayer.daysSurvived = 1;
    newPlayer.stats.ringsVisited = ['傲慢之环'];
    
    var tempApp = player.appearance;
    Object.assign(player, newPlayer);
    player.appearance = tempApp;
    
    var mods = { '暴怒': function() { player.strength += 3;
            player.sanity -= 2; }, '贪婪': function() { player.charisma += 2;
            player.magic += 1; }, '嫉妒': function() { player.agility += 2;
            player.magic += 1; }, '色欲': function() { player.charisma += 3;
            player.strength -= 1; }, '傲慢': function() { player.magic += 2;
            player.charisma += 1;
            player.sanity -= 1; }, '暴食': function() { player.strength += 1;
            player.agility -= 1;
            player.sanity -= 1; }, '懒惰': function() { player.sanity += 2;

    if (mods[player.sin]) mods[player.sin]();
    setSinTraits();

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>七环地狱 · 傲慢之醒</title>
    <style>
        :root {
            --bg: #0a0005;
            --panel: #120108;
            --border: #2a0a14;
            --text: #d0c4c8;
            --dim: #7a5a62;
            --gold: #d4a040;
            --red: #c03040;
            --sidebar-w: 320px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Georgia', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            height: 100vh; height: 100dvh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        #app { display: flex; height: 100vh; height: 100dvh; position: relative; }
        #main { flex: 1; display: flex; flex-direction: column; min-width: 0; transition: margin-right 0.3s ease; }
        #main.sidebar-open { margin-right: var(--sidebar-w); }
        #topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: linear-gradient(180deg, #14010a 0%, #0d0106 100%); border-bottom: 2px solid #3a0a18; gap: 10px; flex-shrink: 0; }
        #topbar .title { font-size: 1.15em; letter-spacing: 0.08em; color: #e8c060; font-weight: bold; white-space: nowrap; text-shadow: 0 0 12px rgba(200,80,40,0.4); }
        #topbar .subtitle { font-size: 0.72em; color: #9a6a6a; white-space: nowrap; letter-spacing: 0.05em; }
        #menuBtn { background: rgba(180,30,50,0.15); border: 1px solid #5a1a28; color: #e0b0b0; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 0.82em; white-space: nowrap; transition: 0.2s; letter-spacing: 0.04em; }
        #menuBtn:hover, #menuBtn:active { border-color: #c04050; color: #ffc0c0; background: rgba(200,40,60,0.25); box-shadow: 0 0 16px rgba(200,40,60,0.3); }
        #quick-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px; background: #0a0106; border-bottom: 1px solid #200a10; font-size: 0.76em; flex-shrink: 0; }
        #quick-stats span { white-space: nowrap; }
        .qs-label { color: #8a5a62; }
        .qs-val { color: #d0c0c4; font-weight: bold; }
        .qs-gold { color: #e8c060; }
        .qs-red { color: #e85060; }
        .qs-special { color: #ff6080; text-shadow: 0 0 8px rgba(255,60,80,0.5); }
        .qs-time { color: #8ab4d4; font-weight: bold; }
        #text-area { flex: 1; overflow-y: auto; padding: 18px 16px; -webkit-overflow-scrolling: touch; background: linear-gradient(180deg, #0a0005 0%, #0d0108 100%); }
        #text-content { white-space: pre-wrap; line-height: 1.9; font-size: 0.93em; letter-spacing: 0.02em; }
        #text-content em { color: #c09080; font-style: italic; }
        #text-content strong { color: #e8c060; font-weight: bold; }
        #text-content .highlight { color: #ff4060; font-weight: bold; text-shadow: 0 0 8px rgba(255,60,90,0.4); }
        #text-content .gold-text { color: #e8c060; font-weight: bold; }
        .scene-title { text-align: center; font-size: 1.05em; letter-spacing: 0.12em; color: #e8c060; margin-bottom: 14px; text-shadow: 0 0 10px rgba(200,80,40,0.3); }
        .divider { text-align: center; color: #5a2a30; margin: 10px 0; letter-spacing: 0.2em; }
        .input-group { margin: 10px 0; }
        .input-group label { display: block; color: #c09090; font-size: 0.85em; margin-bottom: 4px; letter-spacing: 0.04em; }
        .input-group input { width: 100%; padding: 10px 14px; background: #14040a; border: 1px solid #3a1020; color: #e0c0c0; font-family: inherit; font-size: 0.95em; border-radius: 6px; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: #c04050; box-shadow: 0 0 10px rgba(200,40,60,0.3); }
        .race-select { display: flex; gap: 8px; flex-wrap: wrap; }
        .race-select .clickable { padding: 6px 12px; }
        .race-select .clickable.active { color: #ff8090; text-shadow: 0 0 10px rgba(200,80,60,0.4); }
        #text-content .clickable { color: #e8c060; text-decoration: underline; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-block; padding: 2px 6px; border-radius: 4px; }
        #text-content .clickable:hover { color: #ffc060; background: rgba(200,80,40,0.15); text-shadow: 0 0 8px rgba(255,200,60,0.3); }
        #text-content .clickable:active { transform: scale(0.97); }
        #text-content .clickable.danger { color: #e85060; }
        #text-content .clickable.danger:hover { color: #ff7080; background: rgba(200,40,60,0.2); }
        #text-content .clickable.gold { color: #e8c060; }
        #text-content .clickable.gold:hover { color: #ffd070; background: rgba(200,160,60,0.15); }
        #text-content .clickable.back { color: #8aaa8a; }
        #text-content .clickable.back:hover { color: #aacca0; background: rgba(100,180,100,0.1); }
        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        #sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        #sidebar { position: fixed; top: 0; right: calc(-1 * var(--sidebar-w)); width: var(--sidebar-w); height: 100%; height: 100dvh; background: #0e0108; border-left: 2px solid #3a0a18; z-index: 100; overflow-y: auto; -webkit-overflow-scrolling: touch; transition: right 0.3s ease; padding: 20px 18px; }
        #sidebar.open { right: 0; }
        #sidebar h3 { font-size: 0.88em; color: #e8c060; letter-spacing: 0.1em; margin-bottom: 16px; text-align: center; text-shadow: 0 0 8px rgba(200,80,40,0.3); }
        #sidebar .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a0812; font-size: 0.82em; }
        #sidebar .stat-row .s-label { color: #8a5a62; }
        #sidebar .stat-row .s-val { font-weight: bold; color: #d0c0c4; }
        #sidebar .stat-row .s-highlight { color: #ff4060; text-shadow: 0 0 6px rgba(255,60,80,0.4); }
        #sidebar .stat-row .s-gold { color: #e8c060; }
        #sidebar .close-btn { display: block; width: 100%; margin-top: 18px; padding: 10px; background: #180610; border: 1px solid #2a0a16; color: #d0c0c4; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 0.85em; text-align: center; }
        #sidebar .close-btn:active { border-color: #c04050; }
        #sidebar-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
        #sidebar-tabs button { flex: 1; padding: 6px 4px; background: #180610; border: 1px solid #2a0a16; color: #8a5a62; font-family: inherit; font-size: 0.72em; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        #sidebar-tabs button.active { border-color: #c04050; color: #ff8090; background: #1e0812; }
        #sidebar .social-card { background: #14040a; border: 1px solid #2a0a14; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
        #sidebar .social-card .npc-name { color: #e8c060; font-weight: bold; font-size: 0.82em; }
        #sidebar .social-card .npc-opinion { color: #9a6a6a; font-size: 0.72em; font-style: italic; margin: 2px 0 6px; }
        #sidebar .social-card .npc-bars { font-size: 0.7em; }
        #sidebar .social-card .npc-bar { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        #sidebar .social-card .npc-bar-fill { height: 6px; border-radius: 3px; }
        #sidebar .social-card .npc-bar-fill.love { background: #e85060; }
        #sidebar .social-card .npc-bar-fill.desire { background: #d4a040; }
        #sidebar .social-card .npc-bar-fill.anger { background: #c03040; }
        #sidebar .status-box { background: #14040a; border: 1px solid #2a0a14; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
        #sidebar .status-box .status-label { color: #8a5a62; font-size: 0.7em; }
        #sidebar .status-mood { color: #c09080; font-size: 0.78em; font-style: italic; margin-top: 6px; padding-top: 6px; border-top: 1px solid #1a0812; }
        #sidebar .buff-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.68em; margin: 2px 4px 2px 0; }
        #sidebar .buff-tag.positive { background: rgba(100,180,100,0.2); border: 1px solid rgba(100,180,100,0.4); color: #80c080; }
        #sidebar .buff-tag.negative { background: rgba(200,60,60,0.2); border: 1px solid rgba(200,60,60,0.4); color: #e06060; }
        #sidebar .save-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid #1a0812; }
        #sidebar .save-section button { width: 100%; margin: 4px 0; padding: 8px; background: #180610; border: 1px solid #2a0a16; color: #d0c0c4; font-family: inherit; font-size: 0.78em; border-radius: 4px; cursor: pointer; }
        #sidebar .save-section button:active { border-color: #c04050; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a1020; border-radius: 2px; }
        @media (max-width: 500px) { :root { --sidebar-w: 290px; } #topbar { padding: 8px 12px; } #topbar .title { font-size: 1em; } #quick-stats { padding: 6px 12px; font-size: 0.7em; gap: 4px 8px; } #text-area { padding: 14px 12px; } #text-content { font-size: 0.86em; } .race-select .clickable { padding: 5px 10px; } }
        .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
        .map-node { background: #14040a; border: 1px solid #2a0a14; border-radius: 4px; padding: 6px 8px; font-size: 0.78em; cursor: pointer; text-align: center; transition: 0.2s; }
        .map-node:hover { border-color: #c04050; background: #1e0812; }
        .map-node.current { border-color: #e8c060; background: #1a1008; }
        .map-node.locked { opacity: 0.4; cursor: not-allowed; }
        .task-card { background: #14040a; border: 1px solid #2a0a14; border-radius: 6px; padding: 8px 10px; margin: 4px 0; font-size: 0.8em; }
        .task-card .task-title { color: #e8c060; font-weight: bold; }
        .task-card .task-deadline { color: #e85060; font-size: 0.8em; }
        .task-card .task-reward { color: #d4a040; }
        .black-market-badge { color: #ff6080; text-shadow: 0 0 10px rgba(255,60,80,0.3); font-weight: bold; }
    </style>
</head>
<body>
<div id="app">
    <div id="main">
        <div id="topbar">
            <div>
                <div class="title">七环地狱</div>
                <div class="subtitle">傲慢之醒</div>
            </div>
            <button id="menuBtn" onclick="toggleSidebar()">⚙️ 属性</button>
        </div>
        <div id="quick-stats"><span><span class="qs-label">🕐</span> <span class="qs-time" id="qs-time">08:00</span></span><span><span class="qs-label">📅</span> <span class="qs-val" id="qs-date">第1天</span></span><span><span class="qs-label">姓名</span> <span class="qs-special" id="qs-name">???</span></span><span><span class="qs-label">HP</span> <span class="qs-red" id="qs-hp">100/100</span></span><span><span class="qs-label">🍖</span> <span class="qs-gold" id="qs-food">100</span></span><span><span class="qs-label">😫</span> <span class="qs-red" id="qs-fatigue">0</span></span><span><span class="qs-label">EXP</span> <span class="qs-gold" id="qs-exp">0/20</span></span><span><span class="qs-label">环</span> <span class="qs-gold" id="qs-ring">-</span></span><span><span class="qs-label">金币</span> <span class="qs-gold" id="qs-gold">0</span></span></div>
        <div id="text-area"><div id="text-content"></div></div>
    </div>
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar"><h3>◆ 属 性 面 板 ◆</h3><div id="sidebar-tabs"><button id="tab-status" class="active" onclick="switchTab('status')">状态</button><button id="tab-social" onclick="switchTab('social')">社交</button><button id="tab-inventory" onclick="switchTab('inventory')">背包</button><button id="tab-save" onclick="switchTab('save')">存档</button><button id="tab-map" onclick="switchTab('map')">地图</button><button id="tab-tasks" onclick="switchTab('tasks')">任务</button></div><div id="sidebar-content"></div><button class="close-btn" onclick="toggleSidebar()">关闭面板</button></div>
</div>

<script>
// ==================== 游戏数据 ====================
var player = {
    name: '', race: '', gender: '', sin: '', birthRing: '',
    level: 1, hp: 100, maxHp: 100, exp: 0,
    strength: 0, agility: 0, magic: 0, charisma: 0, sanity: 10, maxSanity: 15,
    desire: 5, maxDesire: 20,
    sinValue: 0, gold: 0,
    currentRing: '', residenceRing: null, currentDistrict: '',
    outfit: '基础衣着', outfitDesc: '你穿着一身坠入地狱时的简陋衣物，已经有些磨损。',
    job: '无业', jobDesc: '你尚未在任何环层找到正式的工作。',
    abilities: [], inventory: [],
    flags: {}, relationships: {},
    buffs: [], statusMood: '你感到迷茫而警觉。初来乍到，一切都需要小心应对。',
    gameTime: 480, food: 100, maxFood: 100, fatigue: 0, maxFatigue: 100,
    sleepPlace: '灰烬区流浪者聚集地', sleepQuality: 'poor',
    npcTalkCounts: {}, daysSurvived: 0, month: 1, year: 1,
    alarmTime: null, hasClock: false,
    equippedClothId: null,
    equippedClothData: null,
    equippedWeaponId: null,
    equippedWeaponData: null,
    sinTrait: '',
    // 新增：NPC对话追踪
    npcTalkDaily: {},
    // 新增：任务系统
    activeTasks: [],
    completedTasks: [],
    failedTasks: [],
    // 新增：黑市刷新
    blackMarketItems: [],
    blackMarketLastRefresh: -1,
    // 新增：饱食状态
    satietyTimer: 0,
    satietyBuff: null
};
var SAVE_KEY = 'qclaw_hell_ring_save';
var sidebarTab = 'status';
var stage = 'title', sidebarOpen = false, selectedRace = '', selectedGender = '';
var tc = document.getElementById('text-content');
var sb = document.getElementById('sidebar');
var ov = document.getElementById('sidebar-overlay');
var mp = document.getElementById('main');
var sc = document.getElementById('sidebar-content');

function roll() { return Math.floor(Math.random() * 20) + 1; }
function st(html) { tc.innerHTML = html; document.getElementById('text-area').scrollTop = 0; }
function ab(label, fn, cls, timeCost) { var span = document.createElement('span'); var c = 'clickable'; if (cls === 'danger-btn') c += ' danger'; else if (cls === 'gold-btn' || cls === 'primary-btn') c += ' gold'; if (timeCost && label.indexOf('（' + timeCost) === -1 && label.indexOf('分钟') === -1) { label = label + '（耗时' + timeCost + '分钟）'; } span.className = c; span.innerHTML = label; var p = document.createElement('p'); p.appendChild(span); tc.appendChild(p); span.addEventListener('click', fn); }
function cb() { /* 选项由 st() 整体重渲染，此处为空操作 */ }

function uqs() {
    document.getElementById('qs-name').textContent = player.name || '???';
    document.getElementById('qs-hp').textContent = player.hp + '/' + player.maxHp;
    document.getElementById('qs-exp').textContent = (player.exp||0) + '/' + (player.level*20);
    document.getElementById('qs-ring').textContent = player.currentRing || '-';
    document.getElementById('qs-gold').textContent = player.gold;
    document.getElementById('qs-time').textContent = getTimeString();
    document.getElementById('qs-date').textContent = getDateString();
    document.getElementById('qs-food').textContent = Math.floor(player.food);
    document.getElementById('qs-fatigue').textContent = Math.floor(player.fatigue);
}
function ua() { uqs(); usb(); }
function addBuff(id, name, desc, type, duration) { player.buffs = player.buffs.filter(function(b) { return b.id !== id; }); player.buffs.push({ id: id, name: name, desc: desc, type: type, duration: duration }); }
function removeBuff(id) { player.buffs = player.buffs.filter(function(b) { return b.id !== id; }); }
function addExp(amount) { player.exp = (player.exp||0) + amount; while (player.exp >= player.level * 20) { player.exp -= player.level * 20; player.level++; player.maxHp += 10; player.hp = player.maxHp; player.maxSanity += 2; player.sanity = Math.min(player.maxSanity, player.sanity + 2); } ua(); }
function addItem(id, name, type, desc, quantity, effects, equipped) {
    quantity = quantity || 1;
    effects = effects || {};
    equipped = equipped || false;
    for (var i = 0; i < player.inventory.length; i++) {
        if (player.inventory[i].id === id) {
            player.inventory[i].quantity += quantity;
            return;
        }
    }
    var item = { id: id, name: name, type: type, desc: desc, quantity: quantity, effects: effects, equipped: equipped, buffs: effects.buffs || [] };
    player.inventory.push(item);
}
function removeItem(id, quantity) { quantity = quantity || 1; for (var i = 0; i < player.inventory.length; i++) { if (player.inventory[i].id === id) { player.inventory[i].quantity -= quantity; if (player.inventory[i].quantity <= 0) { player.inventory.splice(i, 1); } return true; } } return false; }
function hasItem(id) { for (var i = 0; i < player.inventory.length; i++) { if (player.inventory[i].id === id && player.inventory[i].quantity > 0) { return true; } } return false; }
function getItemCount(id) { for (var i = 0; i < player.inventory.length; i++) { if (player.inventory[i].id === id) { return player.inventory[i].quantity; } } return 0; }

function findItemById(id) {
    for (var i = 0; i < player.inventory.length; i++) {
        if (player.inventory[i].id === id) {
            return player.inventory[i];
        }
    }
    return null;
}

// ==================== NPC好感审视系统 ====================
function getNpcAttitude(npcId) {
    var rel = player.relationships[npcId];
    if (!rel) return { text: '你们尚未相识。', level: 'unknown' };
    var love = rel.love || 0;
    if (love <= -20) return { text: '他眼中满是敌意，仿佛随时会对你拔刀相向。', level: 'hostile' };
    if (love <= 0) return { text: '他明显不想和你浪费时间，语气冷淡疏离。', level: 'cold' };
    if (love <= 30) return { text: '他只是简单地回应你的问题，保持着基本的礼貌。', level: 'neutral' };
    if (love <= 60) return { text: '他的态度比之前缓和了许多，愿意多说几句话。', level: 'friendly' };
    if (love <= 80) return { text: '他把你当作可以信任的人，语气中带着难得的温和。', level: 'trusted' };
    return { text: '他愿意向你敞开心扉，甚至分享一些不为人知的秘密。', level: 'intimate' };
}

// ==================== NPC对话次数限制 ====================
function canTalkNPC(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    if (data.count >= 5) {
        return false;
    }
    return true;
}

function incrementNpcTalk(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    data.count++;
}

function getNpcTalkRemaining(npcId) {
    var today = player.daysSurvived;
    if (!player.npcTalkDaily) player.npcTalkDaily = {};
    if (!player.npcTalkDaily[npcId]) {
        player.npcTalkDaily[npcId] = { count: 0, day: today };
    }
    var data = player.npcTalkDaily[npcId];
    if (data.day !== today) {
        data.count = 0;
        data.day = today;
    }
    return Math.max(0, 5 - data.count);
}

// ==================== 服装装备系统 ====================
function unequipCurrentCloth() {
    if (!player.equippedClothId) return;
    var oldData = player.equippedClothData;
    if (oldData) {
        player.charisma -= (oldData.charisma || 0);
        player.strength -= (oldData.strength || 0);
        player.magic -= (oldData.magic || 0);
        player.agility -= (oldData.agility || 0);
        player.sanity = Math.min(player.maxSanity, player.sanity - (oldData.sanity || 0));
        var oldItem = findItemById(player.equippedClothId);
        if (oldItem) oldItem.equipped = false;
    }
    player.equippedClothId = null;
    player.equippedClothData = null;
    player.outfit = '基础衣着';
    player.outfitDesc = '你穿着一身坠入地狱时的简陋衣物，已经有些磨损。';
}

function equipCloth(item) {
    var id = item.name.replace(/\s/g,'_');
    player.equippedClothId = id;
    player.equippedClothData = {
        charisma: item.charisma || 0,
        strength: item.strength || 0,
        magic: item.magic || 0,
        agility: item.agility || 0,
        sanity: item.sanity || 0
    };
    player.charisma += (item.charisma || 0);
    player.strength += (item.strength || 0);
    player.magic += (item.magic || 0);
    player.agility += (item.agility || 0);
    player.sanity = Math.min(player.maxSanity, player.sanity + (item.sanity || 0));
    player.outfit = item.name;
    player.outfitDesc = item.desc;
}

function equipArmorFromBag(itemId) {
    var item = findItemById(itemId);
    if (!item || item.type !== 'armor' || item.equipped) return;
    unequipCurrentCloth();
    item.equipped = true;
    player.equippedClothId = itemId;
    player.equippedClothData = item.effects || {};
    player.charisma += (player.equippedClothData.charisma || 0);
    player.strength += (player.equippedClothData.strength || 0);
    player.magic += (player.equippedClothData.magic || 0);
    player.agility += (player.equippedClothData.agility || 0);
    player.sanity = Math.min(player.maxSanity, player.sanity + (player.equippedClothData.sanity || 0));
    player.outfit = item.name;
    player.outfitDesc = item.desc;
    ua(); usb();
    st('<p>你穿上了 ' + item.name + '。</p>');
    cb();
    ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
}

function unequipArmorFromBag() {
    unequipCurrentCloth();
    ua(); usb();
    st('<p>你卸下了服装，换回了基础衣着。</p>');
    cb();
    ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
}

function equipWeaponData(item) {
    if (!item || item.type !== 'weapon' || item.equipped) return;
    if (player.equippedWeaponId) {
        var oldWeapon = findItemById(player.equippedWeaponId);
        if (oldWeapon) {
            oldWeapon.equipped = false;
            var oldData = player.equippedWeaponData || {};
            if (oldData.attack) player.strength -= oldData.attack;
            removeBuff('weapon_attack');
        }
    }
    item.equipped = true;
    player.equippedWeaponId = item.id;
    player.equippedWeaponData = item.effects || {};
    if (player.equippedWeaponData.attack) {
        player.strength += player.equippedWeaponData.attack;
        addBuff('weapon_attack', item.name, '武器攻击力 +' + player.equippedWeaponData.attack, 'positive', 9999);
    }
    // 武器特殊buff
    if (item.effects && item.effects.buffs) {
        for (var i = 0; i < item.effects.buffs.length; i++) {
            var b = item.effects.buffs[i];
            addBuff('weapon_' + b.id, b.name, b.desc, b.type || 'positive', b.duration || 9999);
        }
    }
}

function unequipWeapon() {
    if (!player.equippedWeaponId) return;
    var item = findItemById(player.equippedWeaponId);
    if (item) {
        item.equipped = false;
        var oldData = player.equippedWeaponData || {};
        if (oldData.attack) player.strength -= oldData.attack;
        removeBuff('weapon_attack');
        if (oldData.buffs) {
            for (var i = 0; i < oldData.buffs.length; i++) {
                removeBuff('weapon_' + oldData.buffs[i].id);
            }
        }
    }
    player.equippedWeaponId = null;
    player.equippedWeaponData = null;
}

function equipWeaponById(itemId) {
    var item = findItemById(itemId);
    if (item && item.type === 'weapon') {
        equipWeaponData(item);
        ua(); usb();
        st('<p>你装备了 ' + item.name + '。</p>');
        cb();
        ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
    }
}

function unequipWeaponFromBag() {
    unequipWeapon();
    ua(); usb();
    st('<p>你卸下了武器。</p>');
    cb();
    ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
}

// ==================== 消耗品使用（修复：增加饱食度） ====================
function useConsumable(itemId) {
    var item = findItemById(itemId);
    if (!item || item.type !== 'consumable' || item.quantity <= 0) return;
    var e = item.effects || {};
    player.hp = Math.min(player.maxHp, player.hp + (e.hp || 0));
    if (e.strength) player.strength += e.strength;
    if (e.magic) player.magic += e.magic;
    if (e.charisma) player.charisma += e.charisma;
    if (e.sanity) player.sanity = Math.min(player.maxSanity, player.sanity + e.sanity);
    if (e.desire) player.desire = Math.min(player.maxDesire, player.desire + e.desire);
    if (e.fatigue !== undefined) {
        player.fatigue = Math.max(0, Math.min(player.maxFatigue, player.fatigue + e.fatigue));
    }
    // 修复：增加饱食度
    if (e.food) {
        player.food = Math.min(player.maxFood, player.food + e.food);
        // 饱食buff
        if (e.satietyBuff) {
            addBuff('satiety', e.satietyBuff.name, e.satietyBuff.desc, 'positive', e.satietyBuff.duration || 1440);
            player.satietyTimer = e.satietyBuff.duration || 1440;
        }
    }
    // 食物道具的额外buff
    if (e.buffs) {
        for (var i = 0; i < e.buffs.length; i++) {
            var b = e.buffs[i];
            addBuff('food_' + b.id, b.name, b.desc, b.type || 'positive', b.duration || 60);
        }
    }
    removeItem(itemId, 1);
    ua(); usb();
    st('<p>你使用了 ' + item.name + '。</p>');
    cb();
    ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
}

// ==================== 饱食度系统（每日检查） ====================
function checkSatiety() {
    // 每天检查一次饱食度状态
    if (player.food <= 0) {
        if (!player.buffs.find(function(b){ return b.id === 'starvation'; })) {
            addBuff('starvation', '饥饿', '你饥肠辘辘，身体开始虚弱。力量-2，敏捷-2，疲劳恢复速度降低。', 'negative', 1440);
            player.strength = Math.max(1, player.strength - 2);
            player.agility = Math.max(1, player.agility - 2);
        }
    } else {
        removeBuff('starvation');
    }
    // 饱食buff过期检查
    if (player.satietyTimer > 0) {
        player.satietyTimer--;
        if (player.satietyTimer <= 0) {
            removeBuff('satiety');
        }
    }
}

// ==================== 战斗系统 ====================
function startCombat(enemyData, flagKey, returnRing, returnLevel) {
    var enemy = {
        name: enemyData.name || '敌人',
        maxHp: enemyData.hp || 30,
        hp: enemyData.hp || 30,
        attack: enemyData.physicalAttack || 8,
        defense: enemyData.defense || 2,
        goldReward: enemyData.goldReward || 5,
        sinReward: enemyData.sinReward || 0,
        desc: enemyData.description || ''
    };

    var playerAtk = Math.floor(player.strength * 1.2) + 2;
    var playerDef = Math.floor(player.agility * 0.8) + 1;

    function renderCombat(statusMsg) {
        var hpBar = '❤️ ' + player.hp + '/' + player.maxHp;
        var enemyHpBar = '💀 ' + enemy.hp + '/' + enemy.maxHp;
        var html = '<div class="scene-title">⚔️ 战 斗 ⚔️</div>';
        html += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a0a14;">';
        html += '<div><span class="highlight">' + player.name + '</span><br>' + hpBar + '<br>⚔️ 攻击 ' + playerAtk + ' | 🛡️ 防御 ' + playerDef + '</div>';
        html += '<div style="text-align:right;"><span class="gold-text">' + enemy.name + '</span><br>' + enemyHpBar + '<br>⚔️ 攻击 ' + enemy.attack + ' | 🛡️ 防御 ' + enemy.defense + '</div>';
        html += '</div>';
        if (statusMsg) html += '<p style="margin:8px 0;color:#c09080;">' + statusMsg + '</p>';
        html += '<p style="font-size:0.78em;color:#8a5a62;">' + enemy.desc + '</p>';
        st(html);
        cb();
    }

    function endCombat(victory) {
        if (victory) {
            var gold = enemy.goldReward + Math.floor(Math.random() * 3);
            var exp = 5 + Math.floor(Math.random() * 6);
            player.gold += gold;
            addExp(exp);
            player.sinValue += (enemy.sinReward || 0);
            if (flagKey) {
                player.flags[flagKey] = true;
                // 如果是酒馆教程，额外设置完成标志
                if (flagKey === 'tavernTutorial') {
                    player.flags.tavernTutorialDone = true;
                }
            }
            ua();
            st('<div class="scene-title">🏆 战 斗 胜 利</div><p>你击败了 <span class="gold-text">' + enemy.name + '</span>！</p><p style="color:#e8c060;">获得 ' + gold + ' 金币，' + exp + ' 经验。' + (enemy.sinReward ? ' 罪业值 +' + enemy.sinReward : '') + '</p>');
            cb();
            ab('继续', function() {
                player.fatigue = Math.min(player.maxFatigue, player.fatigue + 10);
                if (returnRing && returnLevel) {
                    sceneExploreDistrict(returnRing, returnLevel);
                } else {
                    sceneExploreDistrict(player.currentRing, 'poor');
                }
            });
        } else {
            player.hp = Math.max(1, Math.floor(player.maxHp * 0.2));
            player.fatigue = Math.min(player.maxFatigue, player.fatigue + 30);
            var goldLoss = Math.floor(player.gold * 0.3);
            player.gold = Math.max(0, player.gold - goldLoss);
            if (flagKey && flagKey === 'tavernTutorial') {
                player.flags.tavernTutorialDone = true;
            }
            ua();
            st('<div class="scene-title">💀 战 斗 失 败</div><p>你被 <span class="highlight">' + enemy.name + '</span> 击倒了……</p><p>你勉强保住了一条命，但损失了 ' + goldLoss + ' 金币。</p>');
            cb();
            ab('艰难地爬起来', function() {
                if (returnRing && returnLevel) {
                    sceneExploreDistrict(returnRing, returnLevel);
                } else {
                    sceneExploreDistrict(player.currentRing, 'poor');
                }
            });
        }
    }

    function playerTurn(action) {
        if (enemy.hp <= 0) { endCombat(true); return; }
        if (player.hp <= 0) { endCombat(false); return; }

        if (action === 'attack') {
            var dmg = Math.max(1, playerAtk - enemy.defense + Math.floor(Math.random() * 4) - 1);
            enemy.hp = Math.max(0, enemy.hp - dmg);
            renderCombat('你攻击了 ' + enemy.name + '，造成 ' + dmg + ' 点伤害！');
            if (enemy.hp <= 0) { endCombat(true); return; }
            enemyTurn();
        } else if (action === 'defend') {
            var recovered = Math.floor(player.maxHp * 0.05) + 2;
            player.hp = Math.min(player.maxHp, player.hp + recovered);
            renderCombat('你采取了防御姿态，恢复了 ' + recovered + ' 点生命。');
            enemyTurn();
        } else if (action === 'flee') {
            var fleeChance = 0.4 + (player.agility * 0.02);
            if (Math.random() < fleeChance) {
                st('<div class="scene-title">🏃 逃 跑</div><p>你成功脱离了战斗！</p>');
                cb();
                ab('继续', function() {
                    if (returnRing && returnLevel) {
                        sceneExploreDistrict(returnRing, returnLevel);
                    } else {
                        sceneExploreDistrict(player.currentRing, 'poor');
                    }
                });
                return;
            } else {
                renderCombat('逃跑失败！');
                enemyTurn();
            }
        } else if (action === 'item') {
            var consumables = player.inventory.filter(function(it) { return it.type === 'consumable' && it.quantity > 0; });
            if (consumables.length === 0) {
                renderCombat('没有可用的消耗品。');
                cb();
                ab('⚔️ 攻击', function() { playerTurn('attack'); });
                ab('🛡️ 防御', function() { playerTurn('defend'); });
                ab('🏃 逃跑', function() { playerTurn('flee'); });
                return;
            }
            var html = '<div class="scene-title">🧪 使 用 物 品</div>';
            for (var i = 0; i < consumables.length; i++) {
                html += '<p>' + consumables[i].name + ' x' + consumables[i].quantity + ' — ' + consumables[i].desc + '</p>';
            }
            st(html);
            cb();
            for (var i = 0; i < consumables.length; i++) {
                (function(item) {
                    ab('使用 ' + item.name, function() {
                        var e = item.effects || {};
                        player.hp = Math.min(player.maxHp, player.hp + (e.hp || 0));
                        if (e.strength) player.strength += e.strength;
                        if (e.magic) player.magic += e.magic;
                        if (e.charisma) player.charisma += e.charisma;
                        if (e.sanity) player.sanity = Math.min(player.maxSanity, player.sanity + e.sanity);
                        if (e.desire) player.desire = Math.min(player.maxDesire, player.desire + e.desire);
                        if (e.fatigue !== undefined) {
                            player.fatigue = Math.max(0, Math.min(player.maxFatigue, player.fatigue + e.fatigue));
                        }
                        if (e.food) {
                            player.food = Math.min(player.maxFood, player.food + e.food);
                        }
                        removeItem(item.id, 1);
                        ua();
                        renderCombat('你使用了 ' + item.name + '。');
                        enemyTurn();
                    });
                })(consumables[i]);
            }
            ab('取消', function() {
                renderCombat('');
                cb();
                ab('⚔️ 攻击', function() { playerTurn('attack'); });
                ab('🛡️ 防御', function() { playerTurn('defend'); });
                ab('🧪 使用物品', function() { playerTurn('item'); });
                ab('🏃 逃跑', function() { playerTurn('flee'); });
            });
            return;
        }
    }

    function enemyTurn() {
        if (enemy.hp <= 0) { endCombat(true); return; }
        if (player.hp <= 0) { endCombat(false); return; }
        var dmg = Math.max(1, enemy.attack - playerDef + Math.floor(Math.random() * 3) - 1);
        player.hp = Math.max(0, player.hp - dmg);
        renderCombat(enemy.name + ' 攻击了你，造成 ' + dmg + ' 点伤害！');
        if (player.hp <= 0) { endCombat(false); return; }
        cb();
        ab('⚔️ 攻击', function() { playerTurn('attack'); });
        ab('🛡️ 防御', function() { playerTurn('defend'); });
        ab('🧪 使用物品', function() { playerTurn('item'); });
        ab('🏃 逃跑', function() { playerTurn('flee'); });
    }

    renderCombat('战斗开始！');
    cb();
    ab('⚔️ 攻击', function() { playerTurn('attack'); });
    ab('🛡️ 防御', function() { playerTurn('defend'); });
    ab('🧪 使用物品', function() { playerTurn('item'); });
    ab('🏃 逃跑', function() { playerTurn('flee'); });
}

// ==================== 时间系统 ====================
function getTimeString() { var h = Math.floor(player.gameTime / 60) % 24; var m = player.gameTime % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
function getDateString() { return '第' + player.daysSurvived + '天 · 月' + player.month + ' · 年' + player.year; }
function getTimePeriod() { var h = Math.floor(player.gameTime / 60) % 24; if (h >= 6 && h < 12) return 'morning'; if (h >= 12 && h < 18) return 'afternoon'; if (h >= 18 && h < 22) return 'evening'; return 'night'; }
function isNight() { var h = Math.floor(player.gameTime / 60) % 24; return h >= 22 || h < 6; }
function isBlackMarketOpen() { var h = Math.floor(player.gameTime / 60) % 24; return h >= 22 || h < 2; }

function addTime(minutes) {
    player.gameTime += minutes;
    while (player.gameTime >= 1440) {
        player.gameTime -= 1440;
        player.daysSurvived++;
        if (player.daysSurvived % 30 === 0) { player.month++; if (player.month > 12) { player.month = 1; player.year++; } }
        // 每天重置NPC对话
        player.npcTalkDaily = {};
        // 检查饱食度
        checkSatiety();
        // 黑市刷新
        refreshBlackMarket();
        // 任务过期检查
        checkTaskDeadlines();
        // 随机事件触发
        if (Math.random() < 0.15) {
            triggerRandomEvent();
        }
    }
    updateFatigue();
    updateFood();
    tickBuffs();
    ua();
}

function updateFatigue() {
    var period = getTimePeriod();
    if (period === 'night' && !player.flags.isSleeping) {
        player.fatigue = Math.min(player.maxFatigue, player.fatigue + 1);
    }
    if ((player.sin === '暴食' || player.birthRing === '暴食之环') && !player.flags.isSleeping) {
        player.fatigue = Math.min(player.maxFatigue, player.fatigue + 0.5);
    }
    if ((player.sin === '懒惰' || player.birthRing === '懒惰之环') && !player.flags.isSleeping) {
        player.fatigue = Math.min(player.maxFatigue, player.fatigue + 1);
    }
    var h = Math.floor(player.gameTime / 60) % 24;
    if (h >= 0 && h < 6 && !player.flags.isSleeping) {
        player.fatigue = Math.min(player.maxFatigue, player.fatigue + 2);
    }
    if (player.fatigue >= 100) {
        var excess = player.fatigue - 100;
        var newLayers = Math.floor(excess / 40) + 1;
        for (var i = 1; i <= 8; i++) {
            if (i <= newLayers) {
                addBuff('fatigue_layer_' + i, '疲劳层' + i, '疲劳累积过多，力量-1，敏捷-1。', 'negative', 999);
                player.strength = Math.max(1, player.strength - 1);
                player.agility = Math.max(1, player.agility - 1);
            } else {
                removeBuff('fatigue_layer_' + i);
            }
        }
        if (newLayers >= 8) {
            triggerFaintDeep();
            return;
        }
    }
    if (player.fatigue >= 80 && !player.buffs.find(function(b){return b.id==='exhausted';})) {
        addBuff('exhausted', '极度疲劳', '你感到极度疲惫，行动力大幅下降。力量-2，敏捷-2。', 'negative', 999);
        player.strength = Math.max(1, player.strength - 2);
        player.agility = Math.max(1, player.agility - 2);
    }
    if ((player.sin === '色欲' || player.birthRing === '色欲之环') && !player.flags.isSleeping) {
        player.desire = Math.min(player.maxDesire, player.desire + 1);
    }
    if (player.desire >= player.maxDesire) {
        triggerDesireOverflow();
    }
}

function triggerFaintDeep() {
    player.hp = Math.max(1, player.hp - 10);
    player.sanity = Math.max(0, player.sanity - 3);
    for (var i = 1; i <= 8; i++) {
        removeBuff('fatigue_layer_' + i);
    }
    removeBuff('exhausted');
    player.strength = Math.max(1, player.strength - 0);
    player.gameTime += 360;
    player.fatigue = 0;
    player.flags.isSleeping = false;
    var eventText = '你因极度疲劳而晕倒了整整六个小时。当你再次醒来时，身体仍然虚弱，但至少不再处于崩溃边缘。';
    player.statusMood = '你刚从昏迷中醒来，身体极度虚弱。';
    st('<div class="scene-title">晕 倒（极度疲劳）</div><p>' + eventText + '</p><p style="color:#e85060;">HP-10，理智-3。疲劳已清除，疲劳层debuff已消失。</p>');
    cb();
    ab('继续', function() { addTime(5); sceneExploreDistrict(player.currentRing || '傲慢之环', 'poor'); });
}

function triggerDesireOverflow() {
    st('<div class="scene-title">欲望涌动</div><p>你感到内心的欲望如潮水般涌动，几乎要将理智淹没……</p>');
    cb();
    ab('寻找NPC解决（耗时30分钟）', function() {
        addTime(30);
        player.desire = 0;
        player.sinValue += 2;
        st('<p>你通过亲密互动释放了欲望。理智恢复了。</p>');
        cb();
        ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
    });
    ab('卖身工作（耗时60分钟）', function() {
        addTime(60);
        player.desire = 0;
        player.sinValue += 3;
        var gold = 8 + Math.floor(Math.random() * 8);
        player.gold += gold;
        st('<p>你通过工作释放了欲望。获得了' + gold + '金币。</p>');
        cb();
        ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
    });
    ab('强行压制（理智-3）', function() {
        player.sanity = Math.max(0, player.sanity - 3);
        player.desire = Math.floor(player.maxDesire * 0.5);
        st('<p>你强行压制住了欲望，但这让你的精神承受了巨大压力。</p>');
        cb();
        ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
    });
}

function tickBuffs() {
    for (var i = player.buffs.length - 1; i >= 0; i--) {
        var b = player.buffs[i];
        if (b.duration > 0) {
            b.duration--;
            if (b.duration <= 0) {
                removeBuff(b.id);
            }
        }
    }
}

function updateFood() {
    player.food = Math.max(0, player.food - 1);
    if (player.sin === '暴食' || player.birthRing === '暴食之环') {
        player.food = Math.max(0, player.food - 1);
    }
    if (player.food <= 0) {
        player.hp = Math.max(0, player.hp - 5);
        player.statusMood = '你饥肠辘辘，再不进食可能会有生命危险。';
    }
    checkSatiety();
}

function triggerFaint() {
    player.hp = Math.max(1, player.hp - 20);
    player.sanity = Math.max(0, player.sanity - 5);
    player.fatigue = 50;
    player.flags.isSleeping = false;
    addTime(120);
    var r = Math.random();
    var event;
    if (r < 0.4) {
        event = { text: '你恢复意识时，最先感受到的是四肢如同灌了铅般的沉重与酸痛。你缓缓睁开眼，发现自己正躺在一个昏暗、散发着霉味的死胡同角落里。极度的疲劳让你的视线难以立刻聚焦，大脑深处传来阵阵发麻的空虚与胀痛。你用手撑着布满灰尘的墙壁，借着粗糙的摩擦力，勉强支撑起虚脱的身体坐了起来。晕倒前的最后记忆是你拖着沉重的步伐走在街头，眼前发黑。你深吸了一口气，下意识伸手摸向腰间检查物品。皮革钱袋的底部被利器平整地划开了一道口子。你把手探进去摸索，发现原本沉甸甸的分量轻了不少，里面的金币少了一大半。周围没有任何人的身影。巷子里很安静，只有几步之外的街道上，隐约传来人群走动和交谈的嘈杂声。', goldLoss: Math.floor(player.gold * 0.3) };
    } else if (r < 0.7) {

function addFood(amount) { player.food = Math.min(player.maxFood, player.food + amount); ua(); }
function addFatigue(amount) { player.fatigue = Math.min(player.maxFatigue, player.fatigue + amount); if (player.fatigue >= 100) { triggerFaint(); } ua(); }

function sleepRest(quality, hours, fatiguePerHour, hpPerHour, sanityPerHour) {
    var fatigueRecovery = fatiguePerHour * hours;
    var hpRecovery = hpPerHour * hours;
    var sanityRecovery = sanityPerHour * hours;
    var foodCost = Math.floor(hours * 2);

    player.hp = Math.min(player.maxHp, player.hp + hpRecovery);
    player.sanity = Math.min(player.maxSanity, player.sanity + sanityRecovery);
    player.fatigue = Math.max(0, player.fatigue - fatigueRecovery);
    player.food = Math.max(0, player.food - foodCost);

    if (player.alarmTime !== null) {
        var currentMin = player.gameTime % 1440;
        var alarmMin = player.alarmTime % 1440;
        if (alarmMin > currentMin) {
            player.gameTime += (alarmMin - currentMin);
        } else if (alarmMin < currentMin) {
            player.gameTime += (1440 - currentMin + alarmMin);
        }
        player.alarmTime = null;
    } else {
        addTime(Math.floor(hours * 60));
    }
    player.flags.isSleeping = false;
    removeBuff('exhausted');

    var keys = Object.keys(player.flags);
    for (var i = 0; i < keys.length; i++) {
        if (keys[i].indexOf('npcLeft_') === 0) {
            delete player.flags[keys[i]];
        }
    }
    player.npcTalkCounts = {};

    player.statusMood = '你好好休息了一觉，感到精力充沛。';
    ua();
}

function getMoodText() {
    var moods = [];
    if (player.sanity <= 3) moods.push('你感到精神濒临崩溃，现实与幻觉的界限变得模糊。');
    else if (player.sanity <= 6) moods.push('你的理智摇摇欲坠，时常感到不安与恐惧。');
    else if (player.sanity <= 10) moods.push('你感到迷茫而警觉。初来乍到，一切都需要小心应对。');
    else moods.push('你保持着清醒的头脑，对周围的一切有着敏锐的感知。');
    if (player.desire >= 15) moods.push('欲望在你体内燃烧，几乎要将理智吞没。');
    else if (player.desire >= 10) moods.push('一股隐隐的渴望在你心中涌动。');
    if (player.hp < player.maxHp * 0.3) moods.push('你身受重伤，每一次呼吸都带来疼痛。');
    else if (player.hp < player.maxHp * 0.6) moods.push('你身上带着些许伤痕，需要休养。');
    for (var i = 0; i < player.buffs.length; i++) { moods.push(player.buffs[i].desc); }
    return moods.join(' ');
}

function acceptTask(task) {
    if (player.activeTasks.length >= 3) {
        st('<p class="highlight">你已有太多未完成的任务，无法承接新的任务。</p>');
        cb();
        ab('返回', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
        return;
    }
    player.activeTasks.push(task);
    st('<p>你承接了任务：<span class="gold-text">' + task.title + '</span></p><p style="color:#9a6a6a;font-size:0.82em;">' + task.desc + '</p><p style="color:#e85060;">截止日期：第' + task.deadline + '天</p>');
    cb();
    ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
}

function checkTaskDeadlines() {
    for (var i = player.activeTasks.length - 1; i >= 0; i--) {
        var t = player.activeTasks[i];
        if (player.daysSurvived > t.deadline) {
            t.status = 'failed';
            player.failedTasks.push(t);
            player.activeTasks.splice(i, 1);
            // 惩罚
            player.sanity = Math.max(0, player.sanity - 2);
            player.gold = Math.max(0, player.gold - 3);
            st('<p style="color:#e85060;">⚠️ 任务 "' + t.title + '" 已过期！你失去了信誉，理智-2，金币-3。</p>');
        }
    }
}

function renderTasksHtml() {
    var html = '<div class="status-box"><p style="color:#e8c060;font-weight:bold;text-align:center;">📋 任务面板</p>';
    if (player.activeTasks.length === 0 && player.completedTasks.length === 0 && player.failedTasks.length === 0) {
        html += '<p style="color:#5a5a6a;font-size:0.78em;text-align:center;padding:10px 0;">暂无任务。探索地狱，寻找需要帮助的人。</p>';
    }
    if (player.activeTasks.length > 0) {
        html += '<p style="color:#d4a040;font-size:0.78em;margin-top:6px;">进行中：</p>';
        for (var i = 0; i < player.activeTasks.length; i++) {
            var t = player.activeTasks[i];
            var remain = t.deadline - player.daysSurvived;
            html += '<div class="task-card"><div class="task-title">' + t.title + '</div>' +
                '<div style="font-size:0.7em;color:#9a6a6a;">' + t.desc + '</div>' +

                '<button onclick="abandonTask(\'' + t.id + '\')" style="padding:2px 8px;font-size:0.65em;background:#1a0812;border:1px solid #3a0a14;color:#e06060;border-radius:4px;cursor:pointer;margin-top:4px;">放弃</button></div>';

    }

        html += '<p style="color:#e85060;font-size:0.78em;margin-top:6px;">已失败：' + player.failedTasks.length + ' 项</p>';

    return html;
}

function completeTask(taskId) {
    for (var i = 0; i < player.activeTasks.length; i++) {
        if (player.activeTasks[i].id === taskId) {
            var t = player.activeTasks[i];
            t.status = 'completed';
            player.gold += t.rewardGold;
            addExp(t.rewardExp);
            if (t.sinReward) player.sinValue += t.sinReward;
            if (t.desireReward) player.desire = Math.min(player.maxDesire, player.desire + t.desireReward);
            player.completedTasks.push(t);
            player.activeTasks.splice(i, 1);
            ua();
            st('<p>✅ 任务完成：<span class="gold-text">' + t.title + '</span></p><p style="color:#e8c060;">获得 ' + t.rewardGold + ' 金币，' + t.rewardExp + ' 经验。' + (t.sinReward ? ' 罪业值+' + t.sinReward : '') + '</p>');
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
            return;
        }
    }
}

function abandonTask(taskId) {
    for (var i = 0; i < player.activeTasks.length; i++) {
        if (player.activeTasks[i].id === taskId) {
            var t = player.activeTasks[i];
            t.status = 'failed';
            player.failedTasks.push(t);
            player.activeTasks.splice(i, 1);
            st('<p style="color:#e85060;">你放弃了任务：' + t.title + '</p>');
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
            return;
        }
    }
}

                { label: '过去看看', effect: function() { st('<p>你走近他。他神秘地掀开斗篷一角，露出里面几件散发着诡异光芒的物品。"便宜卖，只要20金币。"</p>'); cb(); ab('购买神秘物品（20金币）', function() { if (player.gold >= 20) { player.gold -= 20; var r = Math.random(); if (r < 0.3) { addItem('mystery_' + Date.now(), '神秘宝石', 'misc', '一块散发着诡异光芒的宝石，似乎蕴含着某种力量。', 1); st('<p>你买到了一块神秘宝石。</p>'); } else if (r < 0.6) { addItem('mystery_' + Date.now(), '陈旧卷轴', 'misc', '一份写满古老文字的卷轴，内容难以解读。', 1); st('<p>你买到了一张陈旧卷轴。</p>'); } else { st('<p>你买了他的东西，但打开后只是一块普通的石头……你被骗了。</p>'); } } else { st('<p class="highlight">金币不足。</p>'); } cb(); ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); }); }); ab('拒绝', function() { st('<p>你摇了摇头，转身离开。他在你身后低声骂了一句。</p>'); cb(); ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); }); }); } },
                { label: '警惕地走开', effect: function() { st('<p>你觉得这不太对劲，快步走开了。身后传来一声失望的叹息。</p>'); } }
            ]
        },
        {
            type: 'trap',
            title: '陷阱',
            text: '你脚下的地面突然塌陷！你掉进了一个深坑里，坑底插满了尖锐的骨刺。还好你反应快，只受了点轻伤。头顶传来得意的笑声。',
            options: [
                { label: '试图爬出去', effect: function() { if (player.agility >= 10) { st('<p>你凭借敏捷的身手，几下就爬出了深坑。你看到几个恶魔正在不远处大笑，他们看到你出来后立刻逃走了。</p>'); } else { st('<p>你试了几次都爬不上去。你只能大声呼救，过了很久才有人经过把你拉了上来。HP-10，疲劳+20。</p>'); player.hp -= 10; player.fatigue = Math.min(player.maxFatigue, player.fatigue + 20); } } },
                { label: '检查坑底', effect: function() { st('<p>你忍着疼痛检查了坑底，在骨刺之间发现了一枚被遗忘的戒指。它看起来很古老，上面刻着陌生的符文。</p>'); addItem('trap_ring_' + Date.now(), '骨刺坑底戒指', 'misc', '一枚在陷阱底部发现的古老戒指。', 1); } }
            ]
        }
    ];
    return events[Math.floor(Math.random() * events.length)];
}

function triggerRandomEvent() {
    if (Math.random() > 0.25) return; // 25%概率触发
    var event = generateRandomEvent();
    if (!event) return;
    var html = '<div class="scene-title">⚠️ ' + event.title + '</div><p>' + event.text + '</p>';
    st(html);
    cb();
    for (var i = 0; i < event.options.length; i++) {
        (function(opt) {
            ab(opt.label, function() {
                opt.effect();
                ua();
                cb();
                ab('继续探索', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
            }, opt.label.indexOf('动手') >= 0 || opt.label.indexOf('插手') >= 0 ? 'danger-btn' : '');
        })(event.options[i]);
    }
}

// ==================== 工作系统优化 ====================
function findJob() {
    var ring = player.currentRing;
    var statNames = { strength: '力量', agility: '敏捷', magic: '魔力', charisma: '魅力' };

    var ringJobs = {
        '傲慢之环': [
            { name: '水晶矿场搬运', desc: '灰烬区的废弃水晶矿场深处，仍残留着一些蕴含微弱能量的暗紫色水晶碎片。矿场的监工正在招募愿意冒险进入坑道、将沉重的原矿搬运出来的苦力。这项工作对体力要求极高，在搬运过程中，你需要时刻留意头顶摇摇欲坠的碎石——近年来已经有不少搬运工被塌方砸断了脊骨。', stat: 'strength', dc: 12, reward: 8, exp: 10, time: 60, failMsg: '你勉强搬了几趟，但体力很快见底。监工看你气喘吁吁的样子，皱眉扣掉了一半工钱。', successMsg: '你咬牙坚持了整整一个工时。监工用脚尖踢了踢你搬出的矿石堆，难得地点了点头，将说好的工钱一枚不少地扔进你手里。' },
            { name: '审判厅文书抄写', desc: '星尘区的审判厅正在招募临时抄写员，负责誊录审判记录和归档文件。工作环境阴冷肃穆，空气中只听得见羽毛笔摩擦羊皮纸的沙沙声。你需要用精准的书写将堆积如山的冗长卷宗逐字誊抄，任何错漏都会被退回重写。', stat: 'magic', dc: 11, reward: 7, exp: 9, time: 50, failMsg: '你的字迹太过潦草，执事扫了一眼便扔回你面前。他只付了三分之一的辛苦费。', successMsg: '你伏案誊抄了整整一个下午，手腕酸痛但每一页都干净工整。执事仔细核对了最后一份卷宗后，将报酬整齐地码放在你面前。' },
            { name: '晨星水晶打磨', desc: '傲慢环中层的一间水晶作坊正在接单——为堕天使们的佩剑打磨装饰用的水晶镶嵌片。这是一门需要专注与耐心的精细活：用不同粗细的砂轮逐层抛光水晶碎片，直到每一片都能在暗光下折射出完美的棱镜光斑。', stat: 'agility', dc: 10, reward: 6, exp: 8, time: 45, failMsg: '你手滑磨碎了两片水晶。工头心疼地捡起碎片，叹了口气后只付了材料费。', successMsg: '你全神贯注地完成了每一片水晶的打磨。当工头举起成品对着暗紫色灯光检查时，棱镜般的光斑映在他脸上——他满意地付了全款。' }
        ],
        '贪婪之环': [
            { name: '收债跑腿', desc: '铜板巷尽头那间挂着"玛门商行催收部"牌子的办公室正在招人。你的工作是挨家挨户敲开债务人的门，用一切"合理"手段将欠款收回来。每个债务人都是一张疲惫且警惕的脸，有些会苦苦哀求延期，有些会试图用破铜烂铁抵债。', stat: 'strength', dc: 12, reward: 10, exp: 10, time: 55, failMsg: '你跑了一整天，只收到几个债务人扔来的零碎铜板。催收部的管事冷笑了一声，丢给你一半跑腿费。', successMsg: '你用了一下午敲开七扇门，收回了三笔欠款。催收部的管事数着金币，在账本上划掉对应名字后，将佣金推到你面前。' },
            { name: '契约公证处助手', desc: '金丝街上那家小型契约公证处的老恶魔忙得焦头烂额。他需要一个人帮他整理堆积如山的契约文件，协助核对条款中的陷阱和漏洞。你必须逐字检查每一行小字——在贪婪之环，一个不起眼的附属条款足以让签署者倾家荡产。', stat: 'magic', dc: 11, reward: 8, exp: 9, time: 50, failMsg: '你漏掉了两份契约中的关键条款。老恶魔发现后气得用拐杖敲地板，只付了基本工时费。', successMsg: '你发现了一份契约中隐藏的利息陷阱，老恶魔兴奋地拍了桌子。他将那份契约单独归档后，多付了你两枚金币作为奖励。' },
            { name: '地摊投机倒把', desc: '铜板巷的地下赌场门外，几个投机商正在临时摆摊。他们需要人手帮忙在巷子里吆喝叫卖——商品是一批来源不明但标价极低的"稀世珍品"。你的口才决定了这些垃圾能卖出什么价钱。', stat: 'charisma', dc: 10, reward: 7, exp: 8, time: 45, failMsg: '你的吆喝声淹没在铜板巷的嘈杂中。投机商耸耸肩，分了你几个硬币。', successMsg: '你用三寸不烂之舌将一箱积压的劣质护符吹成了来自人间的古董。投机商笑得合不拢嘴，将利润分成慷慨地塞进你手里。' }
        ],
        '暴怒之环': [
            { name: '角斗场陪练', desc: '血焰角斗场需要一批"沙包"——在正式角斗士热身时充当陪练的活靶子。你不会被杀死，但肯定会疼。训练师递给你一副破旧的皮甲和一柄钝剑，推着你走进满是干涸血迹的铁笼。', stat: 'strength', dc: 13, reward: 12, exp: 14, time: 50, failMsg: '你在笼子里被揍得鼻青脸肿，连最基本的防御架势都没撑住。训练师失望地丢给你几枚硬币当医药费。', successMsg: '你在铁笼里撑过了整整三轮对练。虽然浑身淤青，但训练师拍了拍你的肩膀——"比我想的能抗。下次需要陪练还叫你。"' },
            { name: '武器工坊淬火', desc: '铁砧大道的武器工坊里，熔炉日夜不熄。你被雇来负责最枯燥的环节——将锻打好的刀坯反复浸入淬火油中，再送进回火炉。这项工作需要稳定的手法和对高温的忍耐力。', stat: 'agility', dc: 10, reward: 6, exp: 8, time: 50, failMsg: '你手抖将刀坯掉进了淬火槽底部，捞出来时刃口已经崩了。工头骂骂咧咧地扣了你一半工资。', successMsg: '你精准地完成了每一把刀坯的淬火和回火。工头用拇指试了试刃口的硬度，难得地咧嘴笑了，将工钱和一小袋磨刀石碎块塞给你。' },
            { name: '伤兵护理', desc: '碎骨巷的伤兵收容所里挤满了从角斗场抬下来的倒霉蛋。他们断骨错位、伤口化脓，急需有人帮忙换绷带、喂水和按住那些因剧痛而挣扎的伤兵。', stat: 'charisma', dc: 9, reward: 5, exp: 7, time: 40, failMsg: '你笨手笨脚地被一个挣扎的伤兵撞翻在地，打翻了一整盆干净的绷带。护士长用沾着血的手套甩了你一脸水。', successMsg: '你轻声安抚着痛苦的伤兵，熟练地帮他们更换绷带。护士长在结束时分了你一份热汤和几枚硬币。' }
        ],
        '色欲之环': [
            { name: '秀场后台杂役', desc: '霓虹大道的欲焰秀场正在筹备今晚的演出。后台乱成一锅粥——戏服散落一地，道具需要搬运，化妆台前堆满了用过的粉扑和假睫毛。场务总管急需人手在开演前将所有东西归位。', stat: 'agility', dc: 10, reward: 6, exp: 8, time: 45, failMsg: '你不小心打翻了一整盒亮片，场务总管尖叫着将你赶出后台，只扔给你两枚硬币。', successMsg: '你在开演前十分钟将所有戏服按出场顺序挂好。场务总管长舒一口气，将报酬塞进你手里时，顺手在你脸上留了一个带着香水味的指印。' },
            { name: '陪酒招待', desc: '暗巷深处的一家地下酒馆正在找临时陪酒。你的工作是坐在卡座里，为那些孤独的恶魔倒酒、听他们抱怨地狱的无聊，偶尔附和几句。不需要出卖身体——只需要出卖倾听的耐心。', stat: 'charisma', dc: 11, reward: 9, exp: 9, time: 55, failMsg: '你的木讷让客人更加郁闷了。他喝完最后一杯后挥挥手让你离开，酒保只好付你最低时薪。', successMsg: '你用恰到好处的微笑和适时的附和，让一位中年魅魔把半辈子的故事都倒了出来。临走时他在酒杯下压了丰厚的小费。' },
            { name: '香水试嗅员', desc: '魅骨时装店的地下室里，一位调香师正在研发新款魅惑香水。她需要"未经训练的鼻子"来测试不同配方的前调、中调和后调。你需要在闻了二十几种香精之后，准确描述每种气味给人的感受。', stat: 'magic', dc: 10, reward: 7, exp: 8, time: 40, failMsg: '你的嗅觉在闻到第十五种香精时彻底失灵了——所有东西闻起来都像发霉的玫瑰。调香师遗憾地付了基础测试费。', successMsg: '你精准地辨识出每一种香精的层次。调香师兴奋地记满了半本笔记本，将报酬和一小管试用装香水塞进你手里。"下次还有新配方，我还找你。"' }
        ],
        '嫉妒之环': [
            { name: '黑水打捞', desc: '水沟区的黑水齐腰深，水面上常年漂浮着从上层环层冲下来的废弃物品。有人专门雇人在黑水中打捞——运气好的话，能捞到完整的旧家具、还能转卖的破损饰品、甚至某位贵族不慎冲进下水道的金笔。', stat: 'strength', dc: 11, reward: 7, exp: 9, time: 50, failMsg: '你在黑水里泡了半天，捞上来的全是无法辨认的破布和锈蚀的铁片。雇主看了一眼就扔回了水里。', successMsg: '你从黑水中捞出了一把还能用的镀银餐具和一只刻着名字的怀表。雇主眯着眼睛端详怀表上的刻字，满意地付了工钱。' },
            { name: '谣言集市散播', desc: '镜面街区的谣言集市里，一个情报贩子正在招募"扩音器"——将几条真假难辨的消息传遍嫉妒之环的各个角落。你需要在茶馆、栈桥和地下通道之间穿梭，用不经意的口吻把话递出去。', stat: 'charisma', dc: 10, reward: 8, exp: 8, time: 45, failMsg: '你的表演太过刻意，茶馆里的恶魔一眼就看出你是来散布谣言的。情报贩子失望地付了路费。', successMsg: '你像闲聊般将消息洒在三个不同的茶馆里。到傍晚时，谣言已经传遍了整个镜面街区，情报贩子满意地将报酬塞进你手里。' },
            { name: '仿冒品加工', desc: '镜面街区的深渊镜像工坊正在赶制一批仿冒的"傲慢环水晶吊坠"——实际上只是用普通玻璃染色后打磨而成。你的工作是给这些假吊坠刻上以假乱真的暗纹，让它们看起来像是从晨星高地上捡来的。', stat: 'agility', dc: 12, reward: 9, exp: 10, time: 55, failMsg: '你刻废了好几片玻璃。工坊主捡起残次品对着灯光看了看，皱着眉头付了一半工钱。', successMsg: '你手中的刻刀精准地游走在玻璃表面，每一道暗纹都足以以假乱真。工坊主举起成品对着灯光端详，满意地点了点头。' }
        ],
        '暴食之环': [
            { name: '食材分拣', desc: '美食大道的永饥食品厂后门，堆满了从各环运来的食材原料。你的工作是将腐烂的部分切掉，把勉强能用的部分分拣进不同的筐里。这项工作对胃的承受力是一种考验——腐烂的肉类散发着令人窒息的恶臭。', stat: 'strength', dc: 10, reward: 6, exp: 8, time: 45, failMsg: '你只撑了不到半小时就跑出去吐了两次。工头看着你惨白的脸，叹了口气付了半个工时。', successMsg: '你面不改色地分拣完三大筐食材。工头看着你干净的围裙，竖起拇指——"你是我见过最能扛的新人。"' },
            { name: '食教传教站帮厨', desc: '食教传教站的执事正在准备今日的免费汤品。他需要人手帮忙削皮、切菜和搅拌那一口永远填不满的大锅。执事一边干活一边低声向你讲述食教的教义——"吞噬是万物最终的归宿"。', stat: 'magic', dc: 10, reward: 7, exp: 9, time: 50, failMsg: '你切菜时不小心切到了手指。执事面无表情地帮你包扎好，但只付了基础帮厨费。', successMsg: '你默契地配合执事的节奏，切菜、投料、搅拌一气呵成。当免费汤品分发完毕时，执事在付你报酬的同时，悄悄往你口袋里塞了一小包干燥的香料。' },
            { name: '残渣区拾荒', desc: '残渣区的深处，堆积如山的食物残渣中偶尔能翻出还能吃的东西。有人在招募拾荒者——从腐臭的垃圾中翻出还能转卖的边角料。这工作需要敏锐的眼力和强大的胃。', stat: 'agility', dc: 11, reward: 8, exp: 10, time: 50, failMsg: '你翻了半天只找到一堆彻底腐烂的垃圾。雇主捏着鼻子检查后，只付了辛苦费。', successMsg: '你从残渣堆中翻出了半箱还没变质的罐头和几袋包装完好的干粮。雇主惊喜地拍了拍你的背，将报酬和两罐罐头一起递给你。' }
        ],
        '懒惰之环': [
            { name: '帮人躺平', desc: '停滞区的惰性休闲馆正在招募"陪伴躺平员"。你的工作很简单——躺在体验区的躺椅上当活招牌，向路过的恶魔展示躺椅的舒适度。唯一的挑战是不能真的睡着——虽然就算睡着了也没人在乎。', stat: 'charisma', dc: 8, reward: 4, exp: 6, time: 40, failMsg: '你真的睡着了。醒来时发现自己在躺椅上流了一滩口水，休闲馆经理面无表情地扣了一半工资。', successMsg: '你在躺椅上保持着半睡半醒的完美状态，好几个路过的恶魔被你的舒适感感染，当场付钱买了躺椅。经理难得地说了句"干得不错"。' },
            { name: '文件代交', desc: '懒鬼外包公司的前台趴在一叠积压了数月的文件上，用极其缓慢的语速告诉你——他们需要人帮客户把一份拖延了半年的申请表交到对面那栋楼。距离：不到一百米。原因：客户懒得亲自走过去。', stat: 'agility', dc: 5, reward: 3, exp: 5, time: 20, failMsg: '你也懒得走了。前台用眼神表达了一种惺惺相惜的失望。', successMsg: '你走了不到一百米，将申请表塞进对面楼的信箱。前台用慢动作竖起一根拇指，将报酬推到你面前。' },
            { name: '灰雾冥想指导', desc: '停滞区的一间低价惰性休闲馆里，几个长期失眠的恶魔正在参加"灰雾冥想"课程。你的工作是坐在他们面前，用最缓慢、最催眠的语调念出指导语，帮助他们进入深层放松状态。', stat: 'magic', dc: 9, reward: 5, exp: 7, time: 35, failMsg: '你的语速太快了，一个学员反而变得更加焦躁。冥想老师无奈地接过指导语，只付了你一半报酬。', successMsg: '你的声音像灰雾一样缓慢而温柔。课程结束时，所有学员都陷入了深沉的睡眠。冥想老师轻手轻脚地将报酬递给你。' }
        ]
    };

    var jobs = ringJobs[ring];
    if (!jobs || jobs.length === 0) {
        jobs = [
            { name: '矿场搬运', desc: '在水晶矿场搬运矿石。需要体力。', stat: 'strength', dc: 12, reward: 8, exp: 10, time: 60, failMsg: '你体力不支，只拿到一半报酬。', successMsg: '工作顺利完成！' },
            { name: '酒馆招待', desc: '在酒馆端盘子。需要魅力。', stat: 'charisma', dc: 10, reward: 6, exp: 8, time: 60, failMsg: '你笨手笨脚，只拿到一半报酬。', successMsg: '工作顺利完成！' },
            { name: '街头卖艺', desc: '用你的魔力表演杂耍。', stat: 'magic', dc: 10, reward: 7, exp: 9, time: 50, failMsg: '你的表演无人喝彩，只拿到一半报酬。', successMsg: '表演大获成功！' },
            { name: '暗巷交易', desc: '参与地下交易，需要敏捷和胆量。', stat: 'agility', dc: 12, reward: 12, exp: 12, time: 40, failMsg: '交易搞砸了，只拿到一半报酬。', successMsg: '交易顺利完成！' }
        ];
    }

    var job = jobs[Math.floor(Math.random() * jobs.length)];
    // 工作事件随机文本
    var eventTexts = [
        '工作中，你听到工友在谈论一个隐藏的宝库。',
        '你发现了一个偷懒的好地方，休息了一会儿。',
        '监工今天心情不错，多给了你一些报酬。',
        '一个同事试图偷你的东西，你及时发现了。',
        '你无意中听到了一段关于某个君主的秘密谈话。'
    ];
    var eventChance = Math.random();
    var extraEvent = '';
    if (eventChance < 0.15) {
        extraEvent = '<p style="color:#c09080;font-style:italic;">' + eventTexts[Math.floor(Math.random() * eventTexts.length)] + '</p>';
    }

    st('<div class="scene-title">工作机会</div><p>' + job.desc + '</p><p>需求：' + statNames[job.stat] + ' ≥ ' + job.dc + '</p>' + extraEvent);
    cb();
    ab('接受（耗时' + job.time + '分钟）', function() {
        addTime(job.time);
        player.fatigue = Math.min(player.maxFatigue, player.fatigue + 15 + Math.floor(player.fatigue/10));
        // 工作意外事件
        var accident = Math.random();
        if (accident < 0.05) {
            st('<p style="color:#e85060;">⚠️ 工作中发生了意外！你被掉落的石块砸伤，HP-15。</p>');
            player.hp -= 15;
            cb();
            ab('继续', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
            return;
        }
        if (player[job.stat] >= job.dc) {
            player.gold += job.reward;
            addExp(job.exp);
            st('<p>' + (job.successMsg || '工作顺利完成！获得了 ' + job.reward + ' 金币，' + job.exp + ' 经验。') + '</p><p style="color:#e8c060;">获得了 ' + job.reward + ' 金币，' + job.exp + ' 经验。</p>' + extraEvent);
        } else {
            var half = Math.floor(job.reward / 2);
            player.gold += half;
            st('<p>' + (job.failMsg || '你勉强完成，但效果不佳。') + '</p><p style="color:#e85060;">获得了 ' + half + ' 金币。</p>' + extraEvent);
        }
        cb();
        ab('返回（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(player.currentRing, 'poor'); });
    });
    ab('拒绝', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
}

// ==================== NPC 交互（修复：次数限制+好感审视） ====================
function getNpcFirstMeetText(npcId) {
    var sin = player.sin, race = player.race;
    if (npcId === '莱利') {
        if (race === 'sinner' && (sin === '贪婪' || sin === '色欲')) return '傲慢之环灰烬区的边缘地带，一座废弃的水晶矿场笼罩在暗紫色的微光中。地面上满是碎石，断裂的巨大水晶柱犹如巨兽的残骨般杂乱地刺向半空。空气中悬浮着呛人的矿石粉尘，混杂着常年不见天日滋生出的浓重霉味。你放轻脚步，小心翼翼地跨过地上散落的石块。就在这时，一阵细微却尖锐的金属摩擦声传入耳中。你立刻停下脚步，判断出前方不远处有人。\n\n你借着掩体靠近，在一块倾斜的巨大水晶板后方看到了那个人。他身形高挑却偏瘦，穿着一件黑色的连帽卫衣。灰色的头发显得有些凌乱，左半边的发色深灰近黑。头顶的猫耳微微翕动，身后一条长长的灰色猫尾正贴着地面缓慢地左右摇晃。他正背对着你，手里握着一把小刀，刀刃抵着一块金属片，正专注而谨慎地削刮着，动作极轻。似乎是察觉到了你的视线，他突然停下手里的动作，转过头来。昏暗的光线下，他那双左眼鎏金、右眼银灰的异色瞳孔闪过一丝冷厉的光。\n\n他的两只猫耳瞬间向后折起，进入高度警觉的状态。原本还在缓慢晃动的长尾巴猛地绷直，尾尖的毛发微微炸开。他浑身的肌肉肉眼可见地紧绷起来，目光死死地锁定在你的位置。<em>贪婪……还是色欲？</em>他的声音没有丝毫情绪起伏，语气生硬且冷漠，如同从这座废弃矿坑最深处吹上来的寒风，带着明显的排斥与防备。<em>我不喜欢这两种味道。离我远点。</em>他收回视线，转过身去再次背对着你。他手中的小刀在金属片上重重地划过，刺耳的摩擦声中迸发出几点明亮的火星。周围的金属碎屑和地上的废弃铁器开始发生有规律的轻微震颤。你能清晰地感觉到，一股由金属幻化而成的锁链力量正被他强行压制在掌心之中。只要你再向前靠近半步，那些锁链就会瞬间爆发。';
        if (race === 'sinner') return '傲慢之环灰烬区的边缘地带，一座废弃的水晶矿场笼罩在暗紫色的微光中。地面上满是碎石，断裂的巨大水晶柱犹如巨兽的残骨般杂乱地刺向半空。空气中悬浮着呛人的矿石粉尘，混杂着常年不见天日滋生出的浓重霉味。你放轻脚步，小心翼翼地跨过地上散落的石块。就在这时，一阵细微却尖锐的金属摩擦声传入耳中。你立刻停下脚步，判断出前方不远处有人。\n\n你借着掩体靠近，在一块倾斜的巨大水晶板后方看到了那个人。他身形高挑却偏瘦，穿着一件黑色的连帽卫衣。灰色的头发显得有些凌乱，左半边的发色深灰近黑。头顶的猫耳微微翕动，身后一条长长的灰色猫尾正贴着地面缓慢地左右摇晃。他正背对着你，手里握着一把小刀，刀刃抵着一块金属片，正专注而谨慎地削刮着。似乎是察觉到了你的视线，他突然停下手里的动作，转过头来。昏暗的光线下，他那双左眼鎏金、右眼银灰的异色瞳孔闪过一丝冷厉的光。\n\n他的视线越过倾斜的水晶板，直直地投向你。那双左金右银的异色瞳孔里既没有被打扰的愤怒，也没有任何欢迎的意味，只剩下一种夹杂着深度戒备与疲惫的冷漠审视。<em>……又是一个罪人。</em>他冷冷地吐出几个字，常年极少与人交谈让他的声音听起来有些干涩沙哑。他站在原地没有动，连脸上的表情都凝固着，只有头顶竖起的猫耳微微转动了一下方向，敏锐地捕捉着你这边的每一丝呼吸声。<em>我也曾是。如果你是来找茬的，现在就可以走了。</em>刀刃刮擦金属的声音重新在死寂的矿区里响起。但他握刀的手腕没有了刚才那种专注的流畅感，金属片被剥落的节奏明显变慢、变沉了。那条原本因警惕而僵直的长尾巴也缓缓松懈下来，垂在地上，尾尖在满是粉尘的石块上无意识地轻轻扫动。他虽然没有再抬头看你，但紧绷的肩膀和停顿的刀尖都暴露出他并没有放松警惕——他在安静地等待你开口，或是走出下一步。';
        return '傲慢之环灰烬区的边缘地带，一座废弃的水晶矿场笼罩在暗紫色的微光中。地面上满是碎石，断裂的巨大水晶柱犹如巨兽的残骨般杂乱地刺向半空。空气中悬浮着呛人的矿石粉尘，混杂着常年不见天日滋生出的浓重霉味。你放轻脚步，小心翼翼地跨过地上散落的石块。就在这时，一阵细微却尖锐的金属摩擦声传入耳中。你立刻停下脚步，判断出前方不远处有人。\n\n你借着掩体靠近，在一块倾斜的巨大水晶板后方看到了那个人。他身形高挑却偏瘦，穿着一件黑色的连帽卫衣。灰色的头发显得有些凌乱，左半边的发色深灰近黑。头顶的猫耳微微翕动，身后一条长长的灰色猫尾正贴着地面缓慢地左右摇晃。他正背对着你，手里握着一把小刀，刀刃抵着一块金属片，正专注而谨慎地削刮着。似乎是察觉到了你的视线，他突然停下手里的动作，转过头来。昏暗的光线下，他那双左眼鎏金、右眼银灰的异色瞳孔闪过一丝冷厉的光。\n\n他的头顶，那对灰色的猫耳敏锐地捕捉到了你靠近的细微声响，耳尖向后微不可察地抖动了一下。紧接着，那条原本垂落在地上的长尾巴迅速收拢，带着十足的防备，紧紧卷住了他自己的小腿。<em>新面孔。</em>他率先开了口。由于极少与人交谈，他的嗓音听起来有些发干。语气像生铁一样生硬冷淡，但并没有直接表露出攻击的敌意。察觉到你的视线正落在他左金右银的异色瞳孔上，他浑身的肌肉瞬间紧绷。他下意识地偏过头，利用黑色卫衣的兜帽阴影遮挡住部分侧脸，声音骤然沉了下来，透出一股烦躁。<em>别盯着我的眼睛看。如果你是来嘲笑我的，现在就可以走了。</em>警告完，他重新转回视线。那双锐利的异色瞳自上而下快速扫过你的全身，目光在你的双手和腰间短暂停留，默默评估着你身上是否带有武器或潜在威胁。但在你持续的直白注视下，他的眼神很快出现了细微的闪躲。他显然极不习惯被人这样盯着看。他握着金属片的手指无意识地收紧，指关节因用力而微微泛白。同时，他身体的重心悄然向后脚跟偏移了半寸，做好了随时隐蔽或拉开距离的准备。';
    }
    if (npcId === '弗雷迪') {
        if (race === 'sinner') return '贪婪之环的金丝街上，整条街道的地面都铺满了金币。万宝商行分店的奢华建筑在这片反光中投下巨大的倒影。你推开沉重的水晶大门，一股混合了陈旧羊皮纸、浓郁檀香以及生锈金属的复杂气味立刻扑面而来。柜台后方站着一个身形极高的男人。他穿着一件深棕色、边缘镶嵌着金线的长袍，苍白修长的手指间捏着一块干净的布，正不紧不慢地擦拭着一枚银币。\n\n听到大门的动静，他停下手里的动作，缓缓抬起头。深红棕色的披肩长发下，是一张苍白且透着冷酷的脸。他的右眼角横亘着一道狰狞的刀疤，右眼戴着一枚单片眼镜。那双细长上挑的眼睛里，暗红色的锋利瞳孔透过镜片，带着毫不掩饰的审视与冰冷打量着你。最引人注目的是他的右臂——那根本不是人类的血肉之躯，而是一只巨大的灰色乌鸦羽翼，末端长着尖锐的利爪。层层叠叠的羽毛边缘在室内灯光下，泛着一层幽暗的蓝光。<em>一位罪人。</em>他缓缓开口，语调沉稳，带着浓厚的旧时代英国绅士腔调，但语气里却透着一股拒人于千里之外的傲慢。<em>欢迎光临。不过请记住，在这里，虚无的身份远不如实打实的金币来得重要。如果您有值钱的物件需要出售，或者想购买什么罕见的珍品，我很乐意为您效劳。</em>说完，他将擦拭好的银币整齐地叠放在一旁。他用那只正常的左手，极其优雅且严谨地整理了一下领口的金色徽章和胸前佩戴的银色十字架。他右侧那只巨大的乌鸦羽翼也随着动作微微向内收拢。尽管他嘴里说着敬语，但微微扬起的下颌与居高临下的眼神，将他病态的阶级执念暴露无遗。那种刻意维持的体面姿态，让你一眼就能看出——他在极力彰显自己曾经属于更高阶层的地方。';
        if (sin === '暴怒' || sin === '嫉妒') return '贪婪之环的金丝街上，整条街道的地面都铺满了金币。万宝商行分店的奢华建筑在这片反光中投下巨大的倒影。你推开沉重的水晶大门，一股混合了陈旧羊皮纸、浓郁檀香以及生锈金属的复杂气味立刻扑面而来。柜台后方站着一个身形极高的男人。他穿着一件深棕色、边缘镶嵌着金线的长袍，苍白修长的手指间捏着一块干净的布，正不紧不慢地擦拭着一枚银币。\n\n察觉到你身上散发出的气息，他擦拭银币的动作骤然停下。那只巨大的灰色乌鸦羽翼瞬间绷紧，层叠的羽毛相互挤压，发出细微的摩擦声。他缓缓抬起那张苍白且透着冷酷的脸，深红棕色的披肩长发下，右眼角的狰狞刀疤在灯光下格外刺目。他单片眼镜后的暗红色瞳孔微缩，眼底飞快地闪过一丝极度不快与嫌恶的神色。<em>暴怒与嫉妒，往往伴随着粗鲁与失控。这并非良好的商业伙伴应有的品质。</em>他的语气冰冷疏离，带着一种居高临下的审视意味。但他很快便控制住了情绪，嘴角生硬地向上拉扯，恢复成了一个完美却毫无温度的职业化微笑。<em>但我从不拒绝任何一位带着金币进门的顾客。您可以随意看看，但请务必在这里保持您仅剩的冷静。</em>他用那只正常的左手，动作极其优雅且严谨地整理了一下领口的金色徽章，仿佛刚才的不快从未发生过。';
        return '贪婪之环的金丝街上，整条街道的地面都铺满了金币。万宝商行分店的奢华建筑在这片反光中投下巨大的倒影。你推开沉重的水晶大门，一股混合了陈旧羊皮纸、浓郁檀香以及生锈金属的复杂气味立刻扑面而来。柜台后方站着一个身形极高的男人。他穿着一件深棕色、边缘镶嵌着金线的长袍，深红棕色的披肩长发垂落在肩侧，右眼角横亘着一道狰狞的刀疤。他的右臂不是血肉——而是一只巨大的灰色乌鸦羽翼，羽毛边缘在灯光下泛着幽暗的蓝光。\n\n弗雷迪站在柜台后，并没有立刻开口。他抬起那只正常的左手，动作极其缓慢且优雅地捏住领口，将那枚象征着身份的金色徽章一点点扶正，确保上面没有一丝灰尘或歪斜。确认仪表完美无缺后，他才微微抬起下颌。暗红色的眼眸透过单片眼镜，自上而下将你审视了一遍。那目光犹如刀锋般锐利，充满了商人评估货物价值时的算计。<em>一张新面孔。希望您能为我带来一笔值得投入精力的好生意。</em>他的语调沉稳，带着浓厚的旧时代英国绅士腔调，但语气里却透着一股拒人于千里之外的傲慢。';

    if (npcId === '埃文·格雷') {

function getNpcFirstImpression(npcId) { var nd = npcData[npcId]; if (!nd) return { love: 5, desire: 0, anger: 0, opinion: '初次见面。' }; var love = 5; var opinion = '对你没有特别的看法。'; if (nd.dislikeSins && nd.dislikeSins.indexOf(player.sin) >= 0) { love -= 3; opinion = '因为你的罪孽，对你有些戒备。'; } if (player.race === 'demon') { love += 2; opinion += ' 作为原生恶魔，他略微高看你一眼。'; } else if (player.race === 'sinner') { love -= 1; opinion += ' 作为罪人，你感到他的审视多了一分。'; } return { love: Math.max(0, love), desire: 0, anger: 0, opinion: opinion }; }

    } else {
        if (t < nd.timeStart && t > nd.timeEnd) return 'time';

}

function ensureNpcInSocial(npcId) { if (!player.relationships[npcId]) { var init = getNpcFirstImpression(npcId); player.relationships[npcId] = { love: init.love, desire: init.desire, anger: init.anger, opinion: init.opinion }; } }

function tryEncounterNPC(ring, level) { var available = []; for (var nid in npcData) { var nd = npcData[nid]; if (nd.ring === ring && nd.level === level) { if (checkNpcAvailable(nid)) { available.push(nid); } } if (nd.ring === 'random' && Math.random() < 0.15) { if (checkNpcAvailable(nid)) { available.push(nid); } } } return available.length > 0 ? available[Math.floor(Math.random() * available.length)] : null; }

    // 检查是否已满5次
    if (count >= 5) {
        player.npcTalkCounts[talkKey] = 0;
        player.flags['npcLeft_'+npcId] = true;
        st('<div class="scene-title">' + npcId + '</div><p>' + npcId + '看了你一眼，摇了摇头：<em>今天已经聊得够多了。我需要一些自己的空间。</em></p><p>他转身离开了。</p>');
        addTime(15);
        cb();
        ab('继续探索（耗时5分钟）', function() { addTime(5); sceneExploreDistrict(returnRing, returnLevel); });
        return;
    }

    var pool = npcInteractionData[npcId] || [{ text: '随便聊聊', loveChange: 0, response: '<em>……嗯。</em>' }];
    var interaction = pool[count % pool.length];
    player.npcTalkCounts[talkKey] = count + 1;
    // 增加NPC对话计数
    incrementNpcTalk(npcId);
    addTime(10);

    var newLove = Math.min(100, Math.max(0, (rel.love || 5) + interaction.loveChange));
    rel.love = newLove;
    var attitude = getNpcAttitude(npcId);

    st('<div class="scene-title">' + npcId + '</div><p>' + interaction.response + '</p><p style="color:#9a6a6a;font-size:0.78em;">好感度变化：' + (interaction.loveChange >= 0 ? '+' : '') + interaction.loveChange + ' | 当前好感：' + newLove + '</p><p style="color:#c09080;font-size:0.75em;">' + attitude.text + '</p>');
    cb();
    if (count < 4) {
        ab('继续交谈（耗时10分钟）', function() { addTime(10); sceneNpcInteraction(npcId, returnRing, returnLevel); });
    }
    ab('结束对话', function() {
        player.npcTalkCounts[talkKey] = 0;
        sceneExploreDistrict(returnRing, returnLevel);
    });
}

function addNpcButton(npcId, ring, level) {
    var reason = getNpcUnavailableReason(npcId);
    if (reason === 'time') {
        return;
    }
    if (reason === 'left') {
        var currentHtml = tc.innerHTML;
        st(currentHtml + '<p style="color:#9a6a6a;font-style:italic;margin-top:10px;">（' + npcId + '正忙着自己的事，还是别去打扰了。）</p>');
        return;
    }
    if (reason === 'max_talk') {
        var attitude = getNpcAttitude(npcId);
        st(tc.innerHTML + '<p style="color:#9a6a6a;font-style:italic;margin-top:10px;">（' + npcId + '看起来有些疲惫，似乎不太想再说话了。' + attitude.text + '）</p>');
        return;
    }
    var remain = getNpcTalkRemaining(npcId);
    ab('💬 与 ' + npcId + ' 交谈（剩余' + remain + '次）', function() {
        addTime(5);
        if (!player.relationships[npcId]) {
            sceneNpcFirstMeet(npcId, ring, level);
        } else {
            sceneNpcInteraction(npcId, ring, level);
        }
    });
}

function enterShop(type) {
    var ring = player.currentRing;
    var items = shopData[ring] ? shopData[ring][type] : [];
    if (!items.length) {
        st('<p>这里暂时没有商品。</p>');
        cb(); ab('返回', function() { sceneExploreDistrict(ring, 'poor'); });
        return;
    }
    var typeName = {food:'食品店',cloth:'服装店',item:'道具店'}[type];
    var html = '<div class="scene-title">◆ ' + typeName + ' ◆</div>';
    html += '<div style="background:#180610;border:1px solid #2a0a16;border-radius:6px;padding:10px;margin:8px 0;">';
    html += '<p style="color:#8a5a62;font-size:0.78em;margin-bottom:6px;">📦 可购买物品：</p>';
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var extra = '';
        if (it.food) extra += ' 🍖+' + it.food;
        if (it.hp) extra += ' ❤️+' + it.hp;
        if (it.strength) extra += ' 💪+' + it.strength;
        if (it.charisma) extra += ' 💋+' + it.charisma;
        if (it.magic) extra += ' ✨+' + it.magic;
        if (it.sanity) extra += ' 🧠+' + it.sanity;
        html += '<p>· ' + it.name + ' <span style="color:#e8c060;">' + it.price + 'G</span> — ' + (it.desc || '') + extra + '</p>';
        if (it.buffs) {
            for (var b = 0; b < it.buffs.length; b++) {
                html += '<p style="font-size:0.65em;color:#80c080;padding-left:16px;">✨ ' + it.buffs[b].name + ': ' + it.buffs[b].desc + '</p>';
            }
        }
    }
    html += '</div>';
    html += '<p style="color:#8a5a62;font-size:0.78em;margin-top:8px;">请选择要购买的物品：</p>';
    st(html);
    cb();

    for (var i = 0; i < items.length; i++) {
        (function(item) {
            ab('购买 ' + item.name + '（' + item.price + 'G）', function() {
                if (player.gold >= item.price) {
                    player.gold -= item.price;
                    var effects = { hp: item.hp || 0, strength: item.strength || 0, magic: item.magic || 0, charisma: item.charisma || 0, sanity: item.sanity || 0, desire: item.desire || 0, fatigue: item.fatigue || 0, food: item.food || 0, buffs: item.buffs || [] };
                    if (type === 'food') {
                        addItem(item.name.replace(/\s/g,'_'), item.name, 'consumable', item.desc, 1, effects);
                    } else if (type === 'cloth') {
                        unequipCurrentCloth();
                        equipCloth(item);
                        addItem(item.name.replace(/\s/g,'_'), item.name, 'armor', item.desc, 1, { charisma: item.charisma || 0, strength: item.strength || 0, magic: item.magic || 0, agility: item.agility || 0, sanity: item.sanity || 0, buffs: item.buffs || [] }, true);
                    } else if (type === 'item') {
                        addItem(item.name.replace(/\s/g,'_'), item.name, 'misc', item.desc, 1, { buffs: item.buffs || [] });
                    }
                    ua();
                    st('<p>✅ 你购买了 <span style="color:#e8c060;">' + item.name + '</span>。</p>');
                } else {
                    st('<p class="highlight">⚠️ 金币不足。需要 ' + item.price + ' 金币，你只有 ' + player.gold + ' 金币。</p>');
                }
                cb();
                ab('继续购物', function() { enterShop(type); });
                ab('离开', function() { sceneExploreDistrict(ring, 'poor'); });
            });
        })(items[i]);
    }
    ab('离开', function() { sceneExploreDistrict(ring, 'poor'); });
}

function travelToRing(ring) {
    if (ring === player.currentRing) { sceneExploreDistrict(ring, 'poor'); return; }
    var cost = 5; var time = 60 + Math.floor(Math.random()*30);
    st('<p>前往' + ring + '需要乘坐跨环马车，花费' + cost + '金币，耗时约' + time + '分钟。</p>');
    cb();
    ab('支付并出发（-' + cost + '金币，耗时' + time + '分钟）', function() {
        if (player.gold >= cost) { player.gold -= cost; addTime(time); player.currentRing = ring; player.residenceRing = ring; ua(); sceneExploreDistrict(ring, 'poor'); }
        else { st('<p class="highlight">金币不足。</p>'); cb(); ab('返回', function() { sceneExploreDistrict(player.currentRing, 'poor'); }); }
    });
    ab('取消', function() { sceneExploreDistrict(player.currentRing, 'poor'); });
}
